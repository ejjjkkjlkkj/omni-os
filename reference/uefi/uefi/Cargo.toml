[package]
name = "aw-uefi-boot"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
aw-accessibility = { path = "../../crates/aw-accessibility" }
aw-acpi = { path = "../../crates/aw-acpi" }
aw-braille = { path = "../../crates/aw-braille" }
aw-kernel-core = { path = "../../crates/aw-kernel-core" }
aw-screen-reader = { path = "../../crates/aw-screen-reader" }
libm = "0.2"
log = { version = "0.4", default-features = false }
uefi = { version = "=0.40.0", features = ["alloc", "global_allocator", "logger", "log-debugcon", "panic_handler"] }
uefi-raw = "=0.16.0"
