[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omniexec-solution"
version = "0.1.0"
description = "Deterministic UEFI accessibility research and software-ceiling verification stack."
readme = "README.md"
license = "0BSD"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
omni = "omni.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
