name: Software Ceiling
on:
  push:
  workflow_dispatch:

concurrency:
  group: software-ceiling-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m omni.cli toolchain

  static-python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m compileall -q src tests

  workflow-policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reject movable Actions and fail-open jobs
        run: python tools/workflow_policy.py .github/workflows --strict
