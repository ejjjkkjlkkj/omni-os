name: UEFI SCT Build

on:
  push:
    branches:
      - main
      - "dev/**"
  workflow_dispatch:

concurrency:
  group: sct-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-sct:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential nasm uuid-dev python3-pip
      - name: Checkout matching EDK II
        run: |
          git clone --depth 1 --branch edk2-stable202608 --recurse-submodules https://github.com/tianocore/edk2.git
          test "$(git -C edk2 rev-parse HEAD)" = "2970e5699ba6267f3384ffab20f96647578aebc8"
      - name: Checkout official edk2-test SCT
        run: |
          git clone --depth 1 --branch edk2-test-stable202509 https://github.com/tianocore/edk2-test.git
          test "$(git -C edk2-test rev-parse HEAD)" = "2b2a16ac239cd89d778cb79ae6e42c533fc4c25a"
      - name: Assemble SCT workspace
        run: |
          cp -a edk2-test/uefi-sct/SctPkg ./SctPkg
          python3 tools/patch_sct_gcc_profile.py SctPkg/build.sh
          python3 tools/patch_sct_efi_header.py SctPkg/Include/Efi.h
          python3 tools/patch_sct_deprecated_protocols.py SctPkg

      - name: Build official UEFI SCT X64
        run: |
          chmod +x SctPkg/build.sh
          ./SctPkg/build.sh X64 GCC RELEASE
          test -d Build/UefiSct/RELEASE_GCC/SctPackageX64
          find Build/UefiSct/RELEASE_GCC/SctPackageX64 -type f | head -50
      - name: Hash SCT package
        run: |
          find Build/UefiSct/RELEASE_GCC/SctPackageX64 -type f -print0 |
            sort -z |
            xargs -0 sha256sum > sct-sha256.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: uefi-sct-x64
          path: |
            Build/UefiSct/RELEASE_GCC/SctPackageX64
            sct-sha256.txt
