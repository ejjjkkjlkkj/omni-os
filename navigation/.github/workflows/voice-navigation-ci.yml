          grep -aF 'HII_GRAPH_NAV_STAGED_EDIT_MODE=PASS' build/NAVIGATION.EFI
          grep -aF 'HII_GRAPH_NAV_STAGED_NUMERIC_MODE=PASS' build/NAVIGATION.EFI
          grep -aF 'HII_GRAPH_NAV_STAGED_NUMERIC=PASS' build/NAVIGATION.EFI
          grep -aF 'HII_GRAPH_NAV_SPECIALIZED_METADATA=PASS' build/NAVIGATION.EFI
          grep -aF 'HII_GRAPH_NAV_QUESTION_FLAGS_SEMANTICS=PASS' build/NAVIGATION.EFI
          grep -aF 'HII_GRAPH_NAV_CALLBACK_AWARE=PASS' build/NAVIGATION.EFI
          grep -aF 'HII_GRAPH_NAV_READ_ONLY_PREVIEW=BLOCKED' build/NAVIGATION.EFI
          grep -aF 'HII_GRAPH_NAV_PASSWORD_PRIVACY=PASS' build/NAVIGATION.EFI
          grep -aF 'HII_GRAPH_NAV_PASSWORD_REDACTION=PASS' build/NAVIGATION.EFI
          grep -aF 'HII_GRAPH_NAV_LIVE_PASSWORD_REDACTION=PASS' build/NAVIGATION.EFI
          grep -aF 'HII_GRAPH_NAV_STAGED_CONDITION_EVAL=PASS' build/NAVIGATION.EFI
          grep -aF 'HII_GRAPH_NAV_STAGED_CONDITION_VALUE=PASS' build/NAVIGATION.EFI
