name: voice-navigation-ci

on:
  push:
    branches: [main]
    paths:
      - 'voice/**'
      - 'navigation/**'
      - '.github/workflows/voice-navigation-ci.yml'
  pull_request:
    paths:
      - 'voice/**'
      - 'navigation/**'
      - '.github/workflows/voice-navigation-ci.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Validate Python sources
        run: |
          set -euo pipefail
          python -m py_compile             voice/v4/native_speech_v4.py             voice/v4/voicecore_v4.py             voice/v4/test_native_speech_v4.py             voice/v4/test_voicecore_v4.py             voice/uefi_units/build_native_units.py             navigation/uefi/generate_units.py             navigation/uefi/test_m1603qa_308_baseline.py

      - name: Run VoiceCore v4 tests
        working-directory: voice/v4
        run: |
          set -euo pipefail
          python test_native_speech_v4.py
          python test_voicecore_v4.py

      - name: Generate UEFI navigation speech units
        run: |
          set -euo pipefail
          mkdir -p build
          (cd navigation/uefi && python test_generate_units.py)
          (cd navigation/uefi && python test_navigation_source_contract.py)
          (cd navigation/uefi && python test_m1603qa_308_baseline.py)
          python navigation/uefi/generate_units.py build/navigation_units.c build/navigation_units.txt
          grep -F 'source=voice/v4/native_speech_v4.py' build/navigation_units.txt
          grep -F 'speech-mode=whole-phrase-voicecore-v4-uefi-v8-mulaw24k' build/navigation_units.txt
          grep -F 'unit-encoding=g711-mulaw-u8' build/navigation_units.txt
          grep -F 'word-lexicon-count=' build/navigation_units.txt
          grep -F 'phrase-clip-count=' build/navigation_units.txt
          grep -F 'letter-map=a-z-french-letter-names' build/navigation_units.txt
          grep -F 'digit-map=0-9-french-number-names' build/navigation_units.txt

      - name: Compile UEFI navigation engine
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang lld
          clang -std=c11 -Wall -Wextra -Werror -pedantic navigation/uefi/semantic_core.c navigation/uefi/test_semantic_core.c -o build/semantic_core_test
          ./build/semantic_core_test | tee build/semantic_core-test.txt
          grep -F 'UEFI_SEMANTIC_CORE_TESTS=PASS' build/semantic_core-test.txt
          clang -std=c11 -Wall -Wextra -Werror -pedantic -fsanitize=address,undefined -fno-omit-frame-pointer navigation/uefi/semantic_core.c navigation/uefi/test_semantic_core.c -o build/semantic_core_test_san
          ASAN_OPTIONS=detect_leaks=1 ./build/semantic_core_test_san | tee build/semantic_core-sanitizer.txt
          grep -F 'UEFI_SEMANTIC_CORE_TESTS=PASS' build/semantic_core-sanitizer.txt
          flags='--target=x86_64-pc-windows-msvc -DQEV_INTERACTIVE_NAV=1 -ffreestanding -fshort-wchar -fno-stack-protector -fno-builtin -mno-red-zone -nostdlib -O2 -Wall -Wextra -Werror'
          clang $flags -c navigation/uefi/semantic_core.c -o build/semantic_core.obj
          test -s build/semantic_core.obj
          clang $flags -c navigation/uefi/hii_graph_prompt_speech_uefi.c -o build/navigation.obj
          clang $flags -c build/navigation_units.c -o build/navigation_units.obj
          lld-link /subsystem:efi_application /entry:efi_main /nodefaultlib /machine:x64 /timestamp:0 /out:build/NAVIGATION.EFI build/navigation.obj build/navigation_units.obj build/semantic_core.obj
          test -s build/NAVIGATION.EFI
          grep -aF 'HII_GRAPH_NAV_REALTIME_MODE=INTERRUPTIBLE_DMA' build/NAVIGATION.EFI
          grep -aF 'HII_GRAPH_SPEECH_QUEUE=INTERRUPTIBLE_64' build/NAVIGATION.EFI
          grep -aF 'HII_GRAPH_SPEECH_WORD_BOUNDARY_CHUNKING=PASS' build/NAVIGATION.EFI
          grep -aF 'HII_GRAPH_SPEECH_HYBRID_WORD_MODE=PASS' build/NAVIGATION.EFI
          grep -aF 'HII_GRAPH_SPEECH_WORD_PRONUNCIATION=PASS' build/NAVIGATION.EFI
          grep -aF 'HII_GRAPH_SPEECH_WORD_FALLBACK=LETTER_NAMES' build/NAVIGATION.EFI
          grep -aF 'HII_GRAPH_SPEECH_UNKNOWN_WORD_FALLBACK=PASS' build/NAVIGATION.EFI
          grep -aF 'HII_GRAPH_SPEECH_MULTI_CHUNK=PASS' build/NAVIGATION.EFI
          grep -aF 'HII_GRAPH_SPEECH_CHUNK_START=PASS' build/NAVIGATION.EFI
          grep -aF 'HII_GRAPH_SPEECH_CHUNK_CONTINUE=PASS' build/NAVIGATION.EFI
          grep -aF 'HII_GRAPH_SPEECH_PHRASE_COMPLETE=PASS' build/NAVIGATION.EFI
          grep -aF 'HII_GRAPH_SPEECH_WHOLE_PHRASE_CLIP=PASS' build/NAVIGATION.EFI
          grep -aF 'HII_GRAPH_SPEECH_MULAW24K=PASS' build/NAVIGATION.EFI
          grep -aF 'HII_GRAPH_SPEECH_PHRASE_FIRST_MODE=PASS' build/NAVIGATION.EFI
          grep -aF 'HII_GRAPH_NAV_REALTIME_FOCUS_SPEECH=PASS' build/NAVIGATION.EFI
          grep -aF 'HII_GRAPH_NAV_SEMANTIC_ROLE=PASS' build/NAVIGATION.EFI
          grep -aF 'HII_GRAPH_NAV_CONTEXT_HELP_SPEECH=PASS' build/NAVIGATION.EFI
          grep -aF 'HII_GRAPH_NAV_DISCOVERY_PROMPT=PASS' build/NAVIGATION.EFI
          grep -aF 'HII_GRAPH_NAV_HELP_DISCOVERABLE=PASS' build/NAVIGATION.EFI
          grep -aF 'HII_GRAPH_NAV_BUILTIN_HELP=PASS' build/NAVIGATION.EFI
          grep -aF 'HII_GRAPH_NAV_SIMPLE_EXIT=PASS' build/NAVIGATION.EFI
