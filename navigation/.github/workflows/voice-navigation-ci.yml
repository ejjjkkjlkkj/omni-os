          grep -aF 'HII_GRAPH_NAV_FOCUS_VALUE_SPEECH=PASS' build/NAVIGATION.EFI
          grep -aF 'HII_GRAPH_NAV_INITIAL_VALUE_SPEECH=PASS' build/NAVIGATION.EFI
          grep -aF 'HII_GRAPH_NAV_SEMANTIC_SPEECH=ROLE_STATE_LABEL_VALUE' build/NAVIGATION.EFI
          grep -aF 'HII_GRAPH_NAV_SEMANTIC_CORE=PASS' build/NAVIGATION.EFI
