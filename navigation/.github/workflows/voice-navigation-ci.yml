          echo VOICE_NAVIGATION_BUILD=PASS

      - name: Upload validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: voice-navigation-build
          path: |
            build/NAVIGATION.EFI
            build/navigation_units.txt
            build/semantic_core-test.txt
            build/semantic_core-sanitizer.txt
            build/semantic_core.obj
          if-no-files-found: error
