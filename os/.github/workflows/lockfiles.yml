name: Lockfile reproducibility

on:
  push:
    branches: [main, bootstrap-v0.1]
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/lockfiles.yml"
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/lockfiles.yml"
  workflow_dispatch:

concurrency:
  group: lockfiles-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify Cargo lockfiles
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc -Vv
          cargo -V

      - name: Require committed lockfiles
        shell: bash
        run: |
          set -euo pipefail
          test -s Cargo.lock
          test -s boot/uefi/Cargo.lock
          test -s kernel/x86_64/Cargo.lock

      - name: Resolve workspace strictly from lockfile
        run: cargo metadata --locked --format-version 1 --manifest-path Cargo.toml > /dev/null

      - name: Resolve UEFI strictly from lockfile
        run: cargo metadata --locked --format-version 1 --manifest-path boot/uefi/Cargo.toml > /dev/null

      - name: Resolve kernel strictly from lockfile
        run: cargo metadata --locked --format-version 1 --manifest-path kernel/x86_64/Cargo.toml > /dev/null

      - name: Verify no lockfile mutation
        shell: bash
        run: git diff --exit-code -- Cargo.lock boot/uefi/Cargo.lock kernel/x86_64/Cargo.lock

      - name: Record lockfile checksums
        shell: bash
        run: |
          sha256sum Cargo.lock boot/uefi/Cargo.lock kernel/x86_64/Cargo.lock | tee LOCKFILES-SHA256.txt
          cat LOCKFILES-SHA256.txt >> "$GITHUB_STEP_SUMMARY"
