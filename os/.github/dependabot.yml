version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - rust

  - package-ecosystem: cargo
    directory: "/boot/uefi"
    schedule:
      interval: weekly
      day: monday
      time: "05:15"
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - uefi

  - package-ecosystem: cargo
    directory: "/kernel/x86_64"
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - kernel

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:45"
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - github-actions
