name: system-native-resource-v1

on:
  push:
    branches: [os]
    paths:
      - 'system/native-resource-v1/NativeResourceWitness.cs'
      - 'system/native-resource-v1/native-resource-v1.labproof'
      - '.github/workflows/system-native-resource-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  amd-real-resource:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Assert resource foundations and dedicated AMD carrier
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach($p in @(
            'lab21/native-relation-core.labproof',
            'system/native-location-v1/native-location-v1.labproof',
            'system/native-store-v1/native-store-v1.labproof'
          )) {
            $lines=Get-Content $p
            if ($lines -notcontains 'proof = PASS' -or $lines -notcontains 'system-foundation = true') {
              throw "required native foundation not proven: $p"
            }
          }
          $contract=Get-Content 'system/native-resource-v1/native-resource-v1.labproof'
          foreach($required in @(
            'required-locations = 256',
            'required-contenders-per-location = 16',
            'required-claim-transitions = 256',
            'required-blocked-claim-observations = 3840',
            'required-release-transitions = 256',
            'required-final-available-locations = 256',
            'target-selection-policy = not-established',
            'priority-semantics = none',
            'owner-identity-semantics = not-established',
            'pointer-semantics = none',
            'integer-address-semantics = none',
            'human-facing = false',
            'accessibility-behavior = not-applicable'
          )) {
            if ($contract -notcontains $required) { throw "missing resource contract: $required" }
          }
          if ($env:RUNNER_NAME -ne 'AMD-5800H-REAL') { throw "wrong runner: $env:RUNNER_NAME" }
          $cpu=Get-CimInstance Win32_Processor | Select-Object -First 1
          if ($cpu.Name -notmatch '5800H') { throw "wrong CPU: $($cpu.Name)" }
          if ([Environment]::ProcessorCount -ne 16) { throw "expected 16 logical processors, got $([Environment]::ProcessorCount)" }
          'NATIVE_RESOURCE_PRECONDITIONS=PASS'

      - name: Generate locations and exercise concurrent resource claims
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force 'resource-runtime' | Out-Null
          Add-Type -TypeDefinition (Get-Content 'system/native-location-v1/NativeLocationWitness.cs' -Raw) -Language CSharp
          Add-Type -TypeDefinition (Get-Content 'system/native-resource-v1/NativeResourceWitness.cs' -Raw) -Language CSharp

          $loc=[NativeLocationV1]::Generate(
            'lab21/relation-compose0',
            'resource-runtime/locations.qloc',
            'resource-runtime/location-witness.txt',
            8
          )
          if ($loc -ne 'NATIVE_LOCATION_V1=PASS;WIDTH=8;LOCATIONS=256;PAIR_CHECKS=32640;UNIQUE=PASS;LABEL_EXCHANGE=PASS;POINTER_SEMANTICS=NONE') {
            throw $loc
          }

          $r=[NativeResourceV1]::Exercise(
            'lab21/relation-compose0',
            'resource-runtime/locations.qloc',
            'resource-runtime/final.qresource',
            'resource-runtime/resource-witness.txt',
            16
          )
          $expected='NATIVE_RESOURCE_V1=PASS;LOCATIONS=256;CONTENDERS=16;CLAIMS=256;BLOCKED=3840;RELEASES=256;FINAL_AVAILABLE=256'
          if ($r -ne $expected) { throw $r }
          $r | Set-Content 'resource-runtime/result.txt' -Encoding utf8
          $r

      - name: Prove ambiguous resource location is rejected
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -TypeDefinition (Get-Content 'system/native-resource-v1/NativeResourceWitness.cs' -Raw) -Language CSharp
          $raw=[IO.File]::ReadAllBytes((Join-Path $PWD 'resource-runtime/locations.qloc'))
          [Array]::Copy($raw,0,$raw,8,8)
          [IO.File]::WriteAllBytes((Join-Path $PWD 'resource-runtime/ambiguous-locations.qloc'),$raw)

          $rejected=$false
          try {
            [void][NativeResourceV1]::Exercise(
              'lab21/relation-compose0',
              'resource-runtime/ambiguous-locations.qloc',
              'resource-runtime/ambiguous-final.qresource',
              'resource-runtime/ambiguous-witness.txt',
              16
            )
          } catch {
            $rejected=$true
            "EXPECTED_RESOURCE_NEGATIVE_REJECTION=$($_.Exception.Message)"
          }
          if (-not $rejected) { throw 'ambiguous resource location was not rejected' }
          'NATIVE_RESOURCE_AMBIGUOUS_LOCATION_NEGATIVE=PASS'

      - name: Verify native resource evidence
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ((Get-Item 'resource-runtime/final.qresource').Length -ne (256*9)) {
            throw 'native resource final carrier length mismatch'
          }
          $witness=Get-Content 'resource-runtime/resource-witness.txt'
          foreach($required in @(
            'locations=256',
            'contenders-per-location=16',
            'claim-transitions=256',
            'blocked-claim-observations=3840',
            'release-transitions=256',
            'available-role=structural-identity',
            'held-role=structural-non-identity',
            'claim-action=structural-non-identity',
            'release-action=structural-non-identity',
            'target-selection-policy=not-established',
            'pointer-semantics=none',
            'integer-address-semantics=none'
          )) {
            if ($witness -notcontains $required) { throw "resource witness missing $required" }
          }

          @(
            'NATIVE-RESOURCE-V1'
            "github-run-id = $env:GITHUB_RUN_ID"
            "runner-name = $env:RUNNER_NAME"
            'locations = 256'
            'contenders-per-location = 16'
            'claim-transitions = 256'
            'blocked-claim-observations = 3840'
            'release-transitions = 256'
            'final-available-locations = 256'
            'single-claim-transition-under-contention = PASS'
            'claim-release-roundtrip = PASS'
            'ambiguous-location-negative-test = PASS'
            'target-selection-policy = not-established'
            'owner-identity-semantics = not-established'
            'pointer-semantics = none'
            'integer-address-semantics = none'
            'result = PASS'
          ) | Set-Content 'resource-runtime/evidence.txt' -Encoding utf8
          Get-Content 'resource-runtime/evidence.txt'

      - name: Enforce native resource accessibility boundary
        shell: pwsh
        run: |
          $lines=Get-Content 'system/native-resource-v1/native-resource-v1.labproof'
          if ($lines -notcontains 'human-facing = false') { throw 'resource human-facing boundary missing' }
          if ($lines -notcontains 'accessibility-behavior = not-applicable') { throw 'resource accessibility boundary missing' }
          if (-not ($lines | Where-Object { $_ -like 'accessibility-gate = *' })) { throw 'resource accessibility gate missing' }
          'NATIVE_RESOURCE_ACCESSIBILITY_BOUNDARY=PASS'

      - name: Hash native resource evidence
        shell: pwsh
        run: |
          Get-FileHash -Algorithm SHA256 'system/native-resource-v1/NativeResourceWitness.cs','resource-runtime/locations.qloc','resource-runtime/final.qresource','resource-runtime/resource-witness.txt','resource-runtime/evidence.txt' |
            ForEach-Object { "$($_.Path) SHA256=$($_.Hash.ToLowerInvariant())" }

      - name: Upload native resource evidence
        uses: actions/upload-artifact@v4
        with:
          name: system-native-resource-v1-amd5800h
          path: |
            resource-runtime/locations.qloc
            resource-runtime/final.qresource
            resource-runtime/resource-witness.txt
            resource-runtime/evidence.txt
          if-no-files-found: error

  linux-independent-replay:
    needs: amd-real-resource
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: system-native-resource-v1-amd5800h
          path: resource-artifact

      - name: Independently replay resource claim release semantics
        shell: python
        run: |
          from pathlib import Path

          table=Path('lab21/relation-compose0').read_bytes()
          states=list(dict.fromkeys(table))
          assert len(table)==4 and len(states)==2
          def idx(x): return states.index(x)
          def compose(a,b): return table[idx(a)*2+idx(b)]
          identities=[e for e in states if all(compose(e,x)==x and compose(x,e)==x for x in states)]
          assert len(identities)==1
          available=identities[0]
          held=states[1] if states[0]==available else states[0]
          assert compose(available,held)==held
          assert compose(held,held)==available

          root=Path('resource-artifact')
          locations=(root/'locations.qloc').read_bytes()
          final=(root/'final.qresource').read_bytes()
          assert len(locations)==256*8
          assert len(final)==256*9

          keys=[locations[i*8:(i+1)*8] for i in range(256)]
          assert len(set(keys))==256

          records=[final[i*9:(i+1)*9] for i in range(256)]
          mapping={}
          for record in records:
              key=record[:8]
              state=record[8]
              assert key not in mapping
              assert key in set(keys)
              assert state==available
              mapping[key]=state
          assert set(mapping)==set(keys)

          witness=(root/'resource-witness.txt').read_text().splitlines()
          values=dict(line.split('=',1) for line in witness if '=' in line)
          assert values['locations']=='256'
          assert values['contenders-per-location']=='16'
          assert values['claim-transitions']=='256'
          assert values['blocked-claim-observations']=='3840'
          assert values['release-transitions']=='256'
          assert values['available-role']=='structural-identity'
          assert values['held-role']=='structural-non-identity'
          assert values['claim-action']=='structural-non-identity'
          assert values['release-action']=='structural-non-identity'
          assert values['target-selection-policy']=='not-established'
          assert values['pointer-semantics']=='none'
          assert values['integer-address-semantics']=='none'

          evidence=(root/'evidence.txt').read_text().splitlines()
          required={
              'locations = 256',
              'contenders-per-location = 16',
              'claim-transitions = 256',
              'blocked-claim-observations = 3840',
              'release-transitions = 256',
              'final-available-locations = 256',
              'single-claim-transition-under-contention = PASS',
              'claim-release-roundtrip = PASS',
              'ambiguous-location-negative-test = PASS',
              'target-selection-policy = not-established',
              'owner-identity-semantics = not-established',
              'pointer-semantics = none',
              'integer-address-semantics = none',
              'result = PASS',
          }
          assert required.issubset(set(evidence))
          print('NATIVE_RESOURCE_V1_LINUX_REPLAY=PASS;CLAIMS=256;BLOCKED=3840;RELEASES=256;FINAL_AVAILABLE=256')
