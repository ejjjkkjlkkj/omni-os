name: system-native-correction-plan-v1

on:
  push:
    branches: [os]
    paths:
      - 'system/native-correction-plan-v1/NativeCorrectionPlanWitness.cs'
      - '.github/workflows/system-native-correction-plan-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  amd-real-correction-plan:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Assert correction-plan foundations and no-execution boundary
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach ($p in @(
            'lab21/native-relation-core.labproof',
            'system/native-episode-v1/native-episode-v1.labproof',
            'system/native-metacognition-v1/native-metacognition-v1.labproof'
          )) {
            $lines=Get-Content $p
            if ($lines -notcontains 'proof = PASS' -or $lines -notcontains 'system-foundation = true') {
              throw "required native foundation not proven: $p"
            }
          }
          $contract=Get-Content 'system/native-correction-plan-v1/native-correction-plan-v1.labproof'
          if ($contract -notcontains 'execution = forbidden') { throw 'correction execution boundary missing' }
          if ($contract -notcontains 'executed-actions = 0') { throw 'executed action count boundary missing' }
          if ($contract -notcontains 'human-authorization-before-execution = required') { throw 'human authorization requirement missing' }
          if ($contract -notcontains 'autonomous-correction-execution = false') { throw 'autonomous correction execution must be disabled' }
          if ($env:RUNNER_NAME -ne 'AMD-5800H-REAL') { throw "wrong runner: $env:RUNNER_NAME" }
          'NATIVE_CORRECTION_PLAN_PRECONDITIONS=PASS'

      - name: Build valid and isolated negative episodic witnesses
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force 'correction-runtime' | Out-Null
          Add-Type -TypeDefinition (Get-Content 'system/native-goal-execution-v1/NativeGoalExecutionWitness.cs' -Raw) -Language CSharp
          Add-Type -TypeDefinition (Get-Content 'system/native-episode-v1/NativeEpisodeWitness.cs' -Raw) -Language CSharp
          Add-Type -TypeDefinition (Get-Content 'system/native-metacognition-v1/NativeMetacognitionWitness.cs' -Raw) -Language CSharp

          [NativeGoalExecutionV1]::WriteFixture('lab21/relation-compose0','identity','correction-runtime/identity.qstate')
          [NativeGoalExecutionV1]::WriteFixture('lab21/relation-compose0','exchange','correction-runtime/exchange.qstate')
          Remove-Item 'correction-runtime/valid.qepisode' -Force -ErrorAction SilentlyContinue
          $I='correction-runtime/identity.qstate'
          $E='correction-runtime/exchange.qstate'
          [void][NativeEpisodeV1]::Append('lab21/relation-compose0',$I,$E,$E,$E,'correction-runtime/valid.qepisode','correction-runtime/ep1.txt')
          [void][NativeEpisodeV1]::Append('lab21/relation-compose0',$E,$I,$I,$I,'correction-runtime/valid.qepisode','correction-runtime/ep2.txt')
          [void][NativeEpisodeV1]::Append('lab21/relation-compose0',$E,$I,$E,$E,'correction-runtime/valid.qepisode','correction-runtime/ep3.txt')
          [void][NativeEpisodeV1]::Append('lab21/relation-compose0',$I,$E,$I,$I,'correction-runtime/valid.qepisode','correction-runtime/ep4.txt')

          [void][NativeMetacognitionV1]::Inspect(
            'lab21/relation-compose0',
            'correction-runtime/valid.qepisode',
            'correction-runtime/valid.qmeta',
            'correction-runtime/valid-meta-witness.txt'
          )

          Copy-Item 'correction-runtime/valid.qepisode' 'correction-runtime/corrupted.qepisode' -Force
          $bytes=[IO.File]::ReadAllBytes((Join-Path $PWD 'correction-runtime/corrupted.qepisode'))
          $identity=[IO.File]::ReadAllBytes((Join-Path $PWD $I))[0]
          $exchange=[IO.File]::ReadAllBytes((Join-Path $PWD $E))[0]
          if ($bytes[10] -ne $exchange -or $bytes[11] -ne $exchange) { throw 'negative fixture episode3 mismatch' }
          $bytes[11]=$identity
          [IO.File]::WriteAllBytes((Join-Path $PWD 'correction-runtime/corrupted.qepisode'),$bytes)

          [void][NativeMetacognitionV1]::Inspect(
            'lab21/relation-compose0',
            'correction-runtime/corrupted.qepisode',
            'correction-runtime/corrupted.qmeta',
            'correction-runtime/corrupted-meta-witness.txt'
          )

          "source-history-sha256 = $((Get-FileHash 'correction-runtime/valid.qepisode' -Algorithm SHA256).Hash.ToLowerInvariant())" |
            Set-Content 'correction-runtime/source-hash.txt' -Encoding utf8
          'NATIVE_CORRECTION_PLAN_FIXTURES=PASS'

      - name: Plan valid no-op corrections without execution
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -TypeDefinition (Get-Content 'system/native-correction-plan-v1/NativeCorrectionPlanWitness.cs' -Raw) -Language CSharp
          $r=[NativeCorrectionPlanV1]::Plan(
            'lab21/relation-compose0',
            'correction-runtime/valid.qepisode',
            'correction-runtime/valid.qmeta',
            'correction-runtime/valid.qplan',
            'correction-runtime/valid-plan-witness.txt'
          )
          if ($r -ne 'NATIVE_CORRECTION_PLAN_V1=PASS;EPISODES=4;CORRECTIONS=0;NOOPS=4;EXECUTED=0') { throw $r }
          $r

      - name: Plan negative correction without execution
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -TypeDefinition (Get-Content 'system/native-correction-plan-v1/NativeCorrectionPlanWitness.cs' -Raw) -Language CSharp
          $r=[NativeCorrectionPlanV1]::Plan(
            'lab21/relation-compose0',
            'correction-runtime/corrupted.qepisode',
            'correction-runtime/corrupted.qmeta',
            'correction-runtime/corrupted.qplan',
            'correction-runtime/corrupted-plan-witness.txt'
          )
          if ($r -ne 'NATIVE_CORRECTION_PLAN_V1=PASS;EPISODES=4;CORRECTIONS=1;NOOPS=3;EXECUTED=0') { throw $r }
          $r

      - name: Verify correction plan semantics and no execution
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $I=[IO.File]::ReadAllBytes((Join-Path $PWD 'correction-runtime/identity.qstate'))[0]
          $E=[IO.File]::ReadAllBytes((Join-Path $PWD 'correction-runtime/exchange.qstate'))[0]
          $valid=[IO.File]::ReadAllBytes((Join-Path $PWD 'correction-runtime/valid.qplan'))
          $bad=[IO.File]::ReadAllBytes((Join-Path $PWD 'correction-runtime/corrupted.qplan'))

          if ($valid.Length -ne 4 -or ($valid | Where-Object { $_ -ne $I }).Count -ne 0) {
            throw 'valid correction plan must contain four structural identity no-ops'
          }
          if ($bad.Length -ne 4 -or $bad[0] -ne $I -or $bad[1] -ne $I -or $bad[2] -ne $E -or $bad[3] -ne $I) {
            throw 'negative correction plan must isolate one exchange repair at episode3'
          }

          $sourceHash=((Get-Content 'correction-runtime/source-hash.txt') -split ' = ',2)[1]
          $afterHash=(Get-FileHash 'correction-runtime/valid.qepisode' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sourceHash -ne $afterHash) { throw 'valid source history mutated' }

          @(
            'NATIVE-CORRECTION-PLAN-V1'
            "github-run-id = $env:GITHUB_RUN_ID"
            "runner-name = $env:RUNNER_NAME"
            'valid-plan-corrections = 0'
            'valid-plan-noops = 4'
            'negative-plan-corrections = 1'
            'negative-plan-noops = 3'
            'negative-plan-correction-episode = 3'
            'executed-actions = 0'
            'execution = forbidden'
            'human-authorization-before-execution = required'
            'autonomous-correction-execution = false'
            'source-history-mutation = false'
            'result = PASS'
          ) | Set-Content 'correction-runtime/evidence.txt' -Encoding utf8
          Get-Content 'correction-runtime/evidence.txt'

      - name: Enforce accessibility and authority boundary
        shell: pwsh
        run: |
          $lines=Get-Content 'system/native-correction-plan-v1/native-correction-plan-v1.labproof'
          if ($lines -notcontains 'human-facing = false') { throw 'correction-plan human-facing boundary missing' }
          if ($lines -notcontains 'accessibility-behavior = not-applicable') { throw 'correction-plan accessibility boundary missing' }
          if ($lines -notcontains 'execution = forbidden') { throw 'execution prohibition missing' }
          if ($lines -notcontains 'human-authorization-before-execution = required') { throw 'human authorization requirement missing' }
          if ($lines -notcontains 'autonomous-correction-execution = false') { throw 'autonomous correction execution prohibition missing' }
          if (-not ($lines | Where-Object { $_ -like 'accessibility-gate = *' })) { throw 'correction accessibility gate missing' }
          'NATIVE_CORRECTION_PLAN_BOUNDARY=PASS'

      - name: Hash correction-plan evidence
        shell: pwsh
        run: |
          Get-FileHash -Algorithm SHA256 'system/native-correction-plan-v1/NativeCorrectionPlanWitness.cs','correction-runtime/valid.qepisode','correction-runtime/valid.qmeta','correction-runtime/valid.qplan','correction-runtime/valid-plan-witness.txt','correction-runtime/corrupted.qepisode','correction-runtime/corrupted.qmeta','correction-runtime/corrupted.qplan','correction-runtime/corrupted-plan-witness.txt','correction-runtime/evidence.txt' |
            ForEach-Object { "$($_.Path) SHA256=$($_.Hash.ToLowerInvariant())" }

      - name: Upload correction-plan evidence
        uses: actions/upload-artifact@v4
        with:
          name: system-native-correction-plan-v1-amd5800h
          path: |
            correction-runtime/valid.qepisode
            correction-runtime/valid.qmeta
            correction-runtime/valid.qplan
            correction-runtime/valid-plan-witness.txt
            correction-runtime/corrupted.qepisode
            correction-runtime/corrupted.qmeta
            correction-runtime/corrupted.qplan
            correction-runtime/corrupted-plan-witness.txt
            correction-runtime/evidence.txt
          if-no-files-found: error

  linux-independent-replay:
    needs: amd-real-correction-plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: system-native-correction-plan-v1-amd5800h
          path: correction-artifact

      - name: Independently replay non-executing correction plans
        shell: python
        run: |
          from pathlib import Path

          table=Path('lab21/relation-compose0').read_bytes()
          states=list(dict.fromkeys(table))
          assert len(table)==4 and len(states)==2
          def idx(x): return states.index(x)
          def compose(a,b): return table[idx(a)*2+idx(b)]
          identities=[e for e in states if all(compose(e,x)==x and compose(x,e)==x for x in states)]
          assert len(identities)==1
          identity=identities[0]
          exchange=states[1] if states[0]==identity else states[0]

          root=Path('correction-artifact')
          valid_hist=(root/'valid.qepisode').read_bytes()
          bad_hist=(root/'corrupted.qepisode').read_bytes()
          valid_meta=(root/'valid.qmeta').read_bytes()
          bad_meta=(root/'corrupted.qmeta').read_bytes()
          valid_plan=(root/'valid.qplan').read_bytes()
          bad_plan=(root/'corrupted.qplan').read_bytes()

          assert valid_meta==bytes([identity]*4)
          assert bad_meta==bytes([identity,identity,exchange,identity])
          assert valid_plan==valid_meta
          assert bad_plan==bad_meta
          assert len(valid_hist)==len(bad_hist)==16

          for history,plan in ((valid_hist,valid_plan),(bad_hist,bad_plan)):
              for i,action in enumerate(plan):
                  expected=history[i*4+2]
                  actual=history[i*4+3]
                  assert compose(actual,action)==expected

          evidence=(root/'evidence.txt').read_text().splitlines()
          required={
              'valid-plan-corrections = 0',
              'valid-plan-noops = 4',
              'negative-plan-corrections = 1',
              'negative-plan-noops = 3',
              'negative-plan-correction-episode = 3',
              'executed-actions = 0',
              'execution = forbidden',
              'human-authorization-before-execution = required',
              'autonomous-correction-execution = false',
              'source-history-mutation = false',
              'result = PASS',
          }
          assert required.issubset(set(evidence))
          print('NATIVE_CORRECTION_PLAN_V1_LINUX_REPLAY=PASS;NO_EXECUTION=PASS;NEGATIVE_REPAIR_PLAN=PASS;HUMAN_AUTHORITY_BOUNDARY=PASS')
