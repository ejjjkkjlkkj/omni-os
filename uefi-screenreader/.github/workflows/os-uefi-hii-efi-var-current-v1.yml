# Refresh EFI_VARSTORE_EFI discovery for final UEFI commit target.
name: os-uefi-hii-efi-var-current-v1

on:
  push:
    branches: [os]
    paths:
      - 'boot/uefi-hii-efi-var-current-v1/build_uefi_hii_efi_var_current.py'
      - 'boot/uefi-hii-efi-var-current-v1/os-uefi-hii-efi-var-current-v1.labproof'
      - 'boot/uefi-hii-varstore-def-v1/os-uefi-hii-varstore-def-v1.labproof'
      - '.github/workflows/os-uefi-hii-efi-var-current-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  q35-native-efi-var-current:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install QEMU and OVMF
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf

      - name: Enforce VarStore definition foundation
        shell: python
        run: |
          from pathlib import Path
          have=set(Path('boot/uefi-hii-varstore-def-v1/os-uefi-hii-varstore-def-v1.labproof').read_text().splitlines())
          for line in [
              'proof = PASS',
              'proof-varstore-definition = PASS',
              'proof-current-value-read = false',
              'proof-runtime-variable-read = false',
              'proof-varstore-write = false',
              'proof-setting-mutation = false',
          ]:
              assert line in have,line
          print('HII_EFI_VAR_CURRENT_DEPENDENCY=PASS')

      - name: Audit read-only EFI variable source contract
        shell: python
        run: |
          from pathlib import Path
          import ast
          root=Path('boot/uefi-hii-efi-var-current-v1')
          src=(root/'build_uefi_hii_efi_var_current.py').read_text()
          ast.parse(src)
          for token in [
              "c.emit(b'\\x3c\\x26')",
              "c.emit(b'\\xff\\x50\\x48')",
              "EFI_VARSTORE_EFI_MATCH=PASS",
              "GET_VARIABLE=PASS",
              "CURRENT_VALUE_READ=PASS",
              "CURRENT_VALUE_BYTES_HEX=",
              "CURRENT_VALUE_RAW8_HEX=",
              "GET_VARIABLE_ATTRIBUTES_LE_HEX=",
              "VARSTORE_EFI_NAME=",
              "OS_UEFI_HII_EFI_VAR_CURRENT_BUILD=PASS",
          ]:
              assert token in src,token
          assert "c.emit(b'\\xff\\x50\\x58')" not in src
          proof=set((root/'os-uefi-hii-efi-var-current-v1.labproof').read_text().splitlines())
          for line in [
              'storage-opcode = 0x26 EFI_IFR_VARSTORE_EFI',
              'storage-read-service = EFI_RUNTIME_SERVICES.GetVariable',
              'set-variable-call = forbidden',
              'varstore-write = forbidden',
              'firmware-setting-mutation = forbidden',
          ]:
              assert line in proof,line
          print('HII_EFI_VAR_CURRENT_SOURCE_CONTRACT=PASS')

      - name: Build deterministic current-value EFI twice
        shell: bash
        run: |
          set -euo pipefail
          root=boot/uefi-hii-efi-var-current-v1
          python "$root/build_uefi_hii_efi_var_current.py" "$root/BOOTX64.EFI" | tee "$root/build.log"
          python "$root/build_uefi_hii_efi_var_current.py" "$root/BOOTX64-2.EFI" > "$root/build2.log"
          cmp "$root/BOOTX64.EFI" "$root/BOOTX64-2.EFI"
          grep -F 'OS_UEFI_HII_EFI_VAR_CURRENT_BUILD=PASS' "$root/build.log"
          sha256sum "$root/BOOTX64.EFI"

      - name: Audit PE and read-only runtime-variable witnesses
        shell: python
        run: |
          from pathlib import Path
          import struct
          image=Path('boot/uefi-hii-efi-var-current-v1/BOOTX64.EFI').read_bytes()
          assert image[:2]==b'MZ'
          pe=struct.unpack_from('<I',image,0x3c)[0]
          assert image[pe:pe+4]==b'PE\0\0'
          coff=pe+4
          assert struct.unpack_from('<HH',image,coff)==(0x8664,3)
          opt=coff+20
          assert struct.unpack_from('<H',image,opt)[0]==0x20b
          assert struct.unpack_from('<H',image,opt+0x44)[0]==10
          sec=opt+0xf0; ds=sec+40
          tc=struct.unpack_from('<I',image,sec+0x24)[0]
          dc=struct.unpack_from('<I',image,ds+0x24)[0]
          assert not(tc&0x80000000)
          assert dc&0x80000000 and not(dc&0x20000000)
          for token in [
              b'HII_EXPORT_ALL_PACKAGE_LISTS=PASS\r\n',
              b'QUESTION_METADATA=PASS\r\n',
              b'VARSTORE_DEFINITION_MATCH=PASS\r\n',
              b'EFI_VARSTORE_EFI_MATCH=PASS\r\n',
              b'GET_VARIABLE=PASS\r\n',
              b'CURRENT_VALUE_READ=PASS\r\n',
              b'CURRENT_VALUE_BYTES_HEX=',
              b'CURRENT_VALUE_RAW8_HEX=',
              b'VARSTORE_EFI_NAME=',
              b'HII_QUESTION_STRING=PASS\r\n',
          ]:
              assert token in image,token
          print('HII_EFI_VAR_CURRENT_STATIC=PASS')
          print('EFI_VARSTORE_EFI_26=REQUIRED')
          print('GET_VARIABLE=BOUND')
          print('SET_VARIABLE=ABSENT_BY_CONTRACT')
          print('W_X=BLOCKED')

      - name: Resolve OVMF
        shell: bash
        run: |
          set -euo pipefail
          CODE=''; VARS=''
          for pair in \
            '/usr/share/OVMF/OVMF_CODE_4M.fd|/usr/share/OVMF/OVMF_VARS_4M.fd' \
            '/usr/share/OVMF/OVMF_CODE.fd|/usr/share/OVMF/OVMF_VARS.fd' \
            '/usr/share/edk2/ovmf/OVMF_CODE.fd|/usr/share/edk2/ovmf/OVMF_VARS.fd'
          do
            IFS='|' read -r code vars <<< "$pair"
            if [[ -f "$code" && -f "$vars" ]]; then CODE="$code"; VARS="$vars"; break; fi
          done
          test -n "$CODE" -a -n "$VARS"
          printf 'CODE=%s\nVARS=%s\n' "$CODE" "$VARS" > boot/uefi-hii-efi-var-current-v1/ovmf.env

      - name: Read live EFI-variable-backed ONE_OF current value
        shell: bash
        run: |
          set -euo pipefail
          source boot/uefi-hii-efi-var-current-v1/ovmf.env
          root=boot/uefi-hii-efi-var-current-v1
          cp "$VARS" "$root/vars.fd"
          rm -rf "$root/esp"
          mkdir -p "$root/esp/EFI/BOOT"
          cp "$root/BOOTX64.EFI" "$root/esp/EFI/BOOT/BOOTX64.EFI"
          rm -f "$root/current.serial" "$root/current.txt"

          qemu-system-x86_64 \
            -machine q35,accel=tcg -m 128M \
            -drive if=pflash,format=raw,readonly=on,file="$CODE" \
            -drive if=pflash,format=raw,file="$root/vars.fd" \
            -drive format=raw,file=fat:rw:"$root/esp" \
            -display none -monitor none \
            -serial file:"$root/current.serial" \
            -parallel none -net none -no-reboot -no-shutdown &
          qpid=$!
          trap 'kill "$qpid" 2>/dev/null || true' EXIT

          python - <<'PY'
          from pathlib import Path
          import re,time
          root=Path('boot/uefi-hii-efi-var-current-v1')
          p=root/'current.serial'
          required=[
              b'HII_EXPORT_ALL_PACKAGE_LISTS=PASS\r\n',
              b'QUESTION_METADATA=PASS\r\n',
              b'VARSTORE_DEFINITION_MATCH=PASS\r\n',
              b'EFI_VARSTORE_EFI_MATCH=PASS\r\n',
              b'GET_VARIABLE=PASS\r\n',
              b'CURRENT_VALUE_READ=PASS\r\n',
              b'HII_QUESTION_STRING=PASS\r\n',
              b'STATUS=PASS\r\n',
          ]
          end=time.time()+30
          while time.time()<end:
              raw=p.read_bytes() if p.exists() else b''
              if b'STATUS=BLOCKED\r\n' in raw:
                  raise SystemExit('EFI variable current-value read blocked: '+repr(raw[-12288:]))
              label=re.search(br'QUESTION_TEXT=([^\r\n]+)',raw)
              qid=re.search(br'QUESTION_ID_LE_HEX=([0-9A-F]{4})',raw)
              vsid=re.search(br'VARSTORE_ID_LE_HEX=([0-9A-F]{4})',raw)
              vinfo=re.search(br'VARSTORE_INFO_LE_HEX=([0-9A-F]{4})',raw)
              op=re.search(br'VARSTORE_OPCODE_HEX=([0-9A-F]{2})',raw)
              size=re.search(br'VARSTORE_SIZE_LE_HEX=([0-9A-F]{4})',raw)
              guid=re.search(br'VARSTORE_GUID_RAW_HEX=([0-9A-F]{32})',raw)
              width=re.search(br'CURRENT_VALUE_BYTES_HEX=([0-9A-F]{2})',raw)
              value=re.search(br'CURRENT_VALUE_RAW8_HEX=([0-9A-F]{16})',raw)
              attrs=re.search(br'GET_VARIABLE_ATTRIBUTES_LE_HEX=([0-9A-F]{8})',raw)
              name=re.search(br'VARSTORE_EFI_NAME=([^\r\n]+)',raw)
              ms=[label,qid,vsid,vinfo,op,size,guid,width,value,attrs,name]
              if all(ms) and all(x in raw for x in required):
                  def le(m):
                      h=m.group(1).decode()
                      return h,int.from_bytes(bytes.fromhex(h),'little')
                  qid_h,qid_v=le(qid)
                  vsid_h,vsid_v=le(vsid)
                  vinfo_h,vinfo_v=le(vinfo)
                  size_h,size_v=le(size)
                  attrs_h,attrs_v=le(attrs)
                  w=int(width.group(1),16)
                  raw8=value.group(1).decode()
                  op_s=op.group(1).decode()
                  guid_s=guid.group(1).decode()
                  name_s=name.group(1).decode('ascii','replace').strip()
                  text=label.group(1).decode('ascii','replace').strip()
                  assert op_s=='26',op_s
                  assert w in {1,2,4,8},w
                  assert vinfo_v+w <= size_v,(vinfo_v,w,size_v)
                  current=int.from_bytes(bytes.fromhex(raw8)[:w],'little')
                  root.joinpath('current.txt').write_text(
                      f'question-text = {text}\n'
                      f'question-id = {qid_v}\n'
                      f'varstore-id = {vsid_v}\n'
                      f'varstore-offset = {vinfo_v}\n'
                      f'varstore-opcode-hex = {op_s}\n'
                      f'varstore-size = {size_v}\n'
                      f'varstore-guid-raw-hex = {guid_s}\n'
                      f'varstore-efi-name = {name_s}\n'
                      f'get-variable-attributes = {attrs_v}\n'
                      f'get-variable-attributes-le-hex = {attrs_h}\n'
                      f'current-width = {w}\n'
                      f'current-raw8-hex = {raw8}\n'
                      f'current-value-unsigned = {current}\n'
                  )
                  print('HII_EFI_VAR_CURRENT_QUESTION='+text)
                  print('HII_EFI_VAR_CURRENT_NAME='+name_s)
                  print('HII_EFI_VAR_CURRENT_WIDTH='+str(w))
                  print('HII_EFI_VAR_CURRENT_VALUE='+str(current))
                  print('UEFI_HII_EFI_VAR_CURRENT_RUNTIME=PASS')
                  break
              time.sleep(.1)
          else:
              raw=p.read_bytes() if p.exists() else b''
              raise SystemExit('timeout waiting EFI variable current-value read: '+repr(raw[-12288:]))
          PY

          kill "$qpid" 2>/dev/null || true
          wait "$qpid" 2>/dev/null || true
          trap - EXIT

      - name: Record current-value evidence
        shell: bash
        run: |
          set -euo pipefail
          root=boot/uefi-hii-efi-var-current-v1
          sha256sum "$root/BOOTX64.EFI" "$root/current.serial" "$root/current.txt" > "$root/evidence.sha256"
          {
            echo 'OS-UEFI-HII-EFI-VAR-CURRENT-V1'
            echo 'firmware = OVMF'
            echo 'machine = q35'
            cat "$root/current.txt"
            echo 'read-service = GetVariable'
            echo 'set-variable-call = false'
            echo 'varstore-write = false'
            echo 'setting-mutation = false'
            echo 'result = PASS'
          } > "$root/linux-evidence.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: os-uefi-hii-efi-var-current-v1-linux
          path: |
            boot/uefi-hii-efi-var-current-v1/BOOTX64.EFI
            boot/uefi-hii-efi-var-current-v1/current.serial
            boot/uefi-hii-efi-var-current-v1/current.txt
            boot/uefi-hii-efi-var-current-v1/build.log
            boot/uefi-hii-efi-var-current-v1/evidence.sha256
            boot/uefi-hii-efi-var-current-v1/linux-evidence.txt
          if-no-files-found: error

      - name: Persist revision-bound EFI-variable current-value proof
        shell: bash
        run: |
          set -euo pipefail
          root=boot/uefi-hii-efi-var-current-v1
          proof="$root/os-uefi-hii-efi-var-current-v1.labproof"
          builder="$root/build_uefi_hii_efi_var_current.py"
          workflow=".github/workflows/os-uefi-hii-efi-var-current-v1.yml"
          tested_builder="$(git rev-parse "$GITHUB_SHA:$builder")"
          tested_workflow="$(git rev-parse "$GITHUB_SHA:$workflow")"
          cp "$root/BOOTX64.EFI" /tmp/hii-efi-var-current.efi
          cp "$root/current.serial" /tmp/hii-efi-var-current.serial
          cp "$root/current.txt" /tmp/hii-efi-var-current.txt

          git fetch origin os
          git checkout -B os origin/os
          [[ "$tested_builder" == "$(git rev-parse "os:$builder")" ]] || { echo HII_EFI_VAR_CURRENT_STALE_BUILDER=SKIP; exit 0; }
          [[ "$tested_workflow" == "$(git rev-parse "os:$workflow")" ]] || { echo HII_EFI_VAR_CURRENT_STALE_WORKFLOW=SKIP; exit 0; }

          python - <<'PY'
          from pathlib import Path
          import hashlib,os
          root=Path('boot/uefi-hii-efi-var-current-v1')
          p=root/'os-uefi-hii-efi-var-current-v1.labproof'
          text=p.read_text()
          states=[x for x in text.splitlines() if x.startswith('proof = ')]
          if len(states)!=1 or states[0] not in {'proof = PENDING_CI','proof = PASS'}:
              raise SystemExit('unexpected proof state: '+repr(states))
          vals={}
          for line in Path('/tmp/hii-efi-var-current.txt').read_text().splitlines():
              if ' = ' in line:
                  k,v=line.split(' = ',1); vals[k]=v
          kept=[]
          for line in text.splitlines():
              if line.startswith('proof-'):
                  continue
              kept.append('proof = PASS' if line.startswith('proof = ') else line)
          efi=Path('/tmp/hii-efi-var-current.efi').read_bytes()
          serial=Path('/tmp/hii-efi-var-current.serial').read_bytes()
          text='\n'.join(kept).rstrip()+'\n'
          text += (
              f"proof-run = {os.environ['GITHUB_RUN_ID']}\n"
              f"proof-head-sha = {os.environ['GITHUB_SHA']}\n"
              "proof-current-value-read = PASS\n"
              "proof-read-service = GetVariable\n"
              f"proof-question-text = {vals['question-text']}\n"
              f"proof-question-id = {vals['question-id']}\n"
              f"proof-varstore-id = {vals['varstore-id']}\n"
              f"proof-varstore-offset = {vals['varstore-offset']}\n"
              f"proof-varstore-size = {vals['varstore-size']}\n"
              f"proof-varstore-guid-raw-hex = {vals['varstore-guid-raw-hex']}\n"
              f"proof-varstore-efi-name = {vals['varstore-efi-name']}\n"
              f"proof-get-variable-attributes = {vals['get-variable-attributes']}\n"
              f"proof-current-width = {vals['current-width']}\n"
              f"proof-current-raw8-hex = {vals['current-raw8-hex']}\n"
              f"proof-current-value-unsigned = {vals['current-value-unsigned']}\n"
              "proof-set-variable-call = false\n"
              "proof-varstore-write = false\n"
              "proof-setting-mutation = false\n"
              f"proof-efi-sha256 = {hashlib.sha256(efi).hexdigest()}\n"
              f"proof-serial-sha256 = {hashlib.sha256(serial).hexdigest()}\n"
          )
          p.write_text(text)
          PY

          if git diff --quiet -- "$proof"; then exit 0; fi
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$proof"
          git commit -m "Record read-only UEFI EFI-variable current-value proof [skip ci]"
          git push origin os
