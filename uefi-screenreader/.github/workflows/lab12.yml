name: lab12-raw-machine-execution

on:
  push:
    branches: [os]
    paths:
      - 'lab12/RawExchangeWitness.cs'
      - '.github/workflows/lab12.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  raw-machine-execution:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    steps:
      - name: Checkout witness material
        uses: actions/checkout@v5

      - name: Assert AMD runner identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'AMD-5800H-REAL') { throw "wrong runner: $env:RUNNER_NAME" }
          if ($env:RUNNER_OS -ne 'Windows') { throw "wrong OS: $env:RUNNER_OS" }
          if ($env:RUNNER_ARCH -ne 'X64') { throw "wrong arch: $env:RUNNER_ARCH" }
          $cpu = Get-CimInstance Win32_Processor | Select-Object -First 1
          if ($cpu.Name -notmatch '5800H') { throw "wrong CPU: $($cpu.Name)" }
          "LAB12_RUNNER_IDENTITY=PASS"
          "LAB12_CPU_IDENTITY=PASS"

      - name: Execute exact raw machine bytes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = Get-Content 'lab12/RawExchangeWitness.cs' -Raw
          Add-Type -TypeDefinition $src -Language CSharp
          $workers = [Environment]::ProcessorCount
          $result = [Lab12Witness]::Run($workers, 4)
          if ($result -notlike 'LAB12_RAW_EXECUTION=PASS*') { throw $result }
          $hash = [Lab12Witness]::CodeSha256()
          @(
            'LAB12'
            "github-run-id = $env:GITHUB_RUN_ID"
            "runner-name = $env:RUNNER_NAME"
            "runner-os = $env:RUNNER_OS"
            "runner-arch = $env:RUNNER_ARCH"
            "cpu-name = $((Get-CimInstance Win32_Processor | Select-Object -First 1).Name)"
            "raw-code-sha256 = $hash"
            $result
            'roundtrip = PASS'
            'result = PASS'
          ) | Set-Content 'lab12-evidence.txt' -Encoding utf8
          Get-Content 'lab12-evidence.txt'

      - name: Enforce accessibility boundary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $lines = Get-Content 'lab12/raw-machine-execution.labproof'
          if ($lines -notcontains 'human-facing = false') { throw 'human-facing boundary missing' }
          if ($lines -notcontains 'accessibility-behavior = not-applicable') { throw 'accessibility behavior boundary missing' }
          if (-not ($lines | Where-Object { $_ -like 'accessibility-gate = *' })) { throw 'accessibility gate missing' }
          'LAB12_ACCESSIBILITY_BOUNDARY=PASS'

      - name: Hash evidence
        shell: pwsh
        run: |
          Get-FileHash -Algorithm SHA256 'lab12/RawExchangeWitness.cs','lab12/raw-machine-execution.labproof','lab12-evidence.txt' |
            ForEach-Object { "$($_.Path) SHA256=$($_.Hash.ToLowerInvariant())" }

      - name: Upload Lab12 evidence
        uses: actions/upload-artifact@v4
        with:
          name: lab12-amd5800h-real-evidence
          path: lab12-evidence.txt
          if-no-files-found: error
