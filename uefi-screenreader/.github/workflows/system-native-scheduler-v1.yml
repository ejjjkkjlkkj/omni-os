name: system-native-scheduler-v1

on:
  push:
    branches: [os]
    paths:
      - 'system/native-scheduler-v1/NativeSchedulerWitness.cs'
      - 'system/native-scheduler-v1/native-scheduler-v1.labproof'
      - '.github/workflows/system-native-scheduler-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  amd-real-scheduler:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Assert scheduler foundations and dedicated AMD carrier
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach($p in @(
            'lab21/native-relation-core.labproof',
            'lab24/native-transition-core.labproof'
          )) {
            $lines=Get-Content $p
            if ($lines -notcontains 'proof = PASS' -or $lines -notcontains 'system-foundation = true') {
              throw "required system foundation not proven: $p"
            }
          }
          $contract=Get-Content 'system/native-scheduler-v1/native-scheduler-v1.labproof'
          foreach($required in @(
            'required-workers = 16',
            'required-submitted-actions = 131072',
            'priority-semantics = none',
            'deadline-semantics = none',
            'human-facing = false',
            'accessibility-behavior = not-applicable'
          )) {
            if ($contract -notcontains $required) { throw "missing scheduler contract: $required" }
          }
          if ($env:RUNNER_NAME -ne 'AMD-5800H-REAL') { throw "wrong runner: $env:RUNNER_NAME" }
          $cpu=Get-CimInstance Win32_Processor | Select-Object -First 1
          if ($cpu.Name -notmatch '5800H') { throw "wrong CPU: $($cpu.Name)" }
          if ([Environment]::ProcessorCount -ne 16) { throw "expected 16 logical processors, got $([Environment]::ProcessorCount)" }
          'NATIVE_SCHEDULER_PRECONDITIONS=PASS'

      - name: Execute native scheduler under parallel load
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force 'scheduler-runtime' | Out-Null
          Add-Type -TypeDefinition (Get-Content 'system/native-scheduler-v1/NativeSchedulerWitness.cs' -Raw) -Language CSharp
          $r=[NativeSchedulerV1]::Run(
            'lab21/relation-compose0',
            'scheduler-runtime/workload.qsched',
            'scheduler-runtime/dispatch.qsched',
            'scheduler-runtime/witness.txt',
            16,
            131072
          )
          if ($r -notlike 'NATIVE_SCHEDULER_V1=PASS;WORKERS=16;ACTIVE_WORKERS=*;SUBMITTED=131072;COMPLETED=131072;EXACTLY_ONCE=PASS;ORDER_INVARIANCE=PASS;CAS_RETRIES=*') {
            throw $r
          }
          $r | Set-Content 'scheduler-runtime/result.txt' -Encoding utf8
          $r

      - name: Verify scheduler artifacts exactly once and complete
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $workload=[IO.File]::ReadAllBytes((Join-Path $PWD 'scheduler-runtime/workload.qsched'))
          if ($workload.Length -ne 131072) { throw "workload length mismatch: $($workload.Length)" }

          $dispatchPath=Join-Path $PWD 'scheduler-runtime/dispatch.qsched'
          if ((Get-Item $dispatchPath).Length -ne (131072*4)) { throw 'dispatch journal length mismatch' }
          $reader=[IO.BinaryReader]::new([IO.File]::OpenRead($dispatchPath))
          try {
            $seen=New-Object 'bool[]' 131072
            for($slot=0;$slot -lt 131072;$slot++) {
              $index=$reader.ReadInt32()
              if ($index -lt 0 -or $index -ge 131072) { throw "dispatch index out of range: $index" }
              if ($seen[$index]) { throw "duplicate dispatch index: $index" }
              $seen[$index]=$true
            }
            if (($seen | Where-Object { -not $_ }).Count -ne 0) { throw 'missing scheduler dispatch indices' }
          } finally {
            $reader.Dispose()
          }

          $witness=Get-Content 'scheduler-runtime/witness.txt'
          $active=[int](($witness | Where-Object { $_ -like 'active-workers=*' }) -split '=',2)[1]
          if ($active -lt 2 -or $active -gt 16) { throw "invalid active worker count: $active" }
          foreach($required in @(
            'submitted-actions=131072',
            'completed-actions=131072',
            'exactly-once-dispatch=PASS',
            'schedule-order-semantic-invariance=PASS'
          )) {
            if ($witness -notcontains $required) { throw "scheduler witness missing $required" }
          }

          @(
            'NATIVE-SCHEDULER-V1'
            "github-run-id = $env:GITHUB_RUN_ID"
            "runner-name = $env:RUNNER_NAME"
            "active-workers = $active"
            'submitted-actions = 131072'
            'completed-actions = 131072'
            'exactly-once-dispatch = PASS'
            'schedule-order-semantic-invariance = PASS'
            'priority-semantics = none'
            'deadline-semantics = none'
            'result = PASS'
          ) | Set-Content 'scheduler-runtime/evidence.txt' -Encoding utf8
          Get-Content 'scheduler-runtime/evidence.txt'

      - name: Enforce scheduler accessibility boundary
        shell: pwsh
        run: |
          $lines=Get-Content 'system/native-scheduler-v1/native-scheduler-v1.labproof'
          if ($lines -notcontains 'human-facing = false') { throw 'scheduler human-facing boundary missing' }
          if ($lines -notcontains 'accessibility-behavior = not-applicable') { throw 'scheduler accessibility behavior boundary missing' }
          if (-not ($lines | Where-Object { $_ -like 'accessibility-gate = *' })) { throw 'scheduler accessibility gate missing' }
          'NATIVE_SCHEDULER_ACCESSIBILITY_BOUNDARY=PASS'

      - name: Hash scheduler evidence
        shell: pwsh
        run: |
          Get-FileHash -Algorithm SHA256 'system/native-scheduler-v1/NativeSchedulerWitness.cs','scheduler-runtime/workload.qsched','scheduler-runtime/dispatch.qsched','scheduler-runtime/witness.txt','scheduler-runtime/evidence.txt' |
            ForEach-Object { "$($_.Path) SHA256=$($_.Hash.ToLowerInvariant())" }

      - name: Upload scheduler evidence
        uses: actions/upload-artifact@v4
        with:
          name: system-native-scheduler-v1-amd5800h
          path: |
            scheduler-runtime/workload.qsched
            scheduler-runtime/dispatch.qsched
            scheduler-runtime/witness.txt
            scheduler-runtime/evidence.txt
          if-no-files-found: error

  linux-independent-replay:
    needs: amd-real-scheduler
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: system-native-scheduler-v1-amd5800h
          path: scheduler-artifact

      - name: Independently replay scheduler dispatch semantics
        shell: python
        run: |
          from pathlib import Path
          import struct

          table=Path('lab21/relation-compose0').read_bytes()
          states=list(dict.fromkeys(table))
          assert len(table)==4 and len(states)==2
          def idx(x): return states.index(x)
          def compose(a,b): return table[idx(a)*2+idx(b)]
          identities=[e for e in states if all(compose(e,x)==x and compose(x,e)==x for x in states)]
          assert len(identities)==1
          identity=identities[0]
          exchange=states[1] if states[0]==identity else states[0]

          root=Path('scheduler-artifact')
          workload=(root/'workload.qsched').read_bytes()
          raw_dispatch=(root/'dispatch.qsched').read_bytes()
          assert len(workload)==131072
          assert len(raw_dispatch)==131072*4
          dispatch=list(struct.unpack('<'+'i'*131072,raw_dispatch))
          assert sorted(dispatch)==list(range(131072))
          assert identity in workload and exchange in workload
          assert all(x in states for x in workload)

          canonical=identity
          for action in workload:
              canonical=compose(canonical,action)

          scheduled=identity
          for index in dispatch:
              scheduled=compose(scheduled,workload[index])

          assert scheduled==canonical

          witness=(root/'witness.txt').read_text().splitlines()
          values=dict(line.split('=',1) for line in witness if '=' in line)
          assert values['submitted-actions']=='131072'
          assert values['completed-actions']=='131072'
          assert values['exactly-once-dispatch']=='PASS'
          assert values['schedule-order-semantic-invariance']=='PASS'
          assert 2 <= int(values['active-workers']) <= 16

          evidence=(root/'evidence.txt').read_text().splitlines()
          required={
              'submitted-actions = 131072',
              'completed-actions = 131072',
              'exactly-once-dispatch = PASS',
              'schedule-order-semantic-invariance = PASS',
              'priority-semantics = none',
              'deadline-semantics = none',
              'result = PASS',
          }
          assert required.issubset(set(evidence))
          print('NATIVE_SCHEDULER_V1_LINUX_REPLAY=PASS;EXACTLY_ONCE=PASS;ORDER_INVARIANCE=PASS')
