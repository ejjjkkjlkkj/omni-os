name: system-native-perception-v1

on:
  push:
    branches: [os]
    paths:
      - 'system/native-perception-v1/NativePerceptionWitness.cs'
      - '.github/workflows/system-native-perception-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  amd-real:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Assert native foundations and AMD carrier
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach ($p in @(
            'lab21/native-relation-core.labproof',
            'lab22/affinity-topology.labproof',
            'lab24/native-transition-core.labproof',
            'system/native-memory-v1/native-memory-v1.labproof',
            'system/native-cognition-v1/native-cognition-v1.labproof',
            'system/native-action-v1/native-action-v1.labproof'
          )) {
            $lines=Get-Content $p
            if ($lines -notcontains 'proof = PASS') { throw "required proof not proven: $p" }
          }
          if ($env:RUNNER_NAME -ne 'AMD-5800H-REAL') { throw "wrong runner: $env:RUNNER_NAME" }
          $cpu=Get-CimInstance Win32_Processor | Select-Object -First 1
          if ($cpu.Name -notmatch '5800H') { throw "wrong CPU: $($cpu.Name)" }
          if ([Environment]::ProcessorCount -ne 16) { throw "expected 16 logical processors" }
          'NATIVE_PERCEPTION_FOUNDATIONS_AND_RUNNER=PASS'

      - name: Capture real external AMD stimuli
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -TypeDefinition (Get-Content 'lab22/AffinityTopologyWitness.cs' -Raw) -Language CSharp
          $topology=[Lab22Witness]::Run(16)
          if ($topology -notlike 'LAB22_AFFINITY_TOPOLOGY=PASS*') { throw $topology }
          New-Item -ItemType Directory -Force 'perception-runtime' | Out-Null
          $topology | Set-Content 'perception-runtime/topology-result.txt' -Encoding utf8
          $topology

      - name: Normalize external stimuli into native percepts
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -TypeDefinition (Get-Content 'system/native-perception-v1/NativePerceptionWitness.cs' -Raw) -Language CSharp
          $topology=(Get-Content 'perception-runtime/topology-result.txt' -Raw).Trim()
          $result=[NativePerceptionV1]::Normalize(
            $topology,
            'lab21/relation-compose0',
            'perception-runtime/raw-stimulus.txt',
            'perception-runtime/percepts.txt'
          )
          if ($result -notlike 'NATIVE_PERCEPTION_V1=PASS*') { throw $result }
          if ($result -notlike '*SAMPLES=16*') { throw "unexpected sample count: $result" }
          @(
            'NATIVE-PERCEPTION-V1'
            "github-run-id = $env:GITHUB_RUN_ID"
            "runner-name = $env:RUNNER_NAME"
            $result
            'result = PASS'
          ) | Set-Content 'perception-runtime/evidence.txt' -Encoding utf8
          Get-Content 'perception-runtime/evidence.txt'
          Get-Content 'perception-runtime/percepts.txt'

      - name: Accessibility boundary
        shell: pwsh
        run: |
          $lines=Get-Content 'system/native-perception-v1/native-perception-v1.labproof'
          if ($lines -notcontains 'human-facing = false') { throw 'human-facing boundary missing' }
          if ($lines -notcontains 'accessibility-behavior = not-applicable') { throw 'accessibility behavior boundary missing' }
          if (-not ($lines | Where-Object { $_ -like 'accessibility-gate = *' })) { throw 'accessibility gate missing' }
          'NATIVE_PERCEPTION_ACCESSIBILITY_BOUNDARY=PASS'

      - name: Hash perception carrier set
        shell: pwsh
        run: |
          Get-FileHash -Algorithm SHA256 'system/native-perception-v1/NativePerceptionWitness.cs','perception-runtime/raw-stimulus.txt','perception-runtime/percepts.txt','perception-runtime/evidence.txt' |
            ForEach-Object { "$($_.Path) SHA256=$($_.Hash.ToLowerInvariant())" }

      - name: Upload AMD perception carrier
        uses: actions/upload-artifact@v4
        with:
          name: system-native-perception-v1-amd5800h
          path: perception-runtime
          if-no-files-found: error

  linux-independent-replay:
    needs: amd-real
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: system-native-perception-v1-amd5800h
          path: perception-artifact

      - name: Independently replay AMD sensory normalization
        shell: python
        run: |
          from pathlib import Path

          table=Path('lab21/relation-compose0').read_bytes()
          assert len(table)==4
          states=list(dict.fromkeys(table))
          assert len(states)==2

          def idx(x): return states.index(x)
          def compose(a,b): return table[idx(a)*2+idx(b)]

          identities=[e for e in states if all(compose(e,x)==x and compose(x,e)==x for x in states)]
          assert len(identities)==1
          identity=identities[0]
          exchange=states[1] if states[0]==identity else states[0]

          raw=Path('perception-artifact/raw-stimulus.txt').read_text().strip()
          assert raw.startswith('LAB22_AFFINITY_TOPOLOGY=PASS;')
          map_text=raw.split(';MAP=',1)[1]
          items=map_text.split('|')
          assert len(items)==16

          cores=[]
          apic8=set()
          apic32=set()
          for i,item in enumerate(items):
              target_text,rest=item.split(':',1)
              assert int(target_text)==i
              fields=dict(part.split('=',1) for part in rest.split(','))
              cores.append(int(fields['core']))
              apic8.add(int(fields['apic8']))
              apic32.add(int(fields['apic32']))
              assert int(fields['tpc'])>0
          assert len(apic8)==16
          assert len(apic32)==16

          expected=[]
          for i,core in enumerate(cores):
              same=(i==0 or core==cores[i-1])
              expected.append(identity if same else exchange)

          lines=Path('perception-artifact/percepts.txt').read_text().splitlines()
          assert lines[0]=='NATIVE-PERCEPTION-V1'
          assert int(lines[1].split('=',1)[1])==16
          assert int(lines[2].split('=',1)[1])==identity
          assert int(lines[3].split('=',1)[1])==exchange
          assert len(lines)==21

          observed=[]
          for i in range(16):
              f=dict(part.split('=',1) for part in lines[4+i].split(';'))
              assert int(f['sample'])==i
              observed.append(int(f['relation']))
          assert observed==expected

          final=identity
          for relation in observed:
              final=compose(final,relation)
          assert int(lines[-1].split('=',1)[1])==final

          print(
              f'NATIVE_PERCEPTION_V1_LINUX_REPLAY=PASS;SAMPLES={len(observed)};'
              f'IDENTITY_PERCEPTS={observed.count(identity)};EXCHANGE_PERCEPTS={observed.count(exchange)}'
          )
