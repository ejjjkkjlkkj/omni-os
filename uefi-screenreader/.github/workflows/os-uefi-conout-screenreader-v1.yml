name: os-uefi-conout-screenreader-v1

on:
  push:
    branches: [os]
    paths:
      - 'boot/uefi-conout-screenreader-v1/build_conout_screenreader.py'
      - 'boot/uefi-conout-screenreader-v1/os-uefi-conout-screenreader-v1.labproof'
      - '.github/workflows/os-uefi-conout-screenreader-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-conout-spoken-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install QEMU OVMF and speech tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf espeak ffmpeg

      - name: Generate target utterance
        shell: bash
        run: |
          set -euo pipefail
          root=boot/uefi-conout-screenreader-v1
          espeak -v fr -s 165 -a 170 -w "$root/secure-boot.wav" "Secure Boot desactive."
          ffmpeg -hide_banner -loglevel error -y             -i "$root/secure-boot.wav" -ac 1 -ar 8000 -f u8 "$root/secure-boot.u8"
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('boot/uefi-conout-screenreader-v1/secure-boot.u8')
          data=p.read_bytes()
          assert 1000 < len(data) < 60000
          assert len(set(data)) > 64
          print('CONOUT_SR_SPEECH_ASSET=PASS')
          print('bytes='+str(len(data)))
          print('sha256='+hashlib.sha256(data).hexdigest())
          PY

      - name: Build parent bridge and independent child twice
        shell: bash
        run: |
          set -euo pipefail
          root=boot/uefi-conout-screenreader-v1
          rm -rf "$root/build1" "$root/build2"
          python "$root/build_conout_screenreader.py" "$root/secure-boot.u8" "$root/build1"
          python "$root/build_conout_screenreader.py" "$root/secure-boot.u8" "$root/build2"
          cmp "$root/build1/BOOTX64.EFI" "$root/build2/BOOTX64.EFI"
          cmp "$root/build1/target.efi" "$root/build2/target.efi"
          sha256sum "$root/build1/BOOTX64.EFI" "$root/build1/target.efi"

      - name: Audit ConOut proxy child loading and memory permissions
        shell: python
        run: |
          from pathlib import Path
          import struct

          root=Path('boot/uefi-conout-screenreader-v1')
          parent=(root/'build1/BOOTX64.EFI').read_bytes()
          child=(root/'build1/target.efi').read_bytes()
          speech=(root/'secure-boot.u8').read_bytes()
          target='Secure Boot desactive.\r\n'.encode('utf-16le')+b'\0\0'

          def inspect(image, sections):
              assert image[:2]==b'MZ'
              pe=struct.unpack_from('<I',image,0x3c)[0]
              assert image[pe:pe+4]==b'PE\0\0'
              coff=pe+4
              machine,nsects=struct.unpack_from('<HH',image,coff)
              assert machine==0x8664 and nsects==sections
              opt=coff+20
              assert struct.unpack_from('<H',image,opt)[0]==0x20b
              assert struct.unpack_from('<H',image,opt+0x44)[0]==10
              return opt

          opt=inspect(parent,3)
          inspect(child,2)
          sec=opt+0xf0
          data=sec+40
          assert parent[sec:sec+8].rstrip(b'\0')==b'.text'
          assert parent[data:data+8].rstrip(b'\0')==b'.data'
          text_chars=struct.unpack_from('<I',parent,sec+0x24)[0]
          data_chars=struct.unpack_from('<I',parent,data+0x24)[0]
          assert not (text_chars & 0x80000000)
          assert data_chars & 0x80000000
          assert not (data_chars & 0x20000000)

          assert child in parent
          assert speech in parent
          assert target in parent and target in child

          required_parent=[
              bytes.fromhex('4c8b7a40'),             # SystemTable.ConOut
              bytes.fromhex('4c8b7260'),             # BootServices
              bytes.fromhex('498b4708'),             # original OutputString
              bytes.fromhex('49894708'),             # hook/restore OutputString
              bytes.fromhex('498b86c8000000'),       # LoadImage
              bytes.fromhex('498b86d0000000'),       # StartImage
              bytes.fromhex('4154415541564157'),     # save r12-r15 ABI nonvolatile
              bytes.fromhex('415f415e415d415cc3'),   # restore r15-r12 then return
              bytes.fromhex('4489442420'),           # preserve computed audio duration
              bytes.fromhex('8b4c2420'),             # Stall uses preserved duration
              b'EVENT=CONOUT_CAPTURE\r\n',
              b'EVENT=SPOKEN\r\n',
              b'STATE=HOOK_RESTORED\r\n',
          ]
          for token in required_parent:
              assert token in parent, token.hex()

          required_child=[
              bytes.fromhex('488b4a40'),             # ConOut
              bytes.fromhex('488b4108'),             # OutputString
              target,
          ]
          for token in required_child:
              assert token in child, token.hex()

          print('CONOUT_SR_STATIC=PASS;CHILD_EMBEDDED=PASS;OUTPUTSTRING_PROXY=BOUND;W_X=BLOCKED')

      - name: Enforce ConOut screen reader contract
        shell: python
        run: |
          from pathlib import Path
          lines=set(Path('boot/uefi-conout-screenreader-v1/os-uefi-conout-screenreader-v1.labproof').read_text().splitlines())
          required={
              'system-foundation = true',
              'human-facing = true',
              'observed-interface = EFI_SIMPLE_TEXT_OUTPUT_PROTOCOL.OutputString',
              'system-table-conout-offset = 0x40',
              'simple-text-output-outputstring-offset = 0x08',
              'child-text = Secure Boot desactive.',
              'capture-source = actual CHAR16 pointer passed by child to ConOut.OutputString',
              'speech-output = native pre-OS SB16 DMA audio path',
              'COM1-role = evidence-only',
              'original-outputstring-called = true',
              'original-outputstring-restored = true',
              'visual-surface-required = false',
              'pointer-required = false',
              'accessibility-reconstruction = forbidden',
          }
          assert required.issubset(lines)
          print('CONOUT_SR_CONTRACT=PASS')

      - name: Resolve OVMF pair
        shell: bash
        run: |
          set -euo pipefail
          CODE=''
          VARS=''
          for pair in             '/usr/share/OVMF/OVMF_CODE_4M.fd|/usr/share/OVMF/OVMF_VARS_4M.fd'             '/usr/share/OVMF/OVMF_CODE.fd|/usr/share/OVMF/OVMF_VARS.fd'             '/usr/share/edk2/ovmf/OVMF_CODE.fd|/usr/share/edk2/ovmf/OVMF_VARS.fd'
          do
            IFS='|' read -r code vars <<< "$pair"
            if [[ -f "$code" && -f "$vars" ]]; then CODE="$code"; VARS="$vars"; break; fi
          done
          test -n "$CODE" -a -n "$VARS"
          printf 'CODE=%s\nVARS=%s\n' "$CODE" "$VARS" > boot/uefi-conout-screenreader-v1/ovmf.env

      - name: Run child OutputString through spoken ConOut proxy
        shell: bash
        run: |
          set -euo pipefail
          source boot/uefi-conout-screenreader-v1/ovmf.env
          root=boot/uefi-conout-screenreader-v1
          cp "$VARS" "$root/vars.fd"
          rm -rf "$root/esp"
          mkdir -p "$root/esp/EFI/BOOT"
          cp "$root/build1/BOOTX64.EFI" "$root/esp/EFI/BOOT/BOOTX64.EFI"
          rm -f "$root/conout.wav" "$root/conout.serial"

          qemu-system-x86_64             -machine pc,accel=tcg             -m 128M             -drive if=pflash,format=raw,readonly=on,file="$CODE"             -drive if=pflash,format=raw,file="$root/vars.fd"             -drive format=raw,file=fat:rw:"$root/esp"             -device sb16,audiodev=aud             -audiodev wav,id=aud,path="$root/conout.wav",out.frequency=8000,out.channels=1,out.format=u8             -display none             -monitor none             -serial file:"$root/conout.serial"             -parallel none             -net none             -no-reboot             -no-shutdown &
          qpid=$!
          trap 'kill $qpid 2>/dev/null || true' EXIT

          python - <<'PY'
          from pathlib import Path
          import time

          serial=Path('boot/uefi-conout-screenreader-v1/conout.serial')
          required=[
              b'STATE=HOOK_INSTALL\r\n',
              b'EVENT=CONOUT_CAPTURE\r\n',
              b'TEXT=Secure Boot desactive.\r\n',
              b'EVENT=SPOKEN\r\n',
              b'STATE=HOOK_RESTORED\r\n',
              b'STATUS=PASS\r\n',
          ]
          fail=b'REASON=CONOUT_BRIDGE_FAILED\r\n'
          end=time.time()+25
          while time.time()<end:
              if serial.exists():
                  raw=serial.read_bytes()
                  if fail in raw:
                      raise SystemExit('bridge failure: '+repr(raw[-4096:]))
                  if all(x in raw for x in required):
                      print('CONOUT_SR_RUNTIME=PASS;CHILD_OUTPUT_CAPTURED=PASS;SPOKEN=PASS;HOOK_RESTORED=PASS')
                      break
              time.sleep(.1)
          else:
              raw=serial.read_bytes() if serial.exists() else b''
              raise SystemExit('timeout: '+repr(raw[-4096:]))
          PY

          sleep 1
          kill $qpid 2>/dev/null || true
          wait $qpid 2>/dev/null || true
          trap - EXIT

      - name: Validate spoken capture waveform
        shell: python
        run: |
          from pathlib import Path
          import wave

          wav=Path('boot/uefi-conout-screenreader-v1/conout.wav')
          assert wav.exists() and wav.stat().st_size>4096
          with wave.open(str(wav),'rb') as w:
              channels=w.getnchannels()
              rate=w.getframerate()
              width=w.getsampwidth()
              frames=w.getnframes()
              raw=w.readframes(frames)
          assert channels==1
          assert rate==8000
          assert width==1
          duration=frames/rate
          assert duration>=1.0, duration
          ratio=sum(abs(x-128)>=3 for x in raw)/max(1,len(raw))
          assert ratio>=0.08, ratio

          serial=Path('boot/uefi-conout-screenreader-v1/conout.serial').read_bytes()
          assert b'EVENT=CONOUT_CAPTURE\r\n' in serial
          assert b'EVENT=SPOKEN\r\n' in serial
          assert b'STATE=HOOK_RESTORED\r\n' in serial
          print('CONOUT_SR_AUDIO=PASS')
          print('duration='+str(duration))
          print('active-ratio='+str(ratio))

      - name: Record ConOut bridge evidence
        shell: bash
        run: |
          root=boot/uefi-conout-screenreader-v1
          sha256sum             "$root/build1/BOOTX64.EFI"             "$root/build1/target.efi"             "$root/secure-boot.u8"             "$root/conout.wav" > "$root/evidence.sha256"
          cat > "$root/linux-evidence.txt" <<'EOF'
          OS-UEFI-CONOUT-SCREENREADER-V1
          runner = GitHub-hosted Linux
          firmware = OVMF
          child-image = separate embedded EFI image
          child-outputstring = PASS
          ConOut-proxy = PASS
          CHAR16-capture = PASS
          spoken-captured-text = PASS
          audio-waveform-captured = PASS
          original-outputstring-called = true
          original-outputstring-restored = true
          visual-surface-required = false
          COM1-role = evidence-only
          generic-arbitrary-text-speech = not-established
          native-tts = not-established
          result = PASS
          EOF
          cat "$root/linux-evidence.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: os-uefi-conout-screenreader-v1-linux
          path: |
            boot/uefi-conout-screenreader-v1/build1/BOOTX64.EFI
            boot/uefi-conout-screenreader-v1/build1/target.efi
            boot/uefi-conout-screenreader-v1/conout.wav
            boot/uefi-conout-screenreader-v1/conout.serial
            boot/uefi-conout-screenreader-v1/secure-boot.u8
            boot/uefi-conout-screenreader-v1/evidence.sha256
            boot/uefi-conout-screenreader-v1/linux-evidence.txt
          if-no-files-found: error


      - name: Persist verified ConOut proof
        shell: bash
        run: |
          set -euo pipefail
          root=boot/uefi-conout-screenreader-v1
          builder="$root/build_conout_screenreader.py"

          python - <<'PY'
          from pathlib import Path
          import hashlib
          import os
          import wave

          root=Path('boot/uefi-conout-screenreader-v1')
          parent=(root/'build1/BOOTX64.EFI').read_bytes()
          child=(root/'build1/target.efi').read_bytes()
          speech=(root/'secure-boot.u8').read_bytes()
          wav_path=root/'conout.wav'
          wav_bytes=wav_path.read_bytes()
          with wave.open(str(wav_path),'rb') as w:
              frames=w.getnframes()
              rate=w.getframerate()
              raw=w.readframes(frames)
          ratio=sum(abs(x-128)>=3 for x in raw)/max(1,len(raw))

          lines=[
              'proof = PASS',
              f"proof-run = {os.environ['GITHUB_RUN_ID']}",
              f"proof-head-sha = {os.environ['GITHUB_SHA']}",
              'proof-child-loadimage = PASS',
              'proof-child-startimage = PASS',
              'proof-child-outputstring = PASS',
              'proof-char16-capture = PASS',
              'proof-spoken-captured-text = PASS',
              'proof-original-outputstring-called = PASS',
              'proof-original-outputstring-restored = PASS',
              'proof-parent-abi-nonvolatile-restore = PASS',
              'proof-audio-duration-argument = PASS',
              'proof-audio-waveform = PASS',
              f'proof-audio-frames = {frames}',
              f'proof-audio-duration-seconds = {frames/rate}',
              f'proof-audio-active-ratio = {ratio}',
              f'proof-parent-sha256 = {hashlib.sha256(parent).hexdigest()}',
              f'proof-child-sha256 = {hashlib.sha256(child).hexdigest()}',
              f'proof-speech-sha256 = {hashlib.sha256(speech).hexdigest()}',
              f'proof-wav-sha256 = {hashlib.sha256(wav_bytes).hexdigest()}',
          ]
          Path('/tmp/conout-proof.txt').write_text('\n'.join(lines)+'\n')
          PY

          git fetch origin os
          git checkout -B os origin/os

          tested_blob="$(git rev-parse "${GITHUB_SHA}:${builder}")"
          current_blob="$(git rev-parse "os:${builder}")"
          if [[ "$tested_blob" != "$current_blob" ]]; then
            echo "CONOUT_PROOF_STALE_RUN=SKIP"
            echo "tested-builder=$tested_blob"
            echo "current-builder=$current_blob"
            exit 0
          fi

          python - <<'PY'
          from pathlib import Path

          proof=Path('boot/uefi-conout-screenreader-v1/os-uefi-conout-screenreader-v1.labproof')
          text=proof.read_text()
          pending='proof = PENDING_REVALIDATION_AFTER_ABI_AUDIO_FIX'
          if pending not in text:
              if 'proof = PASS' in text:
                  print('CONOUT_PROOF_ALREADY_RECORDED=PASS')
                  raise SystemExit(0)
              raise SystemExit('unexpected ConOut proof state')
          verified=Path('/tmp/conout-proof.txt').read_text().rstrip('\n')
          proof.write_text(text.replace(pending,verified))
          PY

          if git diff --quiet -- "$root/os-uefi-conout-screenreader-v1.labproof"; then
            exit 0
          fi

          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$root/os-uefi-conout-screenreader-v1.labproof"
          git commit -m "Record corrected UEFI ConOut proof [skip ci]"

          for attempt in 1 2 3; do
            if git push origin os; then
              exit 0
            fi
            git fetch origin os
            git rebase origin/os
          done
          echo "Unable to persist ConOut proof without overwriting concurrent work" >&2
          exit 1
