name: os-uefi-hii-focus-repeat-v1

on:
  push:
    branches: [os]
    paths:
      - 'boot/uefi-hii-current-option-speech-v1/build_uefi_hii_current_option_speech.py'
      - 'boot/uefi-hii-current-option-speech-v1/os-uefi-hii-current-option-speech-v1.labproof'
      - 'boot/uefi-hii-iscsi-fixture-v1/os-uefi-hii-iscsi-fixture-v1.labproof'
      - 'boot/uefi-hii-focus-repeat-v1/os-uefi-hii-focus-repeat-v1.labproof'
      - '.github/workflows/os-uefi-hii-focus-repeat-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  q35-native-focus-repeat:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Enforce foundations
        shell: python
        run: |
          from pathlib import Path
          current=set(Path('boot/uefi-hii-current-option-speech-v1/os-uefi-hii-current-option-speech-v1.labproof').read_text().splitlines())
          for line in [
              'proof = PASS',
              'proof-live-current-option-varstore-identity = PASS',
              'proof-setting-mutation = false',
          ]:
              assert line in current,line
          print('FOCUS_REPEAT_FOUNDATIONS=PASS')

      - name: Audit source contract
        shell: python
        run: |
          from pathlib import Path
          import ast,re
          src=Path('boot/uefi-hii-current-option-speech-v1/build_uefi_hii_current_option_speech.py').read_text()
          ast.parse(src)
          labels=re.findall(r"c\.label\('([^']+)'\)",src)
          duplicates=sorted({x for x in labels if labels.count(x)>1})
          assert not duplicates,duplicates
          for token in [
              'WAIT_DOWN_SPEAK=False',
              'WAIT_REPEAT_KEY=False',
              'HII_NAVIGATION_KEY=WAIT_DOWN',
              'NAV_NEXT_OPTION_DIRECT_CHILD=PASS',
              'NAV_FOCUS_OPTION_TOKEN_ACTIVATED=PASS',
              'NAV_FOCUS_OPTION_TEXT=',
              'NAV_FOCUS_OPTION_STRING=PASS',
              'NAV_FOCUS_LABEL_BINDING=PASS',
              'NAV_FOCUS_SOURCE=LIVE_DIRECT_SIBLING_HII_LABEL',
              'NAV_FOCUS_SPOKEN_PREFIX=',
              'EVENT=NAV_FOCUS_TEXT_COMMIT',
              'NAV_FOCUS_SPEECH_HDA=PASS',
              'ACCESSIBILITY_REPEAT_KEY=WAIT_R',
              'ACCESSIBILITY_REPEAT_KEY=PASS',
              "'--wait-down-repeat-speak'",
          ]:
              assert token in src,token
          proof=set(Path('boot/uefi-hii-focus-repeat-v1/os-uefi-hii-focus-repeat-v1.labproof').read_text().splitlines())
          for line in [
              'first-key = SCAN_DOWN 0x0002',
              'second-key = Unicode R or r',
              'repeat-target = accessibility focus after DOWN, not the firmware current value',
              'pre-repeat-audio = blocked until R or r is consumed',
              'focus-operation = read-only',
              'route-config-call = forbidden',
              'set-variable-call = forbidden',
              'varstore-write = forbidden',
              'firmware-setting-mutation = forbidden',
              'physical-ASUS-focus-repeat = not-established',
          ]:
              assert line in proof,line
          print('FOCUS_REPEAT_SOURCE_CONTRACT=PASS')

      - name: Install QEMU and OVMF
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf

      - name: Build deterministic focus-repeat speech EFI
        shell: bash
        run: |
          set -euo pipefail
          src=boot/uefi-hii-current-option-speech-v1/build_uefi_hii_current_option_speech.py
          root=boot/uefi-hii-focus-repeat-v1
          python "$src" "$root/BOOTX64.EFI" --wait-down-repeat-speak | tee "$root/build.log"
          python "$src" "$root/BOOTX64-2.EFI" --wait-down-repeat-speak > "$root/build2.log"
          cmp "$root/BOOTX64.EFI" "$root/BOOTX64-2.EFI"
          python "$src" "$root/BOOTX64-VERIFY.EFI" > "$root/verify-build.log"
          grep -F 'hii-down-speak=enabled' "$root/build.log"
          grep -F 'accessibility-repeat-key=enabled' "$root/build.log"
          grep -F 'hii-down-repeat-speak=enabled' "$root/build.log"
          grep -F 'hii-down-speak=disabled' "$root/verify-build.log"
          grep -F 'accessibility-repeat-key=disabled' "$root/verify-build.log"
          sha256sum "$root/BOOTX64.EFI" "$root/BOOTX64-VERIFY.EFI"

      - name: Audit PE and navigation-speech witnesses
        shell: python
        run: |
          from pathlib import Path
          import struct
          image=Path('boot/uefi-hii-focus-repeat-v1/BOOTX64.EFI').read_bytes()
          assert image[:2]==b'MZ'
          pe=struct.unpack_from('<I',image,0x3c)[0]
          assert image[pe:pe+4]==b'PE\0\0'
          coff=pe+4
          assert struct.unpack_from('<HH',image,coff)==(0x8664,3)
          opt=coff+20
          assert struct.unpack_from('<H',image,opt)[0]==0x20b
          assert struct.unpack_from('<H',image,opt+0x44)[0]==10
          sec=opt+0xf0; ds=sec+40
          tc=struct.unpack_from('<I',image,sec+0x24)[0]
          dc=struct.unpack_from('<I',image,ds+0x24)[0]
          assert not(tc&0x80000000)
          assert dc&0x80000000 and not(dc&0x20000000)
          for token in [
              b'HII_NAVIGATION_KEY=WAIT_DOWN\r\n',
              b'NAV_NEXT_OPTION_VALUE_RAW8_HEX=',
              b'NAV_NEXT_OPTION_DIRECT_CHILD=PASS\r\n',
              b'NAV_FOCUS_OPTION_TOKEN_ACTIVATED=PASS\r\n',
              b'NAV_FOCUS_OPTION_TEXT=',
              b'NAV_FOCUS_OPTION_STRING=PASS\r\n',
              b'NAV_FOCUS_LABEL_BINDING=PASS\r\n',
              b'NAV_FOCUS_SOURCE=PASS\r\n',
              b'NAV_FOCUS_SPOKEN_PREFIX=',
              b'NAV_FOCUS_TEXT_COMMIT\r\n',
              b'NAV_FOCUS_SPEECH_HDA=PASS\r\n',
              b'ACCESSIBILITY_REPEAT_KEY=WAIT_R\r\n',
              b'ACCESSIBILITY_REPEAT_KEY=PASS\r\n',
          ]:
              assert token in image,token
          print('FOCUS_REPEAT_STATIC=PASS')
          print('W_X=BLOCKED')

      - name: Resolve OVMF
        shell: bash
        run: |
          set -euo pipefail
          CODE=''; VARS=''
          for pair in \
            '/usr/share/OVMF/OVMF_CODE_4M.fd|/usr/share/OVMF/OVMF_VARS_4M.fd' \
            '/usr/share/OVMF/OVMF_CODE.fd|/usr/share/OVMF/OVMF_VARS.fd' \
            '/usr/share/edk2/ovmf/OVMF_CODE.fd|/usr/share/edk2/ovmf/OVMF_VARS.fd'
          do
            IFS='|' read -r code vars <<< "$pair"
            if [[ -f "$code" && -f "$vars" ]]; then CODE="$code"; VARS="$vars"; break; fi
          done
          test -n "$CODE" -a -n "$VARS"
          printf 'CODE=%s\nVARS=%s\n' "$CODE" "$VARS" > boot/uefi-hii-focus-repeat-v1/ovmf.env

      - name: DOWN focus then explicit R repeat speech
        shell: bash
        run: |
          set -euo pipefail
          root=boot/uefi-hii-focus-repeat-v1
          source "$root/ovmf.env"
          cp "$VARS" "$root/vars.fd"
          rm -rf "$root/esp"
          mkdir -p "$root/esp/EFI/BOOT"
          cp "$root/BOOTX64.EFI" "$root/esp/EFI/BOOT/BOOTX64.EFI"
          rm -f "$root/focus-repeat.serial" "$root/focus-repeat.wav" "$root/qmp.sock" "$root/runtime.txt"

          qemu-system-x86_64 \
            -machine q35,accel=tcg -m 192M \
            -drive if=pflash,format=raw,readonly=on,file="$CODE" \
            -drive if=pflash,format=raw,file="$root/vars.fd" \
            -drive format=raw,file=fat:rw:"$root/esp" \
            -audiodev wav,id=aud,path="$root/focus-repeat.wav",out.frequency=48000,out.channels=2 \
            -device ich9-intel-hda,bus=pcie.0,addr=1b.0,id=hda0 \
            -device hda-micro,bus=hda0.0,cad=0,audiodev=aud,mixer=on \
            -display none -monitor none \
            -qmp unix:"$root/qmp.sock",server=on,wait=off \
            -serial file:"$root/focus-repeat.serial" \
            -parallel none -net none -no-reboot -no-shutdown &
          qpid=$!
          trap 'kill "$qpid" 2>/dev/null || true' EXIT

          python - <<'PY'
          from pathlib import Path
          import json,re,socket,time

          root=Path('boot/uefi-hii-focus-repeat-v1')
          serial=root/'focus-repeat.serial'
          qmp=root/'qmp.sock'

          end=time.time()+35
          while time.time()<end:
              raw=serial.read_bytes() if serial.exists() else b''
              if b'STATUS=BLOCKED\r\n' in raw:
                  raise SystemExit('blocked before DOWN: '+repr(raw[-20000:]))
              if b'HII_NAVIGATION_KEY=WAIT_DOWN\r\n' in raw:
                  assert b'HDA_CONTROLLER_CODEC=PASS\r\n' not in raw
                  assert b'NAV_FOCUS_SPEECH_HDA=PASS\r\n' not in raw
                  break
              time.sleep(.1)
          else:
              raise SystemExit('timeout waiting DOWN')

          end=time.time()+10
          while time.time()<end and not qmp.exists():
              time.sleep(.05)
          if not qmp.exists():
              raise SystemExit('QMP socket missing')

          with socket.socket(socket.AF_UNIX,socket.SOCK_STREAM) as s:
              s.connect(str(qmp))
              f=s.makefile('rwb',buffering=0)
              greeting=json.loads(f.readline())
              assert 'QMP' in greeting,greeting
              f.write((json.dumps({'execute':'qmp_capabilities'})+'\r\n').encode())
              while True:
                  m=json.loads(f.readline())
                  if 'return' in m: break

              def send_key(qcode):
                  f.write((json.dumps({
                      'execute':'send-key',
                      'arguments':{'keys':[{'type':'qcode','data':qcode}],'hold-time':50}
                  })+'\r\n').encode())
                  while True:
                      m=json.loads(f.readline())
                      if 'return' in m: return
                      if 'error' in m: raise SystemExit('QMP send-key failed: '+repr(m))

              send_key('down')

              end=time.time()+35
              while time.time()<end:
                  raw=serial.read_bytes() if serial.exists() else b''
                  if b'STATUS=BLOCKED\r\n' in raw:
                      raise SystemExit('blocked after DOWN before R: '+repr(raw[-20000:]))
                  pre=[
                      b'HII_NAVIGATION_KEY=PASS\r\n',
                      b'NAV_NEXT_OPTION_DIRECT_CHILD=PASS\r\n',
                      b'NAV_FOCUS_OPTION_TOKEN_ACTIVATED=PASS\r\n',
                      b'NAV_FOCUS_OPTION_TEXT=',
                      b'NAV_FOCUS_SPOKEN_PREFIX=PASS\r\n',
                      b'ACCESSIBILITY_REPEAT_KEY=WAIT_R\r\n',
                  ]
                  if all(x in raw for x in pre):
                      assert b'ACCESSIBILITY_REPEAT_KEY=PASS\r\n' not in raw
                      assert b'HDA_CONTROLLER_CODEC=PASS\r\n' not in raw
                      assert b'NAV_FOCUS_SPEECH_HDA=PASS\r\n' not in raw
                      print('FOCUS_REPEAT_PRE_R_HDA_BLOCKED=PASS')
                      break
                  time.sleep(.1)
              else:
                  raw=serial.read_bytes() if serial.exists() else b''
                  raise SystemExit('timeout waiting focused repeat gate: '+repr(raw[-20000:]))

              send_key('r')

          required=[
              b'ACCESSIBILITY_REPEAT_KEY=R\r\n',
              b'ACCESSIBILITY_REPEAT_KEY=PASS\r\n',
              b'HDA_CONTROLLER_CODEC=PASS\r\n',
              b'AFG_RUNTIME_DISCOVERY=PASS\r\n',
              b'BDL_RUNTIME_TEXT_SCHEDULE=PASS\r\n',
              b'LPIB_PROGRESS=PASS\r\n',
              b'NAV_FOCUS_SPEECH_HDA=PASS\r\n',
              b'STATUS=PASS\r\n',
          ]
          end=time.time()+35
          while time.time()<end:
              raw=serial.read_bytes() if serial.exists() else b''
              if b'STATUS=BLOCKED\r\n' in raw:
                  raise SystemExit('blocked after R: '+repr(raw[-20000:]))
              if all(x in raw for x in required):
                  cur=re.search(br'CURRENT_VALUE_RAW8_HEX=([0-9A-F]{16})',raw)
                  sel=re.search(br'SELECTED_OPTION_VALUE_RAW8_HEX=([0-9A-F]{16})',raw)
                  navraw=re.search(br'NAV_NEXT_OPTION_VALUE_RAW8_HEX=([0-9A-F]{16})',raw)
                  navtok=re.search(br'NAV_NEXT_OPTION_STRING_ID_LE_HEX=([0-9A-F]{4})',raw)
                  label=re.search(br'NAV_FOCUS_OPTION_TEXT=([^\r\n]+)',raw)
                  spoken=re.search(br'NAV_FOCUS_SPOKEN_PREFIX=([a-z0-9]{1,8})\r\nNAV_FOCUS_SPOKEN_PREFIX=PASS\r\n',raw)
                  assert all([cur,sel,navraw,navtok,label,spoken]),raw[-20000:]
                  current_raw=cur.group(1).decode()
                  selected_raw=sel.group(1).decode()
                  focus_raw=navraw.group(1).decode()
                  question_m=re.search(br'QUESTION_TEXT=([^\r\n]+)',raw)
                  assert question_m,raw[-20000:]
                  question=question_m.group(1).decode('ascii','replace').strip()
                  token=int.from_bytes(bytes.fromhex(navtok.group(1).decode()),'little')
                  focus_label=label.group(1).decode('ascii','replace').strip()
                  prefix=spoken.group(1).decode()
                  expected=''.join(ch.lower() for ch in focus_label if ('a'<=ch.lower()<='z') or ('0'<=ch<='9'))[:8]
                  assert current_raw==selected_raw,(current_raw,selected_raw)
                  assert focus_raw!=current_raw,(current_raw,focus_raw)
                  assert token!=0,token
                  assert question,question
                  assert focus_label,focus_label
                  assert expected,(focus_label,expected)
                  assert prefix==expected,(prefix,expected,focus_label)
                  root.joinpath('runtime.txt').write_text(
                      f'current-raw8 = {current_raw}\n'
                      f'question-text = {question}\n'
                      f'focus-raw8 = {focus_raw}\n'
                      f'focus-option-string-id = {token}\n'
                      f'focus-option-label = {focus_label}\n'
                      f'focus-spoken-prefix = {prefix}\n'
                      'down-key-event = PASS\n'
                      'repeat-key = R\n'
                      'repeat-key-event = PASS\n'
                      'pre-repeat-hda = blocked\n'
                      'focus-native-hda-speech = PASS\n'
                  )
                  print('FOCUS_REPEAT_DOWN=PASS')
                  print('FOCUS_REPEAT_R=PASS')
                  print('FOCUS_REPEAT_LABEL='+focus_label)
                  print('FOCUS_REPEAT_RUNTIME=PASS')
                  break
              time.sleep(.1)
          else:
              raw=serial.read_bytes() if serial.exists() else b''
              raise SystemExit('timeout repeat speech: '+repr(raw[-20000:]))
          PY

          sleep 1
          kill "$qpid" 2>/dev/null || true
          wait "$qpid" 2>/dev/null || true
          trap - EXIT

      - name: Validate focused speech waveform
        shell: python
        run: |
          from pathlib import Path
          import hashlib,struct,wave
          root=Path('boot/uefi-hii-focus-repeat-v1')
          p=root/'focus-repeat.wav'
          assert p.exists() and p.stat().st_size>10000,p
          with wave.open(str(p),'rb') as w:
              channels=w.getnchannels(); rate=w.getframerate(); width=w.getsampwidth()
              frames=w.getnframes(); raw=w.readframes(frames)
          assert (channels,rate,width)==(2,48000,2),(channels,rate,width)
          vals=struct.unpack('<'+'h'*(len(raw)//2),raw)
          peak=max(abs(v) for v in vals); active=sum(abs(v)>=500 for v in vals)
          assert peak>=5000,peak
          assert active>=3000,active
          (root/'metrics.txt').write_text(
              f'frames={frames}\npeak={peak}\nactive={active}\n'
              f'wav-sha256={hashlib.sha256(p.read_bytes()).hexdigest()}\n'
          )
          print('FOCUS_REPEAT_WAVEFORM=PASS')

      - name: Reboot same VARS and prove focused repeat did not mutate setting
        shell: bash
        run: |
          set -euo pipefail
          root=boot/uefi-hii-focus-repeat-v1
          source "$root/ovmf.env"
          cp "$root/BOOTX64-VERIFY.EFI" "$root/esp/EFI/BOOT/BOOTX64.EFI"
          rm -f "$root/post.serial" "$root/post.wav"

          qemu-system-x86_64 \
            -machine q35,accel=tcg -m 192M \
            -drive if=pflash,format=raw,readonly=on,file="$CODE" \
            -drive if=pflash,format=raw,file="$root/vars.fd" \
            -drive format=raw,file=fat:rw:"$root/esp" \
            -audiodev wav,id=aud,path="$root/post.wav",out.frequency=48000,out.channels=2 \
            -device ich9-intel-hda,bus=pcie.0,addr=1b.0,id=hda0 \
            -device hda-micro,bus=hda0.0,cad=0,audiodev=aud,mixer=on \
            -display none -monitor none -serial file:"$root/post.serial" \
            -parallel none -net none -no-reboot -no-shutdown &
          qpid=$!
          trap 'kill "$qpid" 2>/dev/null || true' EXIT
          python - <<'PY'
          from pathlib import Path
          import re,time
          root=Path('boot/uefi-hii-focus-repeat-v1')
          vals={}
          for line in (root/'runtime.txt').read_text().splitlines():
              if ' = ' in line:
                  k,v=line.split(' = ',1); vals[k]=v
          expected_raw=vals['current-raw8']
          expected_question=vals['question-text']
          p=root/'post.serial'
          end=time.time()+35
          while time.time()<end:
              raw=p.read_bytes() if p.exists() else b''
              if b'STATUS=BLOCKED\r\n' in raw:
                  raise SystemExit('post-state blocked: '+repr(raw[-20000:]))
              if b'STATUS=PASS\r\n' in raw:
                  cur=re.search(br'CURRENT_VALUE_RAW8_HEX=([0-9A-F]{16})',raw)
                  question=re.search(br'QUESTION_TEXT=([^\r\n]+)',raw)
                  assert cur and question
                  got_raw=cur.group(1).decode()
                  got_question=question.group(1).decode('ascii','replace').strip()
                  assert got_raw==expected_raw,(got_raw,expected_raw)
                  assert got_question==expected_question,(got_question,expected_question)
                  print('DOWN_FOCUS_POST_STATE_UNCHANGED=PASS')
                  break
              time.sleep(.1)
          else:
              raise SystemExit('timeout post-state')
          PY
          sleep 1
          kill "$qpid" 2>/dev/null || true
          wait "$qpid" 2>/dev/null || true
          trap - EXIT

      - name: Record evidence
        shell: bash
        run: |
          set -euo pipefail
          root=boot/uefi-hii-focus-repeat-v1
          sha256sum "$root/BOOTX64.EFI" "$root/BOOTX64-VERIFY.EFI" "$root/focus-repeat.serial" "$root/focus-repeat.wav" "$root/post.serial" "$root/runtime.txt" "$root/metrics.txt" > "$root/evidence.sha256"
          {
            echo 'OS-UEFI-HII-DOWN-SPEECH-V1'
            cat "$root/runtime.txt"
            echo 'post-state-unchanged = PASS'
            echo 'setting-mutation = false'
            echo 'physical-ASUS-focus-repeat = not-established'
            echo 'result = PASS'
          } > "$root/linux-evidence.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: os-uefi-hii-focus-repeat-v1-linux
          path: |
            boot/uefi-hii-focus-repeat-v1/BOOTX64.EFI
            boot/uefi-hii-focus-repeat-v1/BOOTX64-VERIFY.EFI
            boot/uefi-hii-focus-repeat-v1/focus-repeat.serial
            boot/uefi-hii-focus-repeat-v1/focus-repeat.wav
            boot/uefi-hii-focus-repeat-v1/post.serial
            boot/uefi-hii-focus-repeat-v1/runtime.txt
            boot/uefi-hii-focus-repeat-v1/metrics.txt
            boot/uefi-hii-focus-repeat-v1/evidence.sha256
            boot/uefi-hii-focus-repeat-v1/linux-evidence.txt
          if-no-files-found: error

      - name: Persist revision-bound focused repeat speech proof
        shell: bash
        run: |
          set -euo pipefail
          root=boot/uefi-hii-focus-repeat-v1
          proof="$root/os-uefi-hii-focus-repeat-v1.labproof"
          builder=boot/uefi-hii-current-option-speech-v1/build_uefi_hii_current_option_speech.py
          fixture=boot/uefi-hii-iscsi-fixture-v1/os-uefi-hii-iscsi-fixture-v1.labproof
          workflow=.github/workflows/os-uefi-hii-focus-repeat-v1.yml
          tested_builder="$(git rev-parse "$GITHUB_SHA:$builder")"
          tested_fixture="$(git rev-parse "$GITHUB_SHA:$fixture")"
          tested_workflow="$(git rev-parse "$GITHUB_SHA:$workflow")"
          cp "$root/BOOTX64.EFI" /tmp/focus-repeat.efi
          cp "$root/focus-repeat.serial" /tmp/focus-repeat.serial
          cp "$root/focus-repeat.wav" /tmp/focus-repeat.wav
          cp "$root/post.serial" /tmp/focus-repeat-post.serial
          cp "$root/runtime.txt" /tmp/focus-repeat-runtime.txt
          cp "$root/metrics.txt" /tmp/focus-repeat-metrics.txt

          git fetch origin os
          git checkout -B os origin/os
          for spec in \
            "$tested_builder|$builder|FOCUS_REPEAT_STALE_BUILDER" \
            "$tested_fixture|$fixture|FOCUS_REPEAT_STALE_FIXTURE" \
            "$tested_workflow|$workflow|FOCUS_REPEAT_STALE_WORKFLOW"
          do
            IFS='|' read -r expected path msg <<< "$spec"
            [[ "$expected" == "$(git rev-parse "os:$path")" ]] || { echo "$msg=SKIP"; exit 0; }
          done

          python - <<'PY'
          from pathlib import Path
          import hashlib,os
          root=Path('boot/uefi-hii-focus-repeat-v1')
          p=root/'os-uefi-hii-focus-repeat-v1.labproof'
          lines=p.read_text().splitlines()
          states=[x for x in lines if x.startswith('proof = ')]
          if len(states)!=1 or states[0] not in {'proof = PENDING_CI','proof = PASS'}:
              raise SystemExit('unexpected proof state: '+repr(states))
          vals={}
          for line in Path('/tmp/focus-repeat-runtime.txt').read_text().splitlines():
              if ' = ' in line:
                  k,v=line.split(' = ',1); vals[k]=v
          kept=[x for x in lines if not x.startswith('proof-') and not x.startswith('proof = ')]
          efi=Path('/tmp/focus-repeat.efi').read_bytes()
          serial=Path('/tmp/focus-repeat.serial').read_bytes()
          wav=Path('/tmp/focus-repeat.wav').read_bytes()
          post=Path('/tmp/focus-repeat-post.serial').read_bytes()
          metrics=Path('/tmp/focus-repeat-metrics.txt').read_text().strip().replace('\n','; ')
          text='\n'.join(kept).rstrip()+'\n'
          text += (
              "proof = PASS\n"
              f"proof-run = {os.environ['GITHUB_RUN_ID']}\n"
              f"proof-head-sha = {os.environ['GITHUB_SHA']}\n"
              "proof-down-key-event = PASS\n"
              "proof-repeat-key-event = PASS\n"
              "proof-repeat-key = R\n"
              "proof-pre-repeat-HDA-blocked = PASS\n"
              "proof-next-direct-sibling = PASS\n"
              f"proof-current-raw8 = {vals['current-raw8']}\n"
              f"proof-question-text = {vals['question-text']}\n"
              f"proof-focus-raw8 = {vals['focus-raw8']}\n"
