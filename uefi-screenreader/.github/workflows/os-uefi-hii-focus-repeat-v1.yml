          for attempt in 1 2 3; do
            if git push origin os; then exit 0; fi
            git fetch origin os
            [[ "$tested_builder" == "$(git rev-parse "origin/os:$builder")" ]] || { echo FOCUS_REPEAT_STALE_BUILDER=SKIP; exit 0; }
