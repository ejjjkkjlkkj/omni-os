name: os-uefi-hda-interactive-speech-v1

on:
  push:
    branches: [os]
    paths:
      - 'boot/uefi-hda-interactive-speech-v1/build_uefi_hda_interactive_speech.py'
      - 'boot/uefi-hda-interactive-speech-v1/os-uefi-hda-interactive-speech-v1.labproof'
      - '.github/workflows/os-uefi-hda-interactive-speech-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  q35-interactive-autorouted-speech:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install QEMU and OVMF
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf

      - name: Enforce current integrated dependencies
        shell: python
        run: |
          from pathlib import Path
          for path in [
              'boot/uefi-hda-word-select-v1/os-uefi-hda-word-select-v1.labproof',
              'boot/uefi-hda-speech-autoroute-v1/os-uefi-hda-speech-autoroute-v1.labproof',
          ]:
              lines=set(Path(path).read_text().splitlines())
              assert 'proof = PASS' in lines,path
          print('INTERACTIVE_HDA_SPEECH_DEPENDENCIES=PASS')

      - name: Audit integrated source contract
        shell: python
        run: |
          from pathlib import Path
          import ast
          root=Path('boot/uefi-hda-interactive-speech-v1')
          src=(root/'build_uefi_hda_interactive_speech.py').read_text()
          ast.parse(src)
          required=[
              "RUNTIME_WORDS={'aide':('e','d'),'erreur':('e','r','eu','r')}",
              "c.label('read_key')",
              "emit_word('select_aide','selected_aide',RUNTIME_WORDS['aide'])",
              "emit_word('select_erreur','selected_erreur',RUNTIME_WORDS['erreur'])",
              "c.label('widget_scan')",
              "c.label('route_short')",
              "c.label('route_long')",
              "verb_data(L['dac_nid'],0x00070610)",
              "verb_data(L['dac_nid'],0x00020011)",
              "verb_data(L['pin_nid'],0x00070740)",
              "verb_data(L['pin_nid'],0x000f000c)",
              "verb_data(L['pin_nid'],0x00070c02)",
              "verb_data(L['pin_nid'],0x000f0c00)",
              "NO_FIXED_WIDGET_NIDS=PASS",
              "PIN_CAPABILITIES_QUERY=PASS",
              "EAPD_IF_SUPPORTED=PASS",
              "DAC_OUTPUT_AMP_VERIFY=PASS",
              "RUNTIME_WORD_SELECTION_HDA=PASS",
              "OS_UEFI_HDA_INTERACTIVE_SPEECH_BUILD=PASS",
          ]
          for token in required:
              assert token in src,token
          for forbidden in [
              "verb_const(0x00270610)",
              "verb_const(0x00220011)",
              "verb_const(0x00370740)",
          ]:
              assert forbidden not in src,forbidden
          proof=set((root/'os-uefi-hda-interactive-speech-v1.labproof').read_text().splitlines())
          for line in [
              'runtime-word-selection = required',
              'widget-nids-hardcoded = false',
              'interactive-native-HDA-speech = required',
              'multi-hop-mixer-selector-routing = not-established',
              'arbitrary-text-speech = not-established',
          ]:
              assert line in proof,line
          print('INTERACTIVE_HDA_SPEECH_SOURCE_CONTRACT=PASS')

      - name: Build deterministic integrated image twice
        shell: bash
        run: |
          set -euo pipefail
          root=boot/uefi-hda-interactive-speech-v1
          python "$root/build_uefi_hda_interactive_speech.py" "$root/BOOTX64.EFI" | tee "$root/build.log"
          python "$root/build_uefi_hda_interactive_speech.py" "$root/BOOTX64-2.EFI" > "$root/build2.log"
          cmp "$root/BOOTX64.EFI" "$root/BOOTX64-2.EFI"
          grep -F 'OS_UEFI_HDA_INTERACTIVE_SPEECH_BUILD=PASS' "$root/build.log"
          grep -F 'runtime-word-options=AIDE,ERREUR' "$root/build.log"
          grep -F 'full-utterance-pcm-assets=0' "$root/build.log"
          sha256sum "$root/BOOTX64.EFI"

      - name: Audit integrated PE and HDA machine path
        shell: python
        run: |
          from pathlib import Path
          import struct
          image=Path('boot/uefi-hda-interactive-speech-v1/BOOTX64.EFI').read_bytes()
          assert image[:2]==b'MZ'
          pe=struct.unpack_from('<I',image,0x3c)[0]
          assert image[pe:pe+4]==b'PE\0\0'
          coff=pe+4
          assert struct.unpack_from('<HH',image,coff)==(0x8664,3)
          opt=coff+20
          assert struct.unpack_from('<H',image,opt)[0]==0x20b
          assert struct.unpack_from('<H',image,opt+0x44)[0]==10
          sec=opt+0xf0
          ds=sec+40
          tc=struct.unpack_from('<I',image,sec+0x24)[0]
          dc=struct.unpack_from('<I',image,ds+0x24)[0]
          assert not(tc&0x80000000)
          assert dc&0x80000000 and not(dc&0x20000000)
          required=[
              bytes.fromhex('4181fc00000100'),
              bytes.fromhex('488b6a30'),
              bytes.fromhex('488b4508ffd0'),
              bytes.fromhex('8a0324fd8803'),
              bytes.fromhex('8a030c018803'),
              bytes.fromhex('8a0324fe8803'),
              b'AFG_RUNTIME_DISCOVERY=PASS\r\n',
              b'AUTO_DAC_WIDGET=PASS\r\n',
              b'AUTO_OUTPUT_PIN_WIDGET=PASS\r\n',
              b'AUTO_PIN_TO_DAC_DIRECT_ROUTE=PASS\r\n',
              b'PIN_CONFIG_DEFAULT=PASS\r\n',
              b'PIN_CAPABILITIES_QUERY=PASS\r\n',
              b'EAPD_IF_SUPPORTED=PASS\r\n',
              b'DAC_OUTPUT_AMP_VERIFY=PASS\r\n',
              b'EVENT=WAIT_KEY\r\n',
              b'WORD=AIDE\r\n',
              b'WORD=ERREUR\r\n',
              b'RUNTIME_WORD_SELECTION_HDA=PASS\r\n',
          ]
          for token in required:
              assert token in image,token
          print('INTERACTIVE_HDA_SPEECH_STATIC=PASS')
          print('EFI_KEYBOARD=BOUND')
          print('DYNAMIC_HDA_ROUTE=BOUND')
          print('OUTPUT_POLICY=BOUND')
          print('RUNTIME_WORD_BDL=BOUND')
          print('W_X=BLOCKED')

      - name: Resolve OVMF
        shell: bash
        run: |
          set -euo pipefail
          CODE=''; VARS=''
          for pair in \
            '/usr/share/OVMF/OVMF_CODE_4M.fd|/usr/share/OVMF/OVMF_VARS_4M.fd' \
            '/usr/share/OVMF/OVMF_CODE.fd|/usr/share/OVMF/OVMF_VARS.fd' \
            '/usr/share/edk2/ovmf/OVMF_CODE.fd|/usr/share/edk2/ovmf/OVMF_VARS.fd'
          do
            IFS='|' read -r code vars <<< "$pair"
            if [[ -f "$code" && -f "$vars" ]]; then CODE="$code"; VARS="$vars"; break; fi
          done
          test -n "$CODE" -a -n "$VARS"
          printf 'CODE=%s\nVARS=%s\n' "$CODE" "$VARS" > boot/uefi-hda-interactive-speech-v1/ovmf.env

      - name: Select and speak both words over autorouted HDA
        shell: bash
        run: |
          set -euo pipefail
          source boot/uefi-hda-interactive-speech-v1/ovmf.env
          root=boot/uefi-hda-interactive-speech-v1
          rm -rf "$root/esp"
          mkdir -p "$root/esp/EFI/BOOT"
          cp "$root/BOOTX64.EFI" "$root/esp/EFI/BOOT/BOOTX64.EFI"

          run_case() {
            key="$1"
            word="$2"
            tag="$3"
            vars="$root/vars-$tag.fd"
            serial="$root/$tag.serial"
            wav="$root/$tag.wav"
            mon="$root/$tag.mon"
            rm -f "$serial" "$wav" "$mon"
            cp "$VARS" "$vars"

            qemu-system-x86_64 \
              -machine q35,accel=tcg \
              -m 192M \
              -drive if=pflash,format=raw,readonly=on,file="$CODE" \
              -drive if=pflash,format=raw,file="$vars" \
              -drive format=raw,file=fat:rw:"$root/esp" \
              -audiodev wav,id=aud,path="$wav",out.frequency=48000,out.channels=2 \
              -device ich9-intel-hda,bus=pcie.0,addr=1b.0,id=hda0 \
              -device hda-micro,bus=hda0.0,cad=0,audiodev=aud,mixer=on \
              -display none \
              -monitor unix:"$mon",server=on,wait=off \
              -serial file:"$serial" \
              -parallel none \
              -net none \
              -no-reboot \
              -no-shutdown &
            qpid=$!

            KEY="$key" WORD="$word" SERIAL="$serial" MON="$mon" python - <<'PY'
          import os,socket,time
          from pathlib import Path
          p=Path(os.environ['SERIAL'])
          mon=Path(os.environ['MON'])
          key=os.environ['KEY']
          word=os.environ['WORD'].encode()
          pre=[
              b'AFG_RUNTIME_DISCOVERY=PASS\r\n',
              b'AUTO_DAC_WIDGET=PASS\r\n',
              b'AUTO_OUTPUT_PIN_WIDGET=PASS\r\n',
              b'AUTO_PIN_TO_DAC_DIRECT_ROUTE=PASS\r\n',
              b'NO_FIXED_WIDGET_NIDS=PASS\r\n',
              b'PIN_CONFIG_DEFAULT=PASS\r\n',
              b'PIN_CAPABILITIES_QUERY=PASS\r\n',
              b'EAPD_IF_SUPPORTED=PASS\r\n',
              b'DAC_OUTPUT_AMP_VERIFY=PASS\r\n',
              b'EVENT=WAIT_KEY\r\n',
          ]
          end=time.time()+30
          while time.time()<end:
              raw=p.read_bytes() if p.exists() else b''
              if b'STATUS=BLOCKED\r\n' in raw:
                  raise SystemExit('blocked before key: '+repr(raw[-4096:]))
              if mon.exists() and all(x in raw for x in pre):
                  break
              time.sleep(.05)
          else:
              raise SystemExit('timeout before key: '+repr((p.read_bytes() if p.exists() else b'')[-4096:]))

          s=socket.socket(socket.AF_UNIX,socket.SOCK_STREAM)
          for _ in range(100):
              try:
                  s.connect(str(mon))
                  break
              except OSError:
                  time.sleep(.05)
          else:
              raise SystemExit('cannot connect monitor')
          s.sendall(('sendkey '+key+'\n').encode())
          time.sleep(.1)
          s.close()

          req=[
              b'EVENT=WORD_SELECTED\r\n',
              b'WORD='+word+b'\r\n',
              b'BDL_RUNTIME_WORD_SCHEDULE=PASS\r\n',
              b'LPIB_PROGRESS=PASS\r\n',
              b'RUNTIME_WORD_SELECTION_HDA=PASS\r\n',
              b'STATUS=PASS\r\n',
          ]
          end=time.time()+30
          while time.time()<end:
              raw=p.read_bytes() if p.exists() else b''
              if b'STATUS=BLOCKED\r\n' in raw:
                  raise SystemExit('interactive speech blocked: '+repr(raw[-4096:]))
              if all(x in raw for x in req):
                  print('INTERACTIVE_'+os.environ['WORD']+'=PASS')
                  break
              time.sleep(.05)
          else:
              raise SystemExit('timeout after key: '+repr((p.read_bytes() if p.exists() else b'')[-4096:]))
          PY

            sleep 1
            kill "$qpid" 2>/dev/null || true
            wait "$qpid" 2>/dev/null || true
            test -s "$wav"
          }

          run_case 1 AIDE aide
          run_case 2 ERREUR erreur
          echo INTERACTIVE_HDA_SPEECH_RUNTIME=PASS

      - name: Validate distinct integrated waveforms
        shell: python
        run: |
          from pathlib import Path
          import hashlib,struct,wave
          root=Path('boot/uefi-hda-interactive-speech-v1')
          metrics={}
          for tag in ('aide','erreur'):
              p=root/f'{tag}.wav'
              assert p.exists() and p.stat().st_size>10000
              with wave.open(str(p),'rb') as w:
                  channels=w.getnchannels()
                  rate=w.getframerate()
                  width=w.getsampwidth()
                  frames=w.getnframes()
                  raw=w.readframes(frames)
              assert channels==2 and rate==48000 and width==2
              vals=struct.unpack('<'+'h'*(len(raw)//2),raw)
              peak=max(abs(v) for v in vals)
              active=sum(abs(v)>=500 for v in vals)
              assert peak>=5000
              assert active>=3000
              metrics[tag]=(frames,peak,active,hashlib.sha256(p.read_bytes()).hexdigest())
          assert metrics['aide'][3] != metrics['erreur'][3],metrics
          assert abs(metrics['aide'][2]-metrics['erreur'][2]) >= 1000,metrics
          text='\n'.join(
              f'{tag}-frames={v[0]}\n{tag}-peak={v[1]}\n{tag}-active={v[2]}\n{tag}-sha256={v[3]}'
              for tag,v in metrics.items()
          )+'\n'
          (root/'interactive-metrics.txt').write_text(text)
          print(text,end='')
          print('INTERACTIVE_HDA_DISTINCT_WAVEFORMS=PASS')

      - uses: actions/upload-artifact@v4
        with:
          name: os-uefi-hda-interactive-speech-v1-linux
          path: |
            boot/uefi-hda-interactive-speech-v1/BOOTX64.EFI
            boot/uefi-hda-interactive-speech-v1/aide.serial
            boot/uefi-hda-interactive-speech-v1/erreur.serial
            boot/uefi-hda-interactive-speech-v1/aide.wav
            boot/uefi-hda-interactive-speech-v1/erreur.wav
            boot/uefi-hda-interactive-speech-v1/interactive-metrics.txt
            boot/uefi-hda-interactive-speech-v1/build.log
          if-no-files-found: error

      - name: Persist integrated proof
        shell: bash
        run: |
          set -euo pipefail
          root=boot/uefi-hda-interactive-speech-v1
          builder="$root/build_uefi_hda_interactive_speech.py"
          workflow=".github/workflows/os-uefi-hda-interactive-speech-v1.yml"
          tested_builder="$(git rev-parse "$GITHUB_SHA:$builder")"
          tested_workflow="$(git rev-parse "$GITHUB_SHA:$workflow")"
          cp "$root/BOOTX64.EFI" /tmp/interactive.efi
          cp "$root/aide.wav" /tmp/interactive-aide.wav
          cp "$root/erreur.wav" /tmp/interactive-erreur.wav
          cp "$root/aide.serial" /tmp/interactive-aide.serial
          cp "$root/erreur.serial" /tmp/interactive-erreur.serial
          cp "$root/interactive-metrics.txt" /tmp/interactive-metrics.txt
          git fetch origin os
          git checkout -B os origin/os
          [[ "$tested_builder" == "$(git rev-parse "os:$builder")" ]] || { echo INTERACTIVE_STALE_BUILDER=SKIP; exit 0; }
          [[ "$tested_workflow" == "$(git rev-parse "os:$workflow")" ]] || { echo INTERACTIVE_STALE_WORKFLOW=SKIP; exit 0; }

          python - <<'PY'
          from pathlib import Path
          import hashlib,os
          root=Path('boot/uefi-hda-interactive-speech-v1')
          p=root/'os-uefi-hda-interactive-speech-v1.labproof'
          text=p.read_text()
          states=[x for x in text.splitlines() if x.startswith('proof = ')]
          if len(states)!=1 or states[0] not in {'proof = PENDING_CI','proof = PASS'}:
              raise SystemExit('unexpected proof state')
          kept=[]
          for line in text.splitlines():
              if line.startswith('proof-') or line.startswith('revalidation-reason ='):
                  continue
              kept.append('proof = PASS' if line.startswith('proof = ') else line)
          efi=Path('/tmp/interactive.efi').read_bytes()
          aw=Path('/tmp/interactive-aide.wav').read_bytes()
          ew=Path('/tmp/interactive-erreur.wav').read_bytes()
          ase=Path('/tmp/interactive-aide.serial').read_bytes()
          ese=Path('/tmp/interactive-erreur.serial').read_bytes()
          metrics=Path('/tmp/interactive-metrics.txt').read_text().strip().replace('\n','; ')
          text='\n'.join(kept).rstrip()+'\n'
          text += (
              f"proof-run = {os.environ['GITHUB_RUN_ID']}\n"
              f"proof-head-sha = {os.environ['GITHUB_SHA']}\n"
              "proof-key-1-AIDE = PASS\n"
              "proof-key-2-ERREUR = PASS\n"
              "proof-AFG-runtime-discovery = PASS\n"
              "proof-auto-DAC = PASS\n"
              "proof-auto-output-pin = PASS\n"
              "proof-auto-direct-route = PASS\n"
              "proof-output-policy = PASS\n"
              "proof-pin-capabilities-query = PASS\n"
              "proof-EAPD-if-supported = PASS\n"
              "proof-widget-NIDs-hardcoded = false\n"
              "proof-runtime-word-selection = PASS\n"
              "proof-distinct-waveforms = PASS\n"
              f"proof-wave-metrics = {metrics}\n"
              f"proof-efi-sha256 = {hashlib.sha256(efi).hexdigest()}\n"
              f"proof-aide-wav-sha256 = {hashlib.sha256(aw).hexdigest()}\n"
              f"proof-erreur-wav-sha256 = {hashlib.sha256(ew).hexdigest()}\n"
              f"proof-aide-serial-sha256 = {hashlib.sha256(ase).hexdigest()}\n"
              f"proof-erreur-serial-sha256 = {hashlib.sha256(ese).hexdigest()}\n"
          )
          p.write_text(text)
          PY
          if git diff --quiet -- "$root/os-uefi-hda-interactive-speech-v1.labproof"; then exit 0; fi
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$root/os-uefi-hda-interactive-speech-v1.labproof"
          git commit -m "Record interactive autorouted HDA speech proof [skip ci]"
          git push origin os
