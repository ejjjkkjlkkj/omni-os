name: os-uefi-hda-output-policy-v1

on:
  push:
    branches: [os]
    paths:
      - 'boot/uefi-hda-output-policy-v1/build_uefi_hda_output_policy_probe.py'
      - 'boot/uefi-hda-output-policy-v1/os-uefi-hda-output-policy-v1.labproof'
      - '.github/workflows/os-uefi-hda-output-policy-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  q35-hda-output-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install QEMU and OVMF
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf

      - name: Enforce current topology dependency
        shell: python
        run: |
          from pathlib import Path
          p=Path('boot/uefi-hda-topology-v1/os-uefi-hda-topology-v1.labproof')
          lines=set(p.read_text().splitlines())
          assert 'proof = PASS' in lines
          assert 'widget-nids-hardcoded = false' in lines
          print('OUTPUT_POLICY_DEPENDENCY=PASS')

      - name: Audit output-policy source contract
        shell: python
        run: |
          from pathlib import Path
          import ast
          root=Path('boot/uefi-hda-output-policy-v1')
          src=(root/'build_uefi_hda_output_policy_probe.py').read_text()
          ast.parse(src)
          required=[
              "PIN_CONFIG_DEFAULT=PASS",
              "DAC_OUTPUT_AMP_CAP=PASS",
              "DAC_OUTPUT_AMP_PROGRAM=PASS",
              "DAC_OUTPUT_AMP_VERIFY=PASS",
              "OS_UEFI_HDA_OUTPUT_POLICY_BUILD=PASS",
              "c.label('route_short')",
              "c.label('route_long')",
          ]
          for token in required:
              assert token in src,token
          proof=set((root/'os-uefi-hda-output-policy-v1.labproof').read_text().splitlines())
          for line in [
              'widget-nids-hardcoded = false',
              'pin-config-default = queried at runtime with GET_CONFIG_DEFAULT',
              'dac-output-amp-programming = SET_AMP_GAIN_MUTE',
              'dac-output-amp-readback = GET_AMP_GAIN_MUTE',
              'multi-hop-mixer-selector-routing = not-established',
          ]:
              assert line in proof,line
          print('OUTPUT_POLICY_SOURCE_CONTRACT=PASS')

      - name: Build deterministic output-policy image twice
        shell: bash
        run: |
          set -euo pipefail
          root=boot/uefi-hda-output-policy-v1
          python "$root/build_uefi_hda_output_policy_probe.py" "$root/BOOTX64.EFI" | tee "$root/build.log"
          python "$root/build_uefi_hda_output_policy_probe.py" "$root/BOOTX64-2.EFI" > "$root/build2.log"
          cmp "$root/BOOTX64.EFI" "$root/BOOTX64-2.EFI"
          grep -F 'OS_UEFI_HDA_OUTPUT_POLICY_BUILD=PASS' "$root/build.log"
          sha256sum "$root/BOOTX64.EFI"

      - name: Audit native HDA policy image
        shell: python
        run: |
          from pathlib import Path
          import struct
          image=Path('boot/uefi-hda-output-policy-v1/BOOTX64.EFI').read_bytes()
          assert image[:2]==b'MZ'
          pe=struct.unpack_from('<I',image,0x3c)[0]
          assert image[pe:pe+4]==b'PE\0\0'
          coff=pe+4
          assert struct.unpack_from('<HH',image,coff)==(0x8664,3)
          opt=coff+20
          assert struct.unpack_from('<H',image,opt)[0]==0x20b
          assert struct.unpack_from('<H',image,opt+0x44)[0]==10
          sec=opt+0xf0
          data=sec+40
          tc=struct.unpack_from('<I',image,sec+0x24)[0]
          dc=struct.unpack_from('<I',image,data+0x24)[0]
          assert not(tc&0x80000000)
          assert dc&0x80000000 and not(dc&0x20000000)
          required=[
              bytes.fromhex('4181fc00000100'),
              bytes.fromhex('0d001c0f00'),
              bytes.fromhex('0d12000f00'),
              bytes.fromhex('0d40b00300'),
              bytes.fromhex('0d00a00b00'),
              bytes.fromhex('0d00800b00'),
              b'PIN_CONFIG_DEFAULT=PASS\r\n',
              b'DAC_OUTPUT_AMP_PROGRAM=PASS\r\n',
              b'DAC_OUTPUT_AMP_VERIFY=PASS\r\n',
          ]
          for token in required:
              assert token in image,token
          print('HDA_OUTPUT_POLICY_STATIC=PASS')
          print('PIN_CONFIG_DEFAULT=BOUND')
          print('AMP_SET_READBACK=BOUND')
          print('DYNAMIC_WIDGET_NIDS=BOUND')
          print('W_X=BLOCKED')

      - name: Resolve OVMF
        shell: bash
        run: |
          set -euo pipefail
          CODE=''; VARS=''
          for pair in \
            '/usr/share/OVMF/OVMF_CODE_4M.fd|/usr/share/OVMF/OVMF_VARS_4M.fd' \
            '/usr/share/OVMF/OVMF_CODE.fd|/usr/share/OVMF/OVMF_VARS.fd' \
            '/usr/share/edk2/ovmf/OVMF_CODE.fd|/usr/share/edk2/ovmf/OVMF_VARS.fd'
          do
            IFS='|' read -r code vars <<< "$pair"
            if [[ -f "$code" && -f "$vars" ]]; then CODE="$code"; VARS="$vars"; break; fi
          done
          test -n "$CODE" -a -n "$VARS"
          printf 'CODE=%s\nVARS=%s\n' "$CODE" "$VARS" > boot/uefi-hda-output-policy-v1/ovmf.env

      - name: Prove speaker classification and DAC amp under OVMF
        shell: bash
        run: |
          set -euo pipefail
          source boot/uefi-hda-output-policy-v1/ovmf.env
          root=boot/uefi-hda-output-policy-v1
          cp "$VARS" "$root/vars.fd"
          rm -rf "$root/esp"
          mkdir -p "$root/esp/EFI/BOOT"
          cp "$root/BOOTX64.EFI" "$root/esp/EFI/BOOT/BOOTX64.EFI"
          rm -f "$root/output-policy.serial"

          qemu-system-x86_64 \
            -machine q35,accel=tcg \
            -m 128M \
            -drive if=pflash,format=raw,readonly=on,file="$CODE" \
            -drive if=pflash,format=raw,file="$root/vars.fd" \
            -drive format=raw,file=fat:rw:"$root/esp" \
            -audiodev none,id=aud \
            -device ich9-intel-hda,bus=pcie.0,addr=1b.0,id=hda0 \
            -device hda-micro,bus=hda0.0,cad=0,audiodev=aud,mixer=on \
            -display none \
            -monitor none \
            -serial file:"$root/output-policy.serial" \
            -parallel none \
            -net none \
            -no-reboot \
            -no-shutdown &
          qpid=$!
          trap 'kill $qpid 2>/dev/null || true' EXIT

          python - <<'PY'
          from pathlib import Path
          import time
          p=Path('boot/uefi-hda-output-policy-v1/output-policy.serial')
          req=[
              b'VENDOR_AGNOSTIC=PASS\r\n',
              b'AUTO_DAC_WIDGET=PASS\r\n',
              b'AUTO_OUTPUT_PIN_WIDGET=PASS\r\n',
              b'AUTO_PIN_TO_DAC_DIRECT_ROUTE=PASS\r\n',
              b'PIN_CONFIG_DEFAULT=PASS\r\n',
              b'OUTPUT_DEVICE_CLASS=ANALOG_OUTPUT\r\n',
              b'DAC_OUTPUT_AMP_CAP=PASS\r\n',
              b'DAC_OUTPUT_AMP_PROGRAM=PASS\r\n',
              b'DAC_OUTPUT_AMP_VERIFY=PASS\r\n',
              b'STATUS=PASS\r\n',
          ]
          end=time.time()+30
          while time.time()<end:
              raw=p.read_bytes() if p.exists() else b''
              if b'STATUS=BLOCKED\r\n' in raw:
                  raise SystemExit('output policy blocked: '+repr(raw[-4096:]))
              if all(x in raw for x in req):
                  print('HDA_OUTPUT_POLICY_RUNTIME=PASS')
                  break
              time.sleep(.1)
          else:
              raise SystemExit('timeout: '+repr((p.read_bytes() if p.exists() else b'')[-4096:]))
          PY

          kill $qpid 2>/dev/null || true
          wait $qpid 2>/dev/null || true
          trap - EXIT

      - name: Record output-policy evidence
        shell: bash
        run: |
          set -euo pipefail
          root=boot/uefi-hda-output-policy-v1
          sha256sum "$root/BOOTX64.EFI" "$root/output-policy.serial" > "$root/evidence.sha256"
          cat > "$root/linux-evidence.txt" <<'EOF'
          OS-UEFI-HDA-OUTPUT-POLICY-V1
          runner = GitHub-hosted Linux
          firmware = OVMF
          machine = q35
          codec = hda-micro
          widget-NID-hardcode = false
          output-pin-config-default = PASS
          speaker-class-witness = PASS
          DAC-output-amp-capability = PASS
          DAC-output-amp-program = PASS
          DAC-output-amp-readback = PASS
          multi-hop-routing = not-established
          physical-ASUS-output-policy = not-established
          result = PASS
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: os-uefi-hda-output-policy-v1-linux
          path: |
            boot/uefi-hda-output-policy-v1/BOOTX64.EFI
            boot/uefi-hda-output-policy-v1/output-policy.serial
            boot/uefi-hda-output-policy-v1/build.log
            boot/uefi-hda-output-policy-v1/evidence.sha256
            boot/uefi-hda-output-policy-v1/linux-evidence.txt
          if-no-files-found: error

      - name: Persist revision-bound output-policy proof
        shell: bash
        run: |
          set -euo pipefail
          root=boot/uefi-hda-output-policy-v1
          builder="$root/build_uefi_hda_output_policy_probe.py"
          workflow=".github/workflows/os-uefi-hda-output-policy-v1.yml"
          tested_builder="$(git rev-parse "$GITHUB_SHA:$builder")"
          tested_workflow="$(git rev-parse "$GITHUB_SHA:$workflow")"
          cp "$root/BOOTX64.EFI" /tmp/output-policy.efi
          cp "$root/output-policy.serial" /tmp/output-policy.serial

          git fetch origin os
          git checkout -B os origin/os
          [[ "$tested_builder" == "$(git rev-parse "os:$builder")" ]] || { echo OUTPUT_POLICY_STALE_BUILDER=SKIP; exit 0; }
          [[ "$tested_workflow" == "$(git rev-parse "os:$workflow")" ]] || { echo OUTPUT_POLICY_STALE_WORKFLOW=SKIP; exit 0; }

          python - <<'PY'
          from pathlib import Path
          import hashlib,os
          root=Path('boot/uefi-hda-output-policy-v1')
          p=root/'os-uefi-hda-output-policy-v1.labproof'
          text=p.read_text()
          states=[x for x in text.splitlines() if x.startswith('proof = ')]
          if len(states)!=1 or states[0] not in {'proof = PENDING_CI','proof = PASS'}:
              raise SystemExit('unexpected proof state')
          kept=[]
          for line in text.splitlines():
              if line.startswith('proof-') or line.startswith('revalidation-reason ='):
                  continue
              kept.append('proof = PASS' if line.startswith('proof = ') else line)
          efi=Path('/tmp/output-policy.efi').read_bytes()
          serial=Path('/tmp/output-policy.serial').read_bytes()
          text='\n'.join(kept).rstrip()+'\n'
          text += (
              f"proof-run = {os.environ['GITHUB_RUN_ID']}\n"
              f"proof-head-sha = {os.environ['GITHUB_SHA']}\n"
              "proof-pin-config-default = PASS\n"
              "proof-speaker-class-witness = PASS\n"
              "proof-dac-output-amp-capabilities = PASS\n"
              "proof-dac-output-amp-program = PASS\n"
              "proof-dac-output-amp-readback = PASS\n"
              "proof-widget-NIDs-hardcoded = false\n"
              f"proof-efi-sha256 = {hashlib.sha256(efi).hexdigest()}\n"
              f"proof-serial-sha256 = {hashlib.sha256(serial).hexdigest()}\n"
          )
          p.write_text(text)
          PY
          if git diff --quiet -- "$root/os-uefi-hda-output-policy-v1.labproof"; then exit 0; fi
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$root/os-uefi-hda-output-policy-v1.labproof"
          git commit -m "Record dynamic HDA output policy proof [skip ci]"
          git push origin os
