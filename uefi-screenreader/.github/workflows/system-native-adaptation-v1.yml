name: system-native-adaptation-v1

on:
  push:
    branches: [os]
    paths:
      - 'system/native-adaptation-v1/NativeAdaptationWitness.cs'
      - '.github/workflows/system-native-adaptation-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  amd-real-adaptation:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Assert adaptation foundations and AMD carrier
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach ($p in @(
            'lab21/native-relation-core.labproof',
            'system/native-perception-v1/native-perception-v1.labproof',
            'system/native-attention-v1/native-attention-v1.labproof',
            'system/native-memory-v1/native-memory-v1.labproof'
          )) {
            $lines=Get-Content $p
            if ($lines -notcontains 'proof = PASS' -or $lines -notcontains 'system-foundation = true') {
              throw "required native foundation not proven: $p"
            }
          }
          $lab22=Get-Content 'lab22/affinity-topology.labproof'
          if ($lab22 -notcontains 'proof = PASS') { throw 'external AMD topology witness not proven' }
          if ($env:RUNNER_NAME -ne 'AMD-5800H-REAL') { throw "wrong runner: $env:RUNNER_NAME" }
          $cpu=Get-CimInstance Win32_Processor | Select-Object -First 1
          if ($cpu.Name -notmatch '5800H') { throw "wrong CPU: $($cpu.Name)" }
          'NATIVE_ADAPTATION_FOUNDATIONS_AND_RUNNER=PASS'

      - name: Capture and attend real AMD episode 1
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force 'adaptation-runtime' | Out-Null
          Add-Type -TypeDefinition (Get-Content 'lab22/AffinityTopologyWitness.cs' -Raw) -Language CSharp
          Add-Type -TypeDefinition (Get-Content 'system/native-perception-v1/NativePerceptionWitness.cs' -Raw) -Language CSharp
          Add-Type -TypeDefinition (Get-Content 'system/native-attention-v1/NativeAttentionWitness.cs' -Raw) -Language CSharp

          $topology=[Lab22Witness]::Run(16)
          $perception=[NativePerceptionV1]::Normalize(
            $topology,
            'lab21/relation-compose0',
            'adaptation-runtime/episode1-raw.txt',
            'adaptation-runtime/episode1-percepts.txt'
          )
          if ($perception -notlike 'NATIVE_PERCEPTION_V1=PASS*') { throw $perception }

          $attention=[NativeAttentionV1]::Focus(
            'lab21/relation-compose0',
            'adaptation-runtime/episode1-percepts.txt',
            'adaptation-runtime/episode1-attention.qattn',
            'adaptation-runtime/episode1-attention-witness.txt'
          )
          if ($attention -notlike 'NATIVE_ATTENTION_V1=PASS*FOCUSED=7*') { throw $attention }
          $attention

      - name: Apply adaptation episode 1 in independent process step
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -TypeDefinition (Get-Content 'system/native-adaptation-v1/NativeAdaptationWitness.cs' -Raw) -Language CSharp

          $result=[NativeAdaptationV1]::Update(
            'lab21/relation-compose0',
            'adaptation-runtime/episode1-attention.qattn',
            'adaptation-runtime/adaptive-state.qstate',
            'adaptation-runtime/episode1-adaptation-witness.txt'
          )
          if ($result -notlike 'NATIVE_ADAPTATION_V1=PASS*') { throw $result }
          if ($result -notlike '*BEFORE_ROLE=identity*') { throw $result }
          if ($result -notlike '*FOCUSED=7*') { throw $result }
          if ($result -notlike '*AFTER_ROLE=non-identity*') { throw $result }
          Copy-Item 'adaptation-runtime/adaptive-state.qstate' 'adaptation-runtime/episode1-state.qstate' -Force
          $result

      - name: Capture and attend real AMD episode 2
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -TypeDefinition (Get-Content 'lab22/AffinityTopologyWitness.cs' -Raw) -Language CSharp
          Add-Type -TypeDefinition (Get-Content 'system/native-perception-v1/NativePerceptionWitness.cs' -Raw) -Language CSharp
          Add-Type -TypeDefinition (Get-Content 'system/native-attention-v1/NativeAttentionWitness.cs' -Raw) -Language CSharp

          $topology=[Lab22Witness]::Run(16)
          $perception=[NativePerceptionV1]::Normalize(
            $topology,
            'lab21/relation-compose0',
            'adaptation-runtime/episode2-raw.txt',
            'adaptation-runtime/episode2-percepts.txt'
          )
          if ($perception -notlike 'NATIVE_PERCEPTION_V1=PASS*') { throw $perception }

          $attention=[NativeAttentionV1]::Focus(
            'lab21/relation-compose0',
            'adaptation-runtime/episode2-percepts.txt',
            'adaptation-runtime/episode2-attention.qattn',
            'adaptation-runtime/episode2-attention-witness.txt'
          )
          if ($attention -notlike 'NATIVE_ATTENTION_V1=PASS*FOCUSED=7*') { throw $attention }
          $attention

      - name: Apply adaptation episode 2 from persisted state
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -TypeDefinition (Get-Content 'system/native-adaptation-v1/NativeAdaptationWitness.cs' -Raw) -Language CSharp

          $result=[NativeAdaptationV1]::Update(
            'lab21/relation-compose0',
            'adaptation-runtime/episode2-attention.qattn',
            'adaptation-runtime/adaptive-state.qstate',
            'adaptation-runtime/episode2-adaptation-witness.txt'
          )
          if ($result -notlike 'NATIVE_ADAPTATION_V1=PASS*') { throw $result }
          if ($result -notlike '*BEFORE_ROLE=non-identity*') { throw $result }
          if ($result -notlike '*FOCUSED=7*') { throw $result }
          if ($result -notlike '*AFTER_ROLE=identity*') { throw $result }
          Copy-Item 'adaptation-runtime/adaptive-state.qstate' 'adaptation-runtime/episode2-state.qstate' -Force
          $result

      - name: Verify persistent adaptation boundary
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ((Get-Item 'adaptation-runtime/episode1-state.qstate').Length -ne 1) { throw 'episode1 adaptive state length mismatch' }
          if ((Get-Item 'adaptation-runtime/episode2-state.qstate').Length -ne 1) { throw 'episode2 adaptive state length mismatch' }

          $s1=[IO.File]::ReadAllBytes((Join-Path $PWD 'adaptation-runtime/episode1-state.qstate'))
          $s2=[IO.File]::ReadAllBytes((Join-Path $PWD 'adaptation-runtime/episode2-state.qstate'))
          if ($s1[0] -eq $s2[0]) { throw 'adaptive state did not change across the second real episode' }

          @(
            'NATIVE-ADAPTATION-V1'
            "github-run-id = $env:GITHUB_RUN_ID"
            "runner-name = $env:RUNNER_NAME"
            'episode1-focused = 7'
            'episode1-before-role = identity'
            'episode1-after-role = non-identity'
            'episode2-focused = 7'
            'episode2-before-role = non-identity'
            'episode2-after-role = identity'
            'persistent-state-between-processes = PASS'
            'attention-driven-state-change = PASS'
            'external-model = none'
            'external-score = none'
            'result = PASS'
          ) | Set-Content 'adaptation-runtime/evidence.txt' -Encoding utf8
          Get-Content 'adaptation-runtime/evidence.txt'

      - name: Enforce accessibility boundary
        shell: pwsh
        run: |
          $lines=Get-Content 'system/native-adaptation-v1/native-adaptation-v1.labproof'
          if ($lines -notcontains 'human-facing = false') { throw 'human-facing adaptation boundary missing' }
          if ($lines -notcontains 'accessibility-behavior = not-applicable') { throw 'accessibility behavior boundary missing' }
          if ($lines -notcontains 'external-model = none') { throw 'external model prohibition missing' }
          if ($lines -notcontains 'external-score = none') { throw 'external score prohibition missing' }
          if (-not ($lines | Where-Object { $_ -like 'accessibility-gate = *' })) { throw 'accessibility gate missing' }
          'NATIVE_ADAPTATION_ACCESSIBILITY_BOUNDARY=PASS'

      - name: Hash adaptation evidence
        shell: pwsh
        run: |
          Get-FileHash -Algorithm SHA256 'system/native-adaptation-v1/NativeAdaptationWitness.cs','adaptation-runtime/episode1-raw.txt','adaptation-runtime/episode1-percepts.txt','adaptation-runtime/episode1-attention.qattn','adaptation-runtime/episode1-state.qstate','adaptation-runtime/episode1-adaptation-witness.txt','adaptation-runtime/episode2-raw.txt','adaptation-runtime/episode2-percepts.txt','adaptation-runtime/episode2-attention.qattn','adaptation-runtime/episode2-state.qstate','adaptation-runtime/episode2-adaptation-witness.txt','adaptation-runtime/evidence.txt' |
            ForEach-Object { "$($_.Path) SHA256=$($_.Hash.ToLowerInvariant())" }

      - name: Upload AMD adaptation evidence
        uses: actions/upload-artifact@v4
        with:
          name: system-native-adaptation-v1-amd5800h
          path: adaptation-runtime
          if-no-files-found: error

  linux-independent-replay:
    needs: amd-real-adaptation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: system-native-adaptation-v1-amd5800h
          path: adaptation-artifact

      - name: Independently replay attention-driven adaptation
        shell: python
        run: |
          from pathlib import Path

          table=Path('lab21/relation-compose0').read_bytes()
          states=list(dict.fromkeys(table))
          assert len(table)==4 and len(states)==2

          def idx(x): return states.index(x)
          def compose(a,b): return table[idx(a)*2+idx(b)]

          identities=[e for e in states if all(compose(e,x)==x and compose(x,e)==x for x in states)]
          assert len(identities)==1
          identity=identities[0]

          root=Path('adaptation-artifact')
          a1=(root/'episode1-attention.qattn').read_bytes()
          a2=(root/'episode2-attention.qattn').read_bytes()
          assert len(a1)==7 and len(a2)==7
          assert all(x in states and x!=identity for x in a1)
          assert all(x in states and x!=identity for x in a2)

          state=identity
          for x in a1:
              state=compose(state,x)
          s1=(root/'episode1-state.qstate').read_bytes()
          assert len(s1)==1 and s1[0]==state
          assert s1[0]!=identity

          for x in a2:
              state=compose(state,x)
          s2=(root/'episode2-state.qstate').read_bytes()
          assert len(s2)==1 and s2[0]==state
          assert s2[0]==identity

          w1=(root/'episode1-adaptation-witness.txt').read_text().splitlines()
          w2=(root/'episode2-adaptation-witness.txt').read_text().splitlines()
          assert 'before-role=identity' in w1
          assert 'focused-events=7' in w1
          assert 'after-role=non-identity' in w1
          assert 'before-role=non-identity' in w2
          assert 'focused-events=7' in w2
          assert 'after-role=identity' in w2

          evidence=(root/'evidence.txt').read_text().splitlines()
          required={
              'persistent-state-between-processes = PASS',
              'attention-driven-state-change = PASS',
              'external-model = none',
              'external-score = none',
              'result = PASS',
          }
          assert required.issubset(set(evidence))

          print('NATIVE_ADAPTATION_V1_LINUX_REPLAY=PASS;EPISODE1_CHANGE=PASS;EPISODE2_PERSISTED_UPDATE=PASS')
