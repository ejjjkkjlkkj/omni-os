name: system-native-guard-v1

on:
  push:
    branches: [os]
    paths:
      - 'system/native-guard-v1/NativeGuardWitness.cs'
      - 'system/native-guard-v1/native-guard-v1.labproof'
      - '.github/workflows/system-native-guard-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  amd-real-guard:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Assert guard foundations and AMD carrier
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach($p in @(
            'lab21/native-relation-core.labproof',
            'system/native-location-v1/native-location-v1.labproof',
            'system/native-store-v1/native-store-v1.labproof'
          )) {
            $lines=Get-Content $p
            if ($lines -notcontains 'proof = PASS' -or $lines -notcontains 'system-foundation = true') {
              throw "required native foundation not proven: $p"
            }
          }
          $contract=Get-Content 'system/native-guard-v1/native-guard-v1.labproof'
          foreach($required in @(
            'required-locations = 256',
            'required-matching-identity-residual-vectors = 256',
            'required-mismatch-nonidentity-residual-vectors = 256',
            'boolean-authorization-semantics = none',
            'protected-operation-execution = none',
            'executed-protected-operations = 0',
            'cryptographic-security-claim = none',
            'pointer-semantics = none',
            'integer-address-semantics = none',
            'human-facing = false',
            'accessibility-behavior = not-applicable'
          )) {
            if ($contract -notcontains $required) { throw "missing guard contract: $required" }
          }
          if ($env:RUNNER_NAME -ne 'AMD-5800H-REAL') { throw "wrong runner: $env:RUNNER_NAME" }
          'NATIVE_GUARD_PRECONDITIONS=PASS'

      - name: Generate native targets and structural guard residuals
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force 'guard-runtime' | Out-Null
          Add-Type -TypeDefinition (Get-Content 'system/native-location-v1/NativeLocationWitness.cs' -Raw) -Language CSharp
          Add-Type -TypeDefinition (Get-Content 'system/native-guard-v1/NativeGuardWitness.cs' -Raw) -Language CSharp

          $loc=[NativeLocationV1]::Generate(
            'lab21/relation-compose0',
            'guard-runtime/locations.qloc',
            'guard-runtime/location-witness.txt',
            8
          )
          if ($loc -ne 'NATIVE_LOCATION_V1=PASS;WIDTH=8;LOCATIONS=256;PAIR_CHECKS=32640;UNIQUE=PASS;LABEL_EXCHANGE=PASS;POINTER_SEMANTICS=NONE') {
            throw $loc
          }

          $r=[NativeGuardV1]::Build(
            'lab21/relation-compose0',
            'guard-runtime/locations.qloc',
            'guard-runtime/matching.qguard',
            'guard-runtime/mismatched.qguard',
            'guard-runtime/guard-witness.txt'
          )
          $expected='NATIVE_GUARD_V1=PASS;LOCATIONS=256;MATCHING_IDENTITY_RESIDUALS=256;MISMATCH_NONIDENTITY_RESIDUALS=256;BOOLEAN_AUTH=NONE;EXECUTED=0'
          if ($r -ne $expected) { throw $r }
          $r | Set-Content 'guard-runtime/result.txt' -Encoding utf8
          $r

      - name: Verify residual shape without authorizing execution
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $table=[IO.File]::ReadAllBytes((Join-Path $PWD 'lab21/relation-compose0'))
          $states=@()
          foreach($b in $table) { if ($states -notcontains $b) { $states += $b } }
          if ($table.Length -ne 4 -or $states.Count -ne 2) { throw 'native relation carrier mismatch' }

          function Compose([byte]$left,[byte]$right) {
            $li=[Array]::IndexOf($states,$left)
            $ri=[Array]::IndexOf($states,$right)
            if ($li -lt 0 -or $ri -lt 0) { throw 'outside relation carrier' }
            return [byte]$table[($li*2)+$ri]
          }

          $identity=$null
          foreach($candidate in $states) {
            $ok=$true
            foreach($x in $states) {
              if ((Compose $candidate $x) -ne $x -or (Compose $x $candidate) -ne $x) { $ok=$false; break }
            }
            if ($ok) { $identity=[byte]$candidate }
          }
          if ($null -eq $identity) { throw 'structural identity missing' }
          $exchange=[byte]($states | Where-Object { $_ -ne $identity } | Select-Object -First 1)

          $matching=[IO.File]::ReadAllBytes((Join-Path $PWD 'guard-runtime/matching.qguard'))
          $mismatched=[IO.File]::ReadAllBytes((Join-Path $PWD 'guard-runtime/mismatched.qguard'))
          if ($matching.Length -ne 2048 -or $mismatched.Length -ne 2048) { throw 'guard residual length mismatch' }

          for($location=0;$location -lt 256;$location++) {
            $offset=$location*8
            for($i=0;$i -lt 8;$i++) {
              if ($matching[$offset+$i] -ne $identity) { throw "matching residual escaped identity at $location/$i" }
              $expected = if ($i -eq 0) { $exchange } else { $identity }
              if ($mismatched[$offset+$i] -ne $expected) { throw "mismatch residual shape failure at $location/$i" }
            }
          }

          $witness=Get-Content 'guard-runtime/guard-witness.txt'
          foreach($required in @(
            'locations=256',
            'key-width-relations=8',
            'matching-identity-residual-vectors=256',
            'mismatch-nonidentity-residual-vectors=256',
            'guard-evaluation=elementwise-native-composition-residual',
            'matching-capability-residual=all-structural-identity',
            'mismatched-capability-residual=contains-structural-non-identity',
            'boolean-authorization-semantics=none',
            'protected-operation-execution=none',
            'cryptographic-security-claim=none',
            'pointer-semantics=none',
            'integer-address-semantics=none'
          )) {
            if ($witness -notcontains $required) { throw "guard witness missing $required" }
          }

          @(
            'NATIVE-GUARD-V1'
            "github-run-id = $env:GITHUB_RUN_ID"
            "runner-name = $env:RUNNER_NAME"
            'locations = 256'
            'matching-identity-residual-vectors = 256'
            'mismatch-nonidentity-residual-vectors = 256'
            'matching-residual-shape = PASS'
            'mismatched-residual-shape = PASS'
            'boolean-authorization-semantics = none'
            'executed-protected-operations = 0'
            'cryptographic-security-claim = none'
            'adversarial-security-proof = not-established'
            'pointer-semantics = none'
            'integer-address-semantics = none'
            'result = PASS'
          ) | Set-Content 'guard-runtime/evidence.txt' -Encoding utf8
          Get-Content 'guard-runtime/evidence.txt'

      - name: Enforce guard accessibility boundary
        shell: pwsh
        run: |
          $lines=Get-Content 'system/native-guard-v1/native-guard-v1.labproof'
          if ($lines -notcontains 'human-facing = false') { throw 'guard human-facing boundary missing' }
          if ($lines -notcontains 'accessibility-behavior = not-applicable') { throw 'guard accessibility boundary missing' }
          if (-not ($lines | Where-Object { $_ -like 'accessibility-gate = *' })) { throw 'guard accessibility gate missing' }
          'NATIVE_GUARD_ACCESSIBILITY_BOUNDARY=PASS'

      - name: Hash guard evidence
        shell: pwsh
        run: |
          $targets=@(
            'system/native-guard-v1/NativeGuardWitness.cs'
            'guard-runtime/locations.qloc'
            'guard-runtime/matching.qguard'
            'guard-runtime/mismatched.qguard'
            'guard-runtime/guard-witness.txt'
            'guard-runtime/evidence.txt'
          )
          Get-FileHash -Algorithm SHA256 $targets |
            ForEach-Object { "$($_.Path) SHA256=$($_.Hash.ToLowerInvariant())" }

      - name: Upload guard evidence
        uses: actions/upload-artifact@v4
        with:
          name: system-native-guard-v1-amd5800h
          path: |
            guard-runtime/locations.qloc
            guard-runtime/matching.qguard
            guard-runtime/mismatched.qguard
            guard-runtime/guard-witness.txt
            guard-runtime/evidence.txt
          if-no-files-found: error

  linux-independent-replay:
    needs: amd-real-guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: system-native-guard-v1-amd5800h
          path: guard-artifact

      - name: Independently replay structural guard residuals
        shell: python
        run: |
          from pathlib import Path

          table=Path('lab21/relation-compose0').read_bytes()
          states=list(dict.fromkeys(table))
          assert len(table)==4 and len(states)==2
          def idx(x): return states.index(x)
          def compose(a,b): return table[idx(a)*2+idx(b)]
          ids=[e for e in states if all(compose(e,x)==x and compose(x,e)==x for x in states)]
          assert len(ids)==1
          identity=ids[0]
          exchange=states[1] if states[0]==identity else states[0]

          root=Path('guard-artifact')
          locations=(root/'locations.qloc').read_bytes()
          matching=(root/'matching.qguard').read_bytes()
          mismatched=(root/'mismatched.qguard').read_bytes()
          assert len(locations)==len(matching)==len(mismatched)==256*8
          keys=[locations[i*8:(i+1)*8] for i in range(256)]
          assert len(set(keys))==256

          expected_matching=bytearray()
          expected_mismatched=bytearray()
          for key in keys:
              expected_matching.extend(compose(x,x) for x in key)
              capability=bytearray(key)
              capability[0]=compose(capability[0],exchange)
              expected_mismatched.extend(compose(x,y) for x,y in zip(key,capability))

          assert bytes(expected_matching)==matching
          assert bytes(expected_mismatched)==mismatched
          for i in range(256):
              m=matching[i*8:(i+1)*8]
              x=mismatched[i*8:(i+1)*8]
              assert m==bytes([identity])*8
              assert x[0]==exchange and x[1:]==bytes([identity])*7

          evidence=(root/'evidence.txt').read_text().splitlines()
          required={
              'locations = 256',
              'matching-identity-residual-vectors = 256',
              'mismatch-nonidentity-residual-vectors = 256',
              'matching-residual-shape = PASS',
              'mismatched-residual-shape = PASS',
              'boolean-authorization-semantics = none',
              'executed-protected-operations = 0',
              'cryptographic-security-claim = none',
              'pointer-semantics = none',
              'integer-address-semantics = none',
              'result = PASS',
          }
          assert required.issubset(set(evidence))
          print('NATIVE_GUARD_V1_LINUX_REPLAY=PASS;MATCHING=256;MISMATCH=256;EXECUTED=0')
