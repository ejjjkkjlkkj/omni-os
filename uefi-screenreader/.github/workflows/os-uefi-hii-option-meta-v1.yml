name: os-uefi-hii-option-meta-v1

on:
  push:
    branches: [os]
    paths:
      - 'boot/uefi-hii-option-meta-v1/build_uefi_hii_option_meta.py'
      - 'boot/uefi-hii-option-meta-v1/os-uefi-hii-option-meta-v1.labproof'
      - 'boot/uefi-hii-option-v1/os-uefi-hii-option-v1.labproof'
      - '.github/workflows/os-uefi-hii-option-meta-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  q35-native-hii-option-meta:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install QEMU and OVMF
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf

      - name: Enforce HII option foundation
        shell: python
        run: |
          from pathlib import Path
          lines=set(Path('boot/uefi-hii-option-v1/os-uefi-hii-option-v1.labproof').read_text().splitlines())
          for line in [
              'proof = PASS',
              'proof-HII-export-all-package-lists = PASS',
              'proof-IFR-option-token = PASS',
              'proof-direct-string-decoder = PASS',
              'proof-option-resolution = PASS',
          ]:
              assert line in lines,line
          print('HII_OPTION_META_DEPENDENCY=PASS')

      - name: Audit option metadata source contract
        shell: python
        run: |
          from pathlib import Path
          import ast
          root=Path('boot/uefi-hii-option-meta-v1')
          src=(root/'build_uefi_hii_option_meta.py').read_text()
          ast.parse(src)
          for token in [
              "IFR_OPTION_STRING_ID=PASS",
              "OPTION_TEXT=",
              "OPTION_FLAGS_HEX=",
              "OPTION_TYPE_HEX=",
              "OPTION_VALUE_BYTES_HEX=",
              "OPTION_VALUE_RAW8_HEX=",
              "OPTION_METADATA=PASS",
              "option_value_len",
              "option_raw",
              "hex8_emit",
              "c.emit(b'\\x3c\\x09')",
              "OS_UEFI_HII_OPTION_META_BUILD=PASS",
          ]:
              assert token in src,token
          proof=set((root/'os-uefi-hii-option-meta-v1.labproof').read_text().splitlines())
          for line in [
              'varstore-read = forbidden-in-this-stage',
              'varstore-write = forbidden',
              'firmware-setting-mutation = forbidden',
          ]:
              assert line in proof,line
          print('HII_OPTION_META_SOURCE_CONTRACT=PASS')

      - name: Build deterministic option metadata EFI twice
        shell: bash
        run: |
          set -euo pipefail
          root=boot/uefi-hii-option-meta-v1
          python "$root/build_uefi_hii_option_meta.py" "$root/BOOTX64.EFI" | tee "$root/build.log"
          python "$root/build_uefi_hii_option_meta.py" "$root/BOOTX64-2.EFI" > "$root/build2.log"
          cmp "$root/BOOTX64.EFI" "$root/BOOTX64-2.EFI"
          grep -F 'OS_UEFI_HII_OPTION_META_BUILD=PASS' "$root/build.log"
          sha256sum "$root/BOOTX64.EFI"

      - name: Audit PE and read-only metadata witnesses
        shell: python
        run: |
          from pathlib import Path
          import struct
          image=Path('boot/uefi-hii-option-meta-v1/BOOTX64.EFI').read_bytes()
          assert image[:2]==b'MZ'
          pe=struct.unpack_from('<I',image,0x3c)[0]
          assert image[pe:pe+4]==b'PE\0\0'
          coff=pe+4
          assert struct.unpack_from('<HH',image,coff)==(0x8664,3)
          opt=coff+20
          assert struct.unpack_from('<H',image,opt)[0]==0x20b
          assert struct.unpack_from('<H',image,opt+0x44)[0]==10
          sec=opt+0xf0
          ds=sec+40
          tc=struct.unpack_from('<I',image,sec+0x24)[0]
          dc=struct.unpack_from('<I',image,ds+0x24)[0]
          assert not(tc&0x80000000)
          assert dc&0x80000000 and not(dc&0x20000000)
          assert bytes.fromhex('72c19fefb2a19346b3276d32fc416042') in image
          for token in [
              b'HII_EXPORT_ALL_PACKAGE_LISTS=PASS\r\n',
              b'IFR_OPTION_STRING_ID=PASS\r\n',
              b'OPTION_FLAGS_HEX=',
              b'OPTION_TYPE_HEX=',
              b'OPTION_VALUE_BYTES_HEX=',
              b'OPTION_VALUE_RAW8_HEX=',
              b'OPTION_METADATA=PASS\r\n',
              b'HII_OPTION_STRING=PASS\r\n',
          ]:
              assert token in image,token
          print('HII_OPTION_META_STATIC=PASS')
          print('ONE_OF_OPTION_09=BOUND')
          print('INLINE_METADATA_CAPTURE=BOUND')
          print('VARSTORE_ACCESS=ABSENT_BY_CONTRACT')
          print('W_X=BLOCKED')

      - name: Resolve OVMF
        shell: bash
        run: |
          set -euo pipefail
          CODE=''; VARS=''
          for pair in \
            '/usr/share/OVMF/OVMF_CODE_4M.fd|/usr/share/OVMF/OVMF_VARS_4M.fd' \
            '/usr/share/OVMF/OVMF_CODE.fd|/usr/share/OVMF/OVMF_VARS.fd' \
            '/usr/share/edk2/ovmf/OVMF_CODE.fd|/usr/share/edk2/ovmf/OVMF_VARS.fd'
          do
            IFS='|' read -r code vars <<< "$pair"
            if [[ -f "$code" && -f "$vars" ]]; then CODE="$code"; VARS="$vars"; break; fi
          done
          test -n "$CODE" -a -n "$VARS"
          printf 'CODE=%s\nVARS=%s\n' "$CODE" "$VARS" > boot/uefi-hii-option-meta-v1/ovmf.env

      - name: Read live ONE_OF_OPTION inline metadata
        shell: bash
        run: |
          set -euo pipefail
          source boot/uefi-hii-option-meta-v1/ovmf.env
          root=boot/uefi-hii-option-meta-v1
          cp "$VARS" "$root/vars.fd"
          rm -rf "$root/esp"
          mkdir -p "$root/esp/EFI/BOOT"
          cp "$root/BOOTX64.EFI" "$root/esp/EFI/BOOT/BOOTX64.EFI"
          rm -f "$root/option-meta.serial" "$root/option-meta.txt"

          qemu-system-x86_64 \
            -machine q35,accel=tcg \
            -m 128M \
            -drive if=pflash,format=raw,readonly=on,file="$CODE" \
            -drive if=pflash,format=raw,file="$root/vars.fd" \
            -drive format=raw,file=fat:rw:"$root/esp" \
            -display none -monitor none \
            -serial file:"$root/option-meta.serial" \
            -parallel none -net none -no-reboot -no-shutdown &
          qpid=$!
          trap 'kill "$qpid" 2>/dev/null || true' EXIT

          python - <<'PY'
          from pathlib import Path
          import re,time
          root=Path('boot/uefi-hii-option-meta-v1')
          p=root/'option-meta.serial'
          required=[
              b'HII_EXPORT_ALL_PACKAGE_LISTS=PASS\r\n',
              b'IFR_OPTION_STRING_ID=PASS\r\n',
              b'OPTION_METADATA=PASS\r\n',
              b'HII_OPTION_STRING=PASS\r\n',
              b'STATUS=PASS\r\n',
          ]
          end=time.time()+30
          while time.time()<end:
              raw=p.read_bytes() if p.exists() else b''
              if b'STATUS=BLOCKED\r\n' in raw:
                  raise SystemExit('HII option metadata blocked: '+repr(raw[-8192:]))
              label=re.search(br'OPTION_TEXT=([^\r\n]+)',raw)
              flags=re.search(br'OPTION_FLAGS_HEX=([0-9A-F]{2})',raw)
              typ=re.search(br'OPTION_TYPE_HEX=([0-9A-F]{2})',raw)
              n=re.search(br'OPTION_VALUE_BYTES_HEX=([0-9A-F]{2})',raw)
              value=re.search(br'OPTION_VALUE_RAW8_HEX=([0-9A-F]{16})',raw)
              if label and flags and typ and n and value and all(x in raw for x in required):
                  label_s=label.group(1).decode('ascii','replace').strip()
                  flags_s=flags.group(1).decode()
                  type_s=typ.group(1).decode()
                  n_s=n.group(1).decode()
                  value_s=value.group(1).decode()
                  captured=int(n_s,16)
                  assert 0 <= captured <= 8,captured
                  root.joinpath('option-meta.txt').write_text(
                      f'option-label = {label_s}\n'
                      f'flags-hex = {flags_s}\n'
                      f'type-hex = {type_s}\n'
                      f'inline-value-bytes-captured = {captured}\n'
                      f'raw8-hex = {value_s}\n'
                  )
                  print('HII_OPTION_META_LABEL='+label_s)
                  print('HII_OPTION_META_FLAGS=0x'+flags_s)
                  print('HII_OPTION_META_TYPE=0x'+type_s)
                  print('HII_OPTION_META_CAPTURED_BYTES='+str(captured))
                  print('HII_OPTION_META_RAW8=0x'+value_s)
                  print('UEFI_HII_OPTION_META_RUNTIME=PASS')
                  break
              time.sleep(.1)
          else:
              raw=p.read_bytes() if p.exists() else b''
              raise SystemExit('timeout waiting HII option metadata: '+repr(raw[-8192:]))
          PY

          kill "$qpid" 2>/dev/null || true
          wait "$qpid" 2>/dev/null || true
          trap - EXIT

      - name: Record option metadata evidence
        shell: bash
        run: |
          set -euo pipefail
          root=boot/uefi-hii-option-meta-v1
          sha256sum "$root/BOOTX64.EFI" "$root/option-meta.serial" "$root/option-meta.txt" > "$root/evidence.sha256"
          {
            echo 'OS-UEFI-HII-OPTION-META-V1'
            echo 'firmware = OVMF'
            echo 'machine = q35'
            cat "$root/option-meta.txt"
            echo 'varstore-read = false'
            echo 'setting-mutation = false'
            echo 'result = PASS'
          } > "$root/linux-evidence.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: os-uefi-hii-option-meta-v1-linux
          path: |
            boot/uefi-hii-option-meta-v1/BOOTX64.EFI
            boot/uefi-hii-option-meta-v1/option-meta.serial
            boot/uefi-hii-option-meta-v1/option-meta.txt
            boot/uefi-hii-option-meta-v1/build.log
            boot/uefi-hii-option-meta-v1/evidence.sha256
            boot/uefi-hii-option-meta-v1/linux-evidence.txt
          if-no-files-found: error

      - name: Persist revision-bound HII option metadata proof
        shell: bash
        run: |
          set -euo pipefail
          root=boot/uefi-hii-option-meta-v1
          proof="$root/os-uefi-hii-option-meta-v1.labproof"
          builder="$root/build_uefi_hii_option_meta.py"
          workflow=".github/workflows/os-uefi-hii-option-meta-v1.yml"
          tested_builder="$(git rev-parse "$GITHUB_SHA:$builder")"
          tested_workflow="$(git rev-parse "$GITHUB_SHA:$workflow")"
          cp "$root/BOOTX64.EFI" /tmp/hii-option-meta.efi
          cp "$root/option-meta.serial" /tmp/hii-option-meta.serial
          cp "$root/option-meta.txt" /tmp/hii-option-meta.txt

          git fetch origin os
          git checkout -B os origin/os
          [[ "$tested_builder" == "$(git rev-parse "os:$builder")" ]] || { echo HII_OPTION_META_STALE_BUILDER=SKIP; exit 0; }
          [[ "$tested_workflow" == "$(git rev-parse "os:$workflow")" ]] || { echo HII_OPTION_META_STALE_WORKFLOW=SKIP; exit 0; }

          python - <<'PY'
          from pathlib import Path
          import hashlib,os
          root=Path('boot/uefi-hii-option-meta-v1')
          p=root/'os-uefi-hii-option-meta-v1.labproof'
          text=p.read_text()
          states=[x for x in text.splitlines() if x.startswith('proof = ')]
          if len(states)!=1 or states[0] not in {'proof = PENDING_CI','proof = PASS'}:
              raise SystemExit('unexpected proof state: '+repr(states))
          vals={}
          for line in Path('/tmp/hii-option-meta.txt').read_text().splitlines():
              if ' = ' in line:
                  k,v=line.split(' = ',1); vals[k]=v
          kept=[]
          for line in text.splitlines():
              if line.startswith('proof-'):
                  continue
              kept.append('proof = PASS' if line.startswith('proof = ') else line)
          efi=Path('/tmp/hii-option-meta.efi').read_bytes()
          serial=Path('/tmp/hii-option-meta.serial').read_bytes()
          text='\n'.join(kept).rstrip()+'\n'
          text += (
              f"proof-run = {os.environ['GITHUB_RUN_ID']}\n"
              f"proof-head-sha = {os.environ['GITHUB_SHA']}\n"
              "proof-option-metadata = PASS\n"
              f"proof-option-label = {vals['option-label']}\n"
              f"proof-option-flags-hex = {vals['flags-hex']}\n"
              f"proof-option-type-hex = {vals['type-hex']}\n"
              f"proof-inline-value-bytes-captured = {vals['inline-value-bytes-captured']}\n"
              f"proof-option-raw8-hex = {vals['raw8-hex']}\n"
              "proof-varstore-read = false\n"
              "proof-setting-mutation = false\n"
              f"proof-efi-sha256 = {hashlib.sha256(efi).hexdigest()}\n"
              f"proof-serial-sha256 = {hashlib.sha256(serial).hexdigest()}\n"
          )
          p.write_text(text)
          PY

          if git diff --quiet -- "$proof"; then exit 0; fi
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$proof"
          git commit -m "Record read-only UEFI HII option metadata proof [skip ci]"
          git push origin os
