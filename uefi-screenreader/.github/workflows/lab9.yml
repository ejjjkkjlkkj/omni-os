name: lab9-exhaustive-finite-closure
on:
  push:
    branches: [os]
    paths:
      - 'lab9/**'
      - '!lab9/*.labproof'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-exhaustive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exhaust complete 16-position external space with witness A
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from collections import Counter

          N = 16
          TOTAL = 1 << N

          def material(code):
              return bytes(0xff if (code >> i) & 1 else 0x00 for i in range(N))

          def derive(src):
              out = bytearray()
              prev = src[-1]
              for cur in src:
                  out.append(0x00 if cur == prev else 0xff)
                  prev = cur
              return bytes(out)

          def recover(rel, anchor):
              out = bytearray(N)
              out[0] = anchor
              for i in range(1, N):
                  if rel[i] == 0x00:
                      out[i] = out[i-1]
                  elif rel[i] == 0xff:
                      out[i] = 0xff if out[i-1] == 0x00 else 0x00
                  else:
                      raise SystemExit("unexpected relation state")
              closure = 0x00 if out[0] == out[-1] else 0xff
              if closure != rel[0]:
                  return None
              return bytes(out)

          counts = Counter()

          for code in range(TOTAL):
              src = material(code)
              comp = bytes(0xff if x == 0x00 else 0x00 for x in src)
              rel = derive(src)
              if derive(comp) != rel:
                  raise SystemExit(f"global exchange mismatch at source {code}")
              if sum(x == 0xff for x in rel) % 2:
                  raise SystemExit(f"non-closing derived relation at source {code}")
              counts[rel] += 1

          if len(counts) != 32768:
              raise SystemExit(f"distinct derived relations = {len(counts)}")
          if any(v != 2 for v in counts.values()):
              raise SystemExit("a derived relation does not have exactly two source representations")

          reconstructable = 0
          rejected = 0

          for code in range(TOTAL):
              rel = material(code)
              a = recover(rel, 0x00)
              b = recover(rel, 0xff)
              present = rel in counts

              if a is None or b is None:
                  if a is not None or b is not None:
                      raise SystemExit(f"anchor disagreement at relation candidate {code}")
                  if present:
                      raise SystemExit(f"derived relation rejected at candidate {code}")
                  rejected += 1
                  continue

              reconstructable += 1
              if not present:
                  raise SystemExit(f"reconstructable relation absent from derived set at candidate {code}")
              if counts[rel] != 2:
                  raise SystemExit(f"source multiplicity mismatch at candidate {code}")
              if any(x == y for x, y in zip(a, b)):
                  raise SystemExit(f"reconstructions are not globally exchanged at candidate {code}")
              if derive(a) != rel or derive(b) != rel:
                  raise SystemExit(f"reconstruction does not rederive relation at candidate {code}")

          if reconstructable != 32768:
              raise SystemExit(f"reconstructable candidates = {reconstructable}")
          if rejected != 32768:
              raise SystemExit(f"nonreconstructable candidates = {rejected}")

          print("LAB9_LINUX=PASS")
          PY

  windows-exhaustive:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exhaust complete 16-position external space with witness B
        shell: pwsh
        run: |
          $N = 16
          $TOTAL = 65536

          function Material([int]$code) {
            [byte[]]$out = New-Object byte[] $N
            for ($i = 0; $i -lt $N; $i++) {
              if (($code -band (1 -shl $i)) -ne 0) { $out[$i] = 255 } else { $out[$i] = 0 }
            }
            return ,$out
          }

          function Derive([byte[]]$src) {
            [byte[]]$out = New-Object byte[] $N
            [byte]$prev = $src[$N - 1]
            for ($i = 0; $i -lt $N; $i++) {
              if ($src[$i] -ne 0 -and $src[$i] -ne 255) { throw "unexpected source state" }
              if ($src[$i] -eq $prev) { $out[$i] = 0 } else { $out[$i] = 255 }
              $prev = $src[$i]
            }
            return ,$out
          }

          function Recover([byte[]]$rel, [byte]$anchor) {
            [byte[]]$out = New-Object byte[] $N
            $out[0] = $anchor
            for ($i = 1; $i -lt $N; $i++) {
              if ($rel[$i] -eq 0) {
                $out[$i] = $out[$i-1]
              } elseif ($rel[$i] -eq 255) {
                if ($out[$i-1] -eq 0) { $out[$i] = 255 } else { $out[$i] = 0 }
              } else {
                throw "unexpected relation state"
              }
            }
            [byte]$closure = 0
            if ($out[0] -ne $out[$N-1]) { $closure = 255 }
            if ($closure -ne $rel[0]) { return $null }
            return ,$out
          }

          $counts = [System.Collections.Generic.Dictionary[string,int]]::new()

          for ($code = 0; $code -lt $TOTAL; $code++) {
            [byte[]]$src = Material $code
            [byte[]]$comp = New-Object byte[] $N
            for ($i = 0; $i -lt $N; $i++) {
              if ($src[$i] -eq 0) { $comp[$i] = 255 } else { $comp[$i] = 0 }
            }

            [byte[]]$rel = Derive $src
            [byte[]]$relComp = Derive $comp
            $different = 0
            for ($i = 0; $i -lt $N; $i++) {
              if ($rel[$i] -ne $relComp[$i]) { throw "global exchange mismatch at source $code" }
              if ($rel[$i] -eq 255) { $different++ }
            }
            if (($different % 2) -ne 0) { throw "non-closing derived relation at source $code" }

            $key = [Convert]::ToHexString($rel)
            if ($counts.ContainsKey($key)) { $counts[$key]++ } else { $counts[$key] = 1 }
          }

          if ($counts.Count -ne 32768) { throw "distinct derived relations = $($counts.Count)" }
          foreach ($entry in $counts.GetEnumerator()) {
            if ($entry.Value -ne 2) { throw "derived relation multiplicity is $($entry.Value)" }
          }

          $reconstructable = 0
          $rejected = 0

          for ($code = 0; $code -lt $TOTAL; $code++) {
            [byte[]]$rel = Material $code
            $key = [Convert]::ToHexString($rel)
            $a = Recover $rel 0
            $b = Recover $rel 255
            $present = $counts.ContainsKey($key)

            if ($null -eq $a -or $null -eq $b) {
              if (($null -eq $a) -ne ($null -eq $b)) { throw "anchor disagreement at relation candidate $code" }
              if ($present) { throw "derived relation rejected at candidate $code" }
              $rejected++
              continue
            }

            $reconstructable++
            if (-not $present) { throw "reconstructable relation absent from derived set at candidate $code" }
            if ($counts[$key] -ne 2) { throw "source multiplicity mismatch at candidate $code" }

            [byte[]]$ra = Derive ([byte[]]$a)
            [byte[]]$rb = Derive ([byte[]]$b)
            for ($i = 0; $i -lt $N; $i++) {
              if ($a[$i] -eq $b[$i]) { throw "reconstructions are not globally exchanged at candidate $code position $i" }
              if ($ra[$i] -ne $rel[$i] -or $rb[$i] -ne $rel[$i]) { throw "reconstruction mismatch at candidate $code position $i" }
            }
          }

          if ($reconstructable -ne 32768) { throw "reconstructable candidates = $reconstructable" }
          if ($rejected -ne 32768) { throw "nonreconstructable candidates = $rejected" }

          "LAB9_WINDOWS=PASS"
