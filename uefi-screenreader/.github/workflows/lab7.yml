name: lab7-local-disturbance
on:
  push:
    branches: [os]
    paths:
      - 'lab0/mark0'
      - 'lab2/relation0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-locality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exhaust all single-position disturbances with witness A
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          src = Path("lab0/mark0").read_bytes()
          ref = Path("lab2/relation0").read_bytes()
          if len(src) != 32 or len(ref) != 32:
              raise SystemExit("length mismatch")
          if any(x not in (0x00,0xff) for x in src + ref):
              raise SystemExit("unexpected state")

          def derive(s):
              out=bytearray()
              prev=s[-1]
              for cur in s:
                  out.append(0 if cur == prev else 0xff)
                  prev=cur
              return bytes(out)

          if derive(src) != ref:
              raise SystemExit("reference relation mismatch")

          total=0
          for i in range(32):
              p=bytearray(src)
              p[i]=0xff if p[i] == 0 else 0
              r=derive(p)
              changed=[j for j,(a,b) in enumerate(zip(r,ref)) if a != b]
              expected=sorted({i,(i+1)%32})
              if changed != expected:
                  raise SystemExit(f"position {i}: got {changed}, expected {expected}")
              total += len(changed)
          if total != 64:
              raise SystemExit(f"total changed relations = {total}")
          print("LAB7_LINUX=PASS")
          PY

  windows-locality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exhaust all single-position disturbances with witness B
        shell: pwsh
        run: |
          [byte[]]$src = [IO.File]::ReadAllBytes("lab0/mark0")
          [byte[]]$ref = [IO.File]::ReadAllBytes("lab2/relation0")
          if ($src.Length -ne 32 -or $ref.Length -ne 32) { throw "length mismatch" }

          function Derive([byte[]]$s) {
            [byte[]]$out = New-Object byte[] 32
            [byte]$prev = $s[31]
            for ($k=0; $k -lt 32; $k++) {
              if ($s[$k] -ne 0 -and $s[$k] -ne 255) { throw "unexpected source state" }
              if ($s[$k] -eq $prev) { $out[$k]=0 } else { $out[$k]=255 }
              $prev=$s[$k]
            }
            return ,$out
          }

          [byte[]]$base = Derive $src
          for ($k=0; $k -lt 32; $k++) {
            if ($base[$k] -ne $ref[$k]) { throw "reference relation mismatch" }
          }

          $total=0
          for ($i=0; $i -lt 32; $i++) {
            [byte[]]$p = New-Object byte[] 32
            [Array]::Copy($src,$p,32)
            if ($p[$i] -eq 0) { $p[$i]=255 } elseif ($p[$i] -eq 255) { $p[$i]=0 } else { throw "unexpected source state" }
            [byte[]]$r = Derive $p
            $changed = @()
            for ($j=0; $j -lt 32; $j++) {
              if ($r[$j] -ne $ref[$j]) { $changed += $j }
            }
            $e1=$i
            $e2=($i+1)%32
            $expected=@($e1,$e2) | Sort-Object -Unique
            if ($changed.Count -ne 2) { throw "position $i changed $($changed.Count) relations" }
            for ($j=0; $j -lt 2; $j++) {
              if ($changed[$j] -ne $expected[$j]) { throw "position $i locality mismatch" }
            }
            $total += $changed.Count
          }
          if ($total -ne 64) { throw "total changed relations = $total" }
          "LAB7_WINDOWS=PASS"
