name: lab16-monotonic-counter

on:
  push:
    branches: [os]
    paths:
      - 'lab16/CounterWitness.cs'
      - '.github/workflows/lab16.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monotonic-counter:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Execute counter witness
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ($env:RUNNER_NAME -ne 'AMD-5800H-REAL') { throw "wrong runner: $env:RUNNER_NAME" }
          Add-Type -TypeDefinition (Get-Content 'lab16/CounterWitness.cs' -Raw) -Language CSharp
          $result=[Lab16Witness]::Run([Environment]::ProcessorCount,250000)
          if ($result -notlike 'LAB16_COUNTER=PASS*') { throw $result }
          @('LAB16',"github-run-id = $env:GITHUB_RUN_ID","runner-name = $env:RUNNER_NAME",$result,'result = PASS') |
            Set-Content 'lab16-evidence.txt' -Encoding utf8
          Get-Content 'lab16-evidence.txt'
      - name: Accessibility boundary
        shell: pwsh
        run: |
          $lines=Get-Content 'lab16/monotonic-counter.labproof'
          if ($lines -notcontains 'human-facing = false') { throw 'human-facing boundary missing' }
          if (-not ($lines | Where-Object { $_ -like 'accessibility-gate = *' })) { throw 'accessibility gate missing' }
          'LAB16_ACCESSIBILITY_BOUNDARY=PASS'
      - name: Hash evidence
        shell: pwsh
        run: |
          Get-FileHash -Algorithm SHA256 'lab16/CounterWitness.cs','lab16/monotonic-counter.labproof','lab16-evidence.txt' |
            ForEach-Object { "$($_.Path) SHA256=$($_.Hash.ToLowerInvariant())" }
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: lab16-amd5800h-real-evidence
          path: lab16-evidence.txt
          if-no-files-found: error
