name: system-native-control-v1

on:
  push:
    branches: [os]
    paths:
      - 'system/native-control-v1/NativeControlApp.cs'
      - '.github/workflows/system-native-control-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  amd-real-control:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Assert executive control foundations human authority and live NVDA
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach ($p in @(
            'lab21/native-relation-core.labproof',
            'system/native-goal-v1/native-goal-v1.labproof',
            'system/native-goal-execution-v1/native-goal-execution-v1.labproof',
            'system/native-input-v1/native-input-v1.labproof',
            'system/native-output-v1/native-output-v1.labproof'
          )) {
            $lines=Get-Content $p
            if ($lines -notcontains 'proof = PASS' -or $lines -notcontains 'system-foundation = true') {
              throw "required native foundation not proven: $p"
            }
          }
          $contract=Get-Content 'system/native-control-v1/native-control-v1.labproof'
          if ($contract -notcontains 'autonomous-execution = false') { throw 'autonomous execution must be disabled' }
          if ($contract -notcontains 'human-authorization = required') { throw 'human authorization gate missing' }
          if ($contract -notcontains 'boolean-control-semantics = none') { throw 'boolean control semantics forbidden' }
          if ($env:RUNNER_NAME -ne 'AMD-5800H-REAL') { throw "wrong runner: $env:RUNNER_NAME" }
          if (Get-Process -Name LogonUI -ErrorAction SilentlyContinue) { throw 'secure or locked screen detected' }
          $nvda=Get-Process -Name nvda -ErrorAction Stop | Select-Object -First 1
          "NATIVE_CONTROL_PRECONDITIONS=PASS;NVDA_PID=$($nvda.Id)"

      - name: Acquire official stable NVDA controller client
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force 'control-runtime' | Out-Null
          $url='https://download.nvaccess.org/releases/stable/nvda_2026.2_controllerClient.zip'
          $zip=Join-Path $PWD 'control-runtime/nvda_2026.2_controllerClient.zip'
          $extract=Join-Path $PWD 'control-runtime/controller'
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          $dll=Get-ChildItem $extract -Recurse -File -Filter 'nvdaControllerClient.dll' |
            Where-Object { $_.FullName -match '[\\/]x64[\\/]' } |
            Select-Object -First 1
          if (-not $dll) { throw 'x64 nvdaControllerClient.dll not found' }
          Copy-Item $dll.FullName 'control-runtime/nvdaControllerClient.dll' -Force
          @(
            'controller-version = 2026.2'
            'controller-architecture = x64'
            "controller-zip-sha256 = $((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant())"
            "controller-dll-sha256 = $((Get-FileHash 'control-runtime/nvdaControllerClient.dll' -Algorithm SHA256).Hash.ToLowerInvariant())"
          ) | Set-Content 'control-runtime/controller-evidence.txt' -Encoding utf8

      - name: Build native executive control witness and structural fixtures
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $source=Join-Path $PWD 'system/native-control-v1/NativeControlApp.cs'
          $out=Join-Path $PWD 'control-runtime/native-control-v1.exe'
          $buildScript=Join-Path $PWD 'control-runtime/build.ps1'
          @'
          param([string]$Source,[string]$Output)
          $ErrorActionPreference='Stop'
          Add-Type -TypeDefinition (Get-Content $Source -Raw) -Language CSharp -ReferencedAssemblies @('System.Windows.Forms.dll','System.Drawing.dll') -OutputAssembly $Output -OutputType WindowsApplication
          '@ | Set-Content $buildScript -Encoding utf8
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $buildScript -Source $source -Output $out
          if ($LASTEXITCODE -ne 0) { throw "Windows PowerShell build failed: $LASTEXITCODE" }
          if (-not (Test-Path $out)) { throw 'native control executable missing' }

          Add-Type -TypeDefinition (Get-Content 'system/native-goal-execution-v1/NativeGoalExecutionWitness.cs' -Raw) -Language CSharp
          [NativeGoalExecutionV1]::WriteFixture('lab21/relation-compose0','identity','control-runtime/identity.qstate')
          [NativeGoalExecutionV1]::WriteFixture('lab21/relation-compose0','exchange','control-runtime/exchange.qstate')
          'NATIVE_CONTROL_BUILD_AND_FIXTURES=PASS'

      - name: Prove four accessible executive-control scenarios
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class NativeControlWin32 {
              [DllImport("user32.dll")]
              [return: MarshalAs(UnmanagedType.Bool)]
              public static extern bool SetForegroundWindow(IntPtr hWnd);
          }
          '@

          $exe=Join-Path $PWD 'control-runtime/native-control-v1.exe'
          $table=Join-Path $PWD 'lab21/relation-compose0'

          function Wait-Window([System.Diagnostics.Process]$p) {
            $root=[System.Windows.Automation.AutomationElement]::RootElement
            $cond=[System.Windows.Automation.PropertyCondition]::new(
              [System.Windows.Automation.AutomationElement]::ProcessIdProperty,[int]$p.Id
            )
            for($i=0;$i -lt 100;$i++) {
              Start-Sleep -Milliseconds 100
              $w=$root.FindFirst([System.Windows.Automation.TreeScope]::Children,$cond)
              if ($w) { return $w }
            }
            throw "UIA window not found for PID $($p.Id)"
          }

          function Run-AssistiveTrial(
            [string]$name,[string]$current,[string]$goal,[string]$buttonName,
            [string]$decision,[string]$currentRole,[string]$goalRole,
            [string]$targetRole,[string]$actionRole,[string]$actualRole
          ) {
            $result=Join-Path $PWD "control-runtime/$name-result.qstate"
            $trace=Join-Path $PWD "control-runtime/$name-trace.txt"
            Remove-Item $result,$trace -Force -ErrorAction SilentlyContinue
            $p=Start-Process -FilePath $exe -ArgumentList @($table,$current,$goal,$result,$trace) -PassThru
            try {
              $window=Wait-Window $p
              $buttonCond=[System.Windows.Automation.PropertyCondition]::new(
                [System.Windows.Automation.AutomationElement]::NameProperty,$buttonName
              )
              $button=$window.FindFirst([System.Windows.Automation.TreeScope]::Descendants,$buttonCond)
              if (-not $button) { throw "$name button not found" }
              $invoke=[System.Windows.Automation.InvokePattern]$button.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern)
              $invoke.Invoke()
              if (-not $p.WaitForExit(10000)) { throw "$name did not exit" }
            } finally {
              if (-not $p.HasExited) { $p.Kill(); $p.WaitForExit() }
            }
            $lines=Get-Content $trace
            $event=$lines | Where-Object { $_ -like 'external-carrier=*' } | Select-Object -First 1
            foreach($required in @(
              'external-carrier=assistive-invoke',
              "decision-kind=$decision",
              "current-role=$currentRole",
              "goal-role=$goalRole",
              "selected-target-role=$targetRole",
              "derived-action-role=$actionRole",
              "actual-role=$actualRole",
              "visible-text=Native control $decision, result $actualRole",
              "accessible-name=Native control $decision, result $actualRole",
              "speech-message=Native control $decision, result $actualRole",
              "braille-message=Native control $decision, result $actualRole",
              'nvda-running=0','nvda-speech=0','nvda-braille=0'
            )) {
              if ($event -notlike "*$required*") { throw "$name missing $required :: $event" }
            }
            if ($lines -notcontains 'decisions=1') { throw "$name decision count mismatch" }
            "NATIVE_CONTROL_$($name.ToUpperInvariant())=PASS"
          }

          function Run-KeyboardTrial(
            [string]$name,[string]$current,[string]$goal,[string]$buttonName,
            [string]$decision,[string]$currentRole,[string]$goalRole,
            [string]$targetRole,[string]$actionRole,[string]$actualRole
          ) {
            $result=Join-Path $PWD "control-runtime/$name-result.qstate"
            $trace=Join-Path $PWD "control-runtime/$name-trace.txt"
            Remove-Item $result,$trace -Force -ErrorAction SilentlyContinue
            $p=Start-Process -FilePath $exe -ArgumentList @($table,$current,$goal,$result,$trace) -PassThru
            try {
              $window=Wait-Window $p
              $buttonCond=[System.Windows.Automation.PropertyCondition]::new(
                [System.Windows.Automation.AutomationElement]::NameProperty,$buttonName
              )
              $button=$window.FindFirst([System.Windows.Automation.TreeScope]::Descendants,$buttonCond)
              if (-not $button) { throw "$name button not found" }
              if (-not $button.Current.IsKeyboardFocusable) { throw "$name button not keyboard focusable" }

              [void][NativeControlWin32]::SetForegroundWindow([IntPtr]::new($window.Current.NativeWindowHandle))
              $button.SetFocus()
              Start-Sleep -Milliseconds 250
              if (-not $button.Current.HasKeyboardFocus) { throw "$name keyboard focus failed" }

              $ws=New-Object -ComObject WScript.Shell
              [void]$ws.AppActivate([int]$p.Id)
              Start-Sleep -Milliseconds 200
              $ws.SendKeys('{ENTER}')

              if (-not $p.WaitForExit(10000)) { throw "$name did not exit" }
            } finally {
              if (-not $p.HasExited) { $p.Kill(); $p.WaitForExit() }
            }
            $lines=Get-Content $trace
            $event=$lines | Where-Object { $_ -like 'external-carrier=*' } | Select-Object -First 1
            foreach($required in @(
              'external-carrier=keyboard-enter',
              "decision-kind=$decision",
              "current-role=$currentRole",
              "goal-role=$goalRole",
              "selected-target-role=$targetRole",
              "derived-action-role=$actionRole",
              "actual-role=$actualRole",
              "visible-text=Native control $decision, result $actualRole",
              "accessible-name=Native control $decision, result $actualRole",
              "speech-message=Native control $decision, result $actualRole",
              "braille-message=Native control $decision, result $actualRole",
              'nvda-running=0','nvda-speech=0','nvda-braille=0'
            )) {
              if ($event -notlike "*$required*") { throw "$name missing $required :: $event" }
            }
            if ($lines -notcontains 'decisions=1') { throw "$name decision count mismatch" }
            "NATIVE_CONTROL_$($name.ToUpperInvariant())=PASS"
          }

          $I=Join-Path $PWD 'control-runtime/identity.qstate'
          $E=Join-Path $PWD 'control-runtime/exchange.qstate'

          Run-AssistiveTrial 'assistive-apply' $I $E 'Apply selected native goal' 'apply-goal' 'identity' 'exchange' 'exchange' 'exchange' 'exchange'
          Run-KeyboardTrial 'keyboard-apply' $E $I 'Apply selected native goal' 'apply-goal' 'exchange' 'identity' 'identity' 'exchange' 'identity'
          Run-AssistiveTrial 'assistive-keep' $E $I 'Keep current native state' 'keep-current' 'exchange' 'identity' 'exchange' 'identity' 'exchange'
          Run-KeyboardTrial 'keyboard-keep' $I $E 'Keep current native state' 'keep-current' 'identity' 'exchange' 'identity' 'identity' 'identity'

      - name: Verify structural authorization and veto outcomes
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $I=[IO.File]::ReadAllBytes((Join-Path $PWD 'control-runtime/identity.qstate'))[0]
          $E=[IO.File]::ReadAllBytes((Join-Path $PWD 'control-runtime/exchange.qstate'))[0]

          $aa=[IO.File]::ReadAllBytes((Join-Path $PWD 'control-runtime/assistive-apply-result.qstate'))[0]
          $ka=[IO.File]::ReadAllBytes((Join-Path $PWD 'control-runtime/keyboard-apply-result.qstate'))[0]
          $ak=[IO.File]::ReadAllBytes((Join-Path $PWD 'control-runtime/assistive-keep-result.qstate'))[0]
          $kk=[IO.File]::ReadAllBytes((Join-Path $PWD 'control-runtime/keyboard-keep-result.qstate'))[0]

          if ($aa -ne $E) { throw 'assistive authorization failed to reach exchange goal' }
          if ($ka -ne $I) { throw 'keyboard authorization failed to reach identity goal' }
          if ($ak -ne $E) { throw 'assistive veto failed to preserve exchange current state' }
          if ($kk -ne $I) { throw 'keyboard veto failed to preserve identity current state' }

          @(
            'NATIVE-CONTROL-V1'
            "github-run-id = $env:GITHUB_RUN_ID"
            "runner-name = $env:RUNNER_NAME"
            'assistive-apply-goal = PASS'
            'keyboard-apply-goal = PASS'
            'assistive-keep-current = PASS'
            'keyboard-keep-current = PASS'
            'human-authorization = PASS'
            'human-veto = PASS'
            'keep-current-derived-action = structural-identity'
            'apply-goal-derived-action = structural-current-to-goal'
            'visible-uia-speech-braille-confirmation = PASS'
            'autonomous-execution = false'
            'boolean-control-semantics = none'
            'pointer-required = false'
            'vision-required = false'
            'result = PASS'
          ) | Set-Content 'control-runtime/evidence.txt' -Encoding utf8
          Get-Content 'control-runtime/evidence.txt'

      - name: Enforce accessible executive-control contract
        shell: pwsh
        run: |
          $lines=Get-Content 'system/native-control-v1/native-control-v1.labproof'
          if ($lines -notcontains 'human-facing = true') { throw 'human-facing control contract missing' }
          if ($lines -notcontains 'autonomous-execution = false') { throw 'autonomous execution prohibition missing' }
          if ($lines -notcontains 'human-authorization = required') { throw 'human authorization gate missing' }
          if ($lines -notcontains 'boolean-control-semantics = none') { throw 'boolean control semantics prohibition missing' }
          if ($lines -notcontains 'pointer-required = false') { throw 'pointer independence missing' }
          if ($lines -notcontains 'vision-required = false') { throw 'vision independence missing' }
          'NATIVE_CONTROL_ACCESSIBILITY_CONTRACT=PASS'

      - name: Hash executive-control evidence
        shell: pwsh
        run: |
          Get-FileHash -Algorithm SHA256 'system/native-control-v1/NativeControlApp.cs','control-runtime/identity.qstate','control-runtime/exchange.qstate','control-runtime/assistive-apply-result.qstate','control-runtime/keyboard-apply-result.qstate','control-runtime/assistive-keep-result.qstate','control-runtime/keyboard-keep-result.qstate','control-runtime/assistive-apply-trace.txt','control-runtime/keyboard-apply-trace.txt','control-runtime/assistive-keep-trace.txt','control-runtime/keyboard-keep-trace.txt','control-runtime/controller-evidence.txt','control-runtime/evidence.txt' |
            ForEach-Object { "$($_.Path) SHA256=$($_.Hash.ToLowerInvariant())" }

      - name: Upload executive-control evidence
        uses: actions/upload-artifact@v4
        with:
          name: system-native-control-v1-amd5800h
          path: |
            control-runtime/identity.qstate
            control-runtime/exchange.qstate
            control-runtime/*-result.qstate
            control-runtime/*-trace.txt
            control-runtime/controller-evidence.txt
            control-runtime/evidence.txt
          if-no-files-found: error

  linux-independent-replay:
    needs: amd-real-control
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: system-native-control-v1-amd5800h
          path: control-artifact

      - name: Independently replay executive-control semantics
        shell: python
        run: |
          from pathlib import Path

          table=Path('lab21/relation-compose0').read_bytes()
          states=list(dict.fromkeys(table))
          assert len(table)==4 and len(states)==2
          def idx(x): return states.index(x)
          def compose(a,b): return table[idx(a)*2+idx(b)]

          identities=[e for e in states if all(compose(e,x)==x and compose(x,e)==x for x in states)]
          assert len(identities)==1
          identity=identities[0]
          exchange=states[1] if states[0]==identity else states[0]

          root=Path('control-artifact')
          assert (root/'identity.qstate').read_bytes()==bytes([identity])
          assert (root/'exchange.qstate').read_bytes()==bytes([exchange])

          scenarios={
              'assistive-apply':('assistive-invoke','apply-goal',identity,exchange,exchange,exchange,exchange),
              'keyboard-apply':('keyboard-enter','apply-goal',exchange,identity,identity,exchange,identity),
              'assistive-keep':('assistive-invoke','keep-current',exchange,identity,exchange,identity,exchange),
              'keyboard-keep':('keyboard-enter','keep-current',identity,exchange,identity,identity,identity),
          }

          for name,(carrier,decision,current,goal,target,action,actual) in scenarios.items():
              result=(root/f'{name}-result.qstate').read_bytes()
              assert result==bytes([actual])
              assert compose(current,action)==actual==target
              lines=(root/f'{name}-trace.txt').read_text().splitlines()
              event=next(line for line in lines if line.startswith('external-carrier='))
              fields=dict(part.split('=',1) for part in event.split(';'))
              role=lambda x:'identity' if x==identity else 'exchange'
              assert fields['external-carrier']==carrier
              assert fields['decision-kind']==decision
              assert fields['current-role']==role(current)
              assert fields['goal-role']==role(goal)
              assert fields['selected-target-role']==role(target)
              assert fields['derived-action-role']==role(action)
              assert fields['actual-role']==role(actual)
              expected=f'Native control {decision}, result {role(actual)}'
              assert fields['visible-text']==expected
              assert fields['accessible-name']==expected
              assert fields['speech-message']==expected
              assert fields['braille-message']==expected
              assert fields['nvda-running']=='0'
              assert fields['nvda-speech']=='0'
              assert fields['nvda-braille']=='0'
              assert 'decisions=1' in lines

          evidence=(root/'evidence.txt').read_text().splitlines()
          required={
              'assistive-apply-goal = PASS',
              'keyboard-apply-goal = PASS',
              'assistive-keep-current = PASS',
              'keyboard-keep-current = PASS',
              'human-authorization = PASS',
              'human-veto = PASS',
              'keep-current-derived-action = structural-identity',
              'autonomous-execution = false',
              'boolean-control-semantics = none',
              'result = PASS',
          }
          assert required.issubset(set(evidence))
          print('NATIVE_CONTROL_V1_LINUX_REPLAY=PASS;HUMAN_AUTHORIZATION=PASS;HUMAN_VETO=PASS;STRUCTURAL_GATE=PASS')
