name: system-native-attention-v1

on:
  push:
    branches: [os]
    paths:
      - 'system/native-attention-v1/NativeAttentionWitness.cs'
      - '.github/workflows/system-native-attention-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  amd-real-attention:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Assert attention foundations and AMD carrier
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach ($p in @(
            'lab21/native-relation-core.labproof',
            'system/native-perception-v1/native-perception-v1.labproof',
            'system/native-memory-v1/native-memory-v1.labproof'
          )) {
            $lines=Get-Content $p
            if ($lines -notcontains 'proof = PASS' -or $lines -notcontains 'system-foundation = true') {
              throw "required native foundation not proven: $p"
            }
          }
          $lab22=Get-Content 'lab22/affinity-topology.labproof'
          if ($lab22 -notcontains 'proof = PASS') {
            throw 'external AMD topology witness is not proven'
          }
          if ($env:RUNNER_NAME -ne 'AMD-5800H-REAL') { throw "wrong runner: $env:RUNNER_NAME" }
          $cpu=Get-CimInstance Win32_Processor | Select-Object -First 1
          if ($cpu.Name -notmatch '5800H') { throw "wrong CPU: $($cpu.Name)" }
          if ([Environment]::ProcessorCount -ne 16) { throw 'expected 16 logical processors' }
          'NATIVE_ATTENTION_FOUNDATIONS_AND_RUNNER=PASS'

      - name: Capture fresh AMD percept stream
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force 'attention-runtime' | Out-Null
          Add-Type -TypeDefinition (Get-Content 'lab22/AffinityTopologyWitness.cs' -Raw) -Language CSharp
          Add-Type -TypeDefinition (Get-Content 'system/native-perception-v1/NativePerceptionWitness.cs' -Raw) -Language CSharp

          $topology=[Lab22Witness]::Run(16)
          if ($topology -notlike 'LAB22_AFFINITY_TOPOLOGY=PASS*') { throw $topology }

          $perception=[NativePerceptionV1]::Normalize(
            $topology,
            'lab21/relation-compose0',
            'attention-runtime/raw-stimulus.txt',
            'attention-runtime/percepts.txt'
          )
          if ($perception -notlike 'NATIVE_PERCEPTION_V1=PASS*') { throw $perception }
          if ($perception -notlike '*SAMPLES=16*') { throw $perception }
          if ($perception -notlike '*IDENTITY_PERCEPTS=9*') { throw $perception }
          if ($perception -notlike '*EXCHANGE_PERCEPTS=7*') { throw $perception }
          $perception

      - name: Apply native structural attention rule
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -TypeDefinition (Get-Content 'system/native-attention-v1/NativeAttentionWitness.cs' -Raw) -Language CSharp

          $result=[NativeAttentionV1]::Focus(
            'lab21/relation-compose0',
            'attention-runtime/percepts.txt',
            'attention-runtime/attention.qattn',
            'attention-runtime/attention-witness.txt'
          )
          if ($result -notlike 'NATIVE_ATTENTION_V1=PASS*') { throw $result }
          if ($result -notlike '*SAMPLES=16*') { throw $result }
          if ($result -notlike '*FOCUSED=7*') { throw $result }
          if ($result -notlike '*IGNORED=9*') { throw $result }

          if ((Get-Item 'attention-runtime/attention.qattn').Length -ne 7) {
            throw 'native attention stream length mismatch'
          }

          @(
            'NATIVE-ATTENTION-V1'
            "github-run-id = $env:GITHUB_RUN_ID"
            "runner-name = $env:RUNNER_NAME"
            $result
            'attention-rule = structural-non-identity-only'
            'external-score = none'
            'result = PASS'
          ) | Set-Content 'attention-runtime/evidence.txt' -Encoding utf8
          Get-Content 'attention-runtime/evidence.txt'

      - name: Enforce accessibility boundary
        shell: pwsh
        run: |
          $lines=Get-Content 'system/native-attention-v1/native-attention-v1.labproof'
          if ($lines -notcontains 'human-facing = false') { throw 'human-facing attention boundary missing' }
          if ($lines -notcontains 'accessibility-behavior = not-applicable') { throw 'accessibility behavior boundary missing' }
          if (-not ($lines | Where-Object { $_ -like 'accessibility-gate = *' })) { throw 'accessibility gate missing' }
          if ($lines -notcontains 'attention-score = none') { throw 'external scoring prohibition missing' }
          if ($lines -notcontains 'external-priority = none') { throw 'external priority prohibition missing' }
          'NATIVE_ATTENTION_ACCESSIBILITY_BOUNDARY=PASS'

      - name: Hash attention evidence
        shell: pwsh
        run: |
          Get-FileHash -Algorithm SHA256 'system/native-attention-v1/NativeAttentionWitness.cs','attention-runtime/raw-stimulus.txt','attention-runtime/percepts.txt','attention-runtime/attention.qattn','attention-runtime/attention-witness.txt','attention-runtime/evidence.txt' |
            ForEach-Object { "$($_.Path) SHA256=$($_.Hash.ToLowerInvariant())" }

      - name: Upload AMD attention evidence
        uses: actions/upload-artifact@v4
        with:
          name: system-native-attention-v1-amd5800h
          path: attention-runtime
          if-no-files-found: error

  linux-independent-replay:
    needs: amd-real-attention
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: system-native-attention-v1-amd5800h
          path: attention-artifact

      - name: Independently replay structural attention
        shell: python
        run: |
          from pathlib import Path

          table=Path('lab21/relation-compose0').read_bytes()
          states=list(dict.fromkeys(table))
          assert len(table)==4 and len(states)==2

          def idx(x): return states.index(x)
          def compose(a,b): return table[idx(a)*2+idx(b)]

          identities=[e for e in states if all(compose(e,x)==x and compose(x,e)==x for x in states)]
          assert len(identities)==1
          identity=identities[0]

          root=Path('attention-artifact')
          raw=(root/'raw-stimulus.txt').read_text().strip()
          assert raw.startswith('LAB22_AFFINITY_TOPOLOGY=PASS;')
          items=raw.split(';MAP=',1)[1].split('|')
          assert len(items)==16

          cores=[]
          for i,item in enumerate(items):
              target,rest=item.split(':',1)
              assert int(target)==i
              fields=dict(part.split('=',1) for part in rest.split(','))
              cores.append(int(fields['core']))

          expected_percepts=[]
          other=states[1] if states[0]==identity else states[0]
          for i,core in enumerate(cores):
              expected_percepts.append(identity if i==0 or core==cores[i-1] else other)

          lines=(root/'percepts.txt').read_text().splitlines()
          observed=[]
          for i in range(16):
              fields=dict(part.split('=',1) for part in lines[4+i].split(';'))
              assert int(fields['sample'])==i
              observed.append(int(fields['relation']))
          assert observed==expected_percepts

          expected_attention=bytes(p for p in observed if p!=identity)
          attention=(root/'attention.qattn').read_bytes()
          assert attention==expected_attention
          assert len(attention)==7
          assert len(observed)-len(attention)==9
          assert all(p!=identity for p in attention)

          witness=(root/'attention-witness.txt').read_text().splitlines()
          assert witness[0]=='NATIVE-ATTENTION-V1'
          selected=[line for line in witness if ';focus=selected' in line]
          ignored=[line for line in witness if ';focus=not-selected' in line]
          assert len(selected)==7
          assert len(ignored)==9

          evidence=(root/'evidence.txt').read_text().splitlines()
          assert 'attention-rule = structural-non-identity-only' in evidence
          assert 'external-score = none' in evidence
          assert 'result = PASS' in evidence

          print('NATIVE_ATTENTION_V1_LINUX_REPLAY=PASS;STRUCTURAL_NOVELTY_SELECTED=7;IDENTITY_IGNORED=9')
