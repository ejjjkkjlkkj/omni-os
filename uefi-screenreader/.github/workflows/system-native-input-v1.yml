name: system-native-input-v1

on:
  push:
    branches: [os]
    paths:
      - 'system/native-input-v1/NativeInputApp.cs'
      - '.github/workflows/system-native-input-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  amd-real-input:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Assert native input foundations and AMD carrier
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach ($p in @(
            'lab21/native-relation-core.labproof',
            'lab24/native-transition-core.labproof',
            'system/native-accessibility-v1/native-accessibility-v1.labproof'
          )) {
            $lines=Get-Content $p
            if ($lines -notcontains 'proof = PASS' -or $lines -notcontains 'system-foundation = true') {
              throw "required native foundation not proven: $p"
            }
          }
          if ($env:RUNNER_NAME -ne 'AMD-5800H-REAL') { throw "wrong runner: $env:RUNNER_NAME" }
          if (Get-Process -Name LogonUI -ErrorAction SilentlyContinue) { throw 'secure or locked screen detected' }
          'NATIVE_INPUT_FOUNDATIONS_AND_RUNNER=PASS'

      - name: Build native input witness
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force 'input-runtime' | Out-Null
          $source=Join-Path $PWD 'system/native-input-v1/NativeInputApp.cs'
          $out=Join-Path $PWD 'input-runtime/native-input-v1.exe'
          $buildScript=Join-Path $PWD 'input-runtime/build.ps1'
          @'
          param([string]$Source,[string]$Output)
          $ErrorActionPreference='Stop'
          Add-Type -TypeDefinition (Get-Content $Source -Raw) -Language CSharp -ReferencedAssemblies @('System.Windows.Forms.dll','System.Drawing.dll') -OutputAssembly $Output -OutputType WindowsApplication
          '@ | Set-Content $buildScript -Encoding utf8
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $buildScript -Source $source -Output $out
          if ($LASTEXITCODE -ne 0) { throw "Windows PowerShell build failed: $LASTEXITCODE" }
          if (-not (Test-Path $out)) { throw 'native input executable missing' }
          'NATIVE_INPUT_BUILD=PASS'

      - name: Prove assistive invocation normalization
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes

          $exe=Join-Path $PWD 'input-runtime/native-input-v1.exe'
          $table=Join-Path $PWD 'lab21/relation-compose0'
          $trace=Join-Path $PWD 'input-runtime/assistive-trace.txt'
          $p=Start-Process -FilePath $exe -ArgumentList @($table,$trace) -PassThru

          try {
            $root=[System.Windows.Automation.AutomationElement]::RootElement
            $procCond=[System.Windows.Automation.PropertyCondition]::new(
              [System.Windows.Automation.AutomationElement]::ProcessIdProperty,[int]$p.Id
            )
            $window=$null
            for($i=0;$i -lt 100 -and -not $window;$i++) {
              Start-Sleep -Milliseconds 100
              $window=$root.FindFirst([System.Windows.Automation.TreeScope]::Children,$procCond)
            }
            if (-not $window) { throw 'assistive trial UIA window not found' }

            $buttonCond=[System.Windows.Automation.PropertyCondition]::new(
              [System.Windows.Automation.AutomationElement]::NameProperty,'Activate native action'
            )
            $button=$window.FindFirst([System.Windows.Automation.TreeScope]::Descendants,$buttonCond)
            if (-not $button) { throw 'assistive trial button not found' }
            $invoke=[System.Windows.Automation.InvokePattern]$button.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern)
            $invoke.Invoke()

            if (-not $p.WaitForExit(10000)) { throw 'assistive trial did not exit' }
          }
          finally {
            if (-not $p.HasExited) { $p.Kill(); $p.WaitForExit() }
          }

          $lines=Get-Content $trace
          if (-not ($lines | Where-Object { $_ -eq 'external-carrier=assistive-invoke;observed-role=exchange;normalized-action-role=exchange;actual-role=identity' })) {
            Get-Content $trace
            throw 'assistive carrier did not normalize to expected native action'
          }
          if ($lines -notcontains 'final-role=identity') { throw 'assistive trial native goal missing' }
          if ($lines -notcontains 'accepted-inputs=1') { throw 'assistive trial input count mismatch' }
          'NATIVE_INPUT_ASSISTIVE_NORMALIZATION=PASS'

      - name: Prove keyboard Enter normalization
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class NativeInputWin32 {
              [DllImport("user32.dll")]
              [return: MarshalAs(UnmanagedType.Bool)]
              public static extern bool SetForegroundWindow(IntPtr hWnd);
          }
          '@

          $exe=Join-Path $PWD 'input-runtime/native-input-v1.exe'
          $table=Join-Path $PWD 'lab21/relation-compose0'
          $trace=Join-Path $PWD 'input-runtime/keyboard-trace.txt'
          $p=Start-Process -FilePath $exe -ArgumentList @($table,$trace) -PassThru

          try {
            $root=[System.Windows.Automation.AutomationElement]::RootElement
            $procCond=[System.Windows.Automation.PropertyCondition]::new(
              [System.Windows.Automation.AutomationElement]::ProcessIdProperty,[int]$p.Id
            )
            $window=$null
            for($i=0;$i -lt 100 -and -not $window;$i++) {
              Start-Sleep -Milliseconds 100
              $window=$root.FindFirst([System.Windows.Automation.TreeScope]::Children,$procCond)
            }
            if (-not $window) { throw 'keyboard trial UIA window not found' }

            $buttonCond=[System.Windows.Automation.PropertyCondition]::new(
              [System.Windows.Automation.AutomationElement]::NameProperty,'Activate native action'
            )
            $button=$window.FindFirst([System.Windows.Automation.TreeScope]::Descendants,$buttonCond)
            if (-not $button) { throw 'keyboard trial button not found' }
            if (-not $button.Current.IsKeyboardFocusable) { throw 'keyboard trial button is not keyboard focusable' }

            [void][NativeInputWin32]::SetForegroundWindow([IntPtr]::new($window.Current.NativeWindowHandle))
            $button.SetFocus()
            Start-Sleep -Milliseconds 250
            if (-not $button.Current.HasKeyboardFocus) { throw 'keyboard trial focus failed' }

            $ws=New-Object -ComObject WScript.Shell
            [void]$ws.AppActivate([int]$p.Id)
            Start-Sleep -Milliseconds 200
            $ws.SendKeys('{ENTER}')

            if (-not $p.WaitForExit(10000)) { throw 'keyboard trial did not exit' }
          }
          finally {
            if (-not $p.HasExited) { $p.Kill(); $p.WaitForExit() }
          }

          $lines=Get-Content $trace
          if (-not ($lines | Where-Object { $_ -eq 'external-carrier=keyboard-enter;observed-role=exchange;normalized-action-role=exchange;actual-role=identity' })) {
            Get-Content $trace
            throw 'keyboard carrier did not normalize to expected native action'
          }
          if ($lines -notcontains 'final-role=identity') { throw 'keyboard trial native goal missing' }
          if ($lines -notcontains 'accepted-inputs=1') { throw 'keyboard trial input count mismatch' }
          'NATIVE_INPUT_KEYBOARD_NORMALIZATION=PASS'

      - name: Compare normalized native semantics
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $assistive=(Get-Content 'input-runtime/assistive-trace.txt' | Where-Object { $_ -like 'external-carrier=*' } | Select-Object -First 1)
          $keyboard=(Get-Content 'input-runtime/keyboard-trace.txt' | Where-Object { $_ -like 'external-carrier=*' } | Select-Object -First 1)
          $aFields=@{}
          foreach($part in $assistive -split ';') { $k,$v=$part -split '=',2; $aFields[$k]=$v }
          $kFields=@{}
          foreach($part in $keyboard -split ';') { $k,$v=$part -split '=',2; $kFields[$k]=$v }

          if ($aFields['observed-role'] -ne $kFields['observed-role']) { throw 'initial native observations differ' }
          if ($aFields['normalized-action-role'] -ne $kFields['normalized-action-role']) { throw 'normalized native actions differ' }
          if ($aFields['actual-role'] -ne $kFields['actual-role']) { throw 'native results differ' }

          @(
            'NATIVE-INPUT-V1'
            "github-run-id = $env:GITHUB_RUN_ID"
            "runner-name = $env:RUNNER_NAME"
            "assistive-carrier = $($aFields['external-carrier'])"
            "keyboard-carrier = $($kFields['external-carrier'])"
            "shared-observed-role = $($aFields['observed-role'])"
            "shared-normalized-action-role = $($aFields['normalized-action-role'])"
            "shared-actual-role = $($aFields['actual-role'])"
            'carrier-semantic-equivalence = PASS'
            'pointer-required = false'
            'vision-required = false'
            'result = PASS'
          ) | Set-Content 'input-runtime/evidence.txt' -Encoding utf8
          Get-Content 'input-runtime/evidence.txt'

      - name: Enforce accessibility-first input contract
        shell: pwsh
        run: |
          $lines=Get-Content 'system/native-input-v1/native-input-v1.labproof'
          if ($lines -notcontains 'human-facing = true') { throw 'human-facing input contract missing' }
          if ($lines -notcontains 'pointer-required = false') { throw 'pointer independence missing' }
          if ($lines -notcontains 'vision-required = false') { throw 'vision independence missing' }
          if ($lines -notcontains 'carrier-specific-semantics-after-normalization = forbidden') { throw 'input normalization boundary missing' }
          'NATIVE_INPUT_ACCESSIBILITY_CONTRACT=PASS'

      - name: Hash input evidence
        shell: pwsh
        run: |
          Get-FileHash -Algorithm SHA256 'system/native-input-v1/NativeInputApp.cs','input-runtime/assistive-trace.txt','input-runtime/keyboard-trace.txt','input-runtime/evidence.txt' |
            ForEach-Object { "$($_.Path) SHA256=$($_.Hash.ToLowerInvariant())" }

      - name: Upload input evidence
        uses: actions/upload-artifact@v4
        with:
          name: system-native-input-v1-amd5800h
          path: |
            input-runtime/assistive-trace.txt
            input-runtime/keyboard-trace.txt
            input-runtime/evidence.txt
          if-no-files-found: error

  linux-independent-replay:
    needs: amd-real-input
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: system-native-input-v1-amd5800h
          path: input-artifact

      - name: Verify carrier-independent native input semantics
        shell: python
        run: |
          from pathlib import Path

          table=Path('lab21/relation-compose0').read_bytes()
          states=list(dict.fromkeys(table))
          assert len(table)==4 and len(states)==2
          def idx(x): return states.index(x)
          def compose(a,b): return table[idx(a)*2+idx(b)]

          identities=[e for e in states if all(compose(e,x)==x and compose(x,e)==x for x in states)]
          assert len(identities)==1
          identity=identities[0]
          exchange=states[1] if states[0]==identity else states[0]
          assert compose(exchange,exchange)==identity

          def event(path):
              lines=Path(path).read_text().splitlines()
              e=next(line for line in lines if line.startswith('external-carrier='))
              return dict(part.split('=',1) for part in e.split(';')),lines

          a,alines=event('input-artifact/assistive-trace.txt')
          k,klines=event('input-artifact/keyboard-trace.txt')

          assert a['external-carrier']=='assistive-invoke'
          assert k['external-carrier']=='keyboard-enter'
          for record in (a,k):
              assert record['observed-role']=='exchange'
              assert record['normalized-action-role']=='exchange'
              assert record['actual-role']=='identity'
          assert a['normalized-action-role']==k['normalized-action-role']
          assert 'final-role=identity' in alines and 'final-role=identity' in klines
          assert 'accepted-inputs=1' in alines and 'accepted-inputs=1' in klines

          evidence=Path('input-artifact/evidence.txt').read_text().splitlines()
          assert 'carrier-semantic-equivalence = PASS' in evidence
          assert 'pointer-required = false' in evidence
          assert 'vision-required = false' in evidence
          assert 'result = PASS' in evidence

          print('NATIVE_INPUT_V1_LINUX_REPLAY=PASS;CARRIER_EQUIVALENCE=PASS;NATIVE_ACTION_EQUIVALENCE=PASS')
