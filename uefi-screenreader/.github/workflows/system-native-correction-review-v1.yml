name: system-native-correction-review-v1

on:
  push:
    branches: [os]
    paths:
      - 'system/native-correction-review-v1/NativeCorrectionReviewApp.cs'
      - 'system/native-correction-review-v1/native-correction-review-v1.labproof'
      - '.github/workflows/system-native-correction-review-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  amd-real-correction-review:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Assert correction-review foundations human authority and live NVDA
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach ($p in @(
            'lab21/native-relation-core.labproof',
            'system/native-episode-v1/native-episode-v1.labproof',
            'system/native-metacognition-v1/native-metacognition-v1.labproof',
            'system/native-correction-plan-v1/native-correction-plan-v1.labproof',
            'system/native-accessibility-v1/native-accessibility-v1.labproof',
            'system/native-output-v1/native-output-v1.labproof'
          )) {
            $lines=Get-Content $p
            if ($lines -notcontains 'proof = PASS' -or $lines -notcontains 'system-foundation = true') {
              throw "required native foundation not proven: $p"
            }
          }
          $contract=Get-Content 'system/native-correction-review-v1/native-correction-review-v1.labproof'
          if ($contract -notcontains 'human-authority = required') { throw 'human authority missing' }
          if ($contract -notcontains 'execution = forbidden') { throw 'execution boundary missing' }
          if ($contract -notcontains 'executed-actions = 0') { throw 'executed action boundary missing' }
          if ($contract -notcontains 'autonomous-correction-execution = false') { throw 'autonomous correction execution must be disabled' }
          if ($contract -notcontains 'boolean-decision-semantics = none') { throw 'boolean decision semantics forbidden' }
          if ($env:RUNNER_NAME -ne 'AMD-5800H-REAL') { throw "wrong runner: $env:RUNNER_NAME" }
          if (Get-Process -Name LogonUI -ErrorAction SilentlyContinue) { throw 'secure or locked screen detected' }
          $nvda=Get-Process -Name nvda -ErrorAction Stop | Select-Object -First 1
          "NATIVE_CORRECTION_REVIEW_PRECONDITIONS=PASS;NVDA_PID=$($nvda.Id)"

      - name: Build isolated correction proposal fixture
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force 'review-runtime' | Out-Null

          $url='https://download.nvaccess.org/releases/stable/nvda_2026.2_controllerClient.zip'
          $zip=Join-Path $PWD 'review-runtime/nvda_2026.2_controllerClient.zip'
          $extract=Join-Path $PWD 'review-runtime/controller'
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          $dll=Get-ChildItem $extract -Recurse -File -Filter 'nvdaControllerClient.dll' |
            Where-Object { $_.FullName -match '[\\/]x64[\\/]' } |
            Select-Object -First 1
          if (-not $dll) { throw 'x64 nvdaControllerClient.dll not found' }
          Copy-Item $dll.FullName 'review-runtime/nvdaControllerClient.dll' -Force

          Add-Type -TypeDefinition (Get-Content 'system/native-goal-execution-v1/NativeGoalExecutionWitness.cs' -Raw) -Language CSharp
          Add-Type -TypeDefinition (Get-Content 'system/native-episode-v1/NativeEpisodeWitness.cs' -Raw) -Language CSharp
          Add-Type -TypeDefinition (Get-Content 'system/native-metacognition-v1/NativeMetacognitionWitness.cs' -Raw) -Language CSharp
          Add-Type -TypeDefinition (Get-Content 'system/native-correction-plan-v1/NativeCorrectionPlanWitness.cs' -Raw) -Language CSharp

          [NativeGoalExecutionV1]::WriteFixture('lab21/relation-compose0','identity','review-runtime/identity.qstate')
          [NativeGoalExecutionV1]::WriteFixture('lab21/relation-compose0','exchange','review-runtime/exchange.qstate')
          Remove-Item 'review-runtime/history.qepisode' -Force -ErrorAction SilentlyContinue
          $I='review-runtime/identity.qstate'
          $E='review-runtime/exchange.qstate'
          [void][NativeEpisodeV1]::Append('lab21/relation-compose0',$I,$E,$E,$E,'review-runtime/history.qepisode','review-runtime/ep1.txt')
          [void][NativeEpisodeV1]::Append('lab21/relation-compose0',$E,$I,$I,$I,'review-runtime/history.qepisode','review-runtime/ep2.txt')
          [void][NativeEpisodeV1]::Append('lab21/relation-compose0',$E,$I,$E,$E,'review-runtime/history.qepisode','review-runtime/ep3.txt')
          [void][NativeEpisodeV1]::Append('lab21/relation-compose0',$I,$E,$I,$I,'review-runtime/history.qepisode','review-runtime/ep4.txt')

          $bytes=[IO.File]::ReadAllBytes((Join-Path $PWD 'review-runtime/history.qepisode'))
          $identity=[IO.File]::ReadAllBytes((Join-Path $PWD $I))[0]
          $exchange=[IO.File]::ReadAllBytes((Join-Path $PWD $E))[0]
          if ($bytes[10] -ne $exchange -or $bytes[11] -ne $exchange) { throw 'review negative fixture episode3 mismatch' }
          $bytes[11]=$identity
          [IO.File]::WriteAllBytes((Join-Path $PWD 'review-runtime/history.qepisode'),$bytes)

          [void][NativeMetacognitionV1]::Inspect(
            'lab21/relation-compose0',
            'review-runtime/history.qepisode',
            'review-runtime/discrepancy.qmeta',
            'review-runtime/meta-witness.txt'
          )
          $r=[NativeCorrectionPlanV1]::Plan(
            'lab21/relation-compose0',
            'review-runtime/history.qepisode',
            'review-runtime/discrepancy.qmeta',
            'review-runtime/plan.qplan',
            'review-runtime/plan-witness.txt'
          )
          if ($r -ne 'NATIVE_CORRECTION_PLAN_V1=PASS;EPISODES=4;CORRECTIONS=1;NOOPS=3;EXECUTED=0') { throw $r }

          @(
            "controller-version = 2026.2"
            "controller-architecture = x64"
            "history-before-sha256 = $((Get-FileHash 'review-runtime/history.qepisode' -Algorithm SHA256).Hash.ToLowerInvariant())"
            "plan-before-sha256 = $((Get-FileHash 'review-runtime/plan.qplan' -Algorithm SHA256).Hash.ToLowerInvariant())"
          ) | Set-Content 'review-runtime/pre-evidence.txt' -Encoding utf8
          'NATIVE_CORRECTION_REVIEW_FIXTURE=PASS'

      - name: Build native correction review surface
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $source=Join-Path $PWD 'system/native-correction-review-v1/NativeCorrectionReviewApp.cs'
          $out=Join-Path $PWD 'review-runtime/native-correction-review-v1.exe'
          $buildScript=Join-Path $PWD 'review-runtime/build.ps1'
          @'
          param([string]$Source,[string]$Output)
          $ErrorActionPreference='Stop'
          Add-Type -TypeDefinition (Get-Content $Source -Raw) -Language CSharp -ReferencedAssemblies @('System.Windows.Forms.dll','System.Drawing.dll') -OutputAssembly $Output -OutputType WindowsApplication
          '@ | Set-Content $buildScript -Encoding utf8
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $buildScript -Source $source -Output $out
          if ($LASTEXITCODE -ne 0) { throw "Windows PowerShell build failed: $LASTEXITCODE" }
          if (-not (Test-Path $out)) { throw 'native correction review executable missing' }
          'NATIVE_CORRECTION_REVIEW_BUILD=PASS'

      - name: Prove assistive approval and keyboard rejection
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class NativeReviewWin32 {
              [DllImport("user32.dll")]
              [return: MarshalAs(UnmanagedType.Bool)]
              public static extern bool SetForegroundWindow(IntPtr hWnd);
          }
          '@

          $exe=Join-Path $PWD 'review-runtime/native-correction-review-v1.exe'
          $table=Join-Path $PWD 'lab21/relation-compose0'
          $history=Join-Path $PWD 'review-runtime/history.qepisode'
          $plan=Join-Path $PWD 'review-runtime/plan.qplan'

          function Wait-Window([System.Diagnostics.Process]$p) {
            $root=[System.Windows.Automation.AutomationElement]::RootElement
            $cond=[System.Windows.Automation.PropertyCondition]::new(
              [System.Windows.Automation.AutomationElement]::ProcessIdProperty,[int]$p.Id
            )
            for($i=0;$i -lt 100;$i++) {
              Start-Sleep -Milliseconds 100
              $w=$root.FindFirst([System.Windows.Automation.TreeScope]::Children,$cond)
              if ($w) { return $w }
            }
            throw "correction review UIA window not found for PID $($p.Id)"
          }

          function Wait-Projection([string]$trace,[string]$prefix) {
            for($i=0;$i -lt 100;$i++) {
              Start-Sleep -Milliseconds 100
              if (Test-Path $trace) {
                $line=Get-Content $trace | Where-Object { $_ -like "$prefix*" } | Select-Object -First 1
                if ($line) { return $line }
              }
            }
            throw "review projection missing: $prefix"
          }

          $approveDecision=Join-Path $PWD 'review-runtime/approve.qdecision'
          $approveTrace=Join-Path $PWD 'review-runtime/approve-trace.txt'
          Remove-Item $approveDecision,$approveTrace -Force -ErrorAction SilentlyContinue
          $p=Start-Process -FilePath $exe -ArgumentList @($table,$history,$plan,$approveDecision,$approveTrace) -PassThru
          try {
            $window=Wait-Window $p
            [void](Wait-Projection $approveTrace 'projection=proposal')
            $cond=[System.Windows.Automation.PropertyCondition]::new(
              [System.Windows.Automation.AutomationElement]::NameProperty,'Approve native correction proposal'
            )
            $button=$window.FindFirst([System.Windows.Automation.TreeScope]::Descendants,$cond)
            if (-not $button) { throw 'approve review button not found' }
            $invoke=[System.Windows.Automation.InvokePattern]$button.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern)
            $invoke.Invoke()
            if (-not $p.WaitForExit(10000)) { throw 'assistive approval review did not exit' }
          } finally {
            if (-not $p.HasExited) { $p.Kill(); $p.WaitForExit() }
          }
          [void](Wait-Projection $approveTrace 'projection=decision')

          $rejectDecision=Join-Path $PWD 'review-runtime/reject.qdecision'
          $rejectTrace=Join-Path $PWD 'review-runtime/reject-trace.txt'
          Remove-Item $rejectDecision,$rejectTrace -Force -ErrorAction SilentlyContinue
          $p=Start-Process -FilePath $exe -ArgumentList @($table,$history,$plan,$rejectDecision,$rejectTrace) -PassThru
          try {
            $window=Wait-Window $p
            [void](Wait-Projection $rejectTrace 'projection=proposal')
            $cond=[System.Windows.Automation.PropertyCondition]::new(
              [System.Windows.Automation.AutomationElement]::NameProperty,'Approve native correction proposal'
            )
            $button=$window.FindFirst([System.Windows.Automation.TreeScope]::Descendants,$cond)
            if (-not $button) { throw 'stable review keyboard focus control not found' }
            [void][NativeReviewWin32]::SetForegroundWindow([IntPtr]::new($window.Current.NativeWindowHandle))
            $button.SetFocus()
            Start-Sleep -Milliseconds 250
            if (-not $button.Current.HasKeyboardFocus) { throw 'review keyboard focus failed' }
            $ws=New-Object -ComObject WScript.Shell
            [void]$ws.AppActivate([int]$p.Id)
            Start-Sleep -Milliseconds 200
            if (-not $button.Current.HasKeyboardFocus) { throw 'review keyboard focus lost' }
            $ws.SendKeys('r')
            if (-not $p.WaitForExit(10000)) { throw 'keyboard rejection review did not exit' }
          } finally {
            if (-not $p.HasExited) { $p.Kill(); $p.WaitForExit() }
          }
          [void](Wait-Projection $rejectTrace 'projection=decision')
          'NATIVE_CORRECTION_REVIEW_HUMAN_SCENARIOS=PASS'

      - name: Verify structural review decisions accessibility and no execution
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $I=[IO.File]::ReadAllBytes((Join-Path $PWD 'review-runtime/identity.qstate'))[0]
          $E=[IO.File]::ReadAllBytes((Join-Path $PWD 'review-runtime/exchange.qstate'))[0]
          $approve=[IO.File]::ReadAllBytes((Join-Path $PWD 'review-runtime/approve.qdecision'))
          $reject=[IO.File]::ReadAllBytes((Join-Path $PWD 'review-runtime/reject.qdecision'))
          if ($approve.Length -ne 1 -or $approve[0] -ne $E) { throw 'approval must structurally select proposed exchange correction' }
          if ($reject.Length -ne 1 -or $reject[0] -ne $I) { throw 'rejection must structurally select native identity action' }

          $proposal='Correction proposal for episode 3: actual identity, expected exchange, planned action exchange. Press A to approve or R to reject.'
          $approveMessage='Correction review approve-proposal: selected action exchange, execution not performed.'
          $rejectMessage='Correction review reject-proposal: selected action identity, execution not performed.'

          $approveLines=Get-Content 'review-runtime/approve-trace.txt'
          $rejectLines=Get-Content 'review-runtime/reject-trace.txt'
          $approveProposal=$approveLines | Where-Object { $_ -like 'projection=proposal*' } | Select-Object -First 1
          $rejectProposal=$rejectLines | Where-Object { $_ -like 'projection=proposal*' } | Select-Object -First 1
          $approveDecision=$approveLines | Where-Object { $_ -like 'projection=decision*' } | Select-Object -First 1
          $rejectDecision=$rejectLines | Where-Object { $_ -like 'projection=decision*' } | Select-Object -First 1

          foreach($event in @($approveProposal,$rejectProposal)) {
            foreach($required in @(
              'episode-index=2','actual-role=identity','expected-role=exchange','planned-action-role=exchange',
              "message=$proposal","visible-text=$proposal","accessible-name=$proposal",
              "speech-message=$proposal","braille-message=$proposal",
              'nvda-running=0','nvda-speech=0','nvda-braille=0','executed=0'
            )) {
              if ($event -notlike "*$required*") { throw "proposal projection missing $required :: $event" }
            }
          }

          foreach($required in @(
            'carrier=assistive-approve','decision-kind=approve-proposal','selected-action-role=exchange',
            "message=$approveMessage","visible-text=$approveMessage","accessible-name=$approveMessage",
            "speech-message=$approveMessage","braille-message=$approveMessage",
            'nvda-running=0','nvda-speech=0','nvda-braille=0','executed=0'
          )) {
            if ($approveDecision -notlike "*$required*") { throw "approval decision missing $required :: $approveDecision" }
          }

          foreach($required in @(
            'carrier=keyboard-r','decision-kind=reject-proposal','selected-action-role=identity',
            "message=$rejectMessage","visible-text=$rejectMessage","accessible-name=$rejectMessage",
            "speech-message=$rejectMessage","braille-message=$rejectMessage",
            'nvda-running=0','nvda-speech=0','nvda-braille=0','executed=0'
          )) {
            if ($rejectDecision -notlike "*$required*") { throw "rejection decision missing $required :: $rejectDecision" }
          }

          $pre=Get-Content 'review-runtime/pre-evidence.txt'
          $historyBefore=($pre | Where-Object { $_ -like 'history-before-sha256 = *' } | ForEach-Object { ($_ -split ' = ',2)[1] })
          $planBefore=($pre | Where-Object { $_ -like 'plan-before-sha256 = *' } | ForEach-Object { ($_ -split ' = ',2)[1] })
          $historyAfter=(Get-FileHash 'review-runtime/history.qepisode' -Algorithm SHA256).Hash.ToLowerInvariant()
          $planAfter=(Get-FileHash 'review-runtime/plan.qplan' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($historyBefore -ne $historyAfter) { throw 'review mutated episodic history' }
          if ($planBefore -ne $planAfter) { throw 'review mutated correction plan' }

          @(
            'NATIVE-CORRECTION-REVIEW-V1'
            "github-run-id = $env:GITHUB_RUN_ID"
            "runner-name = $env:RUNNER_NAME"
            'assistive-approve = PASS'
            'keyboard-reject = PASS'
            'approve-selected-action = exchange'
            'reject-selected-action = identity'
            'visible-uia-speech-braille-equivalence = PASS'
            'boolean-decision-semantics = none'
            'executed-actions = 0'
            'execution = forbidden'
            'autonomous-correction-execution = false'
            'history-mutation = false'
            'plan-mutation = false'
            'pointer-required = false'
            'vision-required = false'
            'result = PASS'
          ) | Set-Content 'review-runtime/evidence.txt' -Encoding utf8
          Get-Content 'review-runtime/evidence.txt'

      - name: Enforce accessible human correction review contract
        shell: pwsh
        run: |
          $lines=Get-Content 'system/native-correction-review-v1/native-correction-review-v1.labproof'
          foreach($required in @(
            'human-facing = true',
            'human-authority = required',
            'execution = forbidden',
            'executed-actions = 0',
            'autonomous-correction-execution = false',
            'boolean-decision-semantics = none',
            'pointer-required = false',
            'vision-required = false'
          )) {
            if ($lines -notcontains $required) { throw "missing review contract: $required" }
          }
          'NATIVE_CORRECTION_REVIEW_ACCESSIBILITY_CONTRACT=PASS'

      - name: Hash correction-review evidence
        shell: pwsh
        run: |
          Get-FileHash -Algorithm SHA256 'system/native-correction-review-v1/NativeCorrectionReviewApp.cs','review-runtime/history.qepisode','review-runtime/discrepancy.qmeta','review-runtime/plan.qplan','review-runtime/approve.qdecision','review-runtime/reject.qdecision','review-runtime/approve-trace.txt','review-runtime/reject-trace.txt','review-runtime/evidence.txt' |
            ForEach-Object { "$($_.Path) SHA256=$($_.Hash.ToLowerInvariant())" }

      - name: Upload correction-review evidence
        uses: actions/upload-artifact@v4
        with:
          name: system-native-correction-review-v1-amd5800h
          path: |
            review-runtime/history.qepisode
            review-runtime/discrepancy.qmeta
            review-runtime/plan.qplan
            review-runtime/approve.qdecision
            review-runtime/reject.qdecision
            review-runtime/approve-trace.txt
            review-runtime/reject-trace.txt
            review-runtime/evidence.txt
          if-no-files-found: error

  linux-independent-replay:
    needs: amd-real-correction-review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: system-native-correction-review-v1-amd5800h
          path: review-artifact

      - name: Independently replay structural human correction review
        shell: python
        run: |
          from pathlib import Path

          table=Path('lab21/relation-compose0').read_bytes()
          states=list(dict.fromkeys(table))
          assert len(table)==4 and len(states)==2
          def idx(x): return states.index(x)
          def compose(a,b): return table[idx(a)*2+idx(b)]
          identities=[e for e in states if all(compose(e,x)==x and compose(x,e)==x for x in states)]
          assert len(identities)==1
          identity=identities[0]
          exchange=states[1] if states[0]==identity else states[0]

          root=Path('review-artifact')
          history=(root/'history.qepisode').read_bytes()
          plan=(root/'plan.qplan').read_bytes()
          approve=(root/'approve.qdecision').read_bytes()
          reject=(root/'reject.qdecision').read_bytes()

          assert len(history)==16
          assert plan==bytes([identity,identity,exchange,identity])
          assert approve==bytes([exchange])
          assert reject==bytes([identity])
          expected=history[10]
          actual=history[11]
          assert expected==exchange and actual==identity
          assert compose(actual,plan[2])==expected
          assert compose(actual,approve[0])==expected
          assert reject[0]==identity

          for name,carrier,kind,selected in (
              ('approve-trace.txt','assistive-approve','approve-proposal','exchange'),
              ('reject-trace.txt','keyboard-r','reject-proposal','identity'),
          ):
              lines=(root/name).read_text().splitlines()
              proposal=next(x for x in lines if x.startswith('projection=proposal'))
              decision=next(x for x in lines if x.startswith('projection=decision'))
              assert ';executed=0' in proposal and ';executed=0' in decision
              fields=dict(part.split('=',1) for part in decision.split(';'))
              assert fields['carrier']==carrier
              assert fields['decision-kind']==kind
              assert fields['selected-action-role']==selected
              assert fields['nvda-running']=='0'
              assert fields['nvda-speech']=='0'
              assert fields['nvda-braille']=='0'

          evidence=(root/'evidence.txt').read_text().splitlines()
          required={
              'assistive-approve = PASS',
              'keyboard-reject = PASS',
              'approve-selected-action = exchange',
              'reject-selected-action = identity',
              'visible-uia-speech-braille-equivalence = PASS',
              'boolean-decision-semantics = none',
              'executed-actions = 0',
              'execution = forbidden',
              'autonomous-correction-execution = false',
              'history-mutation = false',
              'plan-mutation = false',
              'result = PASS',
          }
          assert required.issubset(set(evidence))
          print('NATIVE_CORRECTION_REVIEW_V1_LINUX_REPLAY=PASS;HUMAN_APPROVE=PASS;HUMAN_REJECT=PASS;NO_EXECUTION=PASS')
