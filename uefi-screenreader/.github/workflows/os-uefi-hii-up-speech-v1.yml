name: os-uefi-hii-up-speech-v1

on:
  push:
    branches: [os]
    paths:
      - 'boot/uefi-hii-current-option-speech-v1/build_uefi_hii_current_option_speech.py'
      - 'boot/uefi-hii-current-option-speech-v1/os-uefi-hii-current-option-speech-v1.labproof'
      - 'boot/uefi-hii-iscsi-fixture-v1/os-uefi-hii-iscsi-fixture-v1.labproof'
      - 'boot/uefi-hii-up-speech-v1/os-uefi-hii-up-speech-v1.labproof'
      - '.github/workflows/os-uefi-hii-up-speech-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  q35-native-up-focus-speech:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Enforce foundations
        shell: python
        run: |
          from pathlib import Path
          current=set(Path('boot/uefi-hii-current-option-speech-v1/os-uefi-hii-current-option-speech-v1.labproof').read_text().splitlines())
          for line in [
              'proof = PASS',
              'proof-live-current-option-varstore-identity = PASS',
              'proof-setting-mutation = false',
          ]:
              assert line in current,line
          print('UP_FOCUS_SPEECH_FOUNDATIONS=PASS')
          print('UP_FOCUS_HII_DISCOVERY=DYNAMIC')

      - name: Audit source contract
        shell: python
        run: |
          from pathlib import Path
          import ast,re
          src=Path('boot/uefi-hii-current-option-speech-v1/build_uefi_hii_current_option_speech.py').read_text()
          ast.parse(src)
          labels=re.findall(r"c\.label\('([^']+)'\)",src)
          duplicates=sorted({x for x in labels if labels.count(x)>1})
          assert not duplicates,duplicates
          for token in [
              'WAIT_UP_SPEAK=False',
              'HII_NAVIGATION_KEY=WAIT_UP',
              'NAV_PREV_OPTION_DIRECT_CHILD=PASS',
              'NAV_FOCUS_OPTION_TOKEN_ACTIVATED=PASS',
              'NAV_FOCUS_OPTION_TEXT=',
              'NAV_FOCUS_OPTION_STRING=PASS',
              'NAV_FOCUS_LABEL_BINDING=PASS',
              'NAV_FOCUS_SOURCE=LIVE_DIRECT_SIBLING_HII_LABEL',
              'NAV_FOCUS_SPOKEN_PREFIX=',
              'EVENT=NAV_FOCUS_TEXT_COMMIT',
              'NAV_FOCUS_SPEECH_HDA=PASS',
              "'--wait-up-speak'",
          ]:
              assert token in src,token
          proof=set(Path('boot/uefi-hii-up-speech-v1/os-uefi-hii-up-speech-v1.labproof').read_text().splitlines())
          for line in [
              'keyboard-scan-code = SCAN_UP 0x0001',
              'focus-operation = read-only',
              'route-config-call = forbidden',
              'set-variable-call = forbidden',
              'varstore-write = forbidden',
              'firmware-setting-mutation = forbidden',
              'physical-ASUS-up-focus-speech = not-established',
          ]:
              assert line in proof,line
          print('UP_FOCUS_SPEECH_SOURCE_CONTRACT=PASS')

      - name: Install QEMU and OVMF
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf

      - name: Build deterministic UP-focus speech EFI
        shell: bash
        run: |
          set -euo pipefail
          src=boot/uefi-hii-current-option-speech-v1/build_uefi_hii_current_option_speech.py
          root=boot/uefi-hii-up-speech-v1
          python "$src" "$root/BOOTX64.EFI" --wait-up-speak | tee "$root/build.log"
          python "$src" "$root/BOOTX64-2.EFI" --wait-up-speak > "$root/build2.log"
          cmp "$root/BOOTX64.EFI" "$root/BOOTX64-2.EFI"
          python "$src" "$root/BOOTX64-VERIFY.EFI" > "$root/verify-build.log"
          grep -F 'hii-up-speak=enabled' "$root/build.log"
          grep -F 'hii-up-speak=disabled' "$root/verify-build.log"
          sha256sum "$root/BOOTX64.EFI" "$root/BOOTX64-VERIFY.EFI"

      - name: Audit PE and navigation-speech witnesses
        shell: python
        run: |
          from pathlib import Path
          import struct
          image=Path('boot/uefi-hii-up-speech-v1/BOOTX64.EFI').read_bytes()
          assert image[:2]==b'MZ'
          pe=struct.unpack_from('<I',image,0x3c)[0]
          assert image[pe:pe+4]==b'PE\0\0'
          coff=pe+4
          assert struct.unpack_from('<HH',image,coff)==(0x8664,3)
          opt=coff+20
          assert struct.unpack_from('<H',image,opt)[0]==0x20b
          assert struct.unpack_from('<H',image,opt+0x44)[0]==10
          sec=opt+0xf0; ds=sec+40
          tc=struct.unpack_from('<I',image,sec+0x24)[0]
          dc=struct.unpack_from('<I',image,ds+0x24)[0]
          assert not(tc&0x80000000)
          assert dc&0x80000000 and not(dc&0x20000000)
          for token in [
              b'HII_NAVIGATION_KEY=WAIT_UP\r\n',
              b'NAV_PREV_OPTION_VALUE_RAW8_HEX=',
              b'NAV_PREV_OPTION_DIRECT_CHILD=PASS\r\n',
              b'NAV_PREV_OPTION_WRAP_POLICY=PASS\r\n',
              b'NAV_FOCUS_OPTION_TOKEN_ACTIVATED=PASS\r\n',
              b'NAV_FOCUS_OPTION_TEXT=',
              b'NAV_FOCUS_OPTION_STRING=PASS\r\n',
              b'NAV_FOCUS_LABEL_BINDING=PASS\r\n',
              b'NAV_FOCUS_SOURCE=PASS\r\n',
              b'NAV_FOCUS_SPOKEN_PREFIX=',
              b'NAV_FOCUS_TEXT_COMMIT\r\n',
              b'NAV_FOCUS_SPEECH_HDA=PASS\r\n',
          ]:
              assert token in image,token
          print('UP_FOCUS_SPEECH_STATIC=PASS')
          print('W_X=BLOCKED')

      - name: Resolve OVMF
        shell: bash
        run: |
          set -euo pipefail
          CODE=''; VARS=''
          for pair in \
            '/usr/share/OVMF/OVMF_CODE_4M.fd|/usr/share/OVMF/OVMF_VARS_4M.fd' \
            '/usr/share/OVMF/OVMF_CODE.fd|/usr/share/OVMF/OVMF_VARS.fd' \
            '/usr/share/edk2/ovmf/OVMF_CODE.fd|/usr/share/edk2/ovmf/OVMF_VARS.fd'
          do
            IFS='|' read -r code vars <<< "$pair"
            if [[ -f "$code" && -f "$vars" ]]; then CODE="$code"; VARS="$vars"; break; fi
          done
          test -n "$CODE" -a -n "$VARS"
          printf 'CODE=%s\nVARS=%s\n' "$CODE" "$VARS" > boot/uefi-hii-up-speech-v1/ovmf.env

      - name: UP to live previous HII option and speak it
        shell: bash
        run: |
          set -euo pipefail
          root=boot/uefi-hii-up-speech-v1
          source "$root/ovmf.env"
          cp "$VARS" "$root/vars.fd"
          rm -rf "$root/esp"
          mkdir -p "$root/esp/EFI/BOOT"
          cp "$root/BOOTX64.EFI" "$root/esp/EFI/BOOT/BOOTX64.EFI"
          rm -f "$root/up-speech.serial" "$root/up-speech.wav" "$root/qmp.sock" "$root/runtime.txt"

          qemu-system-x86_64 \
            -machine q35,accel=tcg -m 192M \
            -drive if=pflash,format=raw,readonly=on,file="$CODE" \
            -drive if=pflash,format=raw,file="$root/vars.fd" \
            -drive format=raw,file=fat:rw:"$root/esp" \
            -audiodev wav,id=aud,path="$root/up-speech.wav",out.frequency=48000,out.channels=2 \
            -device ich9-intel-hda,bus=pcie.0,addr=1b.0,id=hda0 \
            -device hda-micro,bus=hda0.0,cad=0,audiodev=aud,mixer=on \
            -display none -monitor none \
            -qmp unix:"$root/qmp.sock",server=on,wait=off \
            -serial file:"$root/up-speech.serial" \
            -parallel none -net none -no-reboot -no-shutdown &
          qpid=$!
          trap 'kill "$qpid" 2>/dev/null || true' EXIT

          python - <<'PY'
          from pathlib import Path
          import json,re,socket,time
          root=Path('boot/uefi-hii-up-speech-v1')
          serial=root/'up-speech.serial'
          qmp=root/'qmp.sock'

          end=time.time()+35
          while time.time()<end:
              raw=serial.read_bytes() if serial.exists() else b''
              if b'STATUS=BLOCKED\r\n' in raw:
                  raise SystemExit('blocked before UP: '+repr(raw[-20000:]))
              if b'HII_NAVIGATION_KEY=WAIT_UP\r\n' in raw:
                  assert b'NAV_FOCUS_SPEECH_HDA=PASS\r\n' not in raw
                  break
              time.sleep(.1)
          else:
              raise SystemExit('timeout waiting UP')

          end=time.time()+10
          while time.time()<end and not qmp.exists():
              time.sleep(.05)
          if not qmp.exists(): raise SystemExit('QMP socket missing')
          with socket.socket(socket.AF_UNIX,socket.SOCK_STREAM) as s:
              s.connect(str(qmp)); f=s.makefile('rwb',buffering=0)
              greeting=json.loads(f.readline()); assert 'QMP' in greeting
              f.write((json.dumps({'execute':'qmp_capabilities'})+'\r\n').encode())
              while True:
                  m=json.loads(f.readline())
                  if 'return' in m: break
              f.write((json.dumps({'execute':'send-key','arguments':{'keys':[{'type':'qcode','data':'up'}],'hold-time':50}})+'\r\n').encode())
              while True:
                  m=json.loads(f.readline())
                  if 'return' in m: break
                  if 'error' in m: raise SystemExit(repr(m))

          required=[
              b'HII_NAVIGATION_KEY=PASS\r\n',
              b'NAV_PREV_OPTION_DIRECT_CHILD=PASS\r\n',
              b'NAV_PREV_OPTION_WRAP_POLICY=PASS\r\n',
              b'NAV_FOCUS_OPTION_TOKEN_ACTIVATED=PASS\r\n',
              b'NAV_FOCUS_OPTION_TEXT=',
              b'NAV_FOCUS_OPTION_STRING=PASS\r\n',
              b'NAV_FOCUS_LABEL_BINDING=PASS\r\n',
              b'NAV_FOCUS_SOURCE=PASS\r\n',
              b'NAV_FOCUS_SPOKEN_PREFIX=PASS\r\n',
              b'NAV_FOCUS_TEXT_COMMIT\r\n',
              b'LPIB_PROGRESS=PASS\r\n',
              b'NAV_FOCUS_SPEECH_HDA=PASS\r\n',
              b'STATUS=PASS\r\n',
          ]
          end=time.time()+35
          while time.time()<end:
              raw=serial.read_bytes() if serial.exists() else b''
              if b'STATUS=BLOCKED\r\n' in raw:
                  raise SystemExit('blocked after UP: '+repr(raw[-20000:]))
              if all(x in raw for x in required):
                  cur=re.search(br'CURRENT_VALUE_RAW8_HEX=([0-9A-F]{16})',raw)
                  sel=re.search(br'SELECTED_OPTION_VALUE_RAW8_HEX=([0-9A-F]{16})',raw)
                  navraw=re.search(br'NAV_PREV_OPTION_VALUE_RAW8_HEX=([0-9A-F]{16})',raw)
                  navtok=re.search(br'NAV_PREV_OPTION_STRING_ID_LE_HEX=([0-9A-F]{4})',raw)
                  label=re.search(br'NAV_FOCUS_OPTION_TEXT=([^\r\n]+)',raw)
                  spoken=re.search(br'NAV_FOCUS_SPOKEN_PREFIX=([a-z0-9]{1,8})\r\nNAV_FOCUS_SPOKEN_PREFIX=PASS\r\n',raw)
                  assert all([cur,sel,navraw,navtok,label,spoken]),raw[-20000:]
                  cur_raw=cur.group(1).decode()
                  sel_raw=sel.group(1).decode()
                  prev_raw=navraw.group(1).decode()
                  question_m=re.search(br'QUESTION_TEXT=([^\r\n]+)',raw)
                  assert question_m,question_m
                  token=int.from_bytes(bytes.fromhex(navtok.group(1).decode()),'little')
                  question=question_m.group(1).decode('ascii','replace').strip()
                  focus_label=label.group(1).decode('ascii','replace').strip()
                  prefix=spoken.group(1).decode()
                  expected_prefix=''.join(
                      ch.lower() for ch in focus_label
                      if ('a' <= ch.lower() <= 'z') or ('0' <= ch <= '9')
                  )[:8]
                  assert cur_raw==sel_raw,(cur_raw,sel_raw)
                  assert prev_raw!=cur_raw,(cur_raw,prev_raw)
                  assert token!=0,token
                  assert question,question
                  assert focus_label,focus_label
                  assert expected_prefix,(focus_label,expected_prefix)
                  assert prefix==expected_prefix,(prefix,expected_prefix,focus_label)
                  root.joinpath('runtime.txt').write_text(
                      f'current-raw8 = {cur_raw}\n'
                      f'question-text = {question}\n'
                      f'focus-raw8 = {prev_raw}\n'
                      f'focus-option-string-id = {token}\n'
                      f'focus-option-label = {focus_label}\n'
                      f'focus-spoken-prefix = {prefix}\n'
                      'up-key-event = PASS\n'
                      'focus-native-hda-speech = PASS\n'
                  )
                  print('UP_FOCUS_DYNAMIC_BINDING=PASS')
                  print('UP_FOCUS_LABEL='+focus_label)
                  print('UP_FOCUS_SPOKEN_PREFIX='+prefix)
                  print('UP_FOCUS_SPEECH_RUNTIME=PASS')
                  break
              time.sleep(.1)
          else:
              raw=serial.read_bytes() if serial.exists() else b''
              raise SystemExit('timeout focus speech: '+repr(raw[-20000:]))
          PY

          sleep 1
          kill "$qpid" 2>/dev/null || true
          wait "$qpid" 2>/dev/null || true
          trap - EXIT

      - name: Validate focused speech waveform
        shell: python
        run: |
          from pathlib import Path
          import hashlib,struct,wave
          root=Path('boot/uefi-hii-up-speech-v1')
          p=root/'up-speech.wav'
          assert p.exists() and p.stat().st_size>10000,p
          with wave.open(str(p),'rb') as w:
              channels=w.getnchannels(); rate=w.getframerate(); width=w.getsampwidth()
              frames=w.getnframes(); raw=w.readframes(frames)
          assert (channels,rate,width)==(2,48000,2),(channels,rate,width)
          vals=struct.unpack('<'+'h'*(len(raw)//2),raw)
          peak=max(abs(v) for v in vals); active=sum(abs(v)>=500 for v in vals)
          assert peak>=5000,peak
          assert active>=3000,active
          (root/'metrics.txt').write_text(
              f'frames={frames}\npeak={peak}\nactive={active}\n'
              f'wav-sha256={hashlib.sha256(p.read_bytes()).hexdigest()}\n'
          )
          print('UP_FOCUS_SPEECH_WAVEFORM=PASS')

      - name: Reboot same VARS and prove navigation did not mutate setting
        shell: bash
        run: |
          set -euo pipefail
          root=boot/uefi-hii-up-speech-v1
          source "$root/ovmf.env"
          cp "$root/BOOTX64-VERIFY.EFI" "$root/esp/EFI/BOOT/BOOTX64.EFI"
          rm -f "$root/post.serial" "$root/post.wav"

          qemu-system-x86_64 \
            -machine q35,accel=tcg -m 192M \
            -drive if=pflash,format=raw,readonly=on,file="$CODE" \
            -drive if=pflash,format=raw,file="$root/vars.fd" \
            -drive format=raw,file=fat:rw:"$root/esp" \
            -audiodev wav,id=aud,path="$root/post.wav",out.frequency=48000,out.channels=2 \
            -device ich9-intel-hda,bus=pcie.0,addr=1b.0,id=hda0 \
            -device hda-micro,bus=hda0.0,cad=0,audiodev=aud,mixer=on \
            -display none -monitor none -serial file:"$root/post.serial" \
            -parallel none -net none -no-reboot -no-shutdown &
          qpid=$!
          trap 'kill "$qpid" 2>/dev/null || true' EXIT
          python - <<'PY'
          from pathlib import Path
          import re,time
          root=Path('boot/uefi-hii-up-speech-v1')
          vals={}
          for line in (root/'runtime.txt').read_text().splitlines():
              if ' = ' in line:
                  k,v=line.split(' = ',1); vals[k]=v
          expected_raw=vals['current-raw8']
          expected_question=vals['question-text']
          p=root/'post.serial'
          end=time.time()+35
          while time.time()<end:
              raw=p.read_bytes() if p.exists() else b''
              if b'STATUS=BLOCKED\r\n' in raw:
                  raise SystemExit('post-state blocked: '+repr(raw[-20000:]))
              if b'STATUS=PASS\r\n' in raw:
                  cur=re.search(br'CURRENT_VALUE_RAW8_HEX=([0-9A-F]{16})',raw)
                  question=re.search(br'QUESTION_TEXT=([^\r\n]+)',raw)
                  assert cur and question
                  got_raw=cur.group(1).decode()
                  got_question=question.group(1).decode('ascii','replace').strip()
                  assert got_raw==expected_raw,(got_raw,expected_raw)
                  assert got_question==expected_question,(got_question,expected_question)
                  (root/'post-state.txt').write_text(
                      f'current-raw8 = {got_raw}\n'
                      f'question-text = {got_question}\n'
                      'unchanged = PASS\n'
                  )
                  print('UP_FOCUS_POST_STATE_UNCHANGED=PASS')
                  break
              time.sleep(.1)
          else:
              raise SystemExit('timeout post-state')
          PY
          sleep 1
          kill "$qpid" 2>/dev/null || true
          wait "$qpid" 2>/dev/null || true
          trap - EXIT

      - name: Record evidence
        shell: bash
        run: |
          set -euo pipefail
          root=boot/uefi-hii-up-speech-v1
          sha256sum "$root/BOOTX64.EFI" "$root/BOOTX64-VERIFY.EFI" "$root/up-speech.serial" "$root/up-speech.wav" "$root/post.serial" "$root/runtime.txt" "$root/metrics.txt" > "$root/evidence.sha256"
          {
            echo 'OS-UEFI-HII-UP-SPEECH-V1'
            cat "$root/runtime.txt"
            cat "$root/post-state.txt"
            echo 'post-state-unchanged = PASS'
            echo 'setting-mutation = false'
            echo 'physical-ASUS-up-focus-speech = not-established'
            echo 'result = PASS'
          } > "$root/linux-evidence.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: os-uefi-hii-up-speech-v1-linux
          path: |
            boot/uefi-hii-up-speech-v1/BOOTX64.EFI
            boot/uefi-hii-up-speech-v1/BOOTX64-VERIFY.EFI
            boot/uefi-hii-up-speech-v1/up-speech.serial
            boot/uefi-hii-up-speech-v1/up-speech.wav
            boot/uefi-hii-up-speech-v1/post.serial
            boot/uefi-hii-up-speech-v1/post-state.txt
            boot/uefi-hii-up-speech-v1/runtime.txt
            boot/uefi-hii-up-speech-v1/metrics.txt
            boot/uefi-hii-up-speech-v1/evidence.sha256
            boot/uefi-hii-up-speech-v1/linux-evidence.txt
          if-no-files-found: error

      - name: Persist revision-bound UP focus speech proof
        shell: bash
        run: |
          set -euo pipefail
          root=boot/uefi-hii-up-speech-v1
          proof="$root/os-uefi-hii-up-speech-v1.labproof"
          builder=boot/uefi-hii-current-option-speech-v1/build_uefi_hii_current_option_speech.py
          fixture=boot/uefi-hii-iscsi-fixture-v1/os-uefi-hii-iscsi-fixture-v1.labproof
          workflow=.github/workflows/os-uefi-hii-up-speech-v1.yml
          tested_builder="$(git rev-parse "$GITHUB_SHA:$builder")"
          tested_fixture="$(git rev-parse "$GITHUB_SHA:$fixture")"
          tested_workflow="$(git rev-parse "$GITHUB_SHA:$workflow")"
          cp "$root/BOOTX64.EFI" /tmp/up-speech.efi
          cp "$root/up-speech.serial" /tmp/up-speech.serial
          cp "$root/up-speech.wav" /tmp/up-speech.wav
          cp "$root/post.serial" /tmp/up-speech-post.serial
          cp "$root/runtime.txt" /tmp/up-speech-runtime.txt
          cp "$root/metrics.txt" /tmp/up-speech-metrics.txt

          git fetch origin os
          git checkout -B os origin/os
          for spec in \
            "$tested_builder|$builder|UP_SPEECH_STALE_BUILDER" \
            "$tested_fixture|$fixture|UP_SPEECH_STALE_FIXTURE" \
            "$tested_workflow|$workflow|UP_SPEECH_STALE_WORKFLOW"
          do
            IFS='|' read -r expected path msg <<< "$spec"
            [[ "$expected" == "$(git rev-parse "os:$path")" ]] || { echo "$msg=SKIP"; exit 0; }
          done

          python - <<'PY'
          from pathlib import Path
          import hashlib,os
          root=Path('boot/uefi-hii-up-speech-v1')
          p=root/'os-uefi-hii-up-speech-v1.labproof'
          lines=p.read_text().splitlines()
          states=[x for x in lines if x.startswith('proof = ')]
          if len(states)!=1 or states[0] not in {'proof = PENDING_CI','proof = PASS'}:
              raise SystemExit('unexpected proof state: '+repr(states))
          vals={}
          for line in Path('/tmp/up-speech-runtime.txt').read_text().splitlines():
              if ' = ' in line:
                  k,v=line.split(' = ',1); vals[k]=v
          kept=[x for x in lines if not x.startswith('proof-') and not x.startswith('proof = ')]
          efi=Path('/tmp/up-speech.efi').read_bytes()
          serial=Path('/tmp/up-speech.serial').read_bytes()
          wav=Path('/tmp/up-speech.wav').read_bytes()
          post=Path('/tmp/up-speech-post.serial').read_bytes()
          metrics=Path('/tmp/up-speech-metrics.txt').read_text().strip().replace('\n','; ')
          text='\n'.join(kept).rstrip()+'\n'
          text += (
              "proof = PASS\n"
              f"proof-run = {os.environ['GITHUB_RUN_ID']}\n"
              f"proof-head-sha = {os.environ['GITHUB_SHA']}\n"
              "proof-up-key-event = PASS\n"
              "proof-prev-direct-sibling = PASS\n"
              "proof-wrap-policy = PASS\n"
              f"proof-current-raw8 = {vals['current-raw8']}\n"
              f"proof-question-text = {vals['question-text']}\n"
              f"proof-focus-raw8 = {vals['focus-raw8']}\n"
              f"proof-focus-option-string-id = {vals['focus-option-string-id']}\n"
              f"proof-focus-option-label = {vals['focus-option-label']}\n"
              f"proof-focus-spoken-prefix = {vals['focus-spoken-prefix']}\n"
              "proof-focus-native-HDA-speech = PASS\n"
              "proof-HDA-waveform = PASS\n"
              "proof-post-state-unchanged = PASS\n"
              "proof-setting-mutation = false\n"
              "proof-physical-ASUS-up-focus-speech = false\n"
              f"proof-wave-metrics = {metrics}\n"
              f"proof-efi-sha256 = {hashlib.sha256(efi).hexdigest()}\n"
              f"proof-serial-sha256 = {hashlib.sha256(serial).hexdigest()}\n"
              f"proof-wav-sha256 = {hashlib.sha256(wav).hexdigest()}\n"
              f"proof-post-serial-sha256 = {hashlib.sha256(post).hexdigest()}\n"
          )
          p.write_text(text)
          PY

          if git diff --quiet -- "$proof"; then exit 0; fi
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$proof"
          git commit -m "Record read-only UP focus speech proof [skip ci]"
          for attempt in 1 2 3; do
            if git push origin os; then exit 0; fi
            git fetch origin os
            [[ "$tested_builder" == "$(git rev-parse "origin/os:$builder")" ]] || { echo UP_SPEECH_STALE_BUILDER=SKIP; exit 0; }
            [[ "$tested_fixture" == "$(git rev-parse "origin/os:$fixture")" ]] || { echo UP_SPEECH_STALE_FIXTURE=SKIP; exit 0; }
            [[ "$tested_workflow" == "$(git rev-parse "origin/os:$workflow")" ]] || { echo UP_SPEECH_STALE_WORKFLOW=SKIP; exit 0; }
            git rebase origin/os || { git rebase --abort || true; exit 1; }
          done
          exit 1
