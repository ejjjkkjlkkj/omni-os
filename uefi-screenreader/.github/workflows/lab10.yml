name: lab10-machine-binary-scale
on:
  push:
    branches: [os]
    paths:
      - 'lab10/**'
      - '!lab10/*.labproof'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-machine-binary-scale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prove recursive binary scale with witness A
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from hashlib import sha256

          widths = (2,4,8,16,32,64,128,256)
          expected_hash = {
              2: "06eb7d6a69ee19e5fbdf749018d3d2abfa04bcbd1365db312eb86dc7169389b8",
              4: "10db5223d19bd1d58c2b8eb3c723b0ba104cf17564f9434e53e1b9e642fb3b37",
              8: "22f97a10117efa48887eb57f502823b581afafaee624d78af2620451d1ad5c31",
              16: "d1c9053487d0fe37767d7df8297c9ba5ca3811b09c1606b706f60e720291614c",
              32: "6a7109f48afd4406884c435207d8b9c7709b9d153001b65afc8220f7888fe62c",
              64: "ad5bc614754bf2bee307f6ade5d655a9feb4b5d76608220cc57680e46088f32f",
              128: "67f753181f4c0f0c58a87530af04684ec3d6b690779a1f0bd913b3dfa8560afc",
              256: "4fb01cc48ebb4496c1a4306e6251a920a6d59e98091777e2aff15de7838db8e6",
          }

          def exchange(src):
              return bytes(0xff if x == 0x00 else 0x00 for x in src)

          def derive(src):
              out = bytearray(len(src))
              prev = src[-1]
              for i, cur in enumerate(src):
                  if cur not in (0x00, 0xff):
                      raise SystemExit("unexpected witness state")
                  out[i] = 0x00 if cur == prev else 0xff
                  prev = cur
              return bytes(out)

          def recover(rel, anchor):
              out = bytearray(len(rel))
              out[0] = anchor
              for i in range(1, len(rel)):
                  if rel[i] == 0x00:
                      out[i] = out[i-1]
                  elif rel[i] == 0xff:
                      out[i] = 0xff if out[i-1] == 0x00 else 0x00
                  else:
                      raise SystemExit("unexpected relation state")
              closure = 0x00 if out[0] == out[-1] else 0xff
              if closure != rel[0]:
                  raise SystemExit("closure mismatch")
              return bytes(out)

          def flip(src, *positions):
              out = bytearray(src)
              for pos in positions:
                  out[pos] = 0xff if out[pos] == 0x00 else 0x00
              return bytes(out)

          material = bytes((0x00, 0xff))

          for stage, width in enumerate(widths):
              if len(material) != width:
                  raise SystemExit(f"width mismatch at {width}")
              if sha256(material).hexdigest() != expected_hash[width]:
                  raise SystemExit(f"hash mismatch at {width}")
              if material.count(0x00) != width // 2 or material.count(0xff) != width // 2:
                  raise SystemExit(f"balance mismatch at {width}")

              opposite = exchange(material)
              relation = derive(material)
              if derive(opposite) != relation:
                  raise SystemExit(f"global polarity mismatch at {width}")
              if recover(relation, material[0]) != material:
                  raise SystemExit(f"primary recovery mismatch at {width}")
              if recover(relation, opposite[0]) != opposite:
                  raise SystemExit(f"opposite recovery mismatch at {width}")

              # Every single externally imposed state exchange.
              for i in range(width):
                  changed = derive(flip(material, i))
                  diff = [k for k,(a,b) in enumerate(zip(changed, relation)) if a != b]
                  expected = sorted({i, (i+1) % width})
                  if diff != expected:
                      raise SystemExit(f"single locality mismatch width={width} position={i}: {diff} != {expected}")

              # Every unordered pair of distinct externally imposed exchanges.
              for i in range(width):
                  for j in range(i+1, width):
                      left = flip(flip(material, i), j)
                      right = flip(flip(material, j), i)
                      if left != right:
                          raise SystemExit(f"pair order mismatch width={width} pair={i},{j}")
                      rel2 = derive(left)
                      incident = [i, (i+1)%width, j, (j+1)%width]
                      expected = sorted(k for k in set(incident) if incident.count(k) % 2 == 1)
                      diff = [k for k,(a,b) in enumerate(zip(rel2, relation)) if a != b]
                      if diff != expected:
                          raise SystemExit(f"pair locality mismatch width={width} pair={i},{j}: {diff} != {expected}")
                      if derive(exchange(left)) != rel2:
                          raise SystemExit(f"pair polarity mismatch width={width} pair={i},{j}")

              if stage + 1 < len(widths):
                  next_material = material + opposite
                  if len(next_material) != width * 2:
                      raise SystemExit(f"doubling mismatch at {width}")
                  if next_material[:width] != material or next_material[width:] != opposite:
                      raise SystemExit(f"recursive composition mismatch at {width}")
                  material = next_material

          print("LAB10_LINUX=PASS")
          PY

  windows-machine-binary-scale:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prove recursive binary scale with compiled witness B
        shell: pwsh
        run: |
          $src = @'
          using System;
          using System.Collections.Generic;
          using System.Security.Cryptography;

          public static class Lab10Witness
          {
              static readonly int[] Widths = new[] { 2,4,8,16,32,64,128,256 };

              static readonly Dictionary<int,string> Expected = new Dictionary<int,string>
              {
                  {2,   "06eb7d6a69ee19e5fbdf749018d3d2abfa04bcbd1365db312eb86dc7169389b8"},
                  {4,   "10db5223d19bd1d58c2b8eb3c723b0ba104cf17564f9434e53e1b9e642fb3b37"},
                  {8,   "22f97a10117efa48887eb57f502823b581afafaee624d78af2620451d1ad5c31"},
                  {16,  "d1c9053487d0fe37767d7df8297c9ba5ca3811b09c1606b706f60e720291614c"},
                  {32,  "6a7109f48afd4406884c435207d8b9c7709b9d153001b65afc8220f7888fe62c"},
                  {64,  "ad5bc614754bf2bee307f6ade5d655a9feb4b5d76608220cc57680e46088f32f"},
                  {128, "67f753181f4c0f0c58a87530af04684ec3d6b690779a1f0bd913b3dfa8560afc"},
                  {256, "4fb01cc48ebb4496c1a4306e6251a920a6d59e98091777e2aff15de7838db8e6"}
              };

              static byte[] Exchange(byte[] src)
              {
                  var dst = new byte[src.Length];
                  for (int i=0;i<src.Length;i++)
                  {
                      if (src[i]==0) dst[i]=255;
                      else if (src[i]==255) dst[i]=0;
                      else throw new Exception("unexpected witness state");
                  }
                  return dst;
              }

              static byte[] Derive(byte[] src)
              {
                  var dst = new byte[src.Length];
                  byte prev = src[src.Length-1];
                  for (int i=0;i<src.Length;i++)
                  {
                      byte cur=src[i];
                      if (cur!=0 && cur!=255) throw new Exception("unexpected witness state");
                      dst[i]=(byte)(cur==prev ? 0 : 255);
                      prev=cur;
                  }
                  return dst;
              }

              static byte[] Recover(byte[] rel, byte anchor)
              {
                  var dst = new byte[rel.Length];
                  dst[0]=anchor;
                  for (int i=1;i<rel.Length;i++)
                  {
                      if (rel[i]==0) dst[i]=dst[i-1];
                      else if (rel[i]==255) dst[i]=(byte)(dst[i-1]==0 ? 255 : 0);
                      else throw new Exception("unexpected relation state");
                  }
                  byte closure=(byte)(dst[0]==dst[dst.Length-1] ? 0 : 255);
                  if (closure!=rel[0]) throw new Exception("closure mismatch");
                  return dst;
              }

              static byte[] FlipOrdered(byte[] src, int first, int second)
              {
                  var dst=(byte[])src.Clone();
                  dst[first]=(byte)(dst[first]==0 ? 255 : 0);
                  if (second>=0) dst[second]=(byte)(dst[second]==0 ? 255 : 0);
                  return dst;
              }

              static bool Equal(byte[] a, byte[] b)
              {
                  if (a.Length!=b.Length) return false;
                  for (int i=0;i<a.Length;i++) if (a[i]!=b[i]) return false;
                  return true;
              }

              static string Hash(byte[] data)
              {
                  using (var sha=SHA256.Create())
                  {
                      var h=sha.ComputeHash(data);
                      return BitConverter.ToString(h).Replace("-","").ToLowerInvariant();
                  }
              }

              public static string Run()
              {
                  byte[] material=new byte[] {0,255};

                  for (int stage=0;stage<Widths.Length;stage++)
                  {
                      int width=Widths[stage];
                      if (material.Length!=width) throw new Exception("width mismatch at "+width);
                      if (Hash(material)!=Expected[width]) throw new Exception("hash mismatch at "+width);

                      int zeros=0, ones=0;
                      for (int k=0;k<width;k++)
                      {
                          if (material[k]==0) zeros++;
                          else if (material[k]==255) ones++;
                          else throw new Exception("unexpected witness state");
                      }
                      if (zeros!=width/2 || ones!=width/2) throw new Exception("balance mismatch at "+width);

                      var opposite=Exchange(material);
                      var relation=Derive(material);
                      if (!Equal(Derive(opposite),relation)) throw new Exception("global polarity mismatch at "+width);
                      if (!Equal(Recover(relation,material[0]),material)) throw new Exception("primary recovery mismatch at "+width);
                      if (!Equal(Recover(relation,opposite[0]),opposite)) throw new Exception("opposite recovery mismatch at "+width);

                      for (int i=0;i<width;i++)
                      {
                          var changed=Derive(FlipOrdered(material,i,-1));
                          for (int k=0;k<width;k++)
                          {
                              bool expected = (k==i || k==((i+1)%width));
                              bool actual = changed[k]!=relation[k];
                              if (actual!=expected) throw new Exception("single locality mismatch width="+width+" position="+i+" relation="+k);
                          }
                      }

                      for (int i=0;i<width;i++)
                      {
                          for (int j=i+1;j<width;j++)
                          {
                              var left=FlipOrdered(material,i,j);
                              var right=FlipOrdered(material,j,i);
                              if (!Equal(left,right)) throw new Exception("pair order mismatch width="+width+" pair="+i+","+j);

                              var rel2=Derive(left);
                              var expected=new bool[width];
                              expected[i]=!expected[i];
                              expected[(i+1)%width]=!expected[(i+1)%width];
                              expected[j]=!expected[j];
                              expected[(j+1)%width]=!expected[(j+1)%width];

                              for (int k=0;k<width;k++)
                              {
                                  bool actual=rel2[k]!=relation[k];
                                  if (actual!=expected[k]) throw new Exception("pair locality mismatch width="+width+" pair="+i+","+j+" relation="+k);
                              }

                              if (!Equal(Derive(Exchange(left)),rel2)) throw new Exception("pair polarity mismatch width="+width+" pair="+i+","+j);
                          }
                      }

                      if (stage+1<Widths.Length)
                      {
                          var next=new byte[width*2];
                          Array.Copy(material,0,next,0,width);
                          Array.Copy(opposite,0,next,width,width);
                          material=next;
                      }
                  }

                  return "LAB10_WINDOWS=PASS";
              }
          }
          '@

          Add-Type -TypeDefinition $src -Language CSharp
          [Lab10Witness]::Run()
