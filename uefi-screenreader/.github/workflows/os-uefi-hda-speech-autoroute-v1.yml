name: os-uefi-hda-speech-autoroute-v1

on:
  push:
    branches: [os]
    paths:
      - 'boot/uefi-hda-speech-autoroute-v1/build_uefi_hda_speech_autoroute.py'
      - 'boot/uefi-hda-speech-autoroute-v1/os-uefi-hda-speech-autoroute-v1.labproof'
      - '.github/workflows/os-uefi-hda-speech-autoroute-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  q35-hda-speech-autoroute:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install QEMU and OVMF
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf

      - name: Enforce current routing dependencies
        shell: python
        run: |
          from pathlib import Path
          for path in [
              'boot/uefi-hda-speech-runtime-v1/os-uefi-hda-speech-runtime-v1.labproof',
              'boot/uefi-hda-topology-v1/os-uefi-hda-topology-v1.labproof',
              'boot/uefi-hda-output-policy-v1/os-uefi-hda-output-policy-v1.labproof',
          ]:
              lines=set(Path(path).read_text().splitlines())
              assert 'proof = PASS' in lines,path
          print('HDA_SPEECH_AUTOROUTE_DEPENDENCIES=PASS')

      - name: Enforce autoroute source contract
        shell: python
        run: |
          from pathlib import Path
          import ast
          root=Path('boot/uefi-hda-speech-autoroute-v1')
          src=(root/'build_uefi_hda_speech_autoroute.py').read_text()
          ast.parse(src)
          required=[
              "c.label('widget_scan')",
              "c.label('route_short')",
              "c.label('route_long')",
              "L={'maxaddr':0,'dac_nid':8,'pin_nid':12}",
              "verb_data(L['dac_nid'],0x00070610)",
              "verb_data(L['dac_nid'],0x00020011)",
              "verb_data(L['pin_nid'],0x00070740)",
              "NO_FIXED_WIDGET_NIDS=PASS",
              "DAC_OUTPUT_AMP_VERIFY=PASS",
              "OS_UEFI_HDA_SPEECH_AUTOROUTE_BUILD=PASS",
          ]
          for token in required:
              assert token in src,token
          for forbidden in [
              "verb_const(0x00270610)",
              "verb_const(0x00220011)",
              "verb_const(0x00370740)",
          ]:
              assert forbidden not in src,forbidden
          proof=set((root/'os-uefi-hda-speech-autoroute-v1.labproof').read_text().splitlines())
          for line in [
              'widget-nids-hardcoded = false',
              'generic-direct-codec-routing-for-speech = required',
              'multi-hop-mixer-selector-routing = not-established',
              'full-utterance-pcm-assets = 0',
          ]:
              assert line in proof,line
          print('HDA_SPEECH_AUTOROUTE_SOURCE_CONTRACT=PASS')

      - name: Build deterministic autoroute speech image twice
        shell: bash
        run: |
          set -euo pipefail
          root=boot/uefi-hda-speech-autoroute-v1
          python "$root/build_uefi_hda_speech_autoroute.py" "$root/BOOTX64.EFI" | tee "$root/build.log"
          python "$root/build_uefi_hda_speech_autoroute.py" "$root/BOOTX64-2.EFI" > "$root/build2.log"
          cmp "$root/BOOTX64.EFI" "$root/BOOTX64-2.EFI"
          grep -F 'OS_UEFI_HDA_SPEECH_AUTOROUTE_BUILD=PASS' "$root/build.log"
          grep -F 'full-utterance-pcm-assets=0' "$root/build.log"
          sha256sum "$root/BOOTX64.EFI"

      - name: Audit autoroute speech image
        shell: python
        run: |
          from pathlib import Path
          import struct
          image=Path('boot/uefi-hda-speech-autoroute-v1/BOOTX64.EFI').read_bytes()
          assert image[:2]==b'MZ'
          pe=struct.unpack_from('<I',image,0x3c)[0]
          assert image[pe:pe+4]==b'PE\0\0'
          coff=pe+4
          assert struct.unpack_from('<HH',image,coff)==(0x8664,3)
          opt=coff+20
          assert struct.unpack_from('<H',image,opt)[0]==0x20b
          assert struct.unpack_from('<H',image,opt+0x44)[0]==10
          sec=opt+0xf0
          data=sec+40
          tc=struct.unpack_from('<I',image,sec+0x24)[0]
          dc=struct.unpack_from('<I',image,data+0x24)[0]
          assert not(tc&0x80000000)
          assert dc&0x80000000 and not(dc&0x20000000)
          required=[
              bytes.fromhex('4181fc00000100'),
              b'AFG_RUNTIME_DISCOVERY=PASS\r\n',
              b'AUTO_DAC_WIDGET=PASS\r\n',
              b'AUTO_OUTPUT_PIN_WIDGET=PASS\r\n',
              b'AUTO_PIN_TO_DAC_DIRECT_ROUTE=PASS\r\n',
              b'NO_FIXED_WIDGET_NIDS=PASS\r\n',
              b'PIN_CONFIG_DEFAULT=PASS\r\n',
              b'DAC_OUTPUT_AMP_VERIFY=PASS\r\n',
              b'RUNTIME_ALLOPHONE_HDA=PASS\r\n',
          ]
          for token in required:
              assert token in image,token
          print('HDA_SPEECH_AUTOROUTE_STATIC=PASS')
          print('DYNAMIC_WIDGET_NIDS=BOUND')
          print('DYNAMIC_CODEC_VERBS=BOUND')
          print('RUNTIME_ALLOPHONE_BDL=BOUND')
          print('W_X=BLOCKED')

      - name: Resolve OVMF
        shell: bash
        run: |
          set -euo pipefail
          CODE=''; VARS=''
          for pair in \
            '/usr/share/OVMF/OVMF_CODE_4M.fd|/usr/share/OVMF/OVMF_VARS_4M.fd' \
            '/usr/share/OVMF/OVMF_CODE.fd|/usr/share/OVMF/OVMF_VARS.fd' \
            '/usr/share/edk2/ovmf/OVMF_CODE.fd|/usr/share/edk2/ovmf/OVMF_VARS.fd'
          do
            IFS='|' read -r code vars <<< "$pair"
            if [[ -f "$code" && -f "$vars" ]]; then CODE="$code"; VARS="$vars"; break; fi
          done
          test -n "$CODE" -a -n "$VARS"
          printf 'CODE=%s\nVARS=%s\n' "$CODE" "$VARS" > boot/uefi-hda-speech-autoroute-v1/ovmf.env

      - name: Run native speech through discovered HDA route
        shell: bash
        run: |
          set -euo pipefail
          source boot/uefi-hda-speech-autoroute-v1/ovmf.env
          root=boot/uefi-hda-speech-autoroute-v1
          cp "$VARS" "$root/vars.fd"
          rm -rf "$root/esp"
          mkdir -p "$root/esp/EFI/BOOT"
          cp "$root/BOOTX64.EFI" "$root/esp/EFI/BOOT/BOOTX64.EFI"
          rm -f "$root/autoroute.wav" "$root/autoroute.serial"

          qemu-system-x86_64 \
            -machine q35,accel=tcg \
            -m 128M \
            -drive if=pflash,format=raw,readonly=on,file="$CODE" \
            -drive if=pflash,format=raw,file="$root/vars.fd" \
            -drive format=raw,file=fat:rw:"$root/esp" \
            -audiodev wav,id=aud,path="$root/autoroute.wav",out.frequency=48000,out.channels=2 \
            -device ich9-intel-hda,bus=pcie.0,addr=1b.0,id=hda0 \
            -device hda-micro,bus=hda0.0,cad=0,audiodev=aud,mixer=on \
            -display none \
            -monitor none \
            -serial file:"$root/autoroute.serial" \
            -parallel none \
            -net none \
            -no-reboot \
            -no-shutdown &
          qpid=$!
          trap 'kill $qpid 2>/dev/null || true' EXIT

          python - <<'PY'
          from pathlib import Path
          import time
          p=Path('boot/uefi-hda-speech-autoroute-v1/autoroute.serial')
          req=[
              b'AFG_RUNTIME_DISCOVERY=PASS\r\n',
              b'AUTO_DAC_WIDGET=PASS\r\n',
              b'AUTO_OUTPUT_PIN_WIDGET=PASS\r\n',
              b'AUTO_PIN_TO_DAC_DIRECT_ROUTE=PASS\r\n',
              b'NO_FIXED_WIDGET_NIDS=PASS\r\n',
              b'PIN_CONFIG_DEFAULT=PASS\r\n',
              b'DAC_OUTPUT_AMP_VERIFY=PASS\r\n',
              b'BDL_ALLOPHONE_SCHEDULE=PASS\r\n',
              b'LPIB_PROGRESS=PASS\r\n',
              b'RUNTIME_ALLOPHONE_HDA=PASS\r\n',
              b'STATUS=PASS\r\n',
          ]
          end=time.time()+30
          while time.time()<end:
              raw=p.read_bytes() if p.exists() else b''
              if b'STATUS=BLOCKED\r\n' in raw:
                  raise SystemExit('autoroute speech blocked: '+repr(raw[-4096:]))
              if all(x in raw for x in req):
                  print('HDA_SPEECH_AUTOROUTE_RUNTIME=PASS')
                  break
              time.sleep(.1)
          else:
              raise SystemExit('timeout: '+repr((p.read_bytes() if p.exists() else b'')[-4096:]))
          PY

          sleep 1
          kill $qpid 2>/dev/null || true
          wait $qpid 2>/dev/null || true
          trap - EXIT

      - name: Validate autoroute speech waveform
        shell: python
        run: |
          from pathlib import Path
          import hashlib,struct,wave
          root=Path('boot/uefi-hda-speech-autoroute-v1')
          p=root/'autoroute.wav'
          assert p.exists() and p.stat().st_size>10000
          with wave.open(str(p),'rb') as w:
              channels=w.getnchannels()
              rate=w.getframerate()
              width=w.getsampwidth()
              frames=w.getnframes()
              raw=w.readframes(frames)
          assert channels==2 and rate==48000 and width==2
          vals=struct.unpack('<'+'h'*(len(raw)//2),raw)
          peak=max(abs(v) for v in vals)
          active=sum(abs(v)>=500 for v in vals)
          assert frames>=8000
          assert peak>=5000
          assert active>=3000
          metrics=(
              f'frames={frames}\n'
              f'duration={frames/rate}\n'
              f'peak={peak}\n'
              f'active-samples={active}\n'
              f'wav-sha256={hashlib.sha256(p.read_bytes()).hexdigest()}\n'
          )
          (root/'autoroute-metrics.txt').write_text(metrics)
          print(metrics,end='')
          print('HDA_SPEECH_AUTOROUTE_WAVEFORM=PASS')

      - uses: actions/upload-artifact@v4
        with:
          name: os-uefi-hda-speech-autoroute-v1-linux
          path: |
            boot/uefi-hda-speech-autoroute-v1/BOOTX64.EFI
            boot/uefi-hda-speech-autoroute-v1/autoroute.wav
            boot/uefi-hda-speech-autoroute-v1/autoroute.serial
            boot/uefi-hda-speech-autoroute-v1/autoroute-metrics.txt
            boot/uefi-hda-speech-autoroute-v1/build.log
          if-no-files-found: error

      - name: Persist autoroute speech proof
        shell: bash
        run: |
          set -euo pipefail
          root=boot/uefi-hda-speech-autoroute-v1
          builder="$root/build_uefi_hda_speech_autoroute.py"
          workflow=".github/workflows/os-uefi-hda-speech-autoroute-v1.yml"
          tested_builder="$(git rev-parse "$GITHUB_SHA:$builder")"
          tested_workflow="$(git rev-parse "$GITHUB_SHA:$workflow")"
          cp "$root/BOOTX64.EFI" /tmp/autoroute.efi
          cp "$root/autoroute.wav" /tmp/autoroute.wav
          cp "$root/autoroute.serial" /tmp/autoroute.serial
          cp "$root/autoroute-metrics.txt" /tmp/autoroute-metrics.txt
          git fetch origin os
          git checkout -B os origin/os
          [[ "$tested_builder" == "$(git rev-parse "os:$builder")" ]] || { echo AUTOROUTE_STALE_BUILDER=SKIP; exit 0; }
          [[ "$tested_workflow" == "$(git rev-parse "os:$workflow")" ]] || { echo AUTOROUTE_STALE_WORKFLOW=SKIP; exit 0; }

          python - <<'PY'
          from pathlib import Path
          import hashlib,os
          root=Path('boot/uefi-hda-speech-autoroute-v1')
          p=root/'os-uefi-hda-speech-autoroute-v1.labproof'
          text=p.read_text()
          states=[x for x in text.splitlines() if x.startswith('proof = ')]
          if len(states)!=1 or states[0] not in {'proof = PENDING_CI','proof = PASS'}:
              raise SystemExit('unexpected proof state')
          kept=[]
          for line in text.splitlines():
              if line.startswith('proof-') or line.startswith('revalidation-reason ='):
                  continue
              kept.append('proof = PASS' if line.startswith('proof = ') else line)
          efi=Path('/tmp/autoroute.efi').read_bytes()
          wav=Path('/tmp/autoroute.wav').read_bytes()
          serial=Path('/tmp/autoroute.serial').read_bytes()
          metrics=Path('/tmp/autoroute-metrics.txt').read_text().strip().replace('\n','; ')
          text='\n'.join(kept).rstrip()+'\n'
          text += (
              f"proof-run = {os.environ['GITHUB_RUN_ID']}\n"
              f"proof-head-sha = {os.environ['GITHUB_SHA']}\n"
              "proof-AFG-runtime-discovery = PASS\n"
              "proof-auto-DAC = PASS\n"
              "proof-auto-output-pin = PASS\n"
              "proof-auto-direct-route = PASS\n"
              "proof-output-policy = PASS\n"
              "proof-runtime-allophone-HDA = PASS\n"
              "proof-widget-NIDs-hardcoded = false\n"
              f"proof-wav-metrics = {metrics}\n"
              f"proof-efi-sha256 = {hashlib.sha256(efi).hexdigest()}\n"
              f"proof-wav-sha256 = {hashlib.sha256(wav).hexdigest()}\n"
              f"proof-serial-sha256 = {hashlib.sha256(serial).hexdigest()}\n"
          )
          p.write_text(text)
          PY
          if git diff --quiet -- "$root/os-uefi-hda-speech-autoroute-v1.labproof"; then exit 0; fi
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$root/os-uefi-hda-speech-autoroute-v1.labproof"
          git commit -m "Record runtime-discovered HDA speech route proof [skip ci]"
          git push origin os
