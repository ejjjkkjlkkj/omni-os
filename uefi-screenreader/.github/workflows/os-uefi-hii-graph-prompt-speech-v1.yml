name: os-uefi-hii-graph-prompt-speech-v1

on:
  push:
    branches: [os]
    paths:
      - 'boot/uefi-hii-graph-prompt-speech-v1/**'
      - 'boot/uefi-native-speech-v1/build_uefi_native_speech.py'
      - '.github/workflows/os-uefi-hii-graph-prompt-speech-v1.yml'
  workflow_dispatch:

jobs:
  q35-hii-graph-speech:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang lld qemu-system-x86 ovmf dosfstools mtools

      - name: Generate first-party dynamic unit bank
        run: |
          set -euo pipefail
          root=boot/uefi-hii-graph-prompt-speech-v1
          python "$root/generate_units.py" "$root/speech_units.c" "$root/speech-unit-metadata.txt" | tee "$root/generator.log"
          grep -F 'letter-map=a-z' "$root/speech-unit-metadata.txt"
          grep -F 'full-utterance-asset=false' "$root/speech-unit-metadata.txt"

      - name: Build deterministic HII graph speech EFI
        run: |
          set -euo pipefail
          root=boot/uefi-hii-graph-prompt-speech-v1
          flags='--target=x86_64-pc-windows-msvc -ffreestanding -fshort-wchar -fno-stack-protector -fno-builtin -mno-red-zone -nostdlib -O2 -Wall -Wextra -Werror'
          clang $flags -c "$root/hii_graph_prompt_speech_uefi.c" -o "$root/main.obj"
          clang $flags -c "$root/speech_units.c" -o "$root/units.obj"
          lld-link /subsystem:efi_application /entry:efi_main /nodefaultlib /machine:x64 /timestamp:0 /out:"$root/BOOTX64.EFI" "$root/main.obj" "$root/units.obj"
          clang $flags -c "$root/hii_graph_prompt_speech_uefi.c" -o "$root/main-2.obj"
          clang $flags -c "$root/speech_units.c" -o "$root/units-2.obj"
          lld-link /subsystem:efi_application /entry:efi_main /nodefaultlib /machine:x64 /timestamp:0 /out:"$root/BOOTX64-2.EFI" "$root/main-2.obj" "$root/units-2.obj"
          cmp "$root/BOOTX64.EFI" "$root/BOOTX64-2.EFI"

          clang $flags -DQEV_INTERACTIVE_REPEAT=1 -c "$root/hii_graph_prompt_speech_uefi.c" -o "$root/main-repeat.obj"
          lld-link /subsystem:efi_application /entry:efi_main /nodefaultlib /machine:x64 /timestamp:0 /out:"$root/BOOTX64-REPEAT.EFI" "$root/main-repeat.obj" "$root/units.obj"
          clang $flags -DQEV_INTERACTIVE_REPEAT=1 -c "$root/hii_graph_prompt_speech_uefi.c" -o "$root/main-repeat-2.obj"
          lld-link /subsystem:efi_application /entry:efi_main /nodefaultlib /machine:x64 /timestamp:0 /out:"$root/BOOTX64-REPEAT-2.EFI" "$root/main-repeat-2.obj" "$root/units-2.obj"
          cmp "$root/BOOTX64-REPEAT.EFI" "$root/BOOTX64-REPEAT-2.EFI"

          sha256sum "$root/BOOTX64.EFI" "$root/BOOTX64-REPEAT.EFI" | tee "$root/build.sha256"
          echo HII_GRAPH_PROMPT_SPEECH_BUILD=PASS
          echo HII_GRAPH_REPEAT_BUILD=PASS
          echo HII_GRAPH_REPEAT_DETERMINISM=PASS

      - name: Audit EFI
        shell: python
        run: |
          from pathlib import Path
          import struct
          p=Path('boot/uefi-hii-graph-prompt-speech-v1/BOOTX64.EFI')
          b=p.read_bytes()
          assert b[:2]==b'MZ'
          pe=struct.unpack_from('<I',b,0x3c)[0]
          assert b[pe:pe+4]==b'PE\0\0'
          coff=pe+4; opt=coff+20
          assert struct.unpack_from('<H',b,coff)[0]==0x8664
          assert struct.unpack_from('<H',b,opt)[0]==0x20b
          assert struct.unpack_from('<H',b,opt+0x44)[0]==10
          nsec=struct.unpack_from('<H',b,coff+2)[0]
          sec=opt+struct.unpack_from('<H',b,coff+16)[0]
          for i in range(nsec):
              ch=struct.unpack_from('<I',b,sec+i*40+36)[0]
              assert not ((ch&0x80000000) and (ch&0x20000000)),hex(ch)
          for token in [
              b'HII_PROMPT_SOURCE=PASS',
              b'HDA_CONTROLLER_SELECTION=PREFERRED_AMD_1022_15E3',
              b'HDA_CONTROLLER_SELECTION=GENERIC_CLASS_0403',
              b'HDA_CODEC_SELECTION=REALTEK_10EC_0256',
              b'HDA_CODEC_SELECTION=GENERIC_RUNTIME',
              b'HDA_CODEC_VENDOR_DEVICE=0x',
              b'HDA_GRAPH_SEARCH_LIVE=PASS',
              b'HII_PROMPT_SPEECH_HDA=PASS',
              b'LPIB_PROGRESS=PASS',
          ]:
              assert token in b,token
          rp=Path('boot/uefi-hii-graph-prompt-speech-v1/BOOTX64-REPEAT.EFI')
          rb=rp.read_bytes()
          for token in [
              b'HII_GRAPH_REPEAT_KEY=WAIT_R',
              b'HII_GRAPH_REPEAT_KEY=PASS',
              b'HII_GRAPH_REPEAT_SPEECH_DMA=PASS',
              b'HII_GRAPH_REPEAT_SPEECH_HDA=PASS',
              b'HII_GRAPH_REPEAT_LPIB_PROGRESS=PASS',
          ]:
              assert token in rb,token
          print('HII_GRAPH_PROMPT_SPEECH_PE_AUDIT=PASS')
          print('HII_GRAPH_REPEAT_PE_AUDIT=PASS')

      - name: Resolve OVMF
        run: |
          set -euo pipefail
          CODE=''; VARS=''
          for pair in             '/usr/share/OVMF/OVMF_CODE_4M.fd|/usr/share/OVMF/OVMF_VARS_4M.fd'             '/usr/share/OVMF/OVMF_CODE.fd|/usr/share/OVMF/OVMF_VARS.fd'             '/usr/share/edk2/ovmf/OVMF_CODE.fd|/usr/share/edk2/ovmf/OVMF_VARS.fd'
          do
            IFS='|' read -r code vars <<< "$pair"
            if test -f "$code" -a -f "$vars"; then CODE="$code"; VARS="$vars"; break; fi
          done
          test -n "$CODE" -a -n "$VARS"
          printf 'CODE=%s\nVARS=%s\n' "$CODE" "$VARS" > boot/uefi-hii-graph-prompt-speech-v1/ovmf.env

      - name: Prove live HII to graph-routed HDA speech
        run: |
          set -euo pipefail
          source boot/uefi-hii-graph-prompt-speech-v1/ovmf.env
          root=boot/uefi-hii-graph-prompt-speech-v1
          cp "$VARS" "$root/vars.fd"
          rm -f "$root/esp.img" "$root/runtime-boot-media-proof.txt"
          truncate -s 64M "$root/esp.img"
          mkfs.vfat -F 16 "$root/esp.img"
          mmd -i "$root/esp.img" ::/EFI
          mmd -i "$root/esp.img" ::/EFI/BOOT
          mcopy -i "$root/esp.img" "$root/BOOTX64.EFI" ::/EFI/BOOT/BOOTX64.EFI
          mdir -i "$root/esp.img" ::/EFI/BOOT
          rm -f "$root/runtime.serial" "$root/runtime.wav"
          qemu-system-x86_64             -machine q35,accel=tcg -m 192M             -drive if=pflash,format=raw,readonly=on,file="$CODE"             -drive if=pflash,format=raw,file="$root/vars.fd"             -drive format=raw,file="$root/esp.img"             -audiodev wav,id=aud,path="$root/runtime.wav",out.frequency=48000,out.channels=2             -device ich9-intel-hda,bus=pcie.0,addr=1b.0,id=hda0             -device hda-duplex,bus=hda0.0,cad=0,audiodev=aud             -display none -monitor none             -serial file:"$root/runtime.serial"             -parallel none -net none -no-reboot -no-shutdown &
          qpid=$!
          trap 'kill $qpid 2>/dev/null || true' EXIT
          python - <<'PY'
          from pathlib import Path
          import time
          p=Path('boot/uefi-hii-graph-prompt-speech-v1/runtime.serial')
          req=[
            b'HII_DATABASE_PROTOCOL=PASS\r\n',
            b'HII_STRING_PROTOCOL=PASS\r\n',
            b'IFR_PROMPT_STRING_ID=PASS\r\n',
            b'HII_PROMPT_TEXT=',
            b'HII_PROMPT_SOURCE=PASS\r\n',
            b'HDA_CONTROLLER_SELECTION=GENERIC_CLASS_0403\r\n',
            b'HDA_CODEC_SELECTION=GENERIC_RUNTIME\r\n',
            b'HDA_GRAPH_SEARCH_LIVE=PASS\r\n',
            b'HDA_SELECTOR_APPLY_LIVE=PASS\r\n',
            b'HDA_OUTPUT_PATH_CONFIGURATION=PASS\r\n',
            b'BDL_RUNTIME_TEXT_SCHEDULE=PASS\r\n',
            b'HII_GRAPH_SPEECH_DMA=PASS\r\n',
            b'HII_PROMPT_SPEECH_HDA=PASS\r\n',
            b'LPIB_PROGRESS=PASS\r\n',
            b'BOOT_MEDIA_PERSISTENT_PROOF=PASS\r\n',
            b'STATUS=PASS\r\n',
          ]
          end=time.time()+60
          while time.time()<end:
              raw=p.read_bytes() if p.exists() else b''
              if b'STATUS=BLOCKED\r\n' in raw:
                  raise SystemExit('blocked: '+repr(raw[-12000:]))
              if all(x in raw for x in req):
                  import re
                  if not re.search(br'HDA_CODEC_VENDOR_DEVICE=0x[0-9A-F]{8}\r\n',raw):
                      raise SystemExit('codec vendor/device marker missing: '+repr(raw[-12000:]))
                  print(raw.decode('ascii','replace'))
                  print('HII_GRAPH_PROMPT_SPEECH_RUNTIME=PASS')
                  break
              time.sleep(.1)
          else:
              raise SystemExit('timeout: '+repr((p.read_bytes() if p.exists() else b'')[-12000:]))
          PY
          sleep 1
          kill $qpid 2>/dev/null || true
          wait $qpid 2>/dev/null || true
          trap - EXIT

      - name: Validate persistent boot-media proof
        run: |
          set -euo pipefail
          root=boot/uefi-hii-graph-prompt-speech-v1
          proof="$root/runtime-boot-media-proof.txt"
          mdir -i "$root/esp.img" ::/
          mcopy -o -i "$root/esp.img" ::/QEVARYNOX-PHYSICAL-PROOF.TXT "$proof"
          test -s "$proof"
          grep -F 'QEVARYNOX-UEFI-PHYSICAL-BOOT-PROOF-V1' "$proof"
          grep -F 'STATUS=PASS' "$proof"
          grep -F 'HII_PROMPT_SOURCE=PASS' "$proof"
          grep -F 'HDA_CONTROLLER_SELECTION=GENERIC_CLASS_0403' "$proof"
          grep -F 'HDA_CODEC_SELECTION=GENERIC_RUNTIME' "$proof"
          tr -d '\r' < "$proof" | grep -E '^HDA_CODEC_VENDOR_DEVICE=0x[0-9A-F]{8}$'
          grep -F 'HDA_GRAPH_SEARCH_LIVE=PASS' "$proof"
          grep -F 'HDA_SELECTOR_APPLY_LIVE=PASS' "$proof"
          grep -F 'HDA_OUTPUT_PATH_CONFIGURATION=PASS' "$proof"
          grep -F 'HII_GRAPH_SPEECH_DMA=PASS' "$proof"
          grep -F 'LPIB_PROGRESS=PASS' "$proof"
          grep -F 'AUDIBLE_PHYSICAL_SPEAKER=REQUIRES_HUMAN_CONFIRMATION' "$proof"
          echo HII_GRAPH_BOOT_MEDIA_PERSISTENT_PROOF=PASS

      # Interactive repeat is validated separately by os-uefi-hii-graph-repeat-v1
      # with QMP keyboard injection. This job proves the base live-HII path.

      - name: Validate waveform
        shell: python
        run: |
          from pathlib import Path
          import struct,wave
          p=Path('boot/uefi-hii-graph-prompt-speech-v1/runtime.wav')
          assert p.exists() and p.stat().st_size>10000,p
          with wave.open(str(p),'rb') as w:
              assert w.getnchannels()==2
              assert w.getframerate()==48000
              assert w.getsampwidth()==2
              raw=w.readframes(w.getnframes())
          vals=struct.unpack('<'+'h'*(len(raw)//2),raw)
          peak=max(abs(v) for v in vals)
          active=sum(abs(v)>=500 for v in vals)
          assert peak>=5000,peak
          assert active>=1000,active
          print(f'peak={peak} active={active}')
          print('HII_GRAPH_PROMPT_SPEECH_WAVEFORM=PASS')

      - uses: actions/upload-artifact@v4
        with:
          name: os-uefi-hii-graph-prompt-speech-v1
          path: |
            boot/uefi-hii-graph-prompt-speech-v1/BOOTX64.EFI
            boot/uefi-hii-graph-prompt-speech-v1/BOOTX64-REPEAT.EFI
            boot/uefi-hii-graph-prompt-speech-v1/runtime.serial
            boot/uefi-hii-graph-prompt-speech-v1/runtime.wav
            boot/uefi-hii-graph-prompt-speech-v1/runtime-boot-media-proof.txt
            boot/uefi-hii-graph-prompt-speech-v1/speech-unit-metadata.txt
            boot/uefi-hii-graph-prompt-speech-v1/build.sha256
          if-no-files-found: error
