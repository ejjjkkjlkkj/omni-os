name: lab14-atomic-concurrency

on:
  push:
    branches: [os]
    paths:
      - 'lab14/AtomicWitness.cs'
      - '.github/workflows/lab14.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  atomic-concurrency:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Execute atomic concurrency witness
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ($env:RUNNER_NAME -ne 'AMD-5800H-REAL') { throw "wrong runner: $env:RUNNER_NAME" }
          Add-Type -TypeDefinition (Get-Content 'lab14/AtomicWitness.cs' -Raw) -Language CSharp
          $result=[Lab14Witness]::Run([Environment]::ProcessorCount,100000,512)
          if ($result -notlike 'LAB14_ATOMIC=PASS*') { throw $result }
          @('LAB14',"github-run-id = $env:GITHUB_RUN_ID","runner-name = $env:RUNNER_NAME",$result,'result = PASS') |
            Set-Content 'lab14-evidence.txt' -Encoding utf8
          Get-Content 'lab14-evidence.txt'
      - name: Accessibility boundary
        shell: pwsh
        run: |
          $lines=Get-Content 'lab14/atomic-concurrency.labproof'
          if ($lines -notcontains 'human-facing = false') { throw 'human-facing boundary missing' }
          if (-not ($lines | Where-Object { $_ -like 'accessibility-gate = *' })) { throw 'accessibility gate missing' }
          'LAB14_ACCESSIBILITY_BOUNDARY=PASS'
      - name: Hash evidence
        shell: pwsh
        run: |
          Get-FileHash -Algorithm SHA256 'lab14/AtomicWitness.cs','lab14/atomic-concurrency.labproof','lab14-evidence.txt' |
            ForEach-Object { "$($_.Path) SHA256=$($_.Hash.ToLowerInvariant())" }
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: lab14-amd5800h-real-evidence
          path: lab14-evidence.txt
          if-no-files-found: error
