name: os-uefi-hda-graph-speech-v1

on:
  push:
    branches: [os]
    paths:
      - 'boot/uefi-hda-graph-speech-v1/hda_graph_speech_uefi.c'
      - 'boot/uefi-hda-graph-speech-v1/generate_speech_units.py'
      - 'boot/uefi-native-speech-v1/build_uefi_native_speech.py'
      - '.github/workflows/os-uefi-hda-graph-speech-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  q35-graph-routed-speech:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install toolchain and OVMF
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang lld qemu-system-x86 ovmf

      - name: Generate first-party speech unit bank
        run: |
          set -euo pipefail
          root=boot/uefi-hda-graph-speech-v1
          python "$root/generate_speech_units.py" "$root/speech_units.c" "$root/speech-unit-metadata.txt" | tee "$root/generator.log"
          grep -F 'runtime-sequence=e,d' "$root/speech-unit-metadata.txt"
          grep -F 'unit-bank-order=d,e' "$root/speech-unit-metadata.txt"
          grep -F 'full-utterance-asset=false' "$root/speech-unit-metadata.txt"
          echo GRAPH_SPEECH_UNIT_BANK=PASS

      - name: Enforce graph speech source contract
        shell: python
        run: |
          from pathlib import Path
          root=Path('boot/uefi-hda-graph-speech-v1')
          s=(root/'hda_graph_speech_uefi.c').read_text()
          for token in [
              'static int find_route',
              'static int apply_route',
              'static int configure_output_path',
              'static int run_speech_dma',
              'qev_unit_d_len',
              'qev_unit_e_len',
              '*(volatile u16 *)(sd + 0x0c) = 1',
              'WORD=AIDE',
              'UNIT_BANK_ORDER=d,e',
              'BDL_RUNTIME_ORDER=e,d',
              'HDA_GRAPH_SPEECH_DMA=PASS',
              'RUNTIME_ALLOPHONE_HDA=PASS',
          ]:
              assert token in s,token
          g=(root/'generate_speech_units.py').read_text()
          for token in [
              "PHRASES['help']",
              "sequence != ('e','d')",
              "bank=converted['d']+converted['e']",
              "utterance=converted['e']+converted['d']",
              "full-utterance-asset=false",
          ]:
              assert token in g,token
          print('HDA_GRAPH_SPEECH_SOURCE_CONTRACT=PASS')

      - name: Build deterministic graph speech EFI
        run: |
          set -euo pipefail
          root=boot/uefi-hda-graph-speech-v1
          flags='--target=x86_64-pc-windows-msvc -ffreestanding -fshort-wchar -fno-stack-protector -mno-red-zone -nostdlib -O2 -Wall -Wextra -Werror'
          clang $flags -c "$root/hda_graph_speech_uefi.c" -o "$root/speech.obj"
          clang $flags -c "$root/speech_units.c" -o "$root/units.obj"
          lld-link /subsystem:efi_application /entry:efi_main /nodefaultlib /machine:x64 /timestamp:0 /out:"$root/BOOTX64.EFI" "$root/speech.obj" "$root/units.obj"
          clang $flags -c "$root/hda_graph_speech_uefi.c" -o "$root/speech-2.obj"
          clang $flags -c "$root/speech_units.c" -o "$root/units-2.obj"
          lld-link /subsystem:efi_application /entry:efi_main /nodefaultlib /machine:x64 /timestamp:0 /out:"$root/BOOTX64-2.EFI" "$root/speech-2.obj" "$root/units-2.obj"
          cmp "$root/BOOTX64.EFI" "$root/BOOTX64-2.EFI"
          sha256sum "$root/BOOTX64.EFI" | tee "$root/build.sha256"
          echo HDA_GRAPH_SPEECH_BUILD=PASS

      - name: Audit graph speech EFI
        shell: python
        run: |
          from pathlib import Path
          import struct
          root=Path('boot/uefi-hda-graph-speech-v1')
          b=(root/'BOOTX64.EFI').read_bytes()
          assert b[:2]==b'MZ'
          pe=struct.unpack_from('<I',b,0x3c)[0]
          assert b[pe:pe+4]==b'PE\0\0'
          coff=pe+4
          assert struct.unpack_from('<H',b,coff)[0]==0x8664
          opt=coff+20
          assert struct.unpack_from('<H',b,opt)[0]==0x20b
          assert struct.unpack_from('<H',b,opt+0x44)[0]==10
          nsec=struct.unpack_from('<H',b,coff+2)[0]
          sec=opt+struct.unpack_from('<H',b,coff+16)[0]
          for i in range(nsec):
              ch=struct.unpack_from('<I',b,sec+i*40+36)[0]
              assert not ((ch&0x80000000) and (ch&0x20000000))
          # Clang can inline very short serial literals into instructions, so
          # short WORD/ORDER markers are source-checked above and runtime-checked
          # below instead of requiring their contiguous bytes in the PE image.
          for token in [
              b'SYNTH=ALLOPHONE_CONCATENATIVE_V1',
              b'HDA_GRAPH_SPEECH_DMA=PASS',
              b'RUNTIME_ALLOPHONE_HDA=PASS',
          ]:
              assert token in b,token
          print('HDA_GRAPH_SPEECH_PE_AUDIT=PASS')

      - name: Resolve OVMF
        run: |
          set -euo pipefail
          CODE=''; VARS=''
          for pair in             '/usr/share/OVMF/OVMF_CODE_4M.fd|/usr/share/OVMF/OVMF_VARS_4M.fd'             '/usr/share/OVMF/OVMF_CODE.fd|/usr/share/OVMF/OVMF_VARS.fd'             '/usr/share/edk2/ovmf/OVMF_CODE.fd|/usr/share/edk2/ovmf/OVMF_VARS.fd'
          do
            IFS='|' read -r code vars <<< "$pair"
            if test -f "$code" -a -f "$vars"; then CODE="$code"; VARS="$vars"; break; fi
          done
          test -n "$CODE" -a -n "$VARS"
          printf 'CODE=%s\nVARS=%s\n' "$CODE" "$VARS" > boot/uefi-hda-graph-speech-v1/ovmf.env

      - name: Speak through live HDA route graph
        run: |
          set -euo pipefail
          source boot/uefi-hda-graph-speech-v1/ovmf.env
          root=boot/uefi-hda-graph-speech-v1
          cp "$VARS" "$root/vars.fd"
          rm -rf "$root/esp"
          mkdir -p "$root/esp/EFI/BOOT"
          cp "$root/BOOTX64.EFI" "$root/esp/EFI/BOOT/BOOTX64.EFI"
          rm -f "$root/graph-speech.wav" "$root/graph-speech.serial"

          qemu-system-x86_64             -machine q35,accel=tcg             -m 128M             -drive if=pflash,format=raw,readonly=on,file="$CODE"             -drive if=pflash,format=raw,file="$root/vars.fd"             -drive format=raw,file=fat:rw:"$root/esp"             -audiodev wav,id=aud,path="$root/graph-speech.wav",out.frequency=48000,out.channels=2             -device ich9-intel-hda,bus=pcie.0,addr=1b.0,id=hda0             -device hda-duplex,bus=hda0.0,cad=0,audiodev=aud             -display none             -monitor none             -serial file:"$root/graph-speech.serial"             -parallel none             -net none             -no-reboot             -no-shutdown &
          qpid=$!
          trap 'kill $qpid 2>/dev/null || true' EXIT

          python - <<'PY'
          from pathlib import Path
          import time
          p=Path('boot/uefi-hda-graph-speech-v1/graph-speech.serial')
          req=[
              b'HDA_MULTIHOP_EFI_SELFTEST=PASS\r\n',
              b'HDA_GRAPH_SEARCH_LIVE=PASS\r\n',
              b'HDA_SELECTOR_APPLY_LIVE=PASS\r\n',
              b'HDA_OUTPUT_PATH_CONFIGURATION=PASS\r\n',
              b'SYNTH=ALLOPHONE_CONCATENATIVE_V1\r\n',
              b'WORD=AIDE\r\n',
              b'UNIT_BANK_ORDER=d,e\r\n',
              b'BDL_RUNTIME_ORDER=e,d\r\n',
              b'HDA_GRAPH_SPEECH_DMA=PASS\r\n',
              b'RUNTIME_ALLOPHONE_HDA=PASS\r\n',
              b'LPIB_PROGRESS=PASS\r\n',
              b'STATUS=PASS\r\n',
          ]
          end=time.time()+45
          while time.time()<end:
              raw=p.read_bytes() if p.exists() else b''
              if b'STATUS=BLOCKED\r\n' in raw:
                  raise SystemExit('graph speech blocked: '+repr(raw[-4096:]))
              if all(x in raw for x in req):
                  print('HDA_GRAPH_SPEECH_RUNTIME=PASS')
                  break
              time.sleep(.1)
          else:
              raise SystemExit('timeout: '+repr((p.read_bytes() if p.exists() else b'')[-4096:]))
          PY

          sleep 1
          kill $qpid 2>/dev/null || true
          wait $qpid 2>/dev/null || true
          trap - EXIT

      - name: Validate speech waveform
        shell: python
        run: |
          from pathlib import Path
          import hashlib,struct,wave
          root=Path('boot/uefi-hda-graph-speech-v1')
          p=root/'graph-speech.wav'
          assert p.exists() and p.stat().st_size>10000
          with wave.open(str(p),'rb') as w:
              channels=w.getnchannels()
              rate=w.getframerate()
              width=w.getsampwidth()
              frames=w.getnframes()
              raw=w.readframes(frames)
          assert channels==2 and rate==48000 and width==2
          vals=struct.unpack('<'+'h'*(len(raw)//2),raw)
          peak=max(abs(v) for v in vals)
          active=sum(abs(v)>=500 for v in vals)
          assert frames>=8000,frames
          assert peak>=5000,peak
          assert active>=3000,active
          metrics=(
              f"frames={frames}\n"
              f"duration={frames/rate}\n"
              f"peak={peak}\n"
              f"active-samples={active}\n"
              f"wav-sha256={hashlib.sha256(p.read_bytes()).hexdigest()}\n"
          )
          (root/'graph-speech-metrics.txt').write_text(metrics)
          print(metrics,end='')
          print('HDA_GRAPH_SPEECH_WAVEFORM=PASS')

      - uses: actions/upload-artifact@v4
        with:
          name: os-uefi-hda-graph-speech-v1-linux
          path: |
            boot/uefi-hda-graph-speech-v1/BOOTX64.EFI
            boot/uefi-hda-graph-speech-v1/graph-speech.wav
            boot/uefi-hda-graph-speech-v1/graph-speech.serial
            boot/uefi-hda-graph-speech-v1/graph-speech-metrics.txt
            boot/uefi-hda-graph-speech-v1/speech-unit-metadata.txt
            boot/uefi-hda-graph-speech-v1/generator.log
            boot/uefi-hda-graph-speech-v1/build.sha256
          if-no-files-found: error

      - name: Persist graph speech proof
        run: |
          set -euo pipefail
          root=boot/uefi-hda-graph-speech-v1
          source_file="$root/hda_graph_speech_uefi.c"
          generator="$root/generate_speech_units.py"
          speech_source="boot/uefi-native-speech-v1/build_uefi_native_speech.py"
          workflow_file=".github/workflows/os-uefi-hda-graph-speech-v1.yml"
          proof="$root/os-uefi-hda-graph-speech-v1.labproof"
          tested_source="$(git rev-parse "$GITHUB_SHA:$source_file")"
          tested_generator="$(git rev-parse "$GITHUB_SHA:$generator")"
          tested_speech_source="$(git rev-parse "$GITHUB_SHA:$speech_source")"
          tested_workflow="$(git rev-parse "$GITHUB_SHA:$workflow_file")"
          cp "$root/BOOTX64.EFI" /tmp/graph-speech.efi
          cp "$root/graph-speech.wav" /tmp/graph-speech.wav
          cp "$root/graph-speech.serial" /tmp/graph-speech.serial
          cp "$root/graph-speech-metrics.txt" /tmp/graph-speech-metrics.txt
          cp "$root/speech-unit-metadata.txt" /tmp/graph-speech-units.txt

          git fetch origin os
          git checkout -B os origin/os
          test "$tested_source" = "$(git rev-parse "os:$source_file")" || { echo GRAPH_SPEECH_STALE_SOURCE=SKIP; exit 0; }
          test "$tested_generator" = "$(git rev-parse "os:$generator")" || { echo GRAPH_SPEECH_STALE_GENERATOR=SKIP; exit 0; }
          test "$tested_speech_source" = "$(git rev-parse "os:$speech_source")" || { echo GRAPH_SPEECH_STALE_SYNTH=SKIP; exit 0; }
          test "$tested_workflow" = "$(git rev-parse "os:$workflow_file")" || { echo GRAPH_SPEECH_STALE_WORKFLOW=SKIP; exit 0; }

          python - <<'PY'
          from pathlib import Path
          import hashlib,os
          root=Path('boot/uefi-hda-graph-speech-v1')
          p=root/'os-uefi-hda-graph-speech-v1.labproof'
          kept=[]
          for line in p.read_text().splitlines():
              if line.startswith('proof = ') or line.startswith('proof-'):
                  continue
              kept.append(line)
          efi=Path('/tmp/graph-speech.efi').read_bytes()
          wav=Path('/tmp/graph-speech.wav').read_bytes()
          serial=Path('/tmp/graph-speech.serial').read_bytes()
          metrics=Path('/tmp/graph-speech-metrics.txt').read_text().strip().replace('\n','; ')
          units=Path('/tmp/graph-speech-units.txt').read_bytes()
          kept += [
              'proof = PASS',
              f"proof-run = {os.environ['GITHUB_RUN_ID']}",
              f"proof-head-sha = {os.environ['GITHUB_SHA']}",
              'proof-live-HDA-graph = PASS',
              'proof-selector-apply-readback = PASS',
              'proof-runtime-allophone-BDL-order = e,d',
              'proof-full-utterance-asset = false',
              'proof-DMA-LPIB-progress = PASS',
              'proof-speech-waveform = PASS',
              'proof-physical-ASUS-M1603QA-speech = not-established',
              f"proof-wav-metrics = {metrics}",
              f"proof-unit-metadata-sha256 = {hashlib.sha256(units).hexdigest()}",
              f"proof-efi-sha256 = {hashlib.sha256(efi).hexdigest()}",
              f"proof-wav-sha256 = {hashlib.sha256(wav).hexdigest()}",
              f"proof-serial-sha256 = {hashlib.sha256(serial).hexdigest()}",
          ]
          p.write_text('\n'.join(kept).rstrip()+'\n')
          PY

          if git diff --quiet -- "$proof"; then exit 0; fi
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$proof"
          git commit -m "Record graph-routed UEFI speech proof [skip ci]"
          for attempt in 1 2 3; do
            if git push origin os; then
              echo GRAPH_SPEECH_PROOF_PUSH=PASS
              exit 0
            fi
            git fetch origin os
            git rebase origin/os
          done
          exit 1
