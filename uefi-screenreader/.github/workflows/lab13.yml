name: lab13-cpuid-consistency

on:
  push:
    branches: [os]
    paths:
      - 'lab13/CpuidWitness.cs'
      - '.github/workflows/lab13.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpuid-consistency:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Assert runner
        shell: pwsh
        run: |
          if ($env:RUNNER_NAME -ne 'AMD-5800H-REAL') { throw "wrong runner: $env:RUNNER_NAME" }
          'LAB13_RUNNER_IDENTITY=PASS'
      - name: Execute CPUID consistency witness
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -TypeDefinition (Get-Content 'lab13/CpuidWitness.cs' -Raw) -Language CSharp
          $result = [Lab13Witness]::Run([Environment]::ProcessorCount, 64)
          if ($result -notlike 'LAB13_CPUID=PASS*') { throw $result }
          @('LAB13',"github-run-id = $env:GITHUB_RUN_ID","runner-name = $env:RUNNER_NAME",$result,'result = PASS') |
            Set-Content 'lab13-evidence.txt' -Encoding utf8
          Get-Content 'lab13-evidence.txt'
      - name: Accessibility boundary
        shell: pwsh
        run: |
          $lines=Get-Content 'lab13/cpuid-consistency.labproof'
          if ($lines -notcontains 'human-facing = false') { throw 'human-facing boundary missing' }
          if ($lines -notcontains 'accessibility-behavior = not-applicable') { throw 'accessibility behavior boundary missing' }
          if (-not ($lines | Where-Object { $_ -like 'accessibility-gate = *' })) { throw 'accessibility gate missing' }
          'LAB13_ACCESSIBILITY_BOUNDARY=PASS'
      - name: Hash evidence
        shell: pwsh
        run: |
          Get-FileHash -Algorithm SHA256 'lab13/CpuidWitness.cs','lab13/cpuid-consistency.labproof','lab13-evidence.txt' |
            ForEach-Object { "$($_.Path) SHA256=$($_.Hash.ToLowerInvariant())" }
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: lab13-amd5800h-real-evidence
          path: lab13-evidence.txt
          if-no-files-found: error
