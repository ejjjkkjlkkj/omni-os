name: lab1-observer-boundary
on:
  push:
    branches: [os]
    paths:
      - 'lab0/mark0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-observer-a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Observe source exactly
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -c < lab0/mark0)" -eq 32
          test "$(sha256sum lab0/mark0 | awk '{print $1}')" = "3a7f028ba8bb63877921ce84fdae9cc8e38387566a54c8a671a34595cfb4cd1f"
          mkdir retained
          cp lab0/mark0 retained/mark0
      - uses: actions/upload-artifact@v4
        with:
          name: lab1-linux-origin
          path: retained/mark0
          if-no-files-found: error
          retention-days: 1

  windows-observer-b:
    needs: linux-observer-a
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lab1-linux-origin
          path: recovered
      - name: Reobserve after first observer is gone
        shell: pwsh
        run: |
          $p = "recovered/mark0"
          [byte[]]$b = [IO.File]::ReadAllBytes($p)
          if ($b.Length -ne 32) { throw "length mismatch" }
          $h = (Get-FileHash $p -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($h -ne "3a7f028ba8bb63877921ce84fdae9cc8e38387566a54c8a671a34595cfb4cd1f") { throw "hash mismatch" }

  windows-observer-a:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Observe source exactly
        shell: pwsh
        run: |
          [byte[]]$b = [IO.File]::ReadAllBytes("lab0/mark0")
          if ($b.Length -ne 32) { throw "length mismatch" }
          $h = (Get-FileHash "lab0/mark0" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($h -ne "3a7f028ba8bb63877921ce84fdae9cc8e38387566a54c8a671a34595cfb4cd1f") { throw "hash mismatch" }
          New-Item -ItemType Directory -Path retained | Out-Null
          [IO.File]::WriteAllBytes("retained/mark0", $b)
      - uses: actions/upload-artifact@v4
        with:
          name: lab1-windows-origin
          path: retained/mark0
          if-no-files-found: error
          retention-days: 1

  linux-observer-b:
    needs: windows-observer-a
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lab1-windows-origin
          path: recovered
      - name: Reobserve after first observer is gone
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -c < recovered/mark0)" -eq 32
          test "$(sha256sum recovered/mark0 | awk '{print $1}')" = "3a7f028ba8bb63877921ce84fdae9cc8e38387566a54c8a671a34595cfb4cd1f"
