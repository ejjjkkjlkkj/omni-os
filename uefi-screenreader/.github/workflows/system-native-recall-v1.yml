name: system-native-recall-v1

on:
  push:
    branches: [os]
    paths:
      - 'system/native-recall-v1/NativeRecallApp.cs'
      - '.github/workflows/system-native-recall-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  amd-real-recall:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Assert recall foundations and live NVDA
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach ($p in @(
            'lab21/native-relation-core.labproof',
            'system/native-episode-v1/native-episode-v1.labproof',
            'system/native-accessibility-v1/native-accessibility-v1.labproof',
            'system/native-output-v1/native-output-v1.labproof'
          )) {
            $lines=Get-Content $p
            if ($lines -notcontains 'proof = PASS' -or $lines -notcontains 'system-foundation = true') {
              throw "required native foundation not proven: $p"
            }
          }
          if ($env:RUNNER_NAME -ne 'AMD-5800H-REAL') { throw "wrong runner: $env:RUNNER_NAME" }
          if (Get-Process -Name LogonUI -ErrorAction SilentlyContinue) { throw 'secure or locked screen detected' }
          $nvda=Get-Process -Name nvda -ErrorAction Stop | Select-Object -First 1
          "NATIVE_RECALL_PRECONDITIONS=PASS;NVDA_PID=$($nvda.Id)"

      - name: Acquire NVDA controller and create native episodic history
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force 'recall-runtime' | Out-Null

          $url='https://download.nvaccess.org/releases/stable/nvda_2026.2_controllerClient.zip'
          $zip=Join-Path $PWD 'recall-runtime/nvda_2026.2_controllerClient.zip'
          $extract=Join-Path $PWD 'recall-runtime/controller'
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          $dll=Get-ChildItem $extract -Recurse -File -Filter 'nvdaControllerClient.dll' |
            Where-Object { $_.FullName -match '[\\/]x64[\\/]' } |
            Select-Object -First 1
          if (-not $dll) { throw 'x64 nvdaControllerClient.dll not found' }
          Copy-Item $dll.FullName 'recall-runtime/nvdaControllerClient.dll' -Force

          Add-Type -TypeDefinition (Get-Content 'system/native-goal-execution-v1/NativeGoalExecutionWitness.cs' -Raw) -Language CSharp
          Add-Type -TypeDefinition (Get-Content 'system/native-episode-v1/NativeEpisodeWitness.cs' -Raw) -Language CSharp
          [NativeGoalExecutionV1]::WriteFixture('lab21/relation-compose0','identity','recall-runtime/identity.qstate')
          [NativeGoalExecutionV1]::WriteFixture('lab21/relation-compose0','exchange','recall-runtime/exchange.qstate')
          Remove-Item 'recall-runtime/history.qepisode' -Force -ErrorAction SilentlyContinue

          $I='recall-runtime/identity.qstate'
          $E='recall-runtime/exchange.qstate'
          [void][NativeEpisodeV1]::Append('lab21/relation-compose0',$I,$E,$E,$E,'recall-runtime/history.qepisode','recall-runtime/build-ep1.txt')
          [void][NativeEpisodeV1]::Append('lab21/relation-compose0',$E,$I,$I,$I,'recall-runtime/history.qepisode','recall-runtime/build-ep2.txt')
          [void][NativeEpisodeV1]::Append('lab21/relation-compose0',$E,$I,$E,$E,'recall-runtime/history.qepisode','recall-runtime/build-ep3.txt')
          [void][NativeEpisodeV1]::Append('lab21/relation-compose0',$I,$E,$I,$I,'recall-runtime/history.qepisode','recall-runtime/build-ep4.txt')

          if ((Get-Item 'recall-runtime/history.qepisode').Length -ne 16) { throw 'recall history length mismatch' }
          @(
            'controller-version = 2026.2'
            'controller-architecture = x64'
            "controller-zip-sha256 = $((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant())"
            "controller-dll-sha256 = $((Get-FileHash 'recall-runtime/nvdaControllerClient.dll' -Algorithm SHA256).Hash.ToLowerInvariant())"
            "history-before-sha256 = $((Get-FileHash 'recall-runtime/history.qepisode' -Algorithm SHA256).Hash.ToLowerInvariant())"
          ) | Set-Content 'recall-runtime/pre-evidence.txt' -Encoding utf8

      - name: Build native recall surface
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $source=Join-Path $PWD 'system/native-recall-v1/NativeRecallApp.cs'
          $out=Join-Path $PWD 'recall-runtime/native-recall-v1.exe'
          $buildScript=Join-Path $PWD 'recall-runtime/build.ps1'
          @'
          param([string]$Source,[string]$Output)
          $ErrorActionPreference='Stop'
          Add-Type -TypeDefinition (Get-Content $Source -Raw) -Language CSharp -ReferencedAssemblies @('System.Windows.Forms.dll','System.Drawing.dll') -OutputAssembly $Output -OutputType WindowsApplication
          '@ | Set-Content $buildScript -Encoding utf8
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $buildScript -Source $source -Output $out
          if ($LASTEXITCODE -ne 0) { throw "Windows PowerShell build failed: $LASTEXITCODE" }
          if (-not (Test-Path $out)) { throw 'native recall executable missing' }
          'NATIVE_RECALL_BUILD=PASS'

      - name: Navigate all episodes through UIA and keyboard
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class NativeRecallWin32 {
              [DllImport("user32.dll")]
              [return: MarshalAs(UnmanagedType.Bool)]
              public static extern bool SetForegroundWindow(IntPtr hWnd);

              [DllImport("user32.dll")]
              private static extern void keybd_event(byte bVk, byte bScan, uint dwFlags, UIntPtr dwExtraInfo);

              public static void SendVirtualKey(byte vk) {
                  keybd_event(vk, 0, 0, UIntPtr.Zero);
                  keybd_event(vk, 0, 2, UIntPtr.Zero);
              }
          }
          '@

          $exe=Join-Path $PWD 'recall-runtime/native-recall-v1.exe'
          $table=Join-Path $PWD 'lab21/relation-compose0'
          $history=Join-Path $PWD 'recall-runtime/history.qepisode'
          $trace=Join-Path $PWD 'recall-runtime/recall-trace.txt'
          Remove-Item $trace -Force -ErrorAction SilentlyContinue
          $before=(Get-FileHash $history -Algorithm SHA256).Hash.ToLowerInvariant()
          $p=Start-Process -FilePath $exe -ArgumentList @($table,$history,$trace) -PassThru

          function Wait-TraceCount([int]$count) {
            for($i=0;$i -lt 100;$i++) {
              Start-Sleep -Milliseconds 100
              if (Test-Path $trace) {
                $n=(Get-Content $trace | Where-Object { $_ -like 'carrier=*' }).Count
                if ($n -ge $count) { return }
              }
            }
            throw "recall trace did not reach $count projections"
          }

          try {
            $root=[System.Windows.Automation.AutomationElement]::RootElement
            $procCond=[System.Windows.Automation.PropertyCondition]::new(
              [System.Windows.Automation.AutomationElement]::ProcessIdProperty,[int]$p.Id
            )
            $window=$null
            for($i=0;$i -lt 100 -and -not $window;$i++) {
              Start-Sleep -Milliseconds 100
              $window=$root.FindFirst([System.Windows.Automation.TreeScope]::Children,$procCond)
            }
            if (-not $window) { throw 'native recall window not found' }

            Wait-TraceCount 1

            $nextCond=[System.Windows.Automation.PropertyCondition]::new(
              [System.Windows.Automation.AutomationElement]::NameProperty,'Next native episode'
            )
            $previousCond=[System.Windows.Automation.PropertyCondition]::new(
              [System.Windows.Automation.AutomationElement]::NameProperty,'Previous native episode'
            )
            $closeCond=[System.Windows.Automation.PropertyCondition]::new(
              [System.Windows.Automation.AutomationElement]::NameProperty,'Close native recall'
            )
            $next=$window.FindFirst([System.Windows.Automation.TreeScope]::Descendants,$nextCond)
            $previous=$window.FindFirst([System.Windows.Automation.TreeScope]::Descendants,$previousCond)
            $close=$window.FindFirst([System.Windows.Automation.TreeScope]::Descendants,$closeCond)
            if (-not $next -or -not $previous -or -not $close) { throw 'recall navigation controls missing' }

            $invokeNext=[System.Windows.Automation.InvokePattern]$next.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern)
            $invokePrev=[System.Windows.Automation.InvokePattern]$previous.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern)

            $invokeNext.Invoke()
            Wait-TraceCount 2

            [void][NativeRecallWin32]::SetForegroundWindow([IntPtr]::new($window.Current.NativeWindowHandle))
            $next.SetFocus()
            Start-Sleep -Milliseconds 250
            if (-not $next.Current.HasKeyboardFocus) { throw 'recall next control keyboard focus failed before right navigation' }
            $ws=New-Object -ComObject WScript.Shell
            [void]$ws.AppActivate([int]$p.Id)
            Start-Sleep -Milliseconds 200
            if (-not $next.Current.HasKeyboardFocus) { throw 'recall next control lost keyboard focus before right navigation' }
            $ws.SendKeys('n')
            Wait-TraceCount 3

            $window=$root.FindFirst([System.Windows.Automation.TreeScope]::Children,$procCond)
            if (-not $window) { throw 'native recall window disappeared before second assistive next' }
            $next=$window.FindFirst([System.Windows.Automation.TreeScope]::Descendants,$nextCond)
            if (-not $next) { throw 'fresh next native episode control not found' }
            $invokeNext=[System.Windows.Automation.InvokePattern]$next.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern)
            $invokeNext.Invoke()
            Wait-TraceCount 4

            $window=$root.FindFirst([System.Windows.Automation.TreeScope]::Children,$procCond)
            if (-not $window) { throw 'native recall window disappeared before keyboard previous' }
            [void][NativeRecallWin32]::SetForegroundWindow([IntPtr]::new($window.Current.NativeWindowHandle))
            [void]$ws.AppActivate([int]$p.Id)
            Start-Sleep -Milliseconds 200
            $focused=[System.Windows.Automation.AutomationElement]::FocusedElement
            if (-not $focused -or $focused.Current.ProcessId -ne $p.Id) { throw 'recall window does not own keyboard focus before P shortcut' }
            $ws.SendKeys('p')
            Wait-TraceCount 5

            $window=$root.FindFirst([System.Windows.Automation.TreeScope]::Children,$procCond)
            if (-not $window) { throw 'native recall window disappeared before first assistive previous' }
            $previous=$window.FindFirst([System.Windows.Automation.TreeScope]::Descendants,$previousCond)
            if (-not $previous) { throw 'fresh first assistive previous control not found' }
            $invokePrev=[System.Windows.Automation.InvokePattern]$previous.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern)
            $invokePrev.Invoke()
            Wait-TraceCount 6

            $window=$root.FindFirst([System.Windows.Automation.TreeScope]::Children,$procCond)
            if (-not $window) { throw 'native recall window disappeared before second assistive previous' }
            $previous=$window.FindFirst([System.Windows.Automation.TreeScope]::Descendants,$previousCond)
            if (-not $previous) { throw 'fresh second assistive previous control not found' }
            $invokePrev=[System.Windows.Automation.InvokePattern]$previous.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern)
            $invokePrev.Invoke()
            Wait-TraceCount 7

            $invokeClose=[System.Windows.Automation.InvokePattern]$close.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern)
            $invokeClose.Invoke()
            if (-not $p.WaitForExit(10000)) { throw 'native recall did not exit' }
          }
          finally {
            if (-not $p.HasExited) { $p.Kill(); $p.WaitForExit() }
          }

          $after=(Get-FileHash $history -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($before -ne $after) { throw 'read-only recall mutated native episodic history' }

          $events=Get-Content $trace | Where-Object { $_ -like 'carrier=*' }
          if ($events.Count -ne 7) { throw "expected 7 recall projections, got $($events.Count)" }

          $expected=@(
            @{carrier='startup';index='0';msg='Episode 1 of 4: current identity, goal exchange, target exchange, result exchange'},
            @{carrier='assistive-next';index='1';msg='Episode 2 of 4: current exchange, goal identity, target identity, result identity'},
            @{carrier='keyboard-n';index='2';msg='Episode 3 of 4: current exchange, goal identity, target exchange, result exchange'},
            @{carrier='assistive-next';index='3';msg='Episode 4 of 4: current identity, goal exchange, target identity, result identity'},
            @{carrier='keyboard-p';index='2';msg='Episode 3 of 4: current exchange, goal identity, target exchange, result exchange'},
            @{carrier='assistive-previous';index='1';msg='Episode 2 of 4: current exchange, goal identity, target identity, result identity'},
            @{carrier='assistive-previous';index='0';msg='Episode 1 of 4: current identity, goal exchange, target exchange, result exchange'}
          )

          for($i=0;$i -lt $expected.Count;$i++) {
            $event=$events[$i]
            $e=$expected[$i]
            foreach($required in @(
              "carrier=$($e.carrier)",
              "episode-index=$($e.index)",
              "message=$($e.msg)",
              "visible-text=$($e.msg)",
              "accessible-name=$($e.msg)",
              "speech-message=$($e.msg)",
              "braille-message=$($e.msg)",
              'nvda-running=0','nvda-speech=0','nvda-braille=0'
            )) {
              if ($event -notlike "*$required*") { throw "recall event $i missing $required :: $event" }
            }
          }

          @(
            'NATIVE-RECALL-V1'
            "github-run-id = $env:GITHUB_RUN_ID"
            "runner-name = $env:RUNNER_NAME"
            'episodes-recalled = 4'
            'assistive-next = PASS'
            'assistive-previous = PASS'
            'keyboard-n = PASS'
            'keyboard-p = PASS'
            'visible-uia-speech-braille-equivalence = PASS'
            'read-only-history = PASS'
            "history-before-sha256 = $before"
            "history-after-sha256 = $after"
            'pointer-required = false'
            'vision-required = false'
            'result = PASS'
          ) | Set-Content 'recall-runtime/evidence.txt' -Encoding utf8
          Get-Content 'recall-runtime/evidence.txt'

      - name: Enforce accessible recall contract
        shell: pwsh
        run: |
          $lines=Get-Content 'system/native-recall-v1/native-recall-v1.labproof'
          if ($lines -notcontains 'human-facing = true') { throw 'human-facing recall contract missing' }
          if ($lines -notcontains 'recall-mode = read-only') { throw 'read-only recall contract missing' }
          if ($lines -notcontains 'history-mutation = forbidden') { throw 'history mutation prohibition missing' }
          if ($lines -notcontains 'pointer-required = false') { throw 'pointer independence missing' }
          if ($lines -notcontains 'vision-required = false') { throw 'vision independence missing' }
          'NATIVE_RECALL_ACCESSIBILITY_CONTRACT=PASS'

      - name: Hash recall evidence
        shell: pwsh
        run: |
          Get-FileHash -Algorithm SHA256 'system/native-recall-v1/NativeRecallApp.cs','recall-runtime/history.qepisode','recall-runtime/recall-trace.txt','recall-runtime/pre-evidence.txt','recall-runtime/evidence.txt' |
            ForEach-Object { "$($_.Path) SHA256=$($_.Hash.ToLowerInvariant())" }

      - name: Upload recall evidence
        uses: actions/upload-artifact@v4
        with:
          name: system-native-recall-v1-amd5800h
          path: |
            recall-runtime/history.qepisode
            recall-runtime/recall-trace.txt
            recall-runtime/pre-evidence.txt
            recall-runtime/evidence.txt
          if-no-files-found: error

  linux-independent-replay:
    needs: amd-real-recall
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: system-native-recall-v1-amd5800h
          path: recall-artifact

      - name: Independently verify accessible read-only recall
        shell: python
        run: |
          from pathlib import Path
          import hashlib

          table=Path('lab21/relation-compose0').read_bytes()
          states=list(dict.fromkeys(table))
          assert len(table)==4 and len(states)==2
          def idx(x): return states.index(x)
          def compose(a,b): return table[idx(a)*2+idx(b)]
          identities=[e for e in states if all(compose(e,x)==x and compose(x,e)==x for x in states)]
          assert len(identities)==1
          identity=identities[0]
          exchange=states[1] if states[0]==identity else states[0]

          root=Path('recall-artifact')
          history=(root/'history.qepisode').read_bytes()
          assert history==bytes([
              identity,exchange,exchange,exchange,
              exchange,identity,identity,identity,
              exchange,identity,exchange,exchange,
              identity,exchange,identity,identity,
          ])
          digest=hashlib.sha256(history).hexdigest()

          events=[x for x in (root/'recall-trace.txt').read_text().splitlines() if x.startswith('carrier=')]
          assert len(events)==7
          expected=[
              ('startup',0,'Episode 1 of 4: current identity, goal exchange, target exchange, result exchange'),
              ('assistive-next',1,'Episode 2 of 4: current exchange, goal identity, target identity, result identity'),
              ('keyboard-n',2,'Episode 3 of 4: current exchange, goal identity, target exchange, result exchange'),
              ('assistive-next',3,'Episode 4 of 4: current identity, goal exchange, target identity, result identity'),
              ('keyboard-p',2,'Episode 3 of 4: current exchange, goal identity, target exchange, result exchange'),
              ('assistive-previous',1,'Episode 2 of 4: current exchange, goal identity, target identity, result identity'),
              ('assistive-previous',0,'Episode 1 of 4: current identity, goal exchange, target exchange, result exchange'),
          ]
          for event,(carrier,index,message) in zip(events,expected):
              fields=dict(part.split('=',1) for part in event.split(';'))
              assert fields['carrier']==carrier
              assert fields['episode-index']==str(index)
              for key in ('message','visible-text','accessible-name','speech-message','braille-message'):
                  assert fields[key]==message
              assert fields['nvda-running']=='0'
              assert fields['nvda-speech']=='0'
              assert fields['nvda-braille']=='0'

          evidence=(root/'evidence.txt').read_text().splitlines()
          values=dict(line.split(' = ',1) for line in evidence if ' = ' in line)
          assert values['episodes-recalled']=='4'
          assert values['assistive-next']=='PASS'
          assert values['assistive-previous']=='PASS'
          assert values['keyboard-n']=='PASS'
          assert values['keyboard-p']=='PASS'
          assert values['visible-uia-speech-braille-equivalence']=='PASS'
          assert values['read-only-history']=='PASS'
          assert values['history-before-sha256']==digest
          assert values['history-after-sha256']==digest
          assert values['result']=='PASS'

          print('NATIVE_RECALL_V1_LINUX_REPLAY=PASS;ALL_EPISODES=PASS;READ_ONLY=PASS;ACCESSIBLE_NAVIGATION=PASS')
