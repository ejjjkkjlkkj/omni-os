name: system-native-location-v1

on:
  push:
    branches: [os]
    paths:
      - 'system/native-location-v1/NativeLocationWitness.cs'
      - 'system/native-location-v1/native-location-v1.labproof'
      - '.github/workflows/system-native-location-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  amd-real-location:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Assert native location foundation and AMD carrier
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $core=Get-Content 'lab21/native-relation-core.labproof'
          if ($core -notcontains 'proof = PASS' -or $core -notcontains 'system-foundation = true') {
            throw 'LAB21 native relation foundation not proven'
          }
          $contract=Get-Content 'system/native-location-v1/native-location-v1.labproof'
          foreach($required in @(
            'location-width-relations = 8',
            'required-distinct-locations = 256',
            'location-ordering-semantics = none',
            'location-arithmetic-semantics = none',
            'pointer-semantics = none',
            'integer-address-semantics = none',
            'human-facing = false',
            'accessibility-behavior = not-applicable'
          )) {
            if ($contract -notcontains $required) { throw "missing location contract: $required" }
          }
          if ($env:RUNNER_NAME -ne 'AMD-5800H-REAL') { throw "wrong runner: $env:RUNNER_NAME" }
          'NATIVE_LOCATION_PRECONDITIONS=PASS'

      - name: Generate exhaustive native relational locations
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force 'location-runtime' | Out-Null
          Add-Type -TypeDefinition (Get-Content 'system/native-location-v1/NativeLocationWitness.cs' -Raw) -Language CSharp
          $r=[NativeLocationV1]::Generate(
            'lab21/relation-compose0',
            'location-runtime/locations.qloc',
            'location-runtime/witness.txt',
            8
          )
          $expected='NATIVE_LOCATION_V1=PASS;WIDTH=8;LOCATIONS=256;PAIR_CHECKS=32640;UNIQUE=PASS;LABEL_EXCHANGE=PASS;POINTER_SEMANTICS=NONE'
          if ($r -ne $expected) { throw $r }
          $r | Set-Content 'location-runtime/result.txt' -Encoding utf8
          $r

      - name: Independently verify AMD location artifact shape
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $bytes=[IO.File]::ReadAllBytes((Join-Path $PWD 'location-runtime/locations.qloc'))
          if ($bytes.Length -ne 2048) { throw "location artifact length mismatch: $($bytes.Length)" }

          $seen=[System.Collections.Generic.HashSet[string]]::new([StringComparer]::Ordinal)
          for($location=0;$location -lt 256;$location++) {
            $offset=$location*8
            $key=([BitConverter]::ToString($bytes,$offset,8)).Replace('-','')
            if (-not $seen.Add($key)) { throw "duplicate native location key: $key" }
          }
          if ($seen.Count -ne 256) { throw "native location unique count mismatch: $($seen.Count)" }

          $witness=Get-Content 'location-runtime/witness.txt'
          foreach($required in @(
            'width-relations=8',
            'locations=256',
            'pairwise-uniqueness-checks=32640',
            'equality=elementwise-native-relation-equality',
            'ordering-semantics=none',
            'arithmetic-semantics=none',
            'pointer-semantics=none',
            'global-label-exchange-invariance=PASS'
          )) {
            if ($witness -notcontains $required) { throw "location witness missing $required" }
          }

          @(
            'NATIVE-LOCATION-V1'
            "github-run-id = $env:GITHUB_RUN_ID"
            "runner-name = $env:RUNNER_NAME"
            'width-relations = 8'
            'distinct-locations = 256'
            'pairwise-uniqueness-checks = 32640'
            'elementwise-equality = PASS'
            'global-label-exchange-invariance = PASS'
            'ordering-semantics = none'
            'arithmetic-semantics = none'
            'pointer-semantics = none'
            'result = PASS'
          ) | Set-Content 'location-runtime/evidence.txt' -Encoding utf8
          Get-Content 'location-runtime/evidence.txt'

      - name: Enforce native location accessibility boundary
        shell: pwsh
        run: |
          $lines=Get-Content 'system/native-location-v1/native-location-v1.labproof'
          if ($lines -notcontains 'human-facing = false') { throw 'location human-facing boundary missing' }
          if ($lines -notcontains 'accessibility-behavior = not-applicable') { throw 'location accessibility boundary missing' }
          if (-not ($lines | Where-Object { $_ -like 'accessibility-gate = *' })) { throw 'location accessibility gate missing' }
          'NATIVE_LOCATION_ACCESSIBILITY_BOUNDARY=PASS'

      - name: Hash native location evidence
        shell: pwsh
        run: |
          Get-FileHash -Algorithm SHA256 'system/native-location-v1/NativeLocationWitness.cs','location-runtime/locations.qloc','location-runtime/witness.txt','location-runtime/evidence.txt' |
            ForEach-Object { "$($_.Path) SHA256=$($_.Hash.ToLowerInvariant())" }

      - name: Upload native location evidence
        uses: actions/upload-artifact@v4
        with:
          name: system-native-location-v1-amd5800h
          path: |
            location-runtime/locations.qloc
            location-runtime/witness.txt
            location-runtime/evidence.txt
          if-no-files-found: error

  linux-independent-replay:
    needs: amd-real-location
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: system-native-location-v1-amd5800h
          path: location-artifact

      - name: Independently replay native location identity
        shell: python
        run: |
          from pathlib import Path

          table=Path('lab21/relation-compose0').read_bytes()
          states=list(dict.fromkeys(table))
          assert len(table)==4 and len(states)==2
          def idx(x): return states.index(x)
          def compose(a,b): return table[idx(a)*2+idx(b)]
          identities=[e for e in states if all(compose(e,x)==x and compose(x,e)==x for x in states)]
          assert len(identities)==1
          identity=identities[0]
          exchange=states[1] if states[0]==identity else states[0]

          root=Path('location-artifact')
          raw=(root/'locations.qloc').read_bytes()
          assert len(raw)==256*8
          keys=[raw[i*8:(i+1)*8] for i in range(256)]
          assert len(set(keys))==256
          assert all(all(x in states for x in key) for key in keys)

          role_patterns=[
              tuple('I' if x==identity else 'X' for x in key)
              for key in keys
          ]
          assert len(set(role_patterns))==256
          assert len(set(role_patterns))==2**8

          a,b=states
          def swap(x):
              if x==a: return b
              if x==b: return a
              raise AssertionError('outside carrier')
          swapped_table=bytearray(4)
          for r,new_left in enumerate(states):
              for c,new_right in enumerate(states):
                  old_left=swap(new_left)
                  old_right=swap(new_right)
                  old_output=compose(old_left,old_right)
                  swapped_table[r*2+c]=swap(old_output)
          swapped_table=bytes(swapped_table)
          swapped_states=list(dict.fromkeys(swapped_table))
          def sidx(x): return swapped_states.index(x)
          def scompose(a0,b0): return swapped_table[sidx(a0)*2+sidx(b0)]
          swapped_id=[e for e in swapped_states if all(scompose(e,x)==x and scompose(x,e)==x for x in swapped_states)]
          assert len(swapped_id)==1
          swapped_identity=swapped_id[0]

          for key,pattern in zip(keys,role_patterns):
              transformed=bytes(swap(x) for x in key)
              transformed_pattern=tuple('I' if x==swapped_identity else 'X' for x in transformed)
              assert transformed_pattern==pattern

          evidence=(root/'evidence.txt').read_text().splitlines()
          required={
              'width-relations = 8',
              'distinct-locations = 256',
              'pairwise-uniqueness-checks = 32640',
              'elementwise-equality = PASS',
              'global-label-exchange-invariance = PASS',
              'ordering-semantics = none',
              'arithmetic-semantics = none',
              'pointer-semantics = none',
              'result = PASS',
          }
          assert required.issubset(set(evidence))
          print('NATIVE_LOCATION_V1_LINUX_REPLAY=PASS;UNIQUE_LOCATIONS=256;LABEL_EXCHANGE=PASS;POINTER_SEMANTICS=NONE')
