name: lab22-affinity-cpuid-topology

on:
  push:
    branches: [os]
    paths:
      - 'lab22/AffinityTopologyWitness.cs'
      - '.github/workflows/lab22.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  affinity-cpuid-topology:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Assert dedicated AMD carrier
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ($env:RUNNER_NAME -ne 'AMD-5800H-REAL') { throw "wrong runner: $env:RUNNER_NAME" }
          if ($env:RUNNER_OS -ne 'Windows') { throw "wrong OS: $env:RUNNER_OS" }
          if ($env:RUNNER_ARCH -ne 'X64') { throw "wrong architecture: $env:RUNNER_ARCH" }
          $cpu=Get-CimInstance Win32_Processor | Select-Object -First 1
          if ($cpu.Name -notmatch '5800H') { throw "wrong CPU: $($cpu.Name)" }
          if ([Environment]::ProcessorCount -ne 16) { throw "expected 16 logical processors, got $([Environment]::ProcessorCount)" }
          'LAB22_RUNNER_IDENTITY=PASS'

      - name: Execute explicit affinity and CPUID topology witness
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -TypeDefinition (Get-Content 'lab22/AffinityTopologyWitness.cs' -Raw) -Language CSharp
          $result=[Lab22Witness]::Run(16)
          if ($result -notlike 'LAB22_AFFINITY_TOPOLOGY=PASS*') { throw $result }
          @(
            'LAB22'
            "github-run-id = $env:GITHUB_RUN_ID"
            "runner-name = $env:RUNNER_NAME"
            $result
            'result = PASS'
          ) | Set-Content 'lab22-evidence.txt' -Encoding utf8
          Get-Content 'lab22-evidence.txt'

      - name: Accessibility boundary
        shell: pwsh
        run: |
          $lines=Get-Content 'lab22/affinity-topology.labproof'
          if ($lines -notcontains 'human-facing = false') { throw 'human-facing boundary missing' }
          if ($lines -notcontains 'accessibility-behavior = not-applicable') { throw 'accessibility behavior boundary missing' }
          if (-not ($lines | Where-Object { $_ -like 'accessibility-gate = *' })) { throw 'accessibility gate missing' }
          'LAB22_ACCESSIBILITY_BOUNDARY=PASS'

      - name: Hash evidence
        shell: pwsh
        run: |
          Get-FileHash -Algorithm SHA256 'lab22/AffinityTopologyWitness.cs','lab22/affinity-topology.labproof','lab22-evidence.txt' |
            ForEach-Object { "$($_.Path) SHA256=$($_.Hash.ToLowerInvariant())" }

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: lab22-amd5800h-affinity-topology
          path: lab22-evidence.txt
          if-no-files-found: error
