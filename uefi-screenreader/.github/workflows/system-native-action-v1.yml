name: system-native-action-v1

on:
  push:
    branches: [os]
    paths:
      - 'system/native-action-v1/NativeActionWitness.cs'
      - '.github/workflows/system-native-action-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  amd-real:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Assert native foundations and AMD carrier
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach ($p in @(
            'lab21/native-relation-core.labproof',
            'lab24/native-transition-core.labproof',
            'system/native-memory-v1/native-memory-v1.labproof',
            'system/native-cognition-v1/native-cognition-v1.labproof'
          )) {
            $lines=Get-Content $p
            if ($lines -notcontains 'proof = PASS' -or $lines -notcontains 'system-foundation = true') {
              throw "required native foundation not proven: $p"
            }
          }
          if ($env:RUNNER_NAME -ne 'AMD-5800H-REAL') { throw "wrong runner: $env:RUNNER_NAME" }
          $cpu=Get-CimInstance Win32_Processor | Select-Object -First 1
          if ($cpu.Name -notmatch '5800H') { throw "wrong CPU: $($cpu.Name)" }
          if ([Environment]::ProcessorCount -ne 16) { throw "expected 16 logical processors" }
          'NATIVE_ACTION_FOUNDATIONS_AND_RUNNER=PASS'

      - name: Materialize native remembered histories
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -TypeDefinition (Get-Content 'system/native-memory-v1/NativeMemoryWitness.cs' -Raw) -Language CSharp
          $write=[NativeMemoryV1]::Write('lab21/relation-compose0','action-memory',16,131072)
          if ($write -notlike 'NATIVE_MEMORY_V1_WRITE=PASS*') { throw $write }
          $read=[NativeMemoryV1]::ReadAndValidate('lab21/relation-compose0','action-memory')
          if ($read -notlike 'NATIVE_MEMORY_V1_READ=PASS*') { throw $read }
          $write
          $read

      - name: Execute native prefix actions
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -TypeDefinition (Get-Content 'system/native-action-v1/NativeActionWitness.cs' -Raw) -Language CSharp
          New-Item -ItemType Directory -Force 'action-runtime' | Out-Null
          $result=[NativeActionV1]::Execute('lab21/relation-compose0','action-memory','action-runtime/actions.txt')
          if ($result -notlike 'NATIVE_ACTION_V1=PASS*') { throw $result }
          if ($result -notlike '*ACTIONS=96*') { throw "expected 96 prefix actions: $result" }
          @(
            'NATIVE-ACTION-V1'
            "github-run-id = $env:GITHUB_RUN_ID"
            "runner-name = $env:RUNNER_NAME"
            $result
            'result = PASS'
          ) | Set-Content 'action-runtime/evidence.txt' -Encoding utf8
          Get-Content 'action-runtime/evidence.txt'
          Get-Content 'action-runtime/actions.txt' | Select-Object -First 10

      - name: Accessibility boundary
        shell: pwsh
        run: |
          $lines=Get-Content 'system/native-action-v1/native-action-v1.labproof'
          if ($lines -notcontains 'human-facing = false') { throw 'human-facing boundary missing' }
          if ($lines -notcontains 'accessibility-behavior = not-applicable') { throw 'accessibility behavior boundary missing' }
          if (-not ($lines | Where-Object { $_ -like 'accessibility-gate = *' })) { throw 'accessibility gate missing' }
          'NATIVE_ACTION_ACCESSIBILITY_BOUNDARY=PASS'

      - name: Hash action carrier set
        shell: pwsh
        run: |
          Get-FileHash -Algorithm SHA256 'system/native-action-v1/NativeActionWitness.cs','action-runtime/actions.txt','action-runtime/evidence.txt','action-memory/manifest.txt' |
            ForEach-Object { "$($_.Path) SHA256=$($_.Hash.ToLowerInvariant())" }

      - name: Upload AMD action carrier
        uses: actions/upload-artifact@v4
        with:
          name: system-native-action-v1-amd5800h
          path: |
            action-memory
            action-runtime
          if-no-files-found: error

  linux-independent-replay:
    needs: amd-real
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: system-native-action-v1-amd5800h
          path: action-artifact

      - name: Independently replay every AMD prefix action
        shell: python
        run: |
          from pathlib import Path

          table=Path('lab21/relation-compose0').read_bytes()
          assert len(table)==4
          states=list(dict.fromkeys(table))
          assert len(states)==2
          def idx(x): return states.index(x)
          def compose(a,b): return table[idx(a)*2+idx(b)]

          identities=[e for e in states if all(compose(e,x)==x and compose(x,e)==x for x in states)]
          assert len(identities)==1
          identity=identities[0]

          root=Path('action-artifact/action-memory')
          manifest=(root/'manifest.txt').read_text().splitlines()
          streams=int(manifest[1].split('=',1)[1])
          assert streams==16

          records=Path('action-artifact/action-runtime/actions.txt').read_text().splitlines()
          assert records[0]=='NATIVE-ACTION-V1'
          assert int(records[1].split('=',1)[1])==streams
          assert int(records[2].split('=',1)[1])==identity
          assert len(records)==3+96

          by_key={}
          for line in records[3:]:
              f=dict(part.split('=',1) for part in line.split(';'))
              by_key[(int(f['stream']),int(f['cut']))]=f

          verified=0
          journals=[]
          for stream in range(streams):
              mf=dict(part.split('=',1) for part in manifest[5+stream].split(';'))
              journal=(root/f'stream-{stream:02d}.qmem').read_bytes()
              journals.append(journal)
              cuts=sorted(int(k[1:]) for k in mf if k.startswith('c') and k[1:].isdigit())
              for cut in cuts:
                  observed=identity
                  for a in journal[:cut]:
                      observed=compose(observed,a)
                  assert observed==int(mf[f'c{cut}'])
                  rec=by_key[(stream,cut)]
                  assert int(rec['observed'])==observed
                  action=int(rec['action'])
                  actual=int(rec['actual'])
                  goal=int(rec['goal'])
                  assert goal==identity
                  assert compose(observed,action)==identity
                  assert compose(action,observed)==identity
                  assert actual==identity
                  verified+=1

          assert verified==96
          assert len(set(journals))==16
          print(f'NATIVE_ACTION_V1_LINUX_REPLAY=PASS;STREAMS={streams};ACTIONS={verified};DISTINCT_HISTORIES={len(set(journals))}')
