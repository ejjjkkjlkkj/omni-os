name: os-uefi-hda-graph-live-v1

on:
  push:
    branches: [os]
    paths:
      - 'boot/uefi-hda-graph-live-v1/hda_graph_uefi.c'
      - '.github/workflows/os-uefi-hda-graph-live-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  q35-live-hda-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install freestanding toolchain and OVMF
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang lld qemu-system-x86 ovmf

      - name: Enforce source contract
        shell: python
        run: |
          from pathlib import Path
          p=Path('boot/uefi-hda-graph-live-v1/hda_graph_uefi.c')
          s=p.read_text()
          required=[
              'get_conn_entry(node, base)',
              'previous_was_range',
              'static int find_route',
              'static int graph_selftest',
              'static int apply_route',
              'static int discover_live_graph',
              'encode_verb12(2, 0x14, 0x701, 3)',
              'get_conn_select',
              'set_conn_select',
              'WIDGET_MIXER',
              'WIDGET_SELECTOR',
              'verb12(nid, 0xf02, index)',
              'HDA_MULTIHOP_EFI_SELFTEST=PASS',
              'HDA_GRAPH_SEARCH_LIVE=PASS',
              'PHYSICAL_ASUS_M1603QA_SPEECH=NOT_ESTABLISHED',
          ]
          for token in required:
              assert token in s, token
          assert '#include' not in s
          assert 'efi_main' in s
          assert 'EFI_SYSTEM_TABLE' not in s
          assert 'EFI_BOOT_SERVICES' not in s
          print('HDA_GRAPH_LIVE_SOURCE_CONTRACT=PASS')

      - name: Build deterministic PE32+ EFI twice
        run: |
          set -euo pipefail
          root=boot/uefi-hda-graph-live-v1
          flags='--target=x86_64-pc-windows-msvc -ffreestanding -fshort-wchar -fno-stack-protector -mno-red-zone -nostdlib -O2 -Wall -Wextra -Werror'
          clang $flags -c "$root/hda_graph_uefi.c" -o "$root/hda_graph_uefi.obj"
          lld-link /subsystem:efi_application /entry:efi_main /nodefaultlib /machine:x64 /timestamp:0 /out:"$root/BOOTX64.EFI" "$root/hda_graph_uefi.obj"
          clang $flags -c "$root/hda_graph_uefi.c" -o "$root/hda_graph_uefi-2.obj"
          lld-link /subsystem:efi_application /entry:efi_main /nodefaultlib /machine:x64 /timestamp:0 /out:"$root/BOOTX64-2.EFI" "$root/hda_graph_uefi-2.obj"
          cmp "$root/BOOTX64.EFI" "$root/BOOTX64-2.EFI"
          sha256sum "$root/BOOTX64.EFI" | tee "$root/build.sha256"
          echo HDA_GRAPH_LIVE_BUILD=PASS

      - name: Audit PE and W xor X
        shell: python
        run: |
          from pathlib import Path
          import struct
          p=Path('boot/uefi-hda-graph-live-v1/BOOTX64.EFI')
          b=p.read_bytes()
          assert b[:2] == b'MZ'
          pe=struct.unpack_from('<I',b,0x3c)[0]
          assert b[pe:pe+4] == b'PE\0\0'
          coff=pe+4
          machine,nsec=struct.unpack_from('<HH',b,coff)
          assert machine == 0x8664
          opt=coff+20
          assert struct.unpack_from('<H',b,opt)[0] == 0x20b
          assert struct.unpack_from('<H',b,opt+0x44)[0] == 10
          opt_size=struct.unpack_from('<H',b,coff+16)[0]
          sec=opt+opt_size
          names=[]
          for i in range(nsec):
              o=sec+i*40
              name=b[o:o+8].rstrip(b'\0').decode('ascii')
              ch=struct.unpack_from('<I',b,o+36)[0]
              writable=bool(ch & 0x80000000)
              executable=bool(ch & 0x20000000)
              assert not (writable and executable), (name,hex(ch))
              names.append(name)
          assert '.text' in names
          image_strings=[
              b'HDA_MULTIHOP_EFI_SELFTEST=PASS',
              b'HDA_GRAPH_SEARCH_LIVE=PASS',
              b'NO_FIXED_WIDGET_NIDS=PASS',
              b'PHYSICAL_ASUS_M1603QA_SPEECH=NOT_ESTABLISHED',
          ]
          for token in image_strings:
              assert token in b,token
          print('HDA_GRAPH_LIVE_PE_AUDIT=PASS')
          print('W_X=BLOCKED')

      - name: Resolve OVMF
        run: |
          set -euo pipefail
          CODE=''; VARS=''
          for pair in             '/usr/share/OVMF/OVMF_CODE_4M.fd|/usr/share/OVMF/OVMF_VARS_4M.fd'             '/usr/share/OVMF/OVMF_CODE.fd|/usr/share/OVMF/OVMF_VARS.fd'             '/usr/share/edk2/ovmf/OVMF_CODE.fd|/usr/share/edk2/ovmf/OVMF_VARS.fd'
          do
            IFS='|' read -r code vars <<< "$pair"
            if test -f "$code" -a -f "$vars"; then CODE="$code"; VARS="$vars"; break; fi
          done
          test -n "$CODE" -a -n "$VARS"
          printf 'CODE=%s\nVARS=%s\n' "$CODE" "$VARS" > boot/uefi-hda-graph-live-v1/ovmf.env

      - name: Execute live HDA graph engine under OVMF
        run: |
          set -euo pipefail
          source boot/uefi-hda-graph-live-v1/ovmf.env
          root=boot/uefi-hda-graph-live-v1
          cp "$VARS" "$root/vars.fd"
          rm -rf "$root/esp"
          mkdir -p "$root/esp/EFI/BOOT"
          cp "$root/BOOTX64.EFI" "$root/esp/EFI/BOOT/BOOTX64.EFI"
          rm -f "$root/graph.serial"

          qemu-system-x86_64             -machine q35,accel=tcg             -m 128M             -drive if=pflash,format=raw,readonly=on,file="$CODE"             -drive if=pflash,format=raw,file="$root/vars.fd"             -drive format=raw,file=fat:rw:"$root/esp"             -device ich9-intel-hda,bus=pcie.0,addr=1b.0,id=hda0             -device hda-duplex,bus=hda0.0,cad=0             -display none             -monitor none             -serial file:"$root/graph.serial"             -parallel none             -net none             -no-reboot             -no-shutdown &
          qpid=$!
          trap 'kill $qpid 2>/dev/null || true' EXIT

          python - <<'PY'
          from pathlib import Path
          import re,time
          p=Path('boot/uefi-hda-graph-live-v1/graph.serial')
          req=[
              b'FRAMEWORK=NONE\r\n',
              b'EDK2=NONE\r\n',
              b'NO_FIXED_WIDGET_NIDS=PASS\r\n',
              b'HDA_MULTIHOP_EFI_SELFTEST=PASS\r\n',
              b'HDA_RANGE_AND_SELECTOR_ENGINE=PASS\r\n',
              b'HDA_CONTROLLER_CODEC=PASS\r\n',
              b'HDA_AFG_RUNTIME=PASS\r\n',
              b'HDA_WIDGET_ENUMERATION=PASS\r\n',
              b'HDA_CONNECTION_LIST_DECODE=PASS\r\n',
              b'HDA_GRAPH_SEARCH_LIVE=PASS\r\n',
              b'HDA_SELECTOR_PLAN=PASS\r\n',
              b'PHYSICAL_ASUS_M1603QA_SPEECH=NOT_ESTABLISHED\r\n',
              b'STATUS=PASS\r\n',
          ]
          end=time.time()+45
          while time.time()<end:
              raw=p.read_bytes() if p.exists() else b''
              if b'STATUS=BLOCKED\r\n' in raw:
                  raise SystemExit('graph engine blocked: '+repr(raw[-4096:]))
              if all(x in raw for x in req):
                  break
              time.sleep(.1)
          else:
              raise SystemExit('timeout: '+repr((p.read_bytes() if p.exists() else b'')[-4096:]))
          text=raw.decode('ascii','replace')
          pin=re.search(r'HDA_PIN_NID=0x([0-9A-F]{2})',text)
          dac=re.search(r'HDA_DAC_NID=0x([0-9A-F]{2})',text)
          depth=re.search(r'HDA_ROUTE_DEPTH=0x([0-9A-F]{2})',text)
          selectors=re.search(r'HDA_SELECTOR_WRITES_REQUIRED=0x([0-9A-F]{2})',text)
          applied=re.search(r'HDA_SELECTOR_WRITES_APPLIED=0x([0-9A-F]{2})',text)
          assert pin and dac and depth and selectors and applied
          assert int(applied.group(1),16) == int(selectors.group(1),16)
          metrics=(
              f"pin-nid=0x{pin.group(1)}\n"
              f"dac-nid=0x{dac.group(1)}\n"
              f"route-depth={int(depth.group(1),16)}\n"
              f"selector-writes-required={int(selectors.group(1),16)}\n"
              f"selector-writes-applied={int(applied.group(1),16)}\n"
          )
          Path('boot/uefi-hda-graph-live-v1/graph-metrics.txt').write_text(metrics)
          print(metrics,end='')
          print('HDA_GRAPH_LIVE_RUNTIME=PASS')
          PY

          kill $qpid 2>/dev/null || true
          wait $qpid 2>/dev/null || true
          trap - EXIT

      - uses: actions/upload-artifact@v4
        with:
          name: os-uefi-hda-graph-live-v1-linux
          path: |
            boot/uefi-hda-graph-live-v1/BOOTX64.EFI
            boot/uefi-hda-graph-live-v1/graph.serial
            boot/uefi-hda-graph-live-v1/graph-metrics.txt
            boot/uefi-hda-graph-live-v1/build.sha256
          if-no-files-found: error

      - name: Persist revision-bound live graph proof
        run: |
          set -euo pipefail
          root=boot/uefi-hda-graph-live-v1
          source_file="$root/hda_graph_uefi.c"
          workflow_file=".github/workflows/os-uefi-hda-graph-live-v1.yml"
          proof="$root/os-uefi-hda-graph-live-v1.labproof"
          tested_source="$(git rev-parse "$GITHUB_SHA:$source_file")"
          tested_workflow="$(git rev-parse "$GITHUB_SHA:$workflow_file")"
          cp "$root/BOOTX64.EFI" /tmp/hda-graph-live.efi
          cp "$root/graph.serial" /tmp/hda-graph-live.serial
          cp "$root/graph-metrics.txt" /tmp/hda-graph-live-metrics.txt

          git fetch origin os
          git checkout -B os origin/os
          test "$tested_source" = "$(git rev-parse "os:$source_file")" || { echo HDA_GRAPH_LIVE_STALE_SOURCE=SKIP; exit 0; }
          test "$tested_workflow" = "$(git rev-parse "os:$workflow_file")" || { echo HDA_GRAPH_LIVE_STALE_WORKFLOW=SKIP; exit 0; }

          python - <<'PY'
          from pathlib import Path
          import hashlib,os
          root=Path('boot/uefi-hda-graph-live-v1')
          p=root/'os-uefi-hda-graph-live-v1.labproof'
          kept=[]
          for line in p.read_text().splitlines():
              if line.startswith('proof = ') or line.startswith('proof-'):
                  continue
              kept.append(line)
          efi=Path('/tmp/hda-graph-live.efi').read_bytes()
          serial=Path('/tmp/hda-graph-live.serial').read_bytes()
          metrics=Path('/tmp/hda-graph-live-metrics.txt').read_text().strip().replace('\n','; ')
          kept += [
              'proof = PASS',
              f"proof-run = {os.environ['GITHUB_RUN_ID']}",
              f"proof-head-sha = {os.environ['GITHUB_SHA']}",
              'proof-freestanding-UEFI = PASS',
              'proof-EDK2 = none',
              'proof-multihop-EFI-selftest = PASS',
              'proof-live-HDA-widget-enumeration = PASS',
              'proof-live-HDA-connection-decode = PASS',
              'proof-live-HDA-graph-search = PASS',
              'proof-live-selector-plan = PASS',
              'proof-live-selector-apply-readback = PASS',
              'proof-physical-ASUS-M1603QA-speech = not-established',
              f"proof-live-metrics = {metrics}",
              f"proof-efi-sha256 = {hashlib.sha256(efi).hexdigest()}",
              f"proof-serial-sha256 = {hashlib.sha256(serial).hexdigest()}",
          ]
          p.write_text('\n'.join(kept).rstrip()+'\n')
          PY

          if git diff --quiet -- "$proof"; then exit 0; fi
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$proof"
          git commit -m "Record live UEFI HDA graph proof [skip ci]"

          for attempt in 1 2 3; do
            if git push origin os; then
              echo HDA_GRAPH_LIVE_PROOF_PUSH=PASS
              exit 0
            fi
            git fetch origin os
            git rebase origin/os
          done
          exit 1
