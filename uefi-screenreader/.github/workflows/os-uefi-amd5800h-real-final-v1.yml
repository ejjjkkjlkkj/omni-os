name: os-uefi-amd5800h-real-final-v1

on:
  push:
    branches: [os]
    paths:
      - 'boot/uefi-hii-current-option-speech-v1/build_uefi_hii_current_option_speech.py'
      - 'boot/uefi-hii-option-speech-v1/build_uefi_hii_option_speech.py'
      - 'boot/uefi-hii-prompt-speech-v1/build_uefi_hii_prompt_speech.py'
      - 'boot/uefi-hda-graph-speech-v1/hda_graph_speech_uefi.c'
      - 'boot/uefi-hda-graph-speech-v1/generate_speech_units.py'
      - 'boot/uefi-hii-graph-prompt-speech-v1/hii_graph_prompt_speech_uefi.c'
      - 'boot/uefi-hii-graph-prompt-speech-v1/generate_units.py'
      - 'boot/uefi-native-speech-v1/build_uefi_native_speech.py'
      - 'boot/uefi-amd5800h-real-final-v1/os-uefi-amd5800h-real-final-v1.labproof'
      - 'boot/uefi-hii-current-option-speech-v1/os-uefi-hii-current-option-speech-v1.labproof'
      - 'boot/uefi-hii-platform-commit-v1/os-uefi-hii-platform-commit-v1.labproof'
      - 'boot/uefi-secure-boot-v1/os-uefi-secure-boot-v1.labproof'
      - 'boot/uefi-hii-graph-prompt-speech-v1/os-uefi-hii-graph-prompt-speech-v1.labproof'
      - 'boot/uefi-physical-audio-v1/os-uefi-physical-audio-probe-v1.labproof'
      - 'boot/uefi-asus-m1603qa-preflight-v1/os-uefi-asus-m1603qa-preflight-v1.labproof'
      - 'boot/uefi-physical-boot-proof-v1/os-uefi-physical-boot-proof-v1.labproof'
      - '.github/workflows/os-uefi-amd5800h-real-final-v1.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# Each tested revision gets its own closure run; later commits cannot evict it.
concurrency:
  group: os-uefi-amd5800h-real-final-v3-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build-graph-efi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Cancel stale AMD hardware runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export current="$GITHUB_RUN_ID"
          export current_number="$GITHUB_RUN_NUMBER"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=os&per_page=100" --jq \
            '.workflow_runs[] | select(.status=="queued" or .status=="pending" or .status=="in_progress") | select(.name=="os-uefi-amd5800h-real-final-v1" and .run_number < (env.current_number|tonumber)) | .id' \
            | while read -r run; do
                test -n "$run" || continue
                echo "Cancelling older AMD closure run $run"
                gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$run/cancel" >/dev/null || true
                gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$run/force-cancel" >/dev/null || true
              done
          echo AMD_FINAL_OLDER_RUNS_PRUNED=PASS
      - name: Require proven UEFI accessibility dependencies
        shell: bash
        run: |
          set -euo pipefail
          current='boot/uefi-hii-current-option-speech-v1/os-uefi-hii-current-option-speech-v1.labproof'
          commit='boot/uefi-hii-platform-commit-v1/os-uefi-hii-platform-commit-v1.labproof'
          secure='boot/uefi-secure-boot-v1/os-uefi-secure-boot-v1.labproof'
          graph='boot/uefi-hii-graph-prompt-speech-v1/os-uefi-hii-graph-prompt-speech-v1.labproof'
          physicalAudio='boot/uefi-physical-audio-v1/os-uefi-physical-audio-probe-v1.labproof'
          asusPreflight='boot/uefi-asus-m1603qa-preflight-v1/os-uefi-asus-m1603qa-preflight-v1.labproof'
          for p in "$current" "$commit" "$secure" "$graph" "$physicalAudio" "$asusPreflight"; do
            test -s "$p"
            grep -Fx 'proof = PASS' "$p"
          done
          grep -Fx 'proof-live-current-option-identity = PASS' "$current"
          grep -Fx 'proof-current-label-hardcoded = false' "$current"
          grep -Fx 'proof-route-config = PASS' "$commit"
          grep -Fx 'proof-confirmation-speech = PASS' "$commit"
          grep -Fx 'proof-reboot-persistence = PASS' "$commit"
          grep -Fx 'proof-secure-boot-enforcement = PASS' "$secure"
          grep -Fx 'proof-unsigned-negative-control = PASS' "$secure"
          grep -Fx 'proof-signed-positive-control = PASS' "$secure"
          grep -Fx 'proof-HII-prompt-speech-HDA = PASS' "$graph"
          grep -Fx 'proof-physical-UEFI-speech = not-established' "$physicalAudio"
          grep -Fq 'VEN_1022&DEV_15E3' "$physicalAudio"
          grep -Fq 'VEN_10EC&DEV_0256' "$physicalAudio"
          grep -Fx 'proof-hardware-identity = PASS' "$asusPreflight"
          grep -Fx 'proof-uefi-presence = PASS' "$asusPreflight"
          grep -Fx 'proof-audio-inventory = PASS' "$asusPreflight"
          grep -Fx 'proof-reboot = false' "$asusPreflight"
          grep -Fx 'proof-setting-mutation = false' "$asusPreflight"
          echo PHYSICAL_ASUS_READONLY_PROOFS=PASS
          echo UEFI_ACCESSIBILITY_DEPENDENCIES=PASS
          echo HII_CURRENT_VALUE_PROOF=PASS
          echo HII_PERSISTENT_COMMIT_PROOF=PASS
          echo OVMF_SECURE_BOOT_PROOF=PASS

      - name: Build deterministic multi-hop HDA graph EFI
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang lld
          root=boot/uefi-hda-graph-speech-v1
          python "$root/generate_speech_units.py" "$root/speech_units.c" "$root/speech-unit-metadata.txt"
          flags='--target=x86_64-pc-windows-msvc -ffreestanding -fshort-wchar -fno-stack-protector -mno-red-zone -nostdlib -O2 -Wall -Wextra -Werror'
          clang $flags -c "$root/hda_graph_speech_uefi.c" -o "$root/speech.obj"
          clang $flags -c "$root/speech_units.c" -o "$root/units.obj"
          lld-link /subsystem:efi_application /entry:efi_main /nodefaultlib /machine:x64 /timestamp:0 /out:"$root/graph.EFI" "$root/speech.obj" "$root/units.obj"
          test -s "$root/graph.EFI"
          sha256sum "$root/graph.EFI"

          hiiroot=boot/uefi-hii-graph-prompt-speech-v1
          python "$hiiroot/generate_units.py" "$hiiroot/speech_units.c" "$hiiroot/speech-unit-metadata.txt"
          hiiflags='--target=x86_64-pc-windows-msvc -ffreestanding -fshort-wchar -fno-stack-protector -fno-builtin -mno-red-zone -nostdlib -O2 -Wall -Wextra -Werror'
          clang $hiiflags -c "$hiiroot/hii_graph_prompt_speech_uefi.c" -o "$hiiroot/main.obj"
          clang $hiiflags -c "$hiiroot/speech_units.c" -o "$hiiroot/units.obj"
          lld-link /subsystem:efi_application /entry:efi_main /nodefaultlib /machine:x64 /timestamp:0 /out:"$hiiroot/hii-graph.EFI" "$hiiroot/main.obj" "$hiiroot/units.obj"
          test -s "$hiiroot/hii-graph.EFI"
          grep -aF 'HDA_CODEC_SELECTION=REALTEK_10EC_0256' "$hiiroot/hii-graph.EFI"
          grep -aF 'HDA_CODEC_SELECTION=GENERIC_RUNTIME' "$hiiroot/hii-graph.EFI"
          grep -aF 'PHYSICAL_ASUS_M1603QA_HDA_RUNTIME=PASS' "$hiiroot/hii-graph.EFI"
          grep -aF 'PHYSICAL_ASUS_M1603QA_INTERNAL_SPEAKER_PIN=PASS' "$hiiroot/hii-graph.EFI"
          grep -aF 'PHYSICAL_ASUS_M1603QA_AUDIBLE_SPEAKER=REQUIRES_HUMAN_CONFIRMATION' "$hiiroot/hii-graph.EFI"
          clang $hiiflags -c "$hiiroot/hii_graph_prompt_speech_uefi.c" -o "$hiiroot/main-2.obj"
          clang $hiiflags -c "$hiiroot/speech_units.c" -o "$hiiroot/units-2.obj"
          lld-link /subsystem:efi_application /entry:efi_main /nodefaultlib /machine:x64 /timestamp:0 /out:"$hiiroot/hii-graph-2.EFI" "$hiiroot/main-2.obj" "$hiiroot/units-2.obj"
          cmp "$hiiroot/hii-graph.EFI" "$hiiroot/hii-graph-2.EFI"
          rm -f "$hiiroot/hii-graph-2.EFI"
          sha256sum "$hiiroot/hii-graph.EFI"

          clang $hiiflags -DQEV_INTERACTIVE_NAV=1 -c "$hiiroot/hii_graph_prompt_speech_uefi.c" -o "$hiiroot/main-nav.obj"
          lld-link /subsystem:efi_application /entry:efi_main /nodefaultlib /machine:x64 /timestamp:0 /out:"$hiiroot/hii-graph-nav.EFI" "$hiiroot/main-nav.obj" "$hiiroot/units.obj"
          test -s "$hiiroot/hii-graph-nav.EFI"
          for marker in \
            'HII_GRAPH_NAV_READY=PASS' \
            'HII_GRAPH_NAV_KEY=UP' \
            'HII_GRAPH_NAV_KEY=DOWN' \
            'HII_GRAPH_NAV_KEY=HOME' \
            'HII_GRAPH_NAV_KEY=END' \
            'HII_GRAPH_NAV_KEY=PAGE_UP' \
            'HII_GRAPH_NAV_KEY=PAGE_DOWN' \
            'HII_GRAPH_NAV_KEY=R' \
            'HII_GRAPH_NAV_KEY=ESC' \
            'HII_GRAPH_NAV_REQUIRED_EVENTS=PASS' \
            'HII_GRAPH_NAV_SPEECH_DMA=PASS' \
            'HII_GRAPH_SPEECH_DMA_REUSE=PASS'
          do
            grep -aF "$marker" "$hiiroot/hii-graph-nav.EFI"
          done
          clang $hiiflags -DQEV_INTERACTIVE_NAV=1 -c "$hiiroot/hii_graph_prompt_speech_uefi.c" -o "$hiiroot/main-nav-2.obj"
          lld-link /subsystem:efi_application /entry:efi_main /nodefaultlib /machine:x64 /timestamp:0 /out:"$hiiroot/hii-graph-nav-2.EFI" "$hiiroot/main-nav-2.obj" "$hiiroot/units.obj"
          cmp "$hiiroot/hii-graph-nav.EFI" "$hiiroot/hii-graph-nav-2.EFI"
          rm -f "$hiiroot/hii-graph-nav-2.EFI"
          sha256sum "$hiiroot/hii-graph-nav.EFI"

          stage=boot/uefi-amd5800h-real-final-v1/build-artifact
          rm -rf "$stage"
          mkdir -p "$stage"
          cp "$root/graph.EFI" "$stage/graph.EFI"
          cp "$hiiroot/hii-graph.EFI" "$stage/hii-graph.EFI"
          cp "$hiiroot/hii-graph-nav.EFI" "$stage/hii-graph-nav.EFI"
          echo AMD5800H_HII_GRAPH_EFI_BUILD=PASS
          echo AMD5800H_HII_GRAPH_NAV_EFI_BUILD=PASS
          echo AMD5800H_HII_GRAPH_NAV_EFI_DETERMINISM=PASS
          echo AMD5800H_HII_GRAPH_EFI_DETERMINISM=PASS
      - uses: actions/upload-artifact@v4
        with:
          name: amd5800h-graph-efi
          path: boot/uefi-amd5800h-real-final-v1/build-artifact/
          if-no-files-found: error

  amd5800h-final:
    needs: build-graph-efi
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 50
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v5
        with:
          path: src
          fetch-depth: 8
          clean: false

      - name: Reset generated AMD evidence workspace
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $evidence='boot/uefi-amd5800h-real-final-v1/evidence'

          # A cancelled Hyper-V gate can leave VM configuration files locked.
          # Remove only QEVARYNOX test VMs from older runs before touching evidence.
          Import-Module Hyper-V -ErrorAction SilentlyContinue
          if(Get-Command Get-VM -ErrorAction SilentlyContinue){
            $stale=@(Get-VM -ErrorAction SilentlyContinue | Where-Object { $_.Name -like 'QEV-UEFI-*' })
            foreach($vm in $stale){
              Stop-VM -VM $vm -TurnOff -Force -ErrorAction SilentlyContinue
              Remove-VM -VM $vm -Force -ErrorAction SilentlyContinue
            }
          }

          if(Test-Path $evidence){
            for($attempt=1;$attempt -le 8 -and (Test-Path $evidence);$attempt++){
              Remove-Item $evidence -Recurse -Force -ErrorAction SilentlyContinue
              if(Test-Path $evidence){ Start-Sleep -Milliseconds (250 * $attempt) }
            }
            if(Test-Path $evidence){
              $locked=@(Get-ChildItem $evidence -Recurse -Force -ErrorAction SilentlyContinue | Select-Object -First 20 -ExpandProperty FullName)
              throw "Unable to reset AMD evidence workspace after Hyper-V cleanup. Remaining: $($locked -join '; ')"
            }
          }
          New-Item -ItemType Directory -Force $evidence | Out-Null
          'AMD5800H_STALE_HYPERV_CLEANUP=PASS'
          'AMD5800H_TARGETED_WORKSPACE_RESET=PASS'

      - uses: actions/download-artifact@v5
        with:
          name: amd5800h-graph-efi
          path: src/boot/uefi-amd5800h-real-final-v1/evidence

      - name: Bind exact physical runner and inventory host
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ($env:RUNNER_NAME -ne 'AMD-5800H-REAL') { throw "wrong runner: $env:RUNNER_NAME" }
          $cs=Get-CimInstance Win32_ComputerSystem
          $cpu=Get-CimInstance Win32_Processor | Select-Object -First 1
          $bios=Get-CimInstance Win32_BIOS
          $os=Get-CimInstance Win32_OperatingSystem
          $dg=Get-CimInstance -Namespace root\Microsoft\Windows\DeviceGuard -ClassName Win32_DeviceGuard -ErrorAction Stop

          if ([string]$cs.Manufacturer -notmatch 'ASUSTeK') { throw "unexpected manufacturer: $($cs.Manufacturer)" }
          if ([string]$cs.Model -notmatch 'M1603QA') { throw "unexpected model: $($cs.Model)" }
          if ([string]$cpu.Name -notmatch '5800H') { throw "unexpected cpu: $($cpu.Name)" }
          if ([string]$bios.SMBIOSBIOSVersion -ne 'M1603QA.308') { throw "unexpected BIOS: $($bios.SMBIOSBIOSVersion)" }
          if ([string]$os.BuildNumber -ne '26300') { throw "unexpected Windows build: $($os.BuildNumber)" }
          if (-not [bool]$cs.HypervisorPresent) { throw 'expected Windows hypervisor/VBS host state' }
          if ([int]$dg.VirtualizationBasedSecurityStatus -ne 2) { throw "VBS is not running: $($dg.VirtualizationBasedSecurityStatus)" }
          if (-not (@($dg.SecurityServicesRunning) -contains 1)) { throw 'Credential Guard is not running' }
          if ([uint64]$cs.TotalPhysicalMemory -lt 39GB) { throw "unexpected RAM: $($cs.TotalPhysicalMemory)" }

          $identity=[Security.Principal.WindowsIdentity]::GetCurrent()
          $principal=[Security.Principal.WindowsPrincipal]::new($identity)
          if(-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)){
            throw "AMD-5800H-REAL runner must be started from an elevated Administrator console"
          }

          try {
            $secureBoot=[bool](Confirm-SecureBootUEFI)
          } catch {
            throw "UEFI Secure Boot state unavailable: $($_.Exception.Message)"
          }
          if($secureBoot){ throw 'physical target requires Secure Boot disabled for the current unsigned pre-OS test image' }

          New-Item -ItemType Directory -Force boot/uefi-amd5800h-real-final-v1/evidence | Out-Null
          @(
            "runner=$env:RUNNER_NAME"
            "manufacturer=$($cs.Manufacturer)"
            "model=$($cs.Model)"
            "cpu=$($cpu.Name)"
            "bios=$($bios.SMBIOSBIOSVersion)"
            "windows-caption=$($os.Caption)"
            "windows-version=$($os.Version)"
            "windows-build=$($os.BuildNumber)"
            "ram-bytes=$($cs.TotalPhysicalMemory)"
            "uefi=PASS"
            "secure-boot=DISABLED"
            "hypervisor-present=PASS"
            "vbs-running=PASS"
            "credential-guard=PASS"
            "administrator=PASS"
            "hyperv-prerequisites=DEFERRED_UNTIL_HYPERV_GATE"
            "host-binding=PASS"
            "physical-host-reboot=false"
            "physical-host-firmware-mutation=false"
          ) | Set-Content boot/uefi-amd5800h-real-final-v1/evidence/host.txt -Encoding utf8
          'AMD5800H_REAL_BINDING=PASS'
          'AMD5800H_BIOS_308=PASS'
          'AMD5800H_WINDOWS_BUILD_26300=PASS'
          'AMD5800H_UEFI_SECURE_BOOT_DISABLED=PASS'
          'AMD5800H_VBS_CREDENTIAL_GUARD=PASS'

      - name: Discover Python QEMU OVMF and VMware
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          function FirstExisting([string[]]$paths) {
            foreach($p in $paths) { if($p -and (Test-Path $p)) { return (Resolve-Path $p).Path } }
            return $null
          }
          $py=FirstExisting @(
            'C:\Python316\python.exe',
            'C:\Python315\python.exe',
            'C:\Python314\python.exe',
            ((Get-Command python.exe -ErrorAction SilentlyContinue | Select-Object -First 1).Source)
          )
          if(-not $py){ throw 'Python not found on AMD-5800H-REAL' }

          $qemu=FirstExisting @(
            'C:\Program Files\qemu\qemu-system-x86_64.exe',
            'C:\Program Files (x86)\qemu\qemu-system-x86_64.exe',
            ((Get-Command qemu-system-x86_64.exe -ErrorAction SilentlyContinue | Select-Object -First 1).Source)
          )
          if(-not $qemu){ throw 'QEMU x86_64 not found on AMD-5800H-REAL' }
          $qemuDir=Split-Path $qemu -Parent
          $qimg=FirstExisting @(
            (Join-Path $qemuDir 'qemu-img.exe'),
            ((Get-Command qemu-img.exe -ErrorAction SilentlyContinue | Select-Object -First 1).Source)
          )
          if(-not $qimg){ throw 'qemu-img not found' }

          $share=Join-Path $qemuDir 'share'
          $fds=@()
          if(Test-Path $share){ $fds=@(Get-ChildItem $share -Recurse -File -Filter '*.fd' -ErrorAction SilentlyContinue) }
          $code=@($fds | Where-Object { $_.Name -match '(?i)x86_64.*code|OVMF_CODE' } | Select-Object -First 1)
          $vars=@($fds | Where-Object { $_.Name -match '(?i)(i386|x86).*vars' -and $_.Name -notmatch '(?i)arm|aarch64' } | Select-Object -First 1)
          if($code.Count -eq 0 -or $vars.Count -eq 0){
            throw "OVMF/edk2 CODE+VARS not found under $share"
          }

          $vmrun=FirstExisting @(
            'C:\Program Files (x86)\VMware\VMware Workstation\vmrun.exe',
            'C:\Program Files\VMware\VMware Workstation\vmrun.exe',
            ((Get-Command vmrun.exe -ErrorAction SilentlyContinue | Select-Object -First 1).Source)
          )
          $vmware=FirstExisting @(
            'C:\Program Files (x86)\VMware\VMware Workstation\vmware.exe',
            'C:\Program Files\VMware\VMware Workstation\vmware.exe',
            ((Get-Command vmware.exe -ErrorAction SilentlyContinue | Select-Object -First 1).Source)
          )

          if(-not $vmrun){ throw 'VMware Workstation vmrun.exe not found on AMD-5800H-REAL' }
          if(-not $vmware){ throw 'VMware Workstation vmware.exe not found on AMD-5800H-REAL' }

          "PYTHON_EXE=$py" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "QEMU_EXE=$qemu" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "QEMU_IMG_EXE=$qimg" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "OVMF_CODE=$($code[0].FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "OVMF_VARS=$($vars[0].FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "VMRUN_EXE=$vmrun" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "VMWARE_EXE=$vmware" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

          @(
            "python=$py"
            "qemu=$qemu"
            "qemu-img=$qimg"
            "ovmf-code=$($code[0].FullName)"
            "ovmf-vars=$($vars[0].FullName)"
            "vmrun=$vmrun"
            "vmware=$vmware"
          ) | Set-Content boot/uefi-amd5800h-real-final-v1/evidence/tools.txt -Encoding utf8
          & $qemu --version | Select-Object -First 1
          & $vmrun | Select-Object -First 2
          'AMD5800H_TOOL_DISCOVERY=PASS'
          'VMWARE_WORKSTATION_REQUIRED=PASS'

      - name: Build every final reader mode and prove determinism
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root='boot/uefi-amd5800h-real-final-v1/evidence'
          $src='boot/uefi-hii-current-option-speech-v1/build_uefi_hii_current_option_speech.py'
          $modes=[ordered]@{
            current=''
            repeat='--wait-repeat'
            down='--wait-down-probe'
            downspeech='--wait-down-speak'
            up='--wait-up-probe'
            upspeech='--wait-up-speak'
            focusrepeat='--wait-down-repeat-speak'
            cancel='--wait-down-cancel'
            commit='--wait-down-commit'
          }
          foreach($name in $modes.Keys){
            $a=Join-Path $root "$name.EFI"
            $b=Join-Path $root "$name-2.EFI"
            $mode=$modes[$name]
            if($mode){
              & $env:PYTHON_EXE $src $a $mode | Out-File (Join-Path $root "$name-build.txt") -Encoding utf8
              if($LASTEXITCODE -ne 0){ throw "build failed: $name" }
              & $env:PYTHON_EXE $src $b $mode | Out-Null
            } else {
              & $env:PYTHON_EXE $src $a | Out-File (Join-Path $root "$name-build.txt") -Encoding utf8
              if($LASTEXITCODE -ne 0){ throw "build failed: $name" }
              & $env:PYTHON_EXE $src $b | Out-Null
            }
            $h1=(Get-FileHash $a -Algorithm SHA256).Hash
            $h2=(Get-FileHash $b -Algorithm SHA256).Hash
            if($h1 -ne $h2){ throw "non deterministic: $name" }
            Remove-Item $b -Force
            "$name=$($h1.ToLowerInvariant())" | Out-File (Join-Path $root 'build-sha256.txt') -Append -Encoding ascii
          }
          $promptSrc='boot/uefi-hii-prompt-speech-v1/build_uefi_hii_prompt_speech.py'
          $prompt=Join-Path $root 'prompt.EFI'
          $prompt2=Join-Path $root 'prompt-2.EFI'
          & $env:PYTHON_EXE $promptSrc $prompt | Out-File (Join-Path $root 'prompt-build.txt') -Encoding utf8
          if($LASTEXITCODE -ne 0){ throw 'build failed: prompt' }
          & $env:PYTHON_EXE $promptSrc $prompt2 | Out-Null
          if($LASTEXITCODE -ne 0){ throw 'second build failed: prompt' }
          $ph1=(Get-FileHash $prompt -Algorithm SHA256).Hash
          $ph2=(Get-FileHash $prompt2 -Algorithm SHA256).Hash
          if($ph1 -ne $ph2){ throw 'non deterministic: prompt' }
          Remove-Item $prompt2 -Force
          "prompt=$($ph1.ToLowerInvariant())" | Out-File (Join-Path $root 'build-sha256.txt') -Append -Encoding ascii
          'AMD5800H_ALL_EFI_BUILDS=PASS'
          'AMD5800H_EFI_DETERMINISM=PASS'

      - name: Static PE security and accessibility audit
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $script='boot/uefi-amd5800h-real-final-v1/evidence/static_audit.py'
          @'
          from pathlib import Path
          import struct
          root=Path("boot/uefi-amd5800h-real-final-v1/evidence")
          required=[
            b"HII_DATABASE_PROTOCOL=PASS",
            b"HII_STRING_PROTOCOL=PASS",
            b"HDA_CONTROLLER_SELECTION=PREFERRED_AMD_1022_15E3",
            b"HDA_CONTROLLER_SELECTION=GENERIC_CLASS_0403",
            b"CURRENT_OPTION_SOURCE=PASS",
            b"CURRENT_OPTION_SPEECH_HDA=PASS",
            b"HII_NAVIGATION_KEY=WAIT_DOWN",
            b"NAV_FOCUS_SPEECH_HDA=PASS",
            b"HII_COMMIT_KEY=WAIT_ENTER",
            b"ROUTE_CONFIG=PASS",
