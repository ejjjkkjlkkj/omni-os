      - name: VMware Workstation interactive HII navigation with spoken HDA
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=(Resolve-Path 'boot/uefi-amd5800h-real-final-v1/evidence').Path
          if(-not $env:VMRUN_EXE -or -not (Test-Path $env:VMRUN_EXE)){ throw 'VMware Workstation vmrun.exe missing' }
          $efi=Join-Path $root 'hii-graph-nav.EFI'
          if(-not (Test-Path $efi)){ throw 'interactive VMware HII graph EFI artifact missing' }
          $fatBuilder=Join-Path $root 'make_fat16.py'
          if(-not (Test-Path $fatBuilder)){ throw 'FAT16 builder missing' }
          $rawDisk=Join-Path $root 'vmware-nav-esp.raw'
          $vmdk=Join-Path $root 'vmware-nav.vmdk'
          $serial=Join-Path $root 'vmware-nav.serial'
          $vmx=Join-Path $root 'qevarynx-nav.vmx'
          $port=20000 + ([long]$env:GITHUB_RUN_ID % 20000)

          & $env:PYTHON_EXE $fatBuilder $efi $rawDisk | Out-File (Join-Path $root 'vmware-nav-fat16-build.txt') -Encoding utf8
          if($LASTEXITCODE -ne 0){ throw 'VMware navigation FAT16 creation failed' }
          & $env:QEMU_IMG_EXE convert -f raw -O vmdk $rawDisk $vmdk
          if($LASTEXITCODE -ne 0){ throw 'VMware navigation VMDK conversion failed' }

          @"
          .encoding = "UTF-8"
          config.version = "8"
          virtualHW.version = "20"
          displayName = "Qevarynx Interactive UEFI HII Screen Reader"
          guestOS = "other-64"
          firmware = "efi"
          uefi.secureBoot.enabled = "FALSE"
          memsize = "256"
          numvcpus = "1"
          ide0:0.present = "TRUE"
          ide0:0.fileName = "$($vmdk.Replace('\','/'))"
          ide0:0.deviceType = "disk"
          sound.present = "TRUE"
          sound.virtualDev = "hdaudio"
          serial0.present = "TRUE"
          serial0.fileType = "file"
          serial0.fileName = "$($serial.Replace('\','/'))"
          floppy0.present = "FALSE"
          ethernet0.present = "FALSE"
          RemoteDisplay.vnc.enabled = "TRUE"
          RemoteDisplay.vnc.port = "$port"
          RemoteDisplay.vnc.ip = "127.0.0.1"
          msg.autoAnswer = "TRUE"
          "@ | Set-Content $vmx -Encoding ascii

          Remove-Item $serial -Force -ErrorAction SilentlyContinue
          $script=Join-Path $root 'vmware_nav_vnc_test.py'
          @'
          from pathlib import Path
          import socket,struct,sys,time

          root=Path(sys.argv[1])
          port=int(sys.argv[2])
          serial=root/"vmware-nav.serial"

          def raw():
              try:
                  return serial.read_bytes()
              except FileNotFoundError:
                  return b""

          def wait_for(marker,count=1,timeout=75):
              end=time.time()+timeout
              while time.time()<end:
                  b=raw()
                  if b"STATUS=BLOCKED\r\n" in b:
                      raise SystemExit("VMware navigation blocked: "+repr(b[-24000:]))
                  if b.count(marker)>=count:
                      return b
                  time.sleep(.05)
              raise SystemExit("timeout waiting for "+repr(marker)+": "+repr(raw()[-24000:]))

          def recv_exact(sock,n):
              out=b""
              while len(out)<n:
                  chunk=sock.recv(n-len(out))
                  if not chunk:
                      raise SystemExit("VNC connection closed")
                  out+=chunk
              return out

          def connect_vnc():
              end=time.time()+30
              while time.time()<end:
                  try:
                      s=socket.create_connection(("127.0.0.1",port),1.0)
                      break
                  except OSError:
                      time.sleep(.1)
              else:
                  raise SystemExit("VMware VNC endpoint unavailable")
              version=recv_exact(s,12)
              if not version.startswith(b"RFB "):
                  raise SystemExit("bad RFB version "+repr(version))
              try:
                  minor=int(version[8:11])
              except ValueError:
                  minor=8
              if minor<=3:
                  s.sendall(b"RFB 003.003\n")
                  sec=struct.unpack(">I",recv_exact(s,4))[0]
                  if sec!=1:
                      raise SystemExit("VMware VNC requires unsupported RFB 3.3 security type "+str(sec))
              else:
                  s.sendall(b"RFB 003.008\n")
                  n=recv_exact(s,1)[0]
                  if n==0:
                      ln=struct.unpack(">I",recv_exact(s,4))[0]
                      reason=recv_exact(s,ln)
                      raise SystemExit("VMware VNC rejected client: "+reason.decode("utf-8","replace"))
                  types=recv_exact(s,n)
                  if 1 not in types:
                      raise SystemExit("VMware VNC has no None security type: "+repr(types))
                  s.sendall(b"\x01")
                  result=struct.unpack(">I",recv_exact(s,4))[0]
                  if result!=0:
                      raise SystemExit("VMware VNC security failed: "+str(result))
              s.sendall(b"\x01")
              init=recv_exact(s,24)
              name_len=struct.unpack(">I",init[20:24])[0]
              if name_len:
                  recv_exact(s,name_len)
              return s

          def key(sock,keysym):
              sock.sendall(struct.pack(">BBHI",4,1,0,keysym))
              time.sleep(.06)
              sock.sendall(struct.pack(">BBHI",4,0,0,keysym))
              time.sleep(.12)

          wait_for(b"HII_GRAPH_NAV_READY=PASS\r\n")
          s=connect_vnc()
          try:
              sequence=[
                  (0xff54,b"HII_GRAPH_NAV_KEY=DOWN\r\n"),
                  (0xff52,b"HII_GRAPH_NAV_KEY=UP\r\n"),
                  (0xff57,b"HII_GRAPH_NAV_KEY=END\r\n"),
                  (0xff50,b"HII_GRAPH_NAV_KEY=HOME\r\n"),
                  (0xff56,b"HII_GRAPH_NAV_KEY=PAGE_DOWN\r\n"),
                  (0xff55,b"HII_GRAPH_NAV_KEY=PAGE_UP\r\n"),
                  (ord("r"),b"HII_GRAPH_NAV_KEY=R\r\n"),
              ]
              for idx,(keysym,marker) in enumerate(sequence,1):
                  key(s,keysym)
                  wait_for(marker)
                  wait_for(b"HII_GRAPH_NAV_SPEECH_DMA=PASS\r\n",idx)
                  wait_for(b"HII_GRAPH_NAV_SPEECH_HDA=PASS\r\n",idx)
                  wait_for(b"HII_GRAPH_NAV_LPIB_PROGRESS=PASS\r\n",idx)
              key(s,0xff1b)
              wait_for(b"HII_GRAPH_NAV_KEY=ESC\r\n")
              b=wait_for(b"STATUS=PASS\r\n")
          finally:
              s.close()

          required=[
              b"HII_DATABASE_PROTOCOL=PASS\r\n",
              b"HII_STRING_PROTOCOL=PASS\r\n",
              b"HII_GRAPH_NAV_PROMPT_COLLECTION=PASS\r\n",
              b"HDA_CONTROLLER_SELECTION=GENERIC_CLASS_0403\r\n",
              b"HDA_CODEC_SELECTION=GENERIC_RUNTIME\r\n",
              b"HDA_GRAPH_SEARCH_LIVE=PASS\r\n",
              b"HDA_SELECTOR_APPLY_LIVE=PASS\r\n",
              b"HDA_ROUTE_POWER_D0=PASS\r\n",
              b"HDA_EAPD_POLICY=PASS\r\n",
              b"HDA_DAC_STREAM_READBACK=PASS\r\n",
              b"HDA_PIN_CONTROL_READBACK=PASS\r\n",
              b"HII_PROMPT_SPEECH_HDA=PASS\r\n",
              b"HII_GRAPH_NAV_EXIT=PASS\r\n",
              b"HII_GRAPH_SPEECH_DMA_REUSE=PASS\r\n",
          ]
          for marker in required:
              if marker not in b:
                  raise SystemExit("missing "+repr(marker)+": "+repr(b[-24000:]))
          if b.count(b"HII_GRAPH_NAV_SPEECH_DMA=PASS\r\n") < 7:
              raise SystemExit("expected seven spoken VMware navigation events")
          print("VMWARE_INTERACTIVE_HII_NAVIGATION=PASS")
          print("VMWARE_INTERACTIVE_HII_NAV_SPEECH_EVENTS=7")
          print("VMWARE_INTERACTIVE_HII_NAV_DMA_REUSE=PASS")
          print("VMWARE_VNC_FIRMWARE_KEY_INJECTION=PASS")
          '@ | Set-Content $script -Encoding utf8

          & $env:VMRUN_EXE -T ws start $vmx nogui
          if($LASTEXITCODE -ne 0){ throw 'vmrun interactive navigation start failed' }
          try {
            & $env:PYTHON_EXE $script $root $port | Tee-Object (Join-Path $root 'vmware-nav-result.txt')
            if($LASTEXITCODE -ne 0){ throw 'VMware interactive HII navigation test failed' }
          } finally {
            & $env:VMRUN_EXE -T ws stop $vmx hard 2>$null | Out-Null
            Start-Sleep -Seconds 1
          }
          Get-Content (Join-Path $root 'vmware-nav-result.txt') | Add-Content (Join-Path $root 'vmware-result.txt') -Encoding ascii
          Get-Content $serial -Raw | Set-Content (Join-Path $root 'vmware-nav-captured.txt') -Encoding ascii

      - name: Hyper-V Generation 2 UEFI reader boot witness
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=(Resolve-Path 'boot/uefi-amd5800h-real-final-v1/evidence').Path
          $result=Join-Path $root 'hyperv-result.txt'
          $serial=Join-Path $root 'hyperv.serial'
          $vmPath=Join-Path $root "hyperv-vm-$env:GITHUB_RUN_ID"
          $vhdx=Join-Path $vmPath 'hyperv-uefi.vhdx'
          $vmName="QEV-UEFI-$env:GITHUB_RUN_ID"
          $pipeName="qev-uefi-$env:GITHUB_RUN_ID"
          $captureJob=$null
          $mounted=$false

          function Read-SerialSnapshot([string]$path) {
            if(-not (Test-Path $path)){ return '' }
            try {
              $fs=[System.IO.File]::Open(
                $path,
                [System.IO.FileMode]::Open,
                [System.IO.FileAccess]::Read,
                [System.IO.FileShare]::ReadWrite
              )
              try {
                $reader=[System.IO.StreamReader]::new(
                  $fs,
                  [System.Text.Encoding]::ASCII,
                  $false,
                  4096,
                  $true
                )
                try { return $reader.ReadToEnd() } finally { $reader.Dispose() }
              } finally {
                $fs.Dispose()
              }
            } catch {
              return ''
            }
          }

          Import-Module Hyper-V -ErrorAction Stop
          foreach($cmd in @('New-VHD','Mount-VHD','Dismount-VHD','New-VM','Set-VMFirmware','Set-VMComPort','Get-VMHardDiskDrive','Start-VM','Stop-VM','Remove-VM')){
            if(-not (Get-Command $cmd -ErrorAction SilentlyContinue)){ throw "Hyper-V command missing: $cmd" }
          }
          $vmms=Get-Service vmms -ErrorAction Stop
          if($vmms.Status -ne 'Running'){ throw "Hyper-V VMMS is not running: $($vmms.Status)" }

          try {
            Get-VM -Name $vmName -ErrorAction SilentlyContinue | Stop-VM -TurnOff -Force -ErrorAction SilentlyContinue
            Get-VM -Name $vmName -ErrorAction SilentlyContinue | Remove-VM -Force -ErrorAction SilentlyContinue
            Remove-Item $vmPath -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item $serial -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force $vmPath | Out-Null

            New-VHD -Path $vhdx -SizeBytes 128MB -Dynamic | Out-Null
            $vhd=Mount-VHD -Path $vhdx -PassThru
            $mounted=$true
            $diskNumber=$vhd.DiskNumber
            $disk=Get-Disk -Number $diskNumber
            if($disk.IsOffline){ Set-Disk -Number $diskNumber -IsOffline $false }
            if($disk.IsReadOnly){ Set-Disk -Number $diskNumber -IsReadOnly $false }
            Initialize-Disk -Number $diskNumber -PartitionStyle GPT | Out-Null
            $part=New-Partition -DiskNumber $diskNumber -UseMaximumSize -AssignDriveLetter -GptType '{C12A7328-F81F-11D2-BA4B-00A0C93EC93B}'
            $part | Format-Volume -FileSystem FAT32 -NewFileSystemLabel 'QEVARYNOX' -Confirm:$false | Out-Null
            $drive="$($part.DriveLetter):"
            New-Item -ItemType Directory -Force "$drive\EFI\BOOT" | Out-Null
            Copy-Item (Join-Path $root 'hii-graph.EFI') "$drive\EFI\BOOT\BOOTX64.EFI" -Force
            Dismount-VHD -Path $vhdx
            $mounted=$false

            New-VM -Name $vmName -Generation 2 -MemoryStartupBytes 256MB -VHDPath $vhdx -Path $vmPath | Out-Null
            Set-VMFirmware -VMName $vmName -EnableSecureBoot Off
            Set-VMProcessor -VMName $vmName -Count 1
            Set-VMComPort -VMName $vmName -Number 1 -Path "\\.\pipe\$pipeName"
            $bootDisk=Get-VMHardDiskDrive -VMName $vmName | Select-Object -First 1
            if(-not $bootDisk){ throw 'Hyper-V boot disk not attached' }
            Set-VMFirmware -VMName $vmName -FirstBootDevice $bootDisk

            $captureJob=Start-Job -ScriptBlock {
              param($pipeName,$serialPath)
              $client=[System.IO.Pipes.NamedPipeClientStream]::new(
                '.',
                $pipeName,
                [System.IO.Pipes.PipeDirection]::In,
                [System.IO.Pipes.PipeOptions]::Asynchronous
              )
              try {
                $connected=$false
                for($i=0;$i -lt 120 -and -not $connected;$i++){
                  try {
                    $client.Connect(250)
                    $connected=$client.IsConnected
                  } catch [System.TimeoutException] {
                    Start-Sleep -Milliseconds 100
                  } catch {
                    Start-Sleep -Milliseconds 100
                  }
                }
                if(-not $connected){ throw "Hyper-V COM named pipe connection timeout: $pipeName" }
                $file=[System.IO.File]::Open(
                  $serialPath,
                  [System.IO.FileMode]::Create,
                  [System.IO.FileAccess]::Write,
                  [System.IO.FileShare]::ReadWrite
                )
                try {
                  $buf=New-Object byte[] 4096
                  while($true){
                    $n=$client.Read($buf,0,$buf.Length)
                    if($n -le 0){ break }
                    $file.Write($buf,0,$n)
                    $file.Flush()
                  }
                } finally {
                  $file.Dispose()
                }
              } finally {
                $client.Dispose()
              }
            } -ArgumentList $pipeName,$serial

            Start-VM -Name $vmName
            $deadline=(Get-Date).AddSeconds(45)
            $raw=''
            do {
              Start-Sleep -Milliseconds 500
              if(Test-Path $serial){
                $snapshot=Read-SerialSnapshot $serial
                if($snapshot){ $raw=$snapshot }
                if($raw -match 'HII_PROMPT_SPEECH_HDA=PASS' -or $raw -match 'STATUS=BLOCKED'){ break }
              }
            } while((Get-Date) -lt $deadline)

            if(-not $raw -and (Test-Path $serial)){
              for($i=0;$i -lt 20 -and -not $raw;$i++){
                $raw=Read-SerialSnapshot $serial
                if(-not $raw){ Start-Sleep -Milliseconds 250 }
              }
            }
            if($raw -notmatch 'QEVARYNOX-UEFI-HII-GRAPH-PROMPT-SPEECH-V1'){
              throw "Hyper-V did not execute the UEFI reader. serial=$raw"
            }
            if($raw -notmatch 'STATE=START'){
              throw "Hyper-V UEFI reader start marker missing. serial=$raw"
            }

            $platform='UNCLASSIFIED'
            $audio='NOT_ESTABLISHED'
            if($raw -match 'HII_PROMPT_SPEECH_HDA=PASS'){
              $platform='FULL_HII_HDA_RUNTIME'
              $audio='PASS'
            } elseif($raw -match 'REASON=HDA_CONTROLLER_OR_CODEC_NOT_FOUND'){
              $platform='EXPECTED_NO_VIRTUAL_HDA'
            } elseif($raw -match 'REASON=HII_PROMPT_NOT_RESOLVED'){
              $platform='FIRMWARE_HII_CONTENT_NOT_RESOLVED'
            } else {
              throw "Hyper-V UEFI reader reached an unexpected state. serial=$raw"
            }

            @(
              'HYPERV_GENERATION2=PASS'
              'HYPERV_UEFI_READER_EXECUTION=PASS'
              'HYPERV_SERIAL_CAPTURE=PASS'
              "HYPERV_PLATFORM_RESULT=$platform"
              "HYPERV_HDA_SPEECH=$audio"
              'HYPERV_FALSE_AUDIO_PASS=BLOCKED'
              ($raw -split "[\r\n]+" | Where-Object {
                $_ -match '^(QEVARYNOX-|STATE=|HII_|HDA_|STATUS=|REASON=)'
              })
            ) | Set-Content $result -Encoding ascii
            Get-Content $result
          } finally {
            if($mounted){ Dismount-VHD -Path $vhdx -ErrorAction SilentlyContinue }
            Get-VM -Name $vmName -ErrorAction SilentlyContinue | Stop-VM -TurnOff -Force -ErrorAction SilentlyContinue
            if($captureJob){
              Wait-Job $captureJob -Timeout 5 | Out-Null
              Stop-Job $captureJob -ErrorAction SilentlyContinue
              Remove-Job $captureJob -Force -ErrorAction SilentlyContinue
            }
            Get-VM -Name $vmName -ErrorAction SilentlyContinue | Remove-VM -Force -ErrorAction SilentlyContinue
            Remove-Item $vmPath -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Final evidence manifest
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root='boot/uefi-amd5800h-real-final-v1/evidence'
          $physicalBootProof='boot/uefi-physical-boot-proof-v1/os-uefi-physical-boot-proof-v1.labproof'
          $physicalRuntime='PENDING_PHYSICAL_BOOT'
          $physicalNavigation='PENDING_PHYSICAL_BOOT'
          $physicalAudible='PENDING_HUMAN_CONFIRMATION'
          if(Test-Path $physicalBootProof){
            $pb=Get-Content $physicalBootProof -Raw
            if($pb -match '(?m)^proof-native-uefi-execution = PASS\s*$' -and
               $pb -match '(?m)^proof-hda-dma = PASS\s*$' -and
               $pb -match '(?m)^proof-lpib-progress = PASS\s*$' -and
               $pb -match '(?m)^proof-internal-speaker-pin = PASS\s*$'){
              $physicalRuntime='PASS'
            }
            if($pb -match '(?m)^proof-hii-navigation = PASS\s*$' -and
               $pb -match '(?m)^proof-hii-navigation-required-events = PASS\s*$'){
              $physicalNavigation='PASS'
            }
            if($pb -match '(?m)^proof-audible-physical-speaker = HUMAN_CONFIRMED\s*$'){
              $physicalAudible='HUMAN_CONFIRMED'
            }
          }
          Get-ChildItem $root -File |
            Where-Object { $_.Name -ne 'manifest.sha256' } |
            Sort-Object Name |
            ForEach-Object {
              $h=(Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$h  $($_.Name)"
            } | Set-Content "$root/manifest.sha256" -Encoding ascii
          @(
            'OS-UEFI-AMD5800H-REAL-FINAL-V1'
            'AMD5800H_REAL_BINDING=PASS'
            'ALL_EFI_BUILDS=PASS'
            'HII_CURRENT_VALUE_PROOF=PASS'
            'HII_PERSISTENT_COMMIT_PROOF=PASS'
            'OVMF_SECURE_BOOT_PROOF=PASS'
            'EFI_DETERMINISM=PASS'
            'PE_SECURITY=PASS'
            'QEMU_OVMF_UEFI_SCREEN_READER=PASS'
            'QEMU_HII_KEYBOARD_NAVIGATION=PASS'
            'QEMU_HDA_SPEECH=PASS'
            'QEMU_HDA_DMA_PROGRESS=PASS'
            'QEMU_HDA_CONTROLLER_SELECTION=GENERIC_CLASS_0403'
            'VMWARE_WORKSTATION_REQUIRED=PASS'
            'HYPERV_GENERATION2_REQUIRED=PASS'
            'PHYSICAL_TARGET_HDA_CONTROLLER=PCI_VEN_1022_DEV_15E3'
            'PHYSICAL_TARGET_CODEC=HDAUDIO_VEN_10EC_DEV_0256'
            'PHYSICAL_TARGET_CODEC_VERIFICATION=NATIVE_HDA_GET_PARAMETER_00'
            'PHYSICAL_UEFI_HDA_RUNTIME_MARKER=REQUIRED'
            'PHYSICAL_INTERNAL_SPEAKER_PIN_MARKER=REQUIRED'
            'PHYSICAL_AUDIBLE_SPEAKER=REQUIRES_HUMAN_CONFIRMATION'
            'PHYSICAL_TARGET_BIOS=M1603QA.308'
            'PHYSICAL_TARGET_OS_BUILD=26300'
            'PHYSICAL_HOST_UEFI=PASS'
            'PHYSICAL_HOST_SECURE_BOOT=DISABLED'
            'PHYSICAL_HOST_HYPERVISOR=DETECTED'
            'PHYSICAL_HOST_VBS=RUNNING'
            'PHYSICAL_HOST_CREDENTIAL_GUARD=RUNNING'
            'PHYSICAL_HOST_REBOOT=false'
            'PHYSICAL_HOST_FIRMWARE_MUTATION=false'
            'VIRTUALIZATION_CLOSURE=PASS'
            "PHYSICAL_UEFI_NATIVE_RUNTIME=$physicalRuntime"
            "PHYSICAL_UEFI_HII_NAVIGATION=$physicalNavigation"
            "PHYSICAL_PRE_OS_SPEAKER=$physicalAudible"
          ) | Set-Content "$root/final-result.txt" -Encoding ascii
          if(Test-Path "$root/qemu-waveform.txt"){ Get-Content "$root/qemu-waveform.txt" | Add-Content "$root/final-result.txt" -Encoding ascii }
          if(Test-Path "$root/vmware-result.txt"){ Get-Content "$root/vmware-result.txt" | Add-Content "$root/final-result.txt" -Encoding ascii }
          if(Test-Path "$root/hyperv-result.txt"){ Get-Content "$root/hyperv-result.txt" | Add-Content "$root/final-result.txt" -Encoding ascii }

      - uses: actions/upload-artifact@v4
        with:
          name: os-uefi-amd5800h-real-final-v1
          path: src/boot/uefi-amd5800h-real-final-v1/evidence
          if-no-files-found: error

      - name: Persist revision-bound AMD final proof
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root='boot/uefi-amd5800h-real-final-v1'
          $proof="$root/os-uefi-amd5800h-real-final-v1.labproof"
          $builder='boot/uefi-hii-current-option-speech-v1/build_uefi_hii_current_option_speech.py'
          $promptBuilder='boot/uefi-hii-prompt-speech-v1/build_uefi_hii_prompt_speech.py'
          $hiiGraphSource='boot/uefi-hii-graph-prompt-speech-v1/hii_graph_prompt_speech_uefi.c'
          $hiiGraphGenerator='boot/uefi-hii-graph-prompt-speech-v1/generate_units.py'
          $currentProof='boot/uefi-hii-current-option-speech-v1/os-uefi-hii-current-option-speech-v1.labproof'
          $commitProof='boot/uefi-hii-platform-commit-v1/os-uefi-hii-platform-commit-v1.labproof'
          $secureBootProof='boot/uefi-secure-boot-v1/os-uefi-secure-boot-v1.labproof'
          $graphProof='boot/uefi-hii-graph-prompt-speech-v1/os-uefi-hii-graph-prompt-speech-v1.labproof'
          $physicalAudioProof='boot/uefi-physical-audio-v1/os-uefi-physical-audio-probe-v1.labproof'
          $asusPreflightProof='boot/uefi-asus-m1603qa-preflight-v1/os-uefi-asus-m1603qa-preflight-v1.labproof'
          $physicalBootProof='boot/uefi-physical-boot-proof-v1/os-uefi-physical-boot-proof-v1.labproof'
          $workflow='.github/workflows/os-uefi-amd5800h-real-final-v1.yml'
          $testedBuilder=(git rev-parse "$($env:GITHUB_SHA):$builder").Trim()
          $testedPromptBuilder=(git rev-parse "$($env:GITHUB_SHA):$promptBuilder").Trim()
          $testedHiiGraphSource=(git rev-parse "$($env:GITHUB_SHA):$hiiGraphSource").Trim()
          $testedHiiGraphGenerator=(git rev-parse "$($env:GITHUB_SHA):$hiiGraphGenerator").Trim()
          $testedCurrentProof=(git rev-parse "$($env:GITHUB_SHA):$currentProof").Trim()
          $testedCommitProof=(git rev-parse "$($env:GITHUB_SHA):$commitProof").Trim()
          $testedSecureBootProof=(git rev-parse "$($env:GITHUB_SHA):$secureBootProof").Trim()
          $testedGraphProof=(git rev-parse "$($env:GITHUB_SHA):$graphProof").Trim()
          $testedPhysicalAudioProof=(git rev-parse "$($env:GITHUB_SHA):$physicalAudioProof").Trim()
          $testedAsusPreflightProof=(git rev-parse "$($env:GITHUB_SHA):$asusPreflightProof").Trim()
          $testedPhysicalBootProof=(git rev-parse "$($env:GITHUB_SHA):$physicalBootProof").Trim()
          $testedWorkflow=(git rev-parse "$($env:GITHUB_SHA):$workflow").Trim()
          git fetch origin os
          git checkout -B os origin/os
          if($testedBuilder -ne (git rev-parse "origin/os:$builder").Trim()){ 'AMD_FINAL_STALE_BUILDER=SKIP'; exit 0 }
          if($testedPromptBuilder -ne (git rev-parse "origin/os:$promptBuilder").Trim()){ 'AMD_FINAL_STALE_PROMPT_BUILDER=SKIP'; exit 0 }
          if($testedHiiGraphSource -ne (git rev-parse "origin/os:$hiiGraphSource").Trim()){ 'AMD_FINAL_STALE_HII_GRAPH_SOURCE=SKIP'; exit 0 }
          if($testedHiiGraphGenerator -ne (git rev-parse "origin/os:$hiiGraphGenerator").Trim()){ 'AMD_FINAL_STALE_HII_GRAPH_GENERATOR=SKIP'; exit 0 }
          if($testedCurrentProof -ne (git rev-parse "origin/os:$currentProof").Trim()){ 'AMD_FINAL_STALE_CURRENT_OPTION_PROOF=SKIP'; exit 0 }
          if($testedCommitProof -ne (git rev-parse "origin/os:$commitProof").Trim()){ 'AMD_FINAL_STALE_PLATFORM_COMMIT_PROOF=SKIP'; exit 0 }
          if($testedSecureBootProof -ne (git rev-parse "origin/os:$secureBootProof").Trim()){ 'AMD_FINAL_STALE_SECURE_BOOT_PROOF=SKIP'; exit 0 }
          if($testedGraphProof -ne (git rev-parse "origin/os:$graphProof").Trim()){ 'AMD_FINAL_STALE_HII_GRAPH_PROOF=SKIP'; exit 0 }
          if($testedPhysicalAudioProof -ne (git rev-parse "origin/os:$physicalAudioProof").Trim()){ 'AMD_FINAL_STALE_PHYSICAL_AUDIO_PROOF=SKIP'; exit 0 }
          if($testedAsusPreflightProof -ne (git rev-parse "origin/os:$asusPreflightProof").Trim()){ 'AMD_FINAL_STALE_ASUS_PREFLIGHT_PROOF=SKIP'; exit 0 }
          if($testedPhysicalBootProof -ne (git rev-parse "origin/os:$physicalBootProof").Trim()){ 'AMD_FINAL_STALE_PHYSICAL_BOOT_PROOF=SKIP'; exit 0 }
          if($testedWorkflow -ne (git rev-parse "origin/os:$workflow").Trim()){ 'AMD_FINAL_STALE_WORKFLOW=SKIP'; exit 0 }
          $lines=Get-Content $proof | Where-Object { $_ -notmatch '^proof(-| = )' -and $_ -notmatch '^final-proof-state = ' }
          $vm='NOT_FOUND'
          $vmSpeech='NOT_ESTABLISHED'
          $vmIntegrated='NOT_ESTABLISHED'
          $vmInteractive='NOT_ESTABLISHED'
          $vmControllerSelection='NOT_ESTABLISHED'
          $vmCodecSelection='NOT_ESTABLISHED'
          if(Test-Path "$root/evidence/vmware-result.txt"){
            $vr=Get-Content "$root/evidence/vmware-result.txt" -Raw
            if($vr -match 'VMWARE_WORKSTATION=PASS'){ $vm='PASS' }
            if($vr -match 'VMWARE_FULL_HDA_SPEECH=PASS'){ $vmSpeech='PASS' }
            if($vr -match 'VMWARE_INTEGRATED_HII_HDA_SPEECH=PASS'){ $vmIntegrated='PASS' }
            if($vr -match 'VMWARE_INTERACTIVE_HII_NAVIGATION=PASS'){ $vmInteractive='PASS' }
            if($vr -match 'VMWARE_HDA_CONTROLLER_SELECTION=GENERIC_CLASS_0403'){ $vmControllerSelection='GENERIC_CLASS_0403' }
            if($vr -match 'VMWARE_HDA_CODEC_SELECTION=GENERIC_RUNTIME'){ $vmCodecSelection='GENERIC_RUNTIME' }
          }
          $sha=(Get-FileHash "$root/evidence/downspeech.EFI" -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest=(Get-FileHash "$root/evidence/manifest.sha256" -Algorithm SHA256).Hash.ToLowerInvariant()
          $hyperv='NOT_ESTABLISHED'
          $hypervPlatform='NOT_ESTABLISHED'
          $hypervAudio='NOT_ESTABLISHED'
          if(Test-Path "$root/evidence/hyperv-result.txt"){
            $hr=Get-Content "$root/evidence/hyperv-result.txt" -Raw
            if($hr -match 'HYPERV_UEFI_READER_EXECUTION=PASS'){ $hyperv='PASS' }
            if($hr -match 'HYPERV_PLATFORM_RESULT=([^\r\n]+)'){ $hypervPlatform=$matches[1].Trim() }
            if($hr -match 'HYPERV_HDA_SPEECH=([^\r\n]+)'){ $hypervAudio=$matches[1].Trim() }
          }
          $qemuWave='NOT_ESTABLISHED'
          if(Test-Path "$root/evidence/qemu-waveform.txt"){
            $qw=Get-Content "$root/evidence/qemu-waveform.txt" -Raw
            if($qw -match 'qemu-waveform = PASS'){ $qemuWave='PASS' }
            elseif($qw -match 'NOT_ESTABLISHED_ON_WINDOWS_BACKEND'){ $qemuWave='NOT_ESTABLISHED_ON_WINDOWS_BACKEND' }
          }
          if($qemuWave -ne 'PASS'){ throw "Final proof refused: QEMU waveform=$qemuWave" }
          if($vm -ne 'PASS'){ throw "Final proof refused: VMware Workstation=$vm" }
          if($vmSpeech -ne 'PASS'){ throw "Final proof refused: VMware HDA graph speech=$vmSpeech" }
          if($vmIntegrated -ne 'PASS'){ throw "Final proof refused: VMware integrated HII/HDA speech=$vmIntegrated" }
          if($vmInteractive -ne 'PASS'){ throw "Final proof refused: VMware interactive HII navigation=$vmInteractive" }
          if($vmControllerSelection -ne 'GENERIC_CLASS_0403'){ throw "Final proof refused: VMware controller selection=$vmControllerSelection" }
          if($vmCodecSelection -ne 'GENERIC_RUNTIME'){ throw "Final proof refused: VMware codec selection=$vmCodecSelection" }
          if($hyperv -ne 'PASS'){ throw "Final proof refused: Hyper-V UEFI execution=$hyperv" }
          if($hypervPlatform -in @('NOT_ESTABLISHED','UNCLASSIFIED')){ throw "Final proof refused: Hyper-V platform result=$hypervPlatform" }
          'FINAL_VIRTUALIZATION_EVIDENCE_ASSERTIONS=PASS'

          $physicalNative='PENDING_PHYSICAL_BOOT'
          $physicalNavigation='PENDING_PHYSICAL_BOOT'
          $physicalInternalSpeaker='PENDING_PHYSICAL_BOOT'
          $physicalAudible='PENDING_HUMAN_CONFIRMATION'
          $physicalSource='NOT_ESTABLISHED'
          $pb=Get-Content $physicalBootProof -Raw
          if($pb -match '(?m)^proof-source-blob = ([0-9a-f]{40})\s*$'){ $physicalSource=$matches[1] }
          if($physicalSource -eq $testedHiiGraphSource -and
             $pb -match '(?m)^proof-native-uefi-execution = PASS\s*$' -and
             $pb -match '(?m)^proof-hda-dma = PASS\s*$' -and
             $pb -match '(?m)^proof-lpib-progress = PASS\s*$'){
            $physicalNative='PASS'
          }
          if($physicalSource -eq $testedHiiGraphSource -and
             $pb -match '(?m)^proof-hii-navigation = PASS\s*$' -and
             $pb -match '(?m)^proof-hii-navigation-required-events = PASS\s*$'){
            $physicalNavigation='PASS'
          }
          if($physicalSource -eq $testedHiiGraphSource -and
             $pb -match '(?m)^proof-internal-speaker-pin = PASS\s*$'){
            $physicalInternalSpeaker='PASS'
          }
          if($physicalSource -eq $testedHiiGraphSource -and
             $pb -match '(?m)^proof-audible-physical-speaker = HUMAN_CONFIRMED\s*$'){
            $physicalAudible='HUMAN_CONFIRMED'
          }

          if($physicalNative -eq 'PASS' -and
             $physicalNavigation -eq 'PASS' -and
             $physicalInternalSpeaker -eq 'PASS' -and
             $physicalAudible -eq 'HUMAN_CONFIRMED'){
            $lines += 'final-proof-state = PASS'
            $lines += 'proof = PASS'
          } else {
            $lines += 'final-proof-state = VIRTUALIZATION_PASS_PHYSICAL_UEFI_PENDING'
            $lines += 'proof = PENDING_PHYSICAL_PRE_OS_AUDIO'
          }
          $lines += "proof-current-option-proof-blob = $testedCurrentProof"
          $lines += "proof-platform-commit-proof-blob = $testedCommitProof"
          $lines += "proof-secure-boot-proof-blob = $testedSecureBootProof"
          $lines += "proof-hii-graph-proof-blob = $testedGraphProof"
          $lines += "proof-physical-audio-proof-blob = $testedPhysicalAudioProof"
          $lines += "proof-asus-preflight-proof-blob = $testedAsusPreflightProof"
          $lines += "proof-physical-boot-proof-blob = $testedPhysicalBootProof"
          $lines += 'proof-physical-asus-readonly-evidence = PASS'
          $lines += "proof-physical-native-uefi = $physicalNative"
          $lines += "proof-physical-hii-navigation = $physicalNavigation"
          $lines += "proof-physical-internal-speaker-pin = $physicalInternalSpeaker"
          $lines += "proof-physical-audible-speaker = $physicalAudible"
          $lines += "proof-physical-source-blob = $physicalSource"
          $lines += 'proof-virtualization-suite = PASS'
          $lines += "proof-run = $env:GITHUB_RUN_ID"
          $lines += "proof-head-sha = $env:GITHUB_SHA"
          $lines += "proof-runner = $env:RUNNER_NAME"
          $lines += 'proof-all-efi-builds = PASS'
          $lines += 'proof-determinism = PASS'
          $lines += 'proof-PE-security = PASS'
          $lines += 'proof-qemu-ovmf-runtime = PASS'
          $lines += 'proof-qemu-keyboard-navigation = PASS'
          $lines += 'proof-qemu-hda-speech = PASS'
          $lines += 'proof-qemu-hda-controller-selection = GENERIC_CLASS_0403_FALLBACK_PASS'
          $lines += 'proof-physical-target-hda-controller = PCI_VEN_1022_DEV_15E3'
          $lines += 'proof-physical-target-codec = HDAUDIO_VEN_10EC_DEV_0256'
          $lines += "proof-qemu-waveform = $qemuWave"
          $lines += "proof-vmware-workstation = $vm"
          $lines += "proof-vmware-hda-graph-speech = $vmSpeech"
          $lines += "proof-vmware-integrated-hii-hda-speech = $vmIntegrated"
          $lines += "proof-vmware-interactive-hii-navigation = $vmInteractive"
          $lines += "proof-vmware-hda-controller-selection = $vmControllerSelection"
          $lines += "proof-vmware-hda-codec-selection = $vmCodecSelection"
          $lines += "proof-hyperv-generation2-uefi-execution = $hyperv"
          $lines += "proof-hyperv-platform-result = $hypervPlatform"
          $lines += "proof-hyperv-hda-speech = $hypervAudio"
          $lines += 'proof-hyperv-false-audio-pass = BLOCKED'
          $lines += 'proof-vmware-hii-source = live-integrated-hii-graph-prompt'
          $lines += 'proof-physical-host-reboot = false'
          $lines += 'proof-physical-host-firmware-mutation = false'
          $lines += "proof-physical-pre-os-speaker = $physicalAudible"
          $lines += 'proof-physical-boot-workflow-triggered-reboot = false'
          $lines += "proof-downspeech-efi-sha256 = $sha"
          $lines += "proof-manifest-sha256 = $manifest"
          Set-Content $proof $lines -Encoding utf8
          if(git diff --quiet -- $proof){ exit 0 }
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add $proof
          git commit -m "Record AMD-5800H final UEFI screen reader proof [skip ci]"
          for($i=0;$i -lt 3;$i++){
            git push origin os
            if($LASTEXITCODE -eq 0){ exit 0 }
            git fetch origin os
            git rebase origin/os
            if($LASTEXITCODE -ne 0){ git rebase --abort; throw 'proof rebase failed' }
          }
          throw 'proof push failed'
