name: system-native-output-v1

on:
  push:
    branches: [os]
    paths:
      - 'system/native-output-v1/NativeOutputApp.cs'
      - '.github/workflows/system-native-output-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  amd-real-output:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Assert native output foundations and live NVDA
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach ($p in @(
            'lab21/native-relation-core.labproof',
            'system/native-accessibility-v1/native-accessibility-v1.labproof',
            'system/native-input-v1/native-input-v1.labproof'
          )) {
            $lines=Get-Content $p
            if ($lines -notcontains 'proof = PASS' -or $lines -notcontains 'system-foundation = true') {
              throw "required native foundation not proven: $p"
            }
          }
          $sr=Get-Content 'system/native-screenreader-v1/native-screenreader-v1.labproof'
          if ($sr -notcontains 'proof = PASS') { throw 'NVDA external screen-reader witness not proven' }
          if ($env:RUNNER_NAME -ne 'AMD-5800H-REAL') { throw "wrong runner: $env:RUNNER_NAME" }
          if (Get-Process -Name LogonUI -ErrorAction SilentlyContinue) { throw 'secure or locked screen detected' }
          $nvda=Get-Process -Name nvda -ErrorAction Stop | Select-Object -First 1
          "NATIVE_OUTPUT_PRECONDITIONS=PASS;NVDA_PID=$($nvda.Id)"

      - name: Acquire official stable NVDA controller client
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force 'output-runtime' | Out-Null
          $url='https://download.nvaccess.org/releases/stable/nvda_2026.2_controllerClient.zip'
          $zip=Join-Path $PWD 'output-runtime/nvda_2026.2_controllerClient.zip'
          $extract=Join-Path $PWD 'output-runtime/controller'
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          $dll=Get-ChildItem $extract -Recurse -File -Filter 'nvdaControllerClient.dll' |
            Where-Object { $_.FullName -match '[\\/]x64[\\/]' } |
            Select-Object -First 1
          if (-not $dll) { throw 'x64 nvdaControllerClient.dll not found' }
          Copy-Item $dll.FullName 'output-runtime/nvdaControllerClient.dll' -Force
          @(
            'controller-version = 2026.2'
            'controller-architecture = x64'
            "controller-zip-sha256 = $((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant())"
            "controller-dll-sha256 = $((Get-FileHash 'output-runtime/nvdaControllerClient.dll' -Algorithm SHA256).Hash.ToLowerInvariant())"
          ) | Set-Content 'output-runtime/controller-evidence.txt' -Encoding utf8

      - name: Build native output witness
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $source=Join-Path $PWD 'system/native-output-v1/NativeOutputApp.cs'
          $out=Join-Path $PWD 'output-runtime/native-output-v1.exe'
          $buildScript=Join-Path $PWD 'output-runtime/build.ps1'
          @'
          param([string]$Source,[string]$Output)
          $ErrorActionPreference='Stop'
          Add-Type -TypeDefinition (Get-Content $Source -Raw) -Language CSharp -ReferencedAssemblies @('System.Windows.Forms.dll','System.Drawing.dll') -OutputAssembly $Output -OutputType WindowsApplication
          '@ | Set-Content $buildScript -Encoding utf8
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $buildScript -Source $source -Output $out
          if ($LASTEXITCODE -ne 0) { throw "Windows PowerShell build failed: $LASTEXITCODE" }
          if (-not (Test-Path $out)) { throw 'native output executable missing' }
          'NATIVE_OUTPUT_BUILD=PASS'

      - name: Prove one semantic message across visible UI UIA speech and braille
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes

          $exe=Join-Path $PWD 'output-runtime/native-output-v1.exe'
          $table=Join-Path $PWD 'lab21/relation-compose0'
          $trace=Join-Path $PWD 'output-runtime/output-trace.txt'
          $p=Start-Process -FilePath $exe -ArgumentList @($table,$trace) -PassThru

          try {
            $root=[System.Windows.Automation.AutomationElement]::RootElement
            $procCond=[System.Windows.Automation.PropertyCondition]::new(
              [System.Windows.Automation.AutomationElement]::ProcessIdProperty,[int]$p.Id
            )
            $window=$null
            for($i=0;$i -lt 100 -and -not $window;$i++) {
              Start-Sleep -Milliseconds 100
              $window=$root.FindFirst([System.Windows.Automation.TreeScope]::Children,$procCond)
            }
            if (-not $window) { throw 'native output window not found' }
            if ($window.Current.Name -ne 'Native Output V1') { throw "wrong output window name: $($window.Current.Name)" }

            for($i=0;$i -lt 50 -and -not (Test-Path $trace);$i++) { Start-Sleep -Milliseconds 100 }
            if (-not (Test-Path $trace)) { throw 'native output semantic trace missing' }
            $traceLines=Get-Content $trace
            $semanticLine=$traceLines | Where-Object { $_ -like 'semantic-message=*' } | Select-Object -First 1
            if (-not $semanticLine) { throw 'semantic message missing' }
            $message=($semanticLine -split '=',2)[1]
            if ($message -ne 'Native state identity') { throw "unexpected native semantic message: $message" }

            if ($traceLines -notcontains "visible-text=$message") { throw 'visible projection differs from native message' }
            if ($traceLines -notcontains "accessible-name=$message") { throw 'accessible projection differs from native message' }
            if ($traceLines -notcontains 'native-role=identity') { throw 'native structural role mismatch' }
            if ($traceLines -notcontains 'window-shown=true') {
              for($i=0;$i -lt 20 -and -not ((Get-Content $trace) -contains 'window-shown=true');$i++) { Start-Sleep -Milliseconds 100 }
              $traceLines=Get-Content $trace
            }
            if ($traceLines -notcontains 'window-shown=true') { throw 'visible window was not shown' }

            $statusCond=[System.Windows.Automation.PropertyCondition]::new(
              [System.Windows.Automation.AutomationElement]::NameProperty,$message
            )
            $status=$window.FindFirst([System.Windows.Automation.TreeScope]::Descendants,$statusCond)
            if (-not $status) { throw 'UIA status carrying native semantic message not found' }
            if ($status.Current.Name -ne $message) { throw 'UIA native message mismatch' }

            $runtime=Join-Path $PWD 'output-runtime'
            $env:PATH="$runtime;$env:PATH"
            [void][System.Runtime.InteropServices.NativeLibrary]::Load((Join-Path $runtime 'nvdaControllerClient.dll'))
            Add-Type -TypeDefinition (Get-Content 'system/native-screenreader-v1/NativeNvdaControllerWitness.cs' -Raw) -Language CSharp
            $nvdaResult=[NativeNvdaControllerWitness]::Run($message)
            if ($nvdaResult -notlike 'NATIVE_NVDA_CONTROLLER=PASS*') { throw $nvdaResult }
            if ($nvdaResult -notlike '*SPEAK_TEXT=0*' -or $nvdaResult -notlike '*BRAILLE_MESSAGE=0*') { throw $nvdaResult }

            @(
              'NATIVE-OUTPUT-V1'
              "github-run-id = $env:GITHUB_RUN_ID"
              "runner-name = $env:RUNNER_NAME"
              'native-role = identity'
              "semantic-message = $message"
              "visible-text = $message"
              "uia-name = $($status.Current.Name)"
              "nvda-speech-message = $message"
              "nvda-braille-message = $message"
              $nvdaResult
              'visible-projection = PASS'
              'uia-projection = PASS'
              'nvda-speech-controller-accepted = PASS'
              'nvda-braille-controller-accepted = PASS'
              'four-carrier-semantic-equivalence = PASS'
              'secure-data = false'
              'result = PASS'
            ) | Set-Content 'output-runtime/evidence.txt' -Encoding utf8

            $closeCond=[System.Windows.Automation.PropertyCondition]::new(
              [System.Windows.Automation.AutomationElement]::NameProperty,'Close native output'
            )
            $close=$window.FindFirst([System.Windows.Automation.TreeScope]::Descendants,$closeCond)
            if ($close) {
              $invoke=[System.Windows.Automation.InvokePattern]$close.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern)
              $invoke.Invoke()
            }
          }
          finally {
            if (-not $p.HasExited) {
              if (-not $p.WaitForExit(3000)) { $p.Kill(); $p.WaitForExit() }
            }
          }

          Get-Content 'output-runtime/evidence.txt'
          Get-Content 'output-runtime/output-trace.txt'

      - name: Enforce native output contract
        shell: pwsh
        run: |
          $lines=Get-Content 'system/native-output-v1/native-output-v1.labproof'
          if ($lines -notcontains 'human-facing = true') { throw 'human-facing output contract missing' }
          if ($lines -notcontains 'single-semantic-message = Native state identity') { throw 'single message contract missing' }
          if ($lines -notcontains 'carrier-specific-meaning = forbidden') { throw 'carrier semantic divergence gate missing' }
          if ($lines -notcontains 'vision-required = false') { throw 'vision independence missing' }
          if ($lines -notcontains 'secure-data = false') { throw 'secure data boundary missing' }
          'NATIVE_OUTPUT_CONTRACT=PASS'

      - name: Hash output evidence
        shell: pwsh
        run: |
          Get-FileHash -Algorithm SHA256 'system/native-output-v1/NativeOutputApp.cs','output-runtime/output-trace.txt','output-runtime/controller-evidence.txt','output-runtime/evidence.txt' |
            ForEach-Object { "$($_.Path) SHA256=$($_.Hash.ToLowerInvariant())" }

      - name: Upload output evidence
        uses: actions/upload-artifact@v4
        with:
          name: system-native-output-v1-amd5800h
          path: |
            output-runtime/output-trace.txt
            output-runtime/controller-evidence.txt
            output-runtime/evidence.txt
          if-no-files-found: error

  linux-independent-replay:
    needs: amd-real-output
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: system-native-output-v1-amd5800h
          path: output-artifact

      - name: Verify native semantic equivalence across output carriers
        shell: python
        run: |
          from pathlib import Path

          table=Path('lab21/relation-compose0').read_bytes()
          states=list(dict.fromkeys(table))
          assert len(table)==4 and len(states)==2
          def idx(x): return states.index(x)
          def compose(a,b): return table[idx(a)*2+idx(b)]

          identities=[e for e in states if all(compose(e,x)==x and compose(x,e)==x for x in states)]
          assert len(identities)==1
          identity=identities[0]

          trace=Path('output-artifact/output-trace.txt').read_text().splitlines()
          assert 'native-role=identity' in trace
          assert 'semantic-message=Native state identity' in trace
          assert 'visible-text=Native state identity' in trace
          assert 'accessible-name=Native state identity' in trace
          assert 'window-shown=true' in trace

          evidence=Path('output-artifact/evidence.txt').read_text().splitlines()
          expected='Native state identity'
          values={}
          for line in evidence:
              if ' = ' in line:
                  k,v=line.split(' = ',1)
                  values[k]=v
          assert values['semantic-message']==expected
          assert values['visible-text']==expected
          assert values['uia-name']==expected
          assert values['nvda-speech-message']==expected
          assert values['nvda-braille-message']==expected
          assert values['four-carrier-semantic-equivalence']=='PASS'
          assert values['secure-data']=='false'
          assert values['result']=='PASS'
          controller=next(line for line in evidence if line.startswith('NATIVE_NVDA_CONTROLLER=PASS'))
          assert ';SPEAK_TEXT=0' in controller
          assert ';BRAILLE_MESSAGE=0' in controller

          print('NATIVE_OUTPUT_V1_LINUX_REPLAY=PASS;VISIBLE_UIA_SPEECH_BRAILLE_EQUIVALENCE=PASS')
