name: lab21-native-relation-core

on:
  push:
    branches: [os]
    paths:
      - 'lab21/relation-compose0'
      - 'lab21/RelationalCoreWitness.cs'
      - '.github/workflows/lab21.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  amd-real:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Assert dedicated AMD carrier
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ($env:RUNNER_NAME -ne 'AMD-5800H-REAL') { throw "wrong runner: $env:RUNNER_NAME" }
          if ($env:RUNNER_OS -ne 'Windows') { throw "wrong OS: $env:RUNNER_OS" }
          if ($env:RUNNER_ARCH -ne 'X64') { throw "wrong architecture: $env:RUNNER_ARCH" }
          $cpu=Get-CimInstance Win32_Processor | Select-Object -First 1
          if ($cpu.Name -notmatch '5800H') { throw "wrong CPU: $($cpu.Name)" }
          if ([Environment]::ProcessorCount -ne 16) { throw "expected 16 logical processors, got $([Environment]::ProcessorCount)" }
          'LAB21_RUNNER_IDENTITY=PASS'

      - name: Execute native relational core witness
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -TypeDefinition (Get-Content 'lab21/RelationalCoreWitness.cs' -Raw) -Language CSharp
          $result=[Lab21Witness]::Run('lab21/relation-compose0',16,25000)
          if ($result -notlike 'LAB21_NATIVE_RELATION_CORE=PASS*') { throw $result }
          @(
            'LAB21'
            "github-run-id = $env:GITHUB_RUN_ID"
            "runner-name = $env:RUNNER_NAME"
            $result
            'result = PASS'
          ) | Set-Content 'lab21-evidence.txt' -Encoding utf8
          Get-Content 'lab21-evidence.txt'

      - name: Accessibility boundary
        shell: pwsh
        run: |
          $lines=Get-Content 'lab21/native-relation-core.labproof'
          if ($lines -notcontains 'human-facing = false') { throw 'human-facing boundary missing' }
          if ($lines -notcontains 'accessibility-behavior = not-applicable') { throw 'accessibility behavior boundary missing' }
          if (-not ($lines | Where-Object { $_ -like 'accessibility-gate = *' })) { throw 'accessibility gate missing' }
          'LAB21_ACCESSIBILITY_BOUNDARY=PASS'

      - name: Hash evidence
        shell: pwsh
        run: |
          Get-FileHash -Algorithm SHA256 'lab21/relation-compose0','lab21/RelationalCoreWitness.cs','lab21/native-relation-core.labproof','lab21-evidence.txt' |
            ForEach-Object { "$($_.Path) SHA256=$($_.Hash.ToLowerInvariant())" }

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: lab21-amd5800h-native-relation-core
          path: lab21-evidence.txt
          if-no-files-found: error

  linux-independent:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Independently validate relational core
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          t=Path('lab21/relation-compose0').read_bytes()
          assert len(t)==4
          assert sha256(t).hexdigest()=='10db5223d19bd1d58c2b8eb3c723b0ba104cf17564f9434e53e1b9e642fb3b37'
          states=sorted(set(t))
          assert len(states)==2
          def op(table,a,b):
              return table[states.index(a)*2+states.index(b)]
          ids=[e for e in states if all(op(t,e,x)==x and op(t,x,e)==x for x in states)]
          assert len(ids)==1
          e=ids[0]
          x=next(v for v in states if v!=e)
          assert op(t,x,x)==e
          for a in states:
              for b in states:
                  assert op(t,a,b)==op(t,b,a)
                  for c in states:
                      assert op(t,op(t,a,b),c)==op(t,a,op(t,b,c))
          lo,hi=states
          sw=lambda v: hi if v==lo else lo
          tx=bytes(sw(op(t,sw(a),sw(b))) for a in states for b in states)
          ids2=[e2 for e2 in states if all(tx[states.index(e2)*2+states.index(y)]==y and tx[states.index(y)*2+states.index(e2)]==y for y in states)]
          assert len(ids2)==1 and ids2[0]!=e
          print('LAB21_LINUX_INDEPENDENT=PASS')
          PY
