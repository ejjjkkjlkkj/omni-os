name: lab24-raw-avx2-vector

on:
  push:
    branches: [os]
    paths:
      - 'lab24/RawAvx2Witness.cs'
      - '.github/workflows/lab24.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  raw-avx2-vector:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Assert dedicated AMD carrier
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ($env:RUNNER_NAME -ne 'AMD-5800H-REAL') { throw "wrong runner: $env:RUNNER_NAME" }
          $cpu=Get-CimInstance Win32_Processor | Select-Object -First 1
          if ($cpu.Name -notmatch '5800H') { throw "wrong CPU: $($cpu.Name)" }
          if ([Environment]::ProcessorCount -ne 16) { throw "expected 16 logical processors, got $([Environment]::ProcessorCount)" }
          'LAB24_RUNNER_IDENTITY=PASS'

      - name: Execute exact raw AVX2 bytes
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -TypeDefinition (Get-Content 'lab24/RawAvx2Witness.cs' -Raw) -Language CSharp
          $result=[Lab24Witness]::Run(16,50000)
          if ($result -notlike 'LAB24_RAW_AVX2=PASS*') { throw $result }
          @(
            'LAB24'
            "github-run-id = $env:GITHUB_RUN_ID"
            "runner-name = $env:RUNNER_NAME"
            $result
            'result = PASS'
          ) | Set-Content 'lab24-evidence.txt' -Encoding utf8
          Get-Content 'lab24-evidence.txt'

      - name: Accessibility boundary
        shell: pwsh
        run: |
          $lines=Get-Content 'lab24/raw-avx2.labproof'
          if ($lines -notcontains 'human-facing = false') { throw 'human-facing boundary missing' }
          if ($lines -notcontains 'accessibility-behavior = not-applicable') { throw 'accessibility behavior boundary missing' }
          if (-not ($lines | Where-Object { $_ -like 'accessibility-gate = *' })) { throw 'accessibility gate missing' }
          'LAB24_ACCESSIBILITY_BOUNDARY=PASS'

      - name: Hash evidence
        shell: pwsh
        run: |
          Get-FileHash -Algorithm SHA256 'lab24/RawAvx2Witness.cs','lab24/raw-avx2.labproof','lab24-evidence.txt' |
            ForEach-Object { "$($_.Path) SHA256=$($_.Hash.ToLowerInvariant())" }

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: lab24-amd5800h-raw-avx2
          path: lab24-evidence.txt
          if-no-files-found: error
