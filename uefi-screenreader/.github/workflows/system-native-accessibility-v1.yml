name: system-native-accessibility-v1

on:
  push:
    branches: [os]
    paths:
      - 'system/native-accessibility-v1/NativeAccessibilityApp.cs'
      - '.github/workflows/system-native-accessibility-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  amd-real-human-facing:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Assert native foundations and interactive AMD carrier
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach ($p in @(
            'lab21/native-relation-core.labproof',
            'lab24/native-transition-core.labproof',
            'system/native-sensory-cycle-v1/native-sensory-cycle-v1.labproof'
          )) {
            $lines=Get-Content $p
            if ($lines -notcontains 'proof = PASS' -or $lines -notcontains 'system-foundation = true') {
              throw "required native foundation not proven: $p"
            }
          }
          if ($env:RUNNER_NAME -ne 'AMD-5800H-REAL') { throw "wrong runner: $env:RUNNER_NAME" }
          $cpu=Get-CimInstance Win32_Processor | Select-Object -First 1
          if ($cpu.Name -notmatch '5800H') { throw "wrong CPU: $($cpu.Name)" }
          'NATIVE_ACCESSIBILITY_FOUNDATIONS_AND_RUNNER=PASS'

      - name: Build human-facing native accessibility adapter
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force 'accessibility-runtime' | Out-Null
          $source=Join-Path $PWD 'system/native-accessibility-v1/NativeAccessibilityApp.cs'
          $out=Join-Path $PWD 'accessibility-runtime/native-accessibility-v1.exe'
          $buildScript=Join-Path $PWD 'accessibility-runtime/build.ps1'
          @'
          param([string]$Source,[string]$Output)
          $ErrorActionPreference='Stop'
          Add-Type -TypeDefinition (Get-Content $Source -Raw) -Language CSharp -ReferencedAssemblies @('System.Windows.Forms.dll','System.Drawing.dll') -OutputAssembly $Output -OutputType WindowsApplication
          '@ | Set-Content $buildScript -Encoding utf8
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $buildScript -Source $source -Output $out
          if ($LASTEXITCODE -ne 0) { throw "Windows PowerShell build failed: $LASTEXITCODE" }
          if (-not (Test-Path $out)) { throw 'human-facing adapter executable missing' }
          "NATIVE_ACCESSIBILITY_BUILD=PASS;EXE=$out"

      - name: Prove UIA semantics assistive invocation and keyboard-only operation
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class NativeAccessibilityWin32 {
              [DllImport("user32.dll")]
              [return: MarshalAs(UnmanagedType.Bool)]
              public static extern bool SetForegroundWindow(IntPtr hWnd);
          }
          '@

          $exe=Join-Path $PWD 'accessibility-runtime/native-accessibility-v1.exe'
          $table=Join-Path $PWD 'lab21/relation-compose0'
          $trace=Join-Path $PWD 'accessibility-runtime/semantic-trace.txt'
          $p=Start-Process -FilePath $exe -ArgumentList @($table,$trace) -PassThru

          try {
            $root=[System.Windows.Automation.AutomationElement]::RootElement
            $procCond=[System.Windows.Automation.PropertyCondition]::new(
              [System.Windows.Automation.AutomationElement]::ProcessIdProperty,
              [int]$p.Id
            )

            $window=$null
            for($i=0;$i -lt 100 -and -not $window;$i++) {
              Start-Sleep -Milliseconds 100
              $window=$root.FindFirst([System.Windows.Automation.TreeScope]::Children,$procCond)
            }
            if (-not $window) { throw 'UIA window not found' }
            if ($window.Current.Name -ne 'Native Accessibility V1') { throw "wrong UIA window name: $($window.Current.Name)" }

            $initialCond=[System.Windows.Automation.PropertyCondition]::new(
              [System.Windows.Automation.AutomationElement]::NameProperty,
              'Native state exchange'
            )
            $initial=$window.FindFirst([System.Windows.Automation.TreeScope]::Descendants,$initialCond)
            if (-not $initial) { throw 'initial accessible state not exposed through UIA' }

            $buttonCond=[System.Windows.Automation.PropertyCondition]::new(
              [System.Windows.Automation.AutomationElement]::NameProperty,
              'Apply native action'
            )
            $button=$window.FindFirst([System.Windows.Automation.TreeScope]::Descendants,$buttonCond)
            if (-not $button) { throw 'native action button not exposed through UIA' }
            if (-not $button.Current.IsEnabled) { throw 'native action button disabled' }
            if (-not $button.Current.IsKeyboardFocusable) { throw 'native action button is not keyboard focusable' }
            if ($button.Current.ControlType -ne [System.Windows.Automation.ControlType]::Button) { throw 'native action is not exposed as a button' }

            $invoke=[System.Windows.Automation.InvokePattern]$button.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern)
            if (-not $invoke) { throw 'UIA InvokePattern missing' }
            $invoke.Invoke()

            $identityCond=[System.Windows.Automation.PropertyCondition]::new(
              [System.Windows.Automation.AutomationElement]::NameProperty,
              'Native state identity'
            )
            $identity=$null
            for($i=0;$i -lt 50 -and -not $identity;$i++) {
              Start-Sleep -Milliseconds 100
              $identity=$window.FindFirst([System.Windows.Automation.TreeScope]::Descendants,$identityCond)
            }
            if (-not $identity) { throw 'UIA invoke did not expose identity state' }

            $hwnd=[IntPtr]::new($window.Current.NativeWindowHandle)
            [void][NativeAccessibilityWin32]::SetForegroundWindow($hwnd)
            $button.SetFocus()
            Start-Sleep -Milliseconds 300
            if (-not $button.Current.HasKeyboardFocus) { throw 'UIA button did not receive keyboard focus' }

            $ws=New-Object -ComObject WScript.Shell
            [void]$ws.AppActivate([int]$p.Id)
            Start-Sleep -Milliseconds 200
            $ws.SendKeys('{ENTER}')

            $keyboardActivated=$false
            for($i=0;$i -lt 30 -and -not $keyboardActivated;$i++) {
              Start-Sleep -Milliseconds 100
              if (Test-Path $trace) {
                $keyboardActivated=[bool](Get-Content $trace | Where-Object { $_ -eq 'activation=2;role=identity' })
              }
            }

            if (-not $keyboardActivated) {
              [void][NativeAccessibilityWin32]::SetForegroundWindow($hwnd)
              $button.SetFocus()
              [System.Windows.Forms.SendKeys]::SendWait('{ENTER}')
              for($i=0;$i -lt 20 -and -not $keyboardActivated;$i++) {
                Start-Sleep -Milliseconds 100
                $keyboardActivated=[bool](Get-Content $trace | Where-Object { $_ -eq 'activation=2;role=identity' })
              }
            }
            if (-not $keyboardActivated) { throw 'keyboard Enter did not invoke native action' }

            $identity2=$window.FindFirst([System.Windows.Automation.TreeScope]::Descendants,$identityCond)
            if (-not $identity2) { throw 'keyboard Enter lost identity state' }

            $nvda=(Get-Process -Name nvda -ErrorAction SilentlyContinue | Select-Object -First 1)
            $jaws=(Get-Process -Name jfw -ErrorAction SilentlyContinue | Select-Object -First 1)

            @(
              'NATIVE-ACCESSIBILITY-V1'
              "github-run-id = $env:GITHUB_RUN_ID"
              "runner-name = $env:RUNNER_NAME"
              'window-uia-name = PASS'
              'visible-and-accessible-initial-state = PASS'
              'button-uia-name = PASS'
              'button-control-type = PASS'
              'button-keyboard-focusable = PASS'
              'uia-invoke-pattern = PASS'
              'uia-state-change = PASS'
              'keyboard-focus = PASS'
              'keyboard-enter = PASS'
              'keyboard-state-change = PASS'
              'mouse-required = false'
              "nvda-process = $(if($nvda){'RUNNING'}else{'NOT_RUNNING'})"
              "jaws-process = $(if($jaws){'RUNNING'}else{'NOT_RUNNING'})"
              'result = PASS'
            ) | Set-Content 'accessibility-runtime/evidence.txt' -Encoding utf8
          }
          finally {
            if (-not $p.HasExited) {
              [void]$p.CloseMainWindow()
              if (-not $p.WaitForExit(5000)) { $p.Kill(); $p.WaitForExit() }
            }
          }

          $traceLines=Get-Content $trace
          if ($traceLines -notcontains 'initial-role=exchange') { throw 'initial structural role trace missing' }
          if ($traceLines -notcontains 'human-visible-initial=Native state exchange') { throw 'visible initial semantic trace missing' }
          if ($traceLines -notcontains 'human-accessible-name-initial=Native state exchange') { throw 'accessible initial semantic trace missing' }
          if (-not ($traceLines | Where-Object { $_ -eq 'activation=1;role=identity' })) { throw 'UIA activation trace missing' }
          if (-not ($traceLines | Where-Object { $_ -eq 'activation=2;role=identity' })) { throw 'keyboard activation trace missing' }
          if ($traceLines -notcontains 'final-role=identity') { throw 'final structural role trace missing' }
          if ($traceLines -notcontains 'activations=2') { throw 'expected two independent activations' }

          Get-Content 'accessibility-runtime/evidence.txt'
          Get-Content $trace

      - name: Enforce native accessibility contract
        shell: pwsh
        run: |
          $lines=Get-Content 'system/native-accessibility-v1/native-accessibility-v1.labproof'
          if ($lines -notcontains 'human-facing = true') { throw 'human-facing contract missing' }
          if ($lines -notcontains 'mouse-required = false') { throw 'pointer independence missing' }
          if ($lines -notcontains 'vision-required = false') { throw 'vision independence missing' }
          if ($lines -notcontains 'separate-accessibility-reconstruction = forbidden') { throw 'native accessibility architecture gate missing' }
          if ($lines -notcontains 'carrier-labels-human-facing = forbidden') { throw 'carrier-label leak gate missing' }
          'NATIVE_ACCESSIBILITY_CONTRACT=PASS'

      - name: Hash accessibility evidence
        shell: pwsh
        run: |
          Get-FileHash -Algorithm SHA256 'system/native-accessibility-v1/NativeAccessibilityApp.cs','accessibility-runtime/semantic-trace.txt','accessibility-runtime/evidence.txt' |
            ForEach-Object { "$($_.Path) SHA256=$($_.Hash.ToLowerInvariant())" }

      - name: Upload accessibility evidence
        uses: actions/upload-artifact@v4
        with:
          name: system-native-accessibility-v1-amd5800h
          path: |
            accessibility-runtime/semantic-trace.txt
            accessibility-runtime/evidence.txt
          if-no-files-found: error

  linux-independent-semantic-replay:
    needs: amd-real-human-facing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: system-native-accessibility-v1-amd5800h
          path: accessibility-artifact

      - name: Verify human-facing semantics derive from native roles
        shell: python
        run: |
          from pathlib import Path

          table=Path('lab21/relation-compose0').read_bytes()
          states=list(dict.fromkeys(table))
          assert len(table)==4 and len(states)==2
          def idx(x): return states.index(x)
          def compose(a,b): return table[idx(a)*2+idx(b)]

          identities=[e for e in states if all(compose(e,x)==x and compose(x,e)==x for x in states)]
          assert len(identities)==1
          identity=identities[0]
          exchange=states[1] if states[0]==identity else states[0]
          assert compose(exchange,exchange)==identity

          trace=Path('accessibility-artifact/semantic-trace.txt').read_text().splitlines()
          assert trace[0]=='NATIVE-ACCESSIBILITY-V1'
          assert 'initial-role=exchange' in trace
          assert 'human-visible-initial=Native state exchange' in trace
          assert 'human-accessible-name-initial=Native state exchange' in trace
          assert 'action-name=Apply native action' in trace
          assert 'activation=1;role=identity' in trace
          assert 'activation=2;role=identity' in trace
          assert 'final-role=identity' in trace
          assert 'activations=2' in trace

          evidence=Path('accessibility-artifact/evidence.txt').read_text().splitlines()
          required={
            'window-uia-name = PASS',
            'visible-and-accessible-initial-state = PASS',
            'button-uia-name = PASS',
            'button-control-type = PASS',
            'button-keyboard-focusable = PASS',
            'uia-invoke-pattern = PASS',
            'uia-state-change = PASS',
            'keyboard-focus = PASS',
            'keyboard-enter = PASS',
            'keyboard-state-change = PASS',
            'mouse-required = false',
            'result = PASS',
          }
          assert required.issubset(set(evidence))
          print('NATIVE_ACCESSIBILITY_V1_LINUX_REPLAY=PASS;NATIVE_ROLE_TRANSITION=PASS;HUMAN_SEMANTIC_EQUIVALENCE=PASS')
