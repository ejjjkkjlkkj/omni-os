[package]
name = "st"
version = "0.6.0-rc.3"
edition = "2021"
description = "Anti-robotic Klatt cascade/parallel formant synthesizer in pure Rust (FR & EN). Features: LF glottal model with adjustable OQ, English vowel reduction, allophonic aspiration, anticipatory coarticulation, ToBI-style intonation, long-term F0 drift."

[lib]
name = "st_synth"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "st"
path = "src/main.rs"

[dependencies]
libm = "0.2"
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
