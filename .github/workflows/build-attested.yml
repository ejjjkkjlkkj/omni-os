name: build-attested

# Reusable release build (SLSA v1.0 Build Level 3): the build instructions and the provenance
# signing live here, isolated from the calling workflow, so every attestation carries this
# workflow's identity. Verify with:
#   gh attestation verify <file> -R ejjjkkjlkkj/omni-os \
#     --signer-workflow ejjjkkjlkkj/omni-os/.github/workflows/build-attested.yml
#
# Open toolchains only (rustc/LLVM, clang/lld, mingw-w64 GCC), on Linux. Every asset is built
# twice on independent runners and must be byte-identical (reproducible build).
on:
  workflow_call:

permissions:
  attestations: write
  contents: read
  id-token: write

jobs:
  build:
    name: build, voice golden check, boot proofs
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Open toolchains and emulator
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-system-x86 ovmf gdisk dosfstools clang lld \
            gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64
          (cd os && rustup target add x86_64-unknown-uefi x86_64-unknown-none)
          (cd voice-st && rustup target add x86_64-pc-windows-gnu)
      - name: Build every release asset
        run: tools/release/build-assets.sh dist
      - name: Voice output is byte-identical to the golden corpus (Linux build)
        run: tools/voice/golden.sh dist/st-linux-x86_64
      - name: Build the GPT image from the release binaries and boot it
        run: |
          set -euo pipefail
          (cd os && ./scripts/build-uefi-disk.sh ../dist/BOOTX64.EFI ../dist/KERNEL.BIN build/omni-os-uefi-x86_64.img)
          tools/boot/run-qemu.sh --disk os/build/omni-os-uefi-x86_64.img
          gzip -9 -n -c os/build/omni-os-uefi-x86_64.img > dist/omni-os-uefi-x86_64.img.gz
          cp build/boot/boot.log dist/boot-proof.log
      - name: Prove spoken BIOS navigation with the released NAVIGATION.EFI
        run: |
          set -euo pipefail
          tools/boot/navigation-qemu.sh
          cmp build/navigation/NAVIGATION.EFI dist/NAVIGATION.EFI
          echo "the booted NAVIGATION.EFI is the released one"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-primary
          path: dist/
          if-no-files-found: error

  rebuild:
    name: independent rebuild (reproducibility)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Open toolchains
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q clang lld gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64
          (cd os && rustup target add x86_64-unknown-uefi x86_64-unknown-none)
          (cd voice-st && rustup target add x86_64-pc-windows-gnu)
      - run: tools/release/build-assets.sh dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-rebuild
          path: dist/
          if-no-files-found: error

  attest:
    name: reproducibility check, checksums, signed provenance
    needs: [build, rebuild]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-primary
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-rebuild
          path: rebuild
      - name: Every binary is byte-identical across the two independent builds
        run: |
          set -euo pipefail
          n=0; bad=0
          for f in rebuild/*; do
            name="$(basename "$f")"
            if cmp -s "$f" "dist/$name"; then
              printf '%s  %s\n' "$(sha256sum < "$f" | cut -d' ' -f1)" "$name" >> dist/REPRODUCIBLE
              n=$((n+1))
            else
              echo "NOT REPRODUCIBLE: $name ($(cmp "$f" "dist/$name" | head -1))"; bad=$((bad+1))
            fi
          done
          [ "$bad" -eq 0 ] || { echo "$bad file(s) differ between the two independent builds" >&2; exit 1; }
          echo "OMNI_OS_REPRODUCIBLE=PASS files=$n"
          cat dist/REPRODUCIBLE
      - name: Checksums
        working-directory: dist
        run: sha256sum * | sort -k2 > SHA256SUMS && cat SHA256SUMS
      # Tags only: a dry run (workflow_dispatch on a branch) builds and proves, but signs nothing.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error
