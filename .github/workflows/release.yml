name: release

# A release is published only if the full CI passes on the tagged commit. Building,
# booting and provenance signing happen in the reusable build-attested.yml (SLSA v1.0
# Build Level 3: attestations are signed with that workflow's identity); this workflow
# only orchestrates and publishes what it produced.
on:
  push:
    tags: ["v*"]
  # Dry run from any branch: CI, build and boot proofs; nothing is signed or published.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    permissions:
      attestations: write
      contents: read
      id-token: write
    uses: ./.github/workflows/build-attested.yml
    secrets:
      OMNI_SIGNING_SEED: ${{ secrets.OMNI_SIGNING_SEED }}

  publish:
    name: publish the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist
      - name: Check the assets match their signed checksums
        working-directory: dist
        run: sha256sum -c SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          notes="docs/releases/$TAG.md"
          test -s "$notes"
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "omni-os $TAG" --notes-file "$notes" --verify-tag
