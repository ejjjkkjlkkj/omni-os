name: Repository Contract

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate repository contract
        run: python -m unittest .omni-agent/tests/test_repository_contract.py
