name: Update Threat Intelligence

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/update_threat_intel.py"
      - "scripts/check_knowledge_coverage.py"
      - "scripts/check_accessibility_source_proof.py"
      - "scripts/check_master_coverage.py"
      - "data/threat-intel/sources.json"
      - "data/taxonomy/**"
      - ".github/workflows/update-threat-intel.yml"

permissions:
  contents: write

concurrency:
  group: update-threat-intel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate knowledge coverage
        run: |
          python3 scripts/check_knowledge_coverage.py
          python3 scripts/check_accessibility_source_proof.py
          python3 scripts/check_master_coverage.py

      - name: Refresh normalized public intelligence
        run: python3 scripts/update_threat_intel.py

      - name: Commit database only when source content changed
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain -- data/threat-intel/generated/)" ]]; then
            echo "UNCHANGED: normalized database already current"
            exit 0
          fi

          git config user.name "omni-security-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/threat-intel/generated/
          git commit -m "data: refresh OMNI threat intelligence"
          gh auth setup-git
          git push origin "HEAD:${GITHUB_REF_NAME}"
