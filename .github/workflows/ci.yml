name: omni-os CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    name: integrity (provenance, archives, secrets)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # private repo: the read-only job token is needed to fetch archive/*
          persist-credentials: true
      - name: Fetch archive branches
        run: git fetch --no-tags origin '+refs/heads/archive/*:refs/remotes/origin/archive/*'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python tools/integrity/verify.py --archive-prefix refs/remotes/origin/

  os:
    name: os (workspace tests, UEFI + kernel builds)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: os
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain (pinned by os/rust-toolchain.toml)
        run: rustup show active-toolchain && rustup target add x86_64-unknown-uefi x86_64-unknown-none
      - name: Format (workspace, UEFI, kernel)
        run: |
          cargo fmt --all --check
          (cd boot/uefi && cargo fmt --check)
          (cd kernel/x86_64 && cargo fmt --check)
      - name: Clippy -D warnings (workspace, UEFI, kernel)
        run: |
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo clippy --locked --manifest-path boot/uefi/Cargo.toml --target x86_64-unknown-uefi --release -- -D warnings
          cargo clippy --locked --manifest-path kernel/x86_64/Cargo.toml --target x86_64-unknown-none --release -- -D warnings
      - run: cargo test --locked --workspace --all-targets
      - run: cargo build --locked --manifest-path boot/uefi/Cargo.toml --target x86_64-unknown-uefi --release
      - run: cargo build --locked --manifest-path kernel/x86_64/Cargo.toml --target x86_64-unknown-none --release
      - name: Lockfiles unchanged
        run: git diff --exit-code -- Cargo.lock boot/uefi/Cargo.lock kernel/x86_64/Cargo.lock

  boot:
    name: boot (QEMU q35 + OVMF, UEFI loader -> native kernel)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: os
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup target add x86_64-unknown-uefi x86_64-unknown-none
      - name: Install QEMU, OVMF and disk tools
        run: sudo apt-get update -q && sudo apt-get install -y -q qemu-system-x86 ovmf gdisk dosfstools
      - name: Build kernel and loader
        run: |
          set -euo pipefail
          cargo build --locked --manifest-path kernel/x86_64/Cargo.toml --target x86_64-unknown-none --release
          KELF=kernel/x86_64/target/x86_64-unknown-none/release/aw-kernel-x86_64
          objcopy -O binary "$KELF" "$KELF.bin"
          cargo build --locked --manifest-path boot/uefi/Cargo.toml --target x86_64-unknown-uefi --release
          ./scripts/build-uefi-disk.sh
      - name: Boot and check the proof markers
        run: |
          set -euo pipefail
          OVMF_CODE=/usr/share/OVMF/OVMF_CODE_4M.fd; OVMF_VARS=/usr/share/OVMF/OVMF_VARS_4M.fd
          [ -f "$OVMF_CODE" ] || { OVMF_CODE=/usr/share/OVMF/OVMF_CODE.fd; OVMF_VARS=/usr/share/OVMF/OVMF_VARS.fd; }
          cp "$OVMF_VARS" ovmf-vars.fd; truncate -s 32M nvme-test.img
          set +e
          timeout 90s qemu-system-x86_64 -machine q35 -cpu max -smp 2 -m 1024M \
            -display none -serial none -monitor none -no-reboot -debugcon file:boot.log \
            -drive if=pflash,format=raw,readonly=on,file="$OVMF_CODE" \
            -drive if=pflash,format=raw,file=ovmf-vars.fd \
            -drive format=raw,file=build/accessible-windows-uefi-x86_64.img \
            -drive if=none,format=raw,file=nvme-test.img,id=nvme0 -device nvme,drive=nvme0,serial=AWNVME \
            -device qemu-xhci -device ich9-intel-hda
          STATUS=$?
          set -e
          cat boot.log
          if [ "$STATUS" -ne 0 ] && [ "$STATUS" -ne 124 ]; then echo "QEMU exited $STATUS" >&2; exit 1; fi
          ../tools/boot/check-log.sh boot.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: boot-log
          path: os/boot.log
          if-no-files-found: ignore

  voice-st:
    name: voice-st (TTS engine, SAPI5 engine, C ABI)
    # ST targets WinPE/WinRE; examples use Windows-only process counters
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        working-directory: voice-st
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: SAPI5 engine (fmt, clippy, tests)
        working-directory: voice-st/integrations/sapi5
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Build st_synth.dll, st_sapi.dll and the SAPI harness
        run: |
          cargo build --locked --release --lib
          cargo build --locked --release --lib --example harness --manifest-path integrations/sapi5/Cargo.toml
      - name: SAPI5 harness (COM engine, bookmarks, silence, abort)
        shell: pwsh
        run: |
          $d = New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\sapi"
          Copy-Item target\release\st_synth.dll, integrations\sapi5\target\release\st_sapi.dll $d
          & integrations\sapi5\target\release\examples\harness.exe $d.FullName
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: C ABI test (MSVC /W4 /WX)
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $d = New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\abi"
          Copy-Item tests\c\abi_test.c, include\st_synth.h, target\release\st_synth.dll, target\release\st_synth.dll.lib $d
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && cd /d `"$d`" && cl /nologo /W4 /WX /std:c11 abi_test.c st_synth.dll.lib /Fe:abi_test.exe"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$d\abi_test.exe"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

  c:
    name: c (protocol and semantic core; gcc + clang, sanitizers)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: solution protocol and navigation semantic core
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/c"; B="$RUNNER_TEMP/c"
          for cc in gcc clang; do
            (cd solution && $cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror -Iinclude \
              c/omni_protocol.c tests/c/test_protocol.c -o "$B/protocol-$cc" && "$B/protocol-$cc")
            (cd navigation && $cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror \
              navigation/uefi/semantic_core.c navigation/uefi/test_semantic_core.c -o "$B/semantic-$cc" && "$B/semantic-$cc")
          done
          SAN="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -g"
          (cd solution && clang -std=c11 -O1 $SAN -Iinclude c/omni_protocol.c tests/c/test_protocol.c -o "$B/protocol-san" && "$B/protocol-san")
          (cd navigation && clang -std=c11 -O1 $SAN navigation/uefi/semantic_core.c navigation/uefi/test_semantic_core.c -o "$B/semantic-san" && "$B/semantic-san")
          (cd solution && clang --analyze -Xclang -analyzer-werror -std=c11 -Iinclude c/omni_protocol.c)
          echo "OMNI_OS_C=PASS"

  solution:
    name: solution (firmware tooling, security data)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: solution
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m compileall -q src tests
      - run: python -m unittest discover -s tests
      - run: python -m unittest discover -s .omni-agent/tests -p "test_*.py"

  navigation:
    name: navigation (UEFI spoken navigation contracts)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Contracts
        run: |
          set -euo pipefail
          for t in navigation/navigation/uefi/test_*.py navigation/voice/v4/test_*.py; do
            echo "::group::$t"
            (cd "$(dirname "$t")" && python "$(basename "$t")")
            echo "::endgroup::"
          done
