name: integrity daily

# Private repo on the free plan cannot use branch rulesets: this scheduled gate
# detects any deleted or rewritten archive/* branch within 24 h.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
      - run: git fetch --no-tags origin '+refs/heads/archive/*:refs/remotes/origin/archive/*'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python tools/integrity/verify.py --archive-prefix refs/remotes/origin/
